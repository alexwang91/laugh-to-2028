name: 0046 artifact evidence correction v2

on:
  push:
    branches:
      - governance/0046-artifact-evidence-correction
    paths:
      - .github/workflows/0046-artifact-evidence-correction-v2.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/0046-artifact-evidence-correction
          fetch-depth: 0

      - name: Download immutable official artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9074623455 > /tmp/meta.json
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/9074623455/zip > /tmp/artifact.zip
          rm -rf /tmp/a && mkdir -p /tmp/a
          unzip -q /tmp/artifact.zip -d /tmp/a

      - name: Reconcile closeout evidence mechanically
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path('.'); p=root/'research/brrk_exhaustion_pulse_0046'
          meta=json.load(open('/tmp/meta.json'))
          assert meta['id']==9074623455
          assert meta['workflow_run']['id']==31419044159
          zip_sha=hashlib.sha256(open('/tmp/artifact.zip','rb').read()).hexdigest()
          assert meta['digest']==f'sha256:{zip_sha}'
          files={x.name:x for x in Path('/tmp/a').iterdir()}
          full_path=files['BRRK_EXHAUSTION_PULSE_0046_PRIMARY_RESULT.json']
          lock_path=files['BRRK_EXHAUSTION_PULSE_0046_CALIBRATION_LOCK.json']
          pred_path=files['BRRK_EXHAUSTION_PULSE_0046_PREDICTOR_PATH.json']
          summ_path=files['BRRK_EXHAUSTION_PULSE_0046_EXECUTION_SUMMARY.json']
          sha=lambda q:hashlib.sha256(q.read_bytes()).hexdigest()
          assert sha(full_path)=='5c0e9aa4864b0044d5033573be78cdee3c0802db2d8b98d24fc0afcc21abbf8c'
          assert sha(summ_path)=='bc9a99481aa2b901987360606a4a5b589e5cbc92d763681579d8768ef3296e8b'
          full=json.load(open(full_path)); lock=json.load(open(lock_path))
          assert full['result_status']=='FAIL_NO_FUTURE_ONLY_PULSE_VALIDATION_ELIGIBILITY'
          expected_alarm={'eligible_sessions':1026,'pulse_dates':['2026-06-03'],'raw_alarm_occupancy':0.018518518518518517,'raw_alarm_sessions':19,'spell_summary':{'durations':[19],'median':19.0,'p90_empirical_nearest_rank':19.0,'spell_count':1},'total_pulse_count':1}
          assert full['alarm_path']==expected_alarm
          assert full['gates']['median_alarm_spell_le_7']=={'pass':False,'value':19.0}
          assert full['gates']['p90_alarm_spell_le_14']=={'pass':False,'value':19.0}

          compact=json.load(open(p/'PRIMARY_RESULT.json'))
          compact['taxonomy_reproduction']={'status':'MATCHED_0043_FROZEN_TAXONOMY','candidate_peak_count':full['taxonomy_reproduction']['candidate_peak_count'],'candidate_peaks':full['taxonomy_reproduction']['candidate_peaks'],'panel_counts':full['taxonomy_reproduction']['panel_counts']}
          compact['point_metrics']=full['point_metrics']
          compact['alarm_path']=full['alarm_path']
          compact['gates']=full['gates']
          compact['change_age_distribution']=full['change_age_distribution']
          compact['uncertainty']=full['uncertainty']
          compact['calibration_lock']={'code_sha':lock['code_sha'],'lock_payload_sha256':lock['lock_payload_sha256_without_self_hash'],'predictor_digest':lock['predictor_digest'],'threshold':lock['threshold'],'lock_validated_before_evaluation_module_import':True,'labels_loaded_only_after_locked_detector_evaluated':True}
          compact['calibration_reproduction']['spectral_radius']=lock['var1']['spectral_radius']
          compact['calibration_reproduction']['threshold']=lock['threshold']
          compact['full_artifact_binding']={'artifact_id':meta['id'],'artifact_digest':meta['digest'],'predictor_file_sha256':sha(pred_path),'calibration_lock_file_sha256':sha(lock_path),'full_primary_result_file_sha256':sha(full_path),'execution_summary_file_sha256':sha(summ_path),'full_primary_result_internal_payload_hash':full['result_payload_sha256_without_self_hash']}
          (p/'PRIMARY_RESULT.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')

          for fn in ('EXECUTION.json','RUN_ONCE.marker'):
            x=json.load(open(p/fn))
            if fn=='EXECUTION.json': x['valid_result_run']['artifact_digest']=meta['digest']
            else: x['artifact_digest']=meta['digest']
            (p/fn).write_text(json.dumps(x,indent=2)+'\n')

          r=(p/'RESULT.md').read_text()
          replacements=[
            ('raw alarm occupancy                         0.001958864      PASS','raw alarm occupancy                         0.018518519      PASS'),
            ('median raw-alarm spell                      1               PASS','median raw-alarm spell                      19              FAIL'),
            ('p90 raw-alarm spell                         1               PASS','p90 raw-alarm spell                         19              FAIL'),
            ('Across 1,021 eligible detector sessions it produced two raw-alarm sessions and only one Transition Pulse, on:','Across 1,026 eligible detector sessions it produced 19 consecutive raw-alarm sessions in one spell and only one Transition Pulse, on:'),
            ('2025-11-22','2026-06-03'),
            ('while passing specificity and anti-stickiness gates.','while passing continuation specificity and occupancy gates but failing both preregistered raw-alarm spell-duration anti-stickiness gates.'),
            ('sha256:2938e8c0a776255848b13990200cd77bec85ab15e143596a477fc08f3b63c2a0',meta['digest']),
          ]
          for a,b in replacements:
            assert a in r, a
            r=r.replace(a,b)
          (p/'RESULT.md').write_text(r)

          t=root/'research/governance/test_brrk_exhaustion_pulse_0046_closeout.py'; s=t.read_text()
          s=s.replace('sha256:2938e8c0a776255848b13990200cd77bec85ab15e143596a477fc08f3b63c2a0',meta['digest'])
          old='assert result["alarm_path"]["pulse_dates"] == ["2025-11-22"]'
          new='''assert result["alarm_path"]["pulse_dates"] == ["2026-06-03"]\n    assert result["alarm_path"]["eligible_sessions"] == 1026\n    assert result["alarm_path"]["raw_alarm_sessions"] == 19\n    assert result["alarm_path"]["spell_summary"]["median"] == 19.0\n    assert result["alarm_path"]["spell_summary"]["p90_empirical_nearest_rank"] == 19.0\n    assert result["gates"]["median_alarm_spell_le_7"]["pass"] is False\n    assert result["gates"]["p90_alarm_spell_le_14"]["pass"] is False'''
          assert old in s; t.write_text(s.replace(old,new,1))

          regp=root/'config/research_registry.json'; reg=json.load(open(regp))
          rec=[x for x in reg['records'] if x.get('research_id')=='BRRK-EXHAUSTION-PULSE-0046']; assert len(rec)==1; rec=rec[0]
          assert rec['result_status']=='FAIL_NO_FUTURE_ONLY_PULSE_VALIDATION_ELIGIBILITY' and rec['actual_variants_evaluated']==1 and rec['production_authorized'] is False
          rec['notes']=[n for n in rec['notes'] if not n.startswith(('Valid artifact 9074623455 digest ','Binding negative result: ','Specificity/anti-stickiness passed: ','Specificity and occupancy passed but anti-stickiness did not fully pass: ','0046 closeout evidence correction: '))]
          rec['notes'] += [f"Valid artifact 9074623455 digest {meta['digest']}; full PRIMARY_RESULT SHA256 {sha(full_path)}.",'Binding negative result: zero of nine primary TRUE events pulsed in PRE14_7, zero of five TRUE episodes hit, zero of seven severe TRUE events hit, zero qualifying PRE21_0 onsets; one pulse occurred across 1,026 eligible sessions.','Specificity and occupancy passed but anti-stickiness did not fully pass: continuation false pulses 0/6 and raw alarm occupancy 1.8519%, while the single raw-alarm spell lasted 19 sessions so both median<=7 and p90<=14 spell gates failed.','0046 closeout evidence correction: PR #166 compact closeout accidentally persisted a hand-built alarm-path summary and wrong artifact digest; this correction is derived mechanically from immutable Actions artifact 9074623455 and does not rerun, retune, rescue or reclassify 0046.']
          rec['evidence_scorecard']['operational_realism']='TRANSITION_PULSE_DIAGNOSTIC_ONLY_ONE_PULSE_1026_ELIGIBLE_SESSIONS_19_SESSION_SINGLE_ALARM_SPELL_NO_PORTFOLIO_TRANSLATION'
          rec['evidence_scorecard']['governance_integrity']='HIGH_PREREGISTERED_SINGLE_CANDIDATE_PRE_RESULT_BOUNDARY_RUN1_FAILURE_PRESERVED_REPAIR_PARENT_SEMANTICS_ONLY_RUN1_LOCK_REPRODUCED_BEFORE_SINGLE_VALID_RESULT_NO_RETUNING_CLOSEOUT_SUMMARY_CORRECTED_TO_IMMUTABLE_ARTIFACT'
          regp.write_text(json.dumps(reg,indent=2)+'\n')

          correction=f'''\n\n## 0046 immutable artifact evidence correction — 2026-08-10\n\nPR #166 preserved the correct 0046 FAIL disposition but its hand-built compact closeout summary contained artifact-derived transcription errors. The immutable GitHub Actions artifact `9074623455` from run `31419044159` is authoritative. Correct facts: artifact digest `{meta['digest']}`; `1,026` eligible sessions; `19` raw-alarm sessions; occupancy `1.8518519%`; one 19-session alarm spell; Transition Pulse `2026-06-03`; median-spell and p90-spell anti-stickiness gates both FAIL. Primary TRUE PRE14_7 remains `0/9`, TRUE episode `0/5`, severe TRUE `0/7`, PRE21_0 onset count `0`; therefore `FAIL_NO_FUTURE_ONLY_PULSE_VALIDATION_ELIGIBILITY` is unchanged. No 0046 rerun, retuning, rescue, threshold change, denominator change or portfolio economics occurred.\n\n```text\nproduction gross cap = 1.0\nproduction_authorized_components = []\nproduction_authorized = false\nsignature_authorized = false\norder_submission_authorized = false\n```\n'''
          for doc in ('docs/CURRENT_STATE.md','docs/NEXT_STEPS.md'):
            q=root/doc; text=q.read_text()
            if '## 0046 immutable artifact evidence correction — 2026-08-10' not in text: q.write_text(text+correction)
          PY

      - name: Validate corrected evidence
        run: |
          python - <<'PY'
          import research.governance.test_brrk_exhaustion_pulse_0046_closeout as t
          tests=[getattr(t,n) for n in sorted(dir(t)) if n.startswith('test_') and callable(getattr(t,n))]
          assert tests
          for fn in tests: fn()
          print('executed',len(tests),'0046 closeout tests')
          PY
          python -m research.governance.validate
          python -m research.governance.no_drift
          git diff --check

      - name: Commit evidence correction only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json docs/CURRENT_STATE.md docs/NEXT_STEPS.md research/brrk_exhaustion_pulse_0046/PRIMARY_RESULT.json research/brrk_exhaustion_pulse_0046/EXECUTION.json research/brrk_exhaustion_pulse_0046/RUN_ONCE.marker research/brrk_exhaustion_pulse_0046/RESULT.md research/governance/test_brrk_exhaustion_pulse_0046_closeout.py
          git commit -m 'governance: correct 0046 closeout from immutable artifact'
          git push origin HEAD:governance/0046-artifact-evidence-correction
