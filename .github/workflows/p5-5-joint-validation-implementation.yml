name: P5.5 joint validation implementation

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_5_validation_contract*.json"
      - "research/cycle_exit/p5_5_validation.py"
      - "research/cycle_exit/run_p5_5_joint_validation*.py"
      - "research/cycle_exit/validate_p5_5_joint_validation_result.py"
      - "research/results/p5_5_joint_validation/**"
      - "execution/plan-b-bot/tests/test_p5_5_validation*.py"
      - ".github/workflows/p5-5-joint-validation-implementation.yml"
      - ".github/workflows/p5-5-joint-validation-run-once.yml"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_5_validation.py"
      - "research/cycle_exit/run_p5_5_joint_validation*.py"
      - "research/cycle_exit/validate_p5_5_joint_validation_result.py"
      - "research/results/p5_5_joint_validation/**"
      - "execution/plan-b-bot/tests/test_p5_5_validation*.py"
      - ".github/workflows/p5-5-joint-validation-implementation.yml"

permissions:
  contents: read

jobs:
  implementation-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Verify frozen research dependencies and coverage correction
        run: |
          set -euo pipefail
          test "$(git hash-object research/cycle_exit/p5_5_validation_contract.json)" = "96a923189fce1682d2cee2dd0b34afdb3e3bd3a7"
          test "$(git hash-object research/cycle_exit/p5_5_validation_contract_r1.json)" = "98f651811b7edcb1f0b4c3047b87d95bffed087a"
          test "$(git hash-object research/cycle_exit/p5_5_validation_contract_r2.json)" = "57073e6948e0c7540c453f193a1be7c21979b7d5"
          test "$(git hash-object research/cycle_exit/p5_4_behavior_mapping_contract.json)" = "595a8488616ac8d333335cf2bc9cc509d808d7e8"
          test "$(git hash-object research/cycle_exit/p5_4_behavior_mapping.py)" = "a6842ddb572f7af7da928a7a8a0c6f1582ef7c56"
          test "$(cat research/results/p5_3_v2_market_state/summary.sha256)" = "05d5d68a59c8b13f1122d98ed75d03934defdc9d73c7dd92e038c92fd97d2e52"
          test "$(cat research/results/p5_2_feature_evidence/summary.sha256)" = "3f6dc3c512d22ac8f71d43ed155f2602cd40d5caf3d617c0e130e170727e0627"
          python - <<'PY'
          import json
          from pathlib import Path
          p52 = json.loads(Path('research/results/p5_2_feature_evidence/summary.json').read_text())
          r2 = json.loads(Path('research/cycle_exit/p5_5_validation_contract_r2.json').read_text())
          assert p52['data_window'][1] == '2026-02-28'
          assert r2['result_observed_before_amendment'] is False
          assert r2['replacement_semantics']['authoritative_brrk_economics_end'] == '2026-02-28'
          assert r2['replacement_semantics']['forward_fill_market_state_after_frozen_end'] is False
          assert r2['replacement_semantics']['fabricate_feature_or_market_state_extension'] is False
          PY
      - name: Run frozen prereg and gate/selection tests
        run: |
          pytest -q \
            execution/plan-b-bot/tests/test_p5_5_validation_prereg.py \
            execution/plan-b-bot/tests/test_p5_5_validation_mechanics.py
      - name: Compile runner and immutable validator
        run: |
          python -m py_compile \
            research/cycle_exit/p5_5_validation.py \
            research/cycle_exit/run_p5_5_joint_validation.py \
            research/cycle_exit/run_p5_5_joint_validation_r2.py \
            research/cycle_exit/validate_p5_5_joint_validation_result.py
      - name: Enforce pre-result boundary or validate immutable result
        run: |
          set -euo pipefail
          if test -e research/results/p5_5_joint_validation/summary.json; then
            python research/cycle_exit/validate_p5_5_joint_validation_result.py
          else
            test ! -d research/results/p5_5_joint_validation
          fi
