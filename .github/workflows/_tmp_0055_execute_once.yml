name: 0055 execute exactly once

on:
  push:
    branches:
      - research/brrk-leadership-4h-structural-readiness-0055-execute-once

permissions:
  contents: write

env:
  SCIENTIFIC_HEAD: bf486fcbebb54ebd84941ea78f825cdba3f58ede
  RESULT_BRANCH: research/brrk-leadership-4h-structural-readiness-0055-result
  RESULT_DIR: /tmp/0055-result
  SCI_DIR: research/brrk_leadership_4h_structural_readiness_0055
  PAYLOAD: research/brrk_leadership_intraday_support_0053/MARKET_4H_PAYLOAD.json

jobs:
  execute-once:
    if: contains(github.event.head_commit.message, 'trigger unique 0055 methodology measurement')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen scientific HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_HEAD }}
          fetch-depth: 0

      - name: Verify exact scientific HEAD
        run: |
          test "$(git rev-parse HEAD)" = "$SCIENTIFIC_HEAD"
          echo "SCIENTIFIC_HEAD_LOCKED=$SCIENTIFIC_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 requests==2.32.5

      - name: Mount durable result branch worktree
        run: |
          git fetch origin "$RESULT_BRANCH:$RESULT_BRANCH"
          rm -rf "$RESULT_DIR"
          git worktree add "$RESULT_DIR" "$RESULT_BRANCH"
          git -C "$RESULT_DIR" config user.name 'Y_Wang'
          git -C "$RESULT_DIR" config user.email '40142450+alexwang91@users.noreply.github.com'
          for f in RUN_ATTEMPT.marker METHOD_RESULT.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "$RESULT_DIR/$SCI_DIR/$f"
          done

      - name: Zero-result preflight
        run: |
          python -m research.brrk_leadership_4h_structural_readiness_0055.run_once preflight \
            --payload "$PAYLOAD" \
            --result "$RESULT_DIR/$SCI_DIR/METHOD_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" | tee /tmp/0055-preflight.json
          grep -q 'PREFLIGHT_PASS_ZERO_RESULT' /tmp/0055-preflight.json

      - name: Create attempt marker before methodology computation
        run: |
          python -m research.brrk_leadership_4h_structural_readiness_0055.run_once start-attempt \
            --payload "$PAYLOAD" \
            --result "$RESULT_DIR/$SCI_DIR/METHOD_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD"
          test -f "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker"
          test ! -e "$RESULT_DIR/$SCI_DIR/METHOD_RESULT.json"
          git -C "$RESULT_DIR" add "$SCI_DIR/RUN_ATTEMPT.marker"
          git -C "$RESULT_DIR" commit -m 'Research result [0055]: persist irreversible methodology attempt marker'
          git -C "$RESULT_DIR" push origin "HEAD:$RESULT_BRANCH"

      - name: Verify durable attempt marker on remote
        run: |
          git fetch origin "$RESULT_BRANCH"
          REMOTE_BLOB=$(git rev-parse "origin/$RESULT_BRANCH:$SCI_DIR/RUN_ATTEMPT.marker")
          LOCAL_BLOB=$(git -C "$RESULT_DIR" rev-parse "HEAD:$SCI_DIR/RUN_ATTEMPT.marker")
          test "$REMOTE_BLOB" = "$LOCAL_BLOB"
          echo "DURABLE_ATTEMPT_LOCK=true"

      - name: Execute immutable 0055 methodology exactly once
        run: |
          python -m research.brrk_leadership_4h_structural_readiness_0055.run_once evaluate \
            --payload "$PAYLOAD" \
            --result "$RESULT_DIR/$SCI_DIR/METHOD_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" | tee /tmp/0055-method-result.stdout.json
          test -f "$RESULT_DIR/$SCI_DIR/METHOD_RESULT.json"
          test -f "$RESULT_DIR/$SCI_DIR/EXECUTION.json"
          test ! -e "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker"
          git -C "$RESULT_DIR" add "$SCI_DIR/METHOD_RESULT.json" "$SCI_DIR/EXECUTION.json"
          git -C "$RESULT_DIR" commit -m 'Research result [0055]: persist unique methodology measurement bundle'
          git -C "$RESULT_DIR" push origin "HEAD:$RESULT_BRANCH"

      - name: Verify durable result bundle on remote
        run: |
          git fetch origin "$RESULT_BRANCH"
          for f in METHOD_RESULT.json EXECUTION.json RUN_ATTEMPT.marker; do
            REMOTE_BLOB=$(git rev-parse "origin/$RESULT_BRANCH:$SCI_DIR/$f")
            LOCAL_BLOB=$(git -C "$RESULT_DIR" rev-parse "HEAD:$SCI_DIR/$f")
            test "$REMOTE_BLOB" = "$LOCAL_BLOB"
          done
          echo "DURABLE_RESULT_BUNDLE=true"

      - name: Finalize marker from existing hashes only
        run: |
          python -m research.brrk_leadership_4h_structural_readiness_0055.run_once finalize \
            --payload "$PAYLOAD" \
            --result "$RESULT_DIR/$SCI_DIR/METHOD_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" | tee /tmp/0055-final-marker.stdout.json
          test -f "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker"
          git -C "$RESULT_DIR" add "$SCI_DIR/RUN_ONCE.marker"
          git -C "$RESULT_DIR" commit -m 'Research result [0055]: finalize immutable same-ID closure marker'
          git -C "$RESULT_DIR" push origin "HEAD:$RESULT_BRANCH"

      - name: Verify final marker durable and emit summary
        run: |
          git fetch origin "$RESULT_BRANCH"
          REMOTE_BLOB=$(git rev-parse "origin/$RESULT_BRANCH:$SCI_DIR/RUN_ONCE.marker")
          LOCAL_BLOB=$(git -C "$RESULT_DIR" rev-parse "HEAD:$SCI_DIR/RUN_ONCE.marker")
          test "$REMOTE_BLOB" = "$LOCAL_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('/tmp/0055-result/research/brrk_leadership_4h_structural_readiness_0055')
          result=json.loads((d/'METHOD_RESULT.json').read_text())
          marker=json.loads((d/'RUN_ONCE.marker').read_text())
          print('CLASSIFICATION='+str(result['classification']))
          print('FINAL_STATUS='+str(marker['status']))
          print('SAME_ID_RERUN_ALLOWED='+str(marker['same_id_rerun_allowed']).lower())
          print('POST_2022_TARGET_VALUES_READ='+str(result['authority']['post_2022_target_values_read']).lower())
          print('PREDICTIVE_METRICS_EXECUTED='+str(result['authority']['predictive_performance_metrics_executed']).lower())
          print('PORTFOLIO_ECONOMICS_EXECUTED='+str(result['authority']['portfolio_economics_executed']).lower())
          PY

      - name: Upload immutable runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: brrk-0055-methodology-runtime-bundle
          if-no-files-found: error
          path: |
            /tmp/0055-result/research/brrk_leadership_4h_structural_readiness_0055/RUN_ATTEMPT.marker
            /tmp/0055-result/research/brrk_leadership_4h_structural_readiness_0055/METHOD_RESULT.json
            /tmp/0055-result/research/brrk_leadership_4h_structural_readiness_0055/EXECUTION.json
            /tmp/0055-result/research/brrk_leadership_4h_structural_readiness_0055/RUN_ONCE.marker
