name: Temporary 0056 controlled boundary test

on:
  push:
    branches:
      - research/0056-simple-beta-router-controlled-run

permissions:
  contents: write

jobs:
  controlled-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Compile frozen 0056 execution surface
        run: |
          python -m py_compile research/brrk_simple_eth_sol_beta_router_0056/engine.py
          python -m py_compile research/brrk_simple_eth_sol_beta_router_0056/run_once.py
          python -m py_compile research/brrk_simple_eth_sol_beta_router_0056/test_engine.py
          python -m py_compile research/brrk_simple_eth_sol_beta_router_0056/test_run_interface.py
      - name: Run implementation and controlled fault contracts
        run: |
          python -m unittest -v \
            research.brrk_simple_eth_sol_beta_router_0056.test_engine \
            research.brrk_simple_eth_sol_beta_router_0056.test_run_interface
      - name: Enforce zero-result controlled-boundary state
        run: |
          set -euo pipefail
          base=research/brrk_simple_eth_sol_beta_router_0056
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "$base/$f"
          done
          ! find "$base" -maxdepth 1 -type f \( -name 'PRIMARY_RESULT*.json' -o -name 'EXECUTION*.json' -o -name 'RUN_ATTEMPT*' -o -name 'RUN_ONCE*' \) | grep .
          echo 'REAL_0056_HISTORICAL_PAYLOAD_NOT_EVALUATED=true'
          echo 'REAL_0056_PORTFOLIO_ECONOMICS_NOT_EXECUTED=true'
          echo 'ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0'
      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temp_0056_controlled_boundary_test.yml
          git commit -m 'Research execution boundary tooling [DRIFT_0]: remove temporary 0056 test workflow'
          git push origin HEAD:research/0056-simple-beta-router-controlled-run
