name: 0086 ARM handoff writer

on:
  push:
    branches:
      - research/0086-factor-atlas-arm-v1
    paths:
      - .github/workflows/0086-arm-handoff-writer.yml

permissions:
  contents: write

jobs:
  append-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0086-factor-atlas-arm-v1
          fetch-depth: 0
      - name: Append durable ARM handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## 0086 Factor Atlas ARM — 2026-08-25$' docs/CURRENT_STATE.md; then
            echo '' | base64 -d >> docs/CURRENT_STATE.md
          fi
          rm -f .github/workflows/0086-arm-handoff-writer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md .github/workflows/0086-arm-handoff-writer.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(0086): persist ARM handoff'
          git push origin HEAD:research/0086-factor-atlas-arm-v1
