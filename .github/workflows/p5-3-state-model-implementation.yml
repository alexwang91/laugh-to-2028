name: P5.3 state-model implementation

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_3_state_model.py"
      - "research/cycle_exit/p5_3_state_path_evidence_contract.json"
      - "research/cycle_exit/run_p5_3_state_paths.py"
      - "research/cycle_exit/validate_p5_3_state_path_result.py"
      - "research/results/p5_3_state_paths/**"
      - "execution/plan-b-bot/tests/test_p5_3_state_model.py"
      - ".github/workflows/p5-3-state-model-implementation.yml"
      - ".github/workflows/p5-3-state-path-run-once.yml"
      - "docs/P5_3_STATE_PATH_CLOSEOUT.md"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
      - "README.md"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_3_state_model.py"
      - "research/cycle_exit/p5_3_state_path_evidence_contract.json"
      - "research/cycle_exit/run_p5_3_state_paths.py"
      - "research/cycle_exit/validate_p5_3_state_path_result.py"
      - "research/results/p5_3_state_paths/**"
      - "execution/plan-b-bot/tests/test_p5_3_state_model.py"
      - ".github/workflows/p5-3-state-model-implementation.yml"
      - "docs/P5_3_STATE_PATH_CLOSEOUT.md"

permissions:
  contents: read

jobs:
  implementation-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Run frozen P5.3 prereg and state-engine tests
        run: |
          pytest -q \
            execution/plan-b-bot/tests/test_p5_3_state_model_prereg.py \
            execution/plan-b-bot/tests/test_p5_3_state_model.py
      - name: Compile runner and validator
        run: |
          python -m py_compile \
            research/cycle_exit/p5_3_state_model.py \
            research/cycle_exit/run_p5_3_state_paths.py \
            research/cycle_exit/validate_p5_3_state_path_result.py
      - name: Validate frozen dependencies and lifecycle state
        run: |
          set -euo pipefail
          test "$(git hash-object research/cycle_exit/p5_3_state_model_contract.json)" = "400ec97f8a0e522c5776ce1f6a98fc6d7e069267"
          test "$(git hash-object research/cycle_exit/p5_3_state_path_evidence_contract.json)" = "2c3f5a200c1c1a1ddad2d93ddd9f455e5a610efd"
          test "$(cat research/results/p5_2_feature_evidence/summary.sha256)" = "3f6dc3c512d22ac8f71d43ed155f2602cd40d5caf3d617c0e130e170727e0627"
          if test -e research/results/p5_3_state_paths/summary.json; then
            python research/cycle_exit/validate_p5_3_state_path_result.py
            test "$(cat research/results/p5_3_state_paths/summary.sha256)" = "a2e5ece89fec93a24e1a65e134a78824629b4b418e106294a6b0821fbd52608b"
            python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/results/p5_3_state_paths/summary.json').read_text())
          assert p['status'] == 'ONE_TIME_FROZEN_STATE_PATH_EVIDENCE_COMPLETE'
          assert p['selection']['profile_selected'] is False
          assert p['selection']['state_model_production_selected'] is False
          assert p['selection']['status'] == 'STATE_PATH_EVIDENCE_ONLY'
          assert p['production_authorized'] is False
          PY
          else
            test ! -e research/results/p5_3_state_paths/summary.json
            python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/cycle_exit/p5_3_state_path_evidence_contract.json').read_text())
          assert c['status'] == 'FROZEN_BEFORE_FIRST_STATE_PATH_RUN'
          assert c['research_integrity']['state_model_rules_frozen_before_run'] is True
          assert c['research_integrity']['no_profile_selection_in_run'] is True
          assert c['research_integrity']['no_p5_4_gross_mapping'] is True
          assert c['research_integrity']['production_authorization'] == 'NONE'
          PY
          fi
