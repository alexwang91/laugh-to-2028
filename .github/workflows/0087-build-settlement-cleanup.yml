name: 0087 BUILD settlement cleanup

on:
  push:
    branches:
      - research/0087-options-vrp-build-v1
    paths:
      - .github/workflows/0087-build-settlement-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0087-options-vrp-build-v1
          fetch-depth: 0
      - name: Remove stale helper and persist correction
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('research/brrk_options_volatility_risk_premium_0087/engine.py'); s=p.read_text(); a=s.index('def delta_hedged_short_straddle_pnl('); b=s.index('def _quantile(', a); p.write_text(s[:a]+s[b:])"
          if ! grep -q '^## 0087 BUILD settlement-convention correction — 2026-08-25$' docs/CURRENT_STATE.md; then
            echo '' | base64 -d >> docs/CURRENT_STATE.md
          fi
          rm -f .github/workflows/0087-build-settlement-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_options_volatility_risk_premium_0087/engine.py docs/CURRENT_STATE.md .github/workflows/0087-build-settlement-cleanup.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix(0087): persist settlement-neutral BUILD correction'
          git push origin HEAD:research/0087-options-vrp-build-v1
