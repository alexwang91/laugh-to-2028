name: Tooling 0068 prereg CURRENT_STATE fix

on:
  push:
    branches:
      - tools/0068-prereg-current-state-fix-v1
    paths:
      - '.github/workflows/tooling-0068-prereg-current-state-fix.yml'

permissions:
  contents: write

concurrency:
  group: brrk-0068-prereg-current-state-fix
  cancel-in-progress: false

jobs:
  patch-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0068-execution-equivalence-design-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update 0068 preregistration handoff state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          marker = '## 0068 execution-equivalence DESIGN\n'
          assert marker in text
          prefix = text.split(marker, 1)[0]
          section = '''## 0068 execution-equivalence PREREGISTRATION

0068 research ID = `BRRK-BTC-SOL-PATH-EVENT-EXECUTION-EQUIVALENCE-0068`.
Owner-first registry commit = `d135bb830c30377c4e69943a2a55974a08ad1e62`.
Merged DESIGN = `e9a3124061e614bff5bc66e004941d8ab7d3c33d`.
State = `PREREGISTERED / NOT IMPLEMENTED / NOT QUALIFIED / NO HISTORICAL AUTHORITY`.
Historical attempt budget = 0; historical content reads are forbidden in 0068.
0068 uses closed 0067 physical-accounting mismatch only as engineering/process evidence. No invalidated 0067 scientific metric is admissible.
Scientific semantics remain frozen to 0067: event definitions, feature universe, P01-P08 semantics/grids, validation selection, horizons, controllers/economics, bootstrap/PBO and classification gates are unchanged.

Frozen execution-assurance contract:
- validation estimator fits remain structurally 31,008;
- economic work and P08 NNLS work are generated by the frozen validation/base-prediction eligibility rules and are therefore data-dependent rather than universal fixed counts;
- FULL_SUPPORT must reproduce 11,904 economic estimator fits and 40 P08 NNLS solves;
- one canonical graph-builder entry point must serve qualification and controlled-mode dry run;
- canonical manifests are deterministically ordered, canonically serialized and SHA256-bound;
- every work unit declares expected physical actions, including `expected_fit_calls` and `expected_nnls` where applicable;
- every manifest unit must receive exactly one terminal trace and duplicate/missing consumption is a qualification failure;
- observed estimator-fit attempts must equal the sum of manifest `expected_fit_calls` and observed NNLS solves must equal manifest-eligible `expected_nnls`;
- inference/result generation is forbidden before complete manifest consumption;
- qualification and controlled-mode dry run must produce byte-identical manifests for identical synthetic inputs;
- zero historical reads and zero network fetches are mandatory.

Frozen deterministic nonhistorical qualification regimes:
1. `FULL_SUPPORT`;
2. `PARTIAL_SUPPORT`;
3. `SINGLE_CLASS_UNDEFINED_TRACKS`;
4. `MISSING_BASE_PREDICTIONS`;
5. `MIXED_P07_P08_ELIGIBILITY`.

Exact next step: after PREREGISTRATION merges with all standing CI green, create a separate IMPLEMENTATION-ONLY stage. Implement the canonical graph builder, per-unit physical-action accounting, terminal traces and multi-regime synthetic qualification without changing frozen science or reading historical content.

No-drift authority remains unchanged: `production_authorized=false`; `signature_authorized=false`; `order_submission_authorized=false`; canonical BRRK-0011, closed 0064/0065/0066/0067 and Phase 6 are unchanged.
'''
          p.write_text(prefix + section, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'docs: record 0068 preregistration handoff'
          git push origin HEAD:research/0068-execution-equivalence-design-v1
