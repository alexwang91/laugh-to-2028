name: 0074 Stage4 handoff repair

on:
  push:
    branches: [research/0074-stage4-implementation-v1]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage4-implementation-v1
      - name: Patch CURRENT_STATE exact anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          anchor='workflow run                         31381953131 / attempt 1'
          assert s.count(anchor)==1
          s=s.replace('0074 Stage 2 DESIGN merged at `08eafc22c3772bd021bc7e3c201c5dc63ac81e64`; Stage 3 PREREGISTRATION is in progress on `research/0074-stage3-preregistration-v1`; formal completion is `2/10` until Stage 3 merges.', '0074 Stage 3 PREREGISTRATION merged at `beae11d807886bfec65aa5cc8a26f79e92e5a0e9`; Stage 4 IMPLEMENTATION is in progress on PR #365 / `research/0074-stage4-implementation-v1`; formal completion is `3/10` until Stage 4 merges.', 1)
          s=s.replace('The next legal action is exact-head CI completion and expected-head merge of Stage 3, then a separate Stage 4 IMPLEMENTATION branch.', 'The next legal action is exact-head CI completion and expected-head merge of Stage 4, then a separate Stage 5 NONHISTORICAL QUALIFICATION branch using synthetic fixtures only.', 1)
          s=s.replace('0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / STAGE-3 PREREGISTRATION IN PROGRESS / FORMAL COMPLETION 2/10 UNTIL STAGE-3 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.', '0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / STAGE-3 PREREGISTRATION MERGED AT `beae11d807886bfec65aa5cc8a26f79e92e5a0e9` / STAGE-4 IMPLEMENTATION IN PROGRESS ON #365 / FORMAL COMPLETION 3/10 UNTIL STAGE-4 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.', 1)
          assert s.count(anchor)==1
          p.write_text(s)
          PY
          git diff --check
          git config user.name github-actions
          git config user.email actions@github.com
          git add docs/CURRENT_STATE.md
          git commit -m 'governance(0074): synchronize Stage4 handoff'
          git push