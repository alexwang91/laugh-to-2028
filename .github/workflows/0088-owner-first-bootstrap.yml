      - name: Remove bootstrap workflow and commit owner record atomically
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0088-owner-first-bootstrap.yml
          git add config/research_registry.json
          git diff --cached --check
          git commit -m "research(0088): register Factor L/S owner first"
          git push origin HEAD:research/0088-factor-ls-spec-freeze-v1
