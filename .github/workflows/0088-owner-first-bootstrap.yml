name: 0088 owner-first registry bootstrap

on:
  push:
    branches:
      - research/0088-factor-ls-spec-freeze-v1

permissions:
  contents: write

jobs:
  register-owner:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0088-factor-ls-spec-freeze-v1
          fetch-depth: 0
      - name: Register 0088 owner before governed path exists
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/research_registry.json')
          data = json.loads(p.read_text())
          rid = 'BRRK-FACTOR-LS-0088'
          if any(r.get('research_id') == rid for r in data['records']):
              raise SystemExit('0088 owner already registered')
          governed = Path('research/brrk_factor_ls_0088')
          if governed.exists():
              raise SystemExit('0088 governed path exists before owner registration')
