            'primary_metric': 'FROZEN_WEEKLY_NET_PORTFOLIO_RETURN_AND_RISK_GATES_AT_STRESSED_COST',
            'secondary_metrics': ['gross_weekly_return','net_weekly_return_c1','net_weekly_return_c2','annualized_sharpe_c2','max_drawdown_c2','positive_week_fraction_c2','one_way_turnover','funding_pnl','portfolio_beta_to_btc','max_name_weight','capacity_utilization','chronological_block_return','calendar_year_return','btc_state_return','leave_one_year_out_return'],
            'feature_families': ['MOM60_RAW_SIGN_MINUS_ONE_FROM_0086','RVOL20_RAW_SIGN_MINUS_ONE_FROM_0086','LIQ30_RAW_SIGN_PLUS_ONE_FROM_0086'],
            'horizon': 'MONDAY_UTC_CLOSE_TO_FULLY_MATURED_5_SESSION_WEEKLY_HOLD',
            'universe': ['POINT_IN_TIME_TOP30_BY_TRAILING30_MEDIAN_QUOTE_VOLUME_BINANCE_USDM_USDT_PERPETUALS'],
            'development_dataset_refs': ['BRRK-CROSS-SECTIONAL-FACTOR-ATLAS-0086'],
            'validation_dataset_refs': [],
            'sealed_dataset_refs': [],
            'declared_variant_budget': 1,
            'actual_variants_evaluated': 0,
            'parameter_candidate_count': 1,
            'stopping_rule': 'Use PROSPECTIVE_FIVE_GATE_LIFECYCLE_V1. Evaluate exactly one fixed Factor L/S construction downstream of immutable 0086 PASS. SPEC_FREEZE precedes controlled values; BUILD uses synthetic/nonhistorical fixtures only; ARM binds exact controlled identities and ControlledResearchRunnerV1SourceQualified; RUN consumes at most one separately authorized attempt; SEAL performs no scientific recomputation. No factor reselection, sign flip, weight optimization, alternate basket, horizon, rebalance, cost panel, risk overlay, source substitution, rerun, retune, rescue, or history extension after controlled exposure.',
