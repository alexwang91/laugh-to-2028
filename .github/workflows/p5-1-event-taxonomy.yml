name: P5.1 event taxonomy contract

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_1_event_taxonomy.json"
      - "research/cycle_exit/p5_1_event_taxonomy.py"
      - "execution/plan-b-bot/tests/test_p5_1_event_taxonomy.py"
      - "docs/P5_1_EVENT_TAXONOMY.md"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
      - "README.md"
      - ".github/workflows/p5-1-event-taxonomy.yml"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_1_event_taxonomy.json"
      - "research/cycle_exit/p5_1_event_taxonomy.py"
      - "execution/plan-b-bot/tests/test_p5_1_event_taxonomy.py"
      - "docs/P5_1_EVENT_TAXONOMY.md"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
      - "README.md"
      - ".github/workflows/p5-1-event-taxonomy.yml"

permissions:
  contents: read

jobs:
  taxonomy-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Run frozen P5.1 taxonomy tests
        run: pytest -q execution/plan-b-bot/tests/test_p5_1_event_taxonomy.py
      - name: Validate frozen taxonomy payload directly
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          root = Path.cwd()
          p5 = root / "research" / "cycle_exit"
          sys.path.insert(0, str(p5))
          import p5_1_event_taxonomy as taxonomy
          payload = taxonomy.load_taxonomy(p5 / "p5_1_event_taxonomy.json")
          assert payload["research_integrity"]["production_authorization"] == "NONE"
          assert payload["status"] == "FROZEN_BEFORE_FEATURE_SELECTION"
          print("P5.1 frozen event taxonomy PASS")
          PY
