name: 0088 arm current-state handoff

on:
  pull_request:
    branches:
      - main
    types: [reopened]

permissions:
  contents: write

jobs:
  append-handoff:
    if: github.event.pull_request.head.ref == 'research/0088-factor-ls-arm-v1' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0088-factor-ls-arm-v1
          fetch-depth: 0
      - name: Append truthful 0088 ARM handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text()
          heading = '## 0088 Factor L/S ARM — 2026-08-26'
          if heading not in text:
              addition = "\n\n## 0088 Factor L/S ARM — 2026-08-26\n\n- SPEC_FREEZE, prospective transition clarification, and synthetic BUILD are merged. ARM binds metadata/identity only and opens no controlled scientific value.\n- Exact source binding: workflow run `32646565505`, artifact `9495175701` / `0075-stage6-authorized-payloads-v1`, size `174445627`, artifact digest `sha256:8040282ff412b2d3fd360173e4745ebfd048796eb9e9c2ad49fa0901e5cedf56`, parent manifest SHA-256 `2f70384dd84a601b69528ef3d770e0fa9c714b3e0888bec009e93b5067ecebf8`, immutable metadata-only submanifest SHA-256 `c33b575cc436db795086458a25ca38fe1527f649809e549caba00e9754422e58`.\n- The frozen read set is all `30,336` authorized submanifest objects: `15,254` monthly USD-M 1d kline objects plus `15,082` monthly funding-rate objects across `467` eligible symbols and candidate months `2021-01` through `2026-07`. No current-symbol snapshot, source substitution, new download, or history extension is permitted.\n- Any future RUN must use `ControlledResearchRunnerV1SourceQualified` with `FactorLS0088Engine`; pre-marker inspection remains metadata/identity-only and forbids `testzip()`, payload decompression, inner ZIP/CSV parsing, CRC payload traversal, scientific-row reads, factor/portfolio/return calculations.\n- Controlled attempt remains `0/1`; controlled reads remain `0`; scientific engine remains `0/1`; scientific values remain unexposed. A fresh zero-result preflight and separate contemporaneous user authorization are required before durable marker creation and attempt consumption.\n- 0086 remains immutable `PASS_VALIDATED_FACTOR_ATLAS`; 0085 remains immutable `INVALID_EXECUTION`; 0076 remains sealed; 0072/0073 remain paused; 0083 remains immutable FAIL; 0087 remains source-metadata blocked. Phase6 closeout, common-runner qualification, and prospective lifecycle governance remain unchanged.\n- `workflow run                         31381953131 / attempt 1`, CAPTURE-0001 sealed/no-retry, and CAPTURE-0002 permanently claimed/no-refetch remain immutable. Production/signature/order/withdrawal/transfer authority remains false.\n"
              p.write_text(text.rstrip() + addition)
          PY
      - name: Remove handoff workflow and commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0088-arm-current-state-handoff.yml
          git add docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "docs(0088): record Factor L/S ARM handoff"
          git push origin HEAD:research/0088-factor-ls-arm-v1
