name: TEMP 0061 CURRENT_STATE materializer

on:
  push:
    branches:
      - research/0061-btc-cash-absolute-risk-measurement-replication-design

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0061-btc-cash-absolute-risk-measurement-replication-design
          fetch-depth: 0
      - name: Update CURRENT_STATE only
        env:
          SECTION_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          s = s.replace('Current `main` research merge: **`fe210187472c2bcdfb51573b4cc544c187ade079`**', 'Current `main` research merge: **`9ac4a70c638bf55d8b7b614e877ed36e8193f0e7`**')
          s = s.replace('Current research branch: **`research/0060-btc-cash-absolute-risk-diagnostic-closeout`**', 'Current research branch: **`research/0061-btc-cash-absolute-risk-measurement-replication-design`**')
          anchor = 'BRRK BTC->Cash absolute risk 0060     INVALID_EXECUTION / CLOSED / NO SCIENTIFIC CONCLUSION\n'
          add = 'BRRK BTC->Cash measurement replication 0061 DESIGN FROZEN / PREREG ABSENT / NOT RUN\n'
          if add not in s:
              if anchor not in s:
                  raise SystemExit('0060 executive anchor missing')
              s = s.replace(anchor, anchor + add)
          if '## 0061 BTC-to-Cash measurement-corrected replication design handoff' not in s:
              s = s.rstrip() + '\n\n' + base64.b64decode(os.environ['SECTION_B64']).decode().rstrip() + '\n'
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet -- docs/CURRENT_STATE.md; then
            exit 0
          fi
          git add docs/CURRENT_STATE.md
          git commit -m 'Research design [0061]: update CURRENT_STATE handoff'
          git push origin HEAD:research/0061-btc-cash-absolute-risk-measurement-replication-design
