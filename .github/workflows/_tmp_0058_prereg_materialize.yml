name: Temporary 0058 prereg consistency repair

on:
  push:
    branches:
      - research/0058-beta-btc-continuation-parameter-geometry-prereg-tooling

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0058-beta-btc-continuation-parameter-geometry-prereg
          fetch-depth: 0
      - name: Make conditional-result semantics explicit
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/brrk_beta_btc_continuation_parameter_geometry_0058/PREREGISTRATION.json')
          d = json.loads(p.read_text())
          sel = d['component_and_representative_selection']
          sel['no_cost_coherent_component_behavior'] = 'NO_REPRESENTATIVE_IS_SELECTED; CLASSIFY_FAIL_STABLE_PLATEAU_NOT_COST_ROBUST; G3_G4_G5_ARE_NOT_EVALUATED'
          sel['representative_exists_iff'] = 'AT_LEAST_ONE_ADMISSIBLE_COST_COHERENT_COMPONENT_EXISTS'
          out = d['required_output_schema']
          out['selected_representative_daily_path_required_when'] = 'A_SELECTED_REPRESENTATIVE_EXISTS; OTHERWISE FIELD MUST BE AN EMPTY_LIST_AND_SELECTED_REPRESENTATIVE_MUST_BE_NULL'
          out['robustness_required_when'] = 'G2_COST_ROBUSTNESS_PASSES_AND_A_SELECTED_REPRESENTATIVE_EXISTS; OTHERWISE NOT_EVALUATED_FIELDS_MUST_BE_NULL_OR_EMPTY_BY_SCHEMA'
          d['mandatory_diagnostics_semantics'] = 'SELECTED_* AND REPRESENTATIVE_PATH_DIAGNOSTICS ARE REQUIRED ONLY WHEN A REPRESENTATIVE EXISTS; ON G2 NO-COMPONENT FAILURE THEY MUST BE NULL/EMPTY, NEVER IMPUTED FROM ARGMAX_OR_AN_INADMISSIBLE_COMPONENT'
          p.write_text(json.dumps(d, indent=2) + '\n')

          c = Path('docs/CURRENT_STATE.md')
          s = c.read_text()
          needle = 'A PASS only freezes one `(L*,kappa*)` for a later **new research ID**.'
          repl = needle + ' If no admissible cost-coherent component exists, no representative is selected: selected-path fields remain empty/null and G3-G5 are not evaluated; an argmax or inadmissible component may not be substituted.'
          if repl not in s:
              if needle not in s:
                  raise SystemExit('CURRENT_STATE prereg handoff anchor missing')
              s = s.replace(needle, repl, 1)
          c.write_text(s)
          PY
          python -m research.governance.validate
          python -m research.governance.no_drift
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/brrk_beta_btc_continuation_parameter_geometry_0058/PREREGISTRATION.json docs/CURRENT_STATE.md
          git commit -m "Research prereg [DRIFT_0]: make 0058 no-representative fail semantics explicit"
          git push origin HEAD:research/0058-beta-btc-continuation-parameter-geometry-prereg
