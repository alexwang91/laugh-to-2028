name: TSMOM ALPHA 0029

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tsmom-alpha-0029.yml'
      - 'research/requirements.txt'
      - 'research/tsmom/**'
      - 'research/regime_kelly/features.py'
      - 'research/funding_router/**'
      - 'research/asym_beta/run_asym_beta_0021.py'
      - 'research/results/pit_disp_0015/daily_equity.csv'
      - 'research/results/funding_pnl_0003/**'

permissions:
  contents: read

concurrency:
  group: tsmom-alpha-0029-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tsmom-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic unit tests
        working-directory: research/tsmom
        run: python -m unittest -v test_tsmom_alpha_0029.py
      - name: Run preregistered TSMOM experiment
        working-directory: research/tsmom
        shell: bash
        run: |
          set -o pipefail
          python run_tsmom_alpha_0029.py | tee tsmom_alpha_0029.log
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsmom-alpha-0029-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/tsmom/TSMOM-ALPHA-0029.json
            research/tsmom/tsmom_alpha_0029.log
            research/results/tsmom_alpha_0029/**
