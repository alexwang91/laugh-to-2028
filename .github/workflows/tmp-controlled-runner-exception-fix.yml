name: Temporary controlled runner exception fix
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-controlled-runner-exception-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    if: github.head_ref == 'governance/controlled-research-runner-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Preserve explicit invalid-execution classifications
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/governance/controlled_research_runner_v1.py')
          s = p.read_text()
          old = '        except DuplicatePayloadRead:\n            raise\n        except zipfile.BadZipFile as exc:'
          new = '        except InvalidExecution:\n            raise\n        except zipfile.BadZipFile as exc:'
          if old not in s:
              raise SystemExit('expected exception block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git rm .github/workflows/tmp-controlled-runner-exception-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/governance/controlled_research_runner_v1.py
          git commit -m 'fix: preserve controlled runner failure classifications'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
