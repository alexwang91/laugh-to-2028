name: 0074 Stage2 handoff repair
on:
  push:
    branches:
      - research/0074-stage2-design-v1
    paths:
      - .github/workflows/0074-stage2-handoff-repair.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage2-design-v1
      - name: Apply exact governance handoff repair
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert anchor in s, 'immutable workflow anchor missing'
          old = '0074 = OWNER-FIRST REGISTRATION IN PROGRESS ON #362 / FORMAL COMPLETION 0/10 UNTIL OWNER-FIRST MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          new = '0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN IN PROGRESS ON #363 / FORMAL COMPLETION 1/10 UNTIL STAGE-2 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          assert s.count(old) == 1, f'expected exactly one stale 0074 handoff, found {s.count(old)}'
          s = s.replace(old, new)
          assert anchor in s
          p.write_text(s)
      - name: Remove one-shot writer
        run: rm .github/workflows/0074-stage2-handoff-repair.yml
      - name: Commit repair and self-delete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md .github/workflows/0074-stage2-handoff-repair.yml
          git commit -m 'governance(0074): synchronize Stage-2 handoff'
          git push origin HEAD:research/0074-stage2-design-v1
