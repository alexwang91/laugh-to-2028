name: Repository branch cleanup once

on:
  push:
    branches:
      - "docs/repository-hygiene-2026-08-07"
    paths:
      - ".github/workflows/repository-branch-cleanup-once.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  branch-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Audit unique historical branches before final cleanup
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_OWNER: ${{ github.repository_owner }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          owner = os.environ["GITHUB_OWNER"]
          token = os.environ["GITHUB_TOKEN"]
          api_root = f"https://api.github.com/repos/{repo}"
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "repository-hygiene-audit",
          }

          def api(path):
              req = urllib.request.Request(api_root + path, headers=headers)
              with urllib.request.urlopen(req) as response:
                  payload = response.read()
                  return json.loads(payload) if payload else None

          branches = {}
          page = 1
          while True:
              rows = api(f"/branches?per_page=100&page={page}")
              if not rows:
                  break
              for row in rows:
                  branches[row["name"]] = row["commit"]["sha"]
              page += 1

          preserve = {
              "main",
              "p4-4/leverage-0040-one-time-study-v2",
              "docs/repository-hygiene-2026-08-07",
          }
          main_sha = branches["main"]

          print(f"TOTAL_BRANCHES={len(branches)}")
          for branch, sha in sorted(branches.items()):
              if branch in preserve:
                  continue
              base = urllib.parse.quote(main_sha, safe="")
              head = urllib.parse.quote(sha, safe="")
              cmp = api(f"/compare/{base}...{head}")
              prs = api(
                  "/pulls?state=all&per_page=100&head="
                  + urllib.parse.quote(f"{owner}:{branch}", safe="")
              )
              print("=== BRANCH ===")
              print(f"name={branch}")
              print(f"head_sha={sha}")
              print(f"compare_status={cmp.get('status')} ahead_by={cmp.get('ahead_by')} behind_by={cmp.get('behind_by')}")
              print("pull_requests=" + json.dumps([
                  {
                      "number": p["number"],
                      "state": p["state"],
                      "merged_at": p.get("merged_at"),
                      "title": p["title"],
                  }
                  for p in prs
              ], ensure_ascii=False))
              print("unique_commits=")
              for c in cmp.get("commits", []):
                  first = (c.get("commit", {}).get("message") or "").splitlines()[0]
                  print(f"  {c['sha']} | {first}")
              print("changed_files=")
              for f in cmp.get("files", []):
                  print(f"  {f['status']} | {f['filename']} | +{f['additions']} -{f['deletions']}")
          PY
