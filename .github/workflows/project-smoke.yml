name: Project Smoke

on:
  push:
    branches:
      - "tools/0085-unique-controlled-run-v1"
    paths:
      - ".github/workflows/project-smoke.yml"

permissions:
  contents: write

jobs:
  register-0085-workflow-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "tools/0085-unique-controlled-run-v1"
          fetch-depth: 0
      - name: Add exact no-drift path and push
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('research/governance/no_drift.py')
          s = p.read_text(encoding='utf-8')
          needle = '    ".github/workflows/0072-capture-0002.yml",\n'
          addition = '    ".github/workflows/0085-unique-controlled-run.yml",\n'
          if addition not in s:
              if needle not in s:
                  raise SystemExit('expected allowlist anchor missing')
              s = s.replace(needle, needle + addition, 1)
              p.write_text(s, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/governance/no_drift.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix(governance): authorize exact 0085 RUN workflow path'
          git push origin HEAD:tools/0085-unique-controlled-run-v1
