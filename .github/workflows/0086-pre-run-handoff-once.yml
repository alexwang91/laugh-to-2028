name: 0086 pre-RUN handoff once

on:
  push:
    branches:
      - "research/0086-factor-atlas-run-v1"
    paths:
      - ".github/workflows/0086-pre-run-handoff-once.yml"

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "research/0086-factor-atlas-run-v1"
          fetch-depth: 0
      - name: Apply prospective allowlist and real CURRENT_STATE handoff
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          no_drift = Path('research/governance/no_drift.py')
          text = no_drift.read_text(encoding='utf-8')
          old = '    ".github/workflows/0085-unique-controlled-run.yml",\n'
          new = old + '    ".github/workflows/0086-unique-controlled-run.yml",\n'
          if new not in text:
              if old not in text:
                  raise SystemExit('0085 workflow allowlist anchor missing')
              text = text.replace(old, new, 1)
              no_drift.write_text(text, encoding='utf-8')

          current = Path('docs/CURRENT_STATE.md')
          state = current.read_text(encoding='utf-8')
          heading = '## 0086 Factor Atlas authorized RUN preparation — 2026-08-26'
          if heading not in state:
              state += '''\n\n## 0086 Factor Atlas authorized RUN preparation — 2026-08-26\n\n- `BRRK-CROSS-SECTIONAL-FACTOR-ATLAS-0086` remains ARM-complete. The repository owner has now durably recorded separate authorization for controlled RUN attempt `1/1`; authorization is not itself an attempt marker and remains unconsumed at this handoff.\n- Worker B reused `research/0086-factor-atlas-run-v1` and added the prospective source-qualified production orchestrator plus a unique trigger-scoped workflow. No `RUN_TRIGGER.json`, `RUN_ATTEMPT.marker`, `PRIMARY_RESULT.json`, or `RUN_ONCE.marker` exists at this preparation point. Controlled reads remain `0`; engine calls remain `0/1`; scientific values remain unexposed.\n- The orchestrator rebuilds exactly the ARM-selected `15,254` USD-M monthly 1d kline identities from the immutable 0076 metadata-only submanifest, maps frozen `stage/payloads/...` keys to the actual GitHub artifact `payloads/...` namespace, verifies declared size/SHA-256 through `ControlledResearchRunnerV1SourceQualified`, and uses the qualified Git create-only store for durable marker/result/RUN_ONCE persistence.\n- The run workflow verifies artifact `9495175701` name, size and digest before downloading the outer container. Pre-marker payload decompression, `testzip()`, CRC traversal, inner ZIP/CSV parsing and scientific calculations remain forbidden.\n- This handoff also repays the real `docs/CURRENT_STATE.md` debt left by merged 0087 BUILD requalification PR #432. 0087 mechanics clarification/requalification is complete pre-exposure, but 0087 remains blocked before ARM/RUN by `BLOCKED_NO_QUALIFYING_CONTROLLED_SOURCE_METADATA`.\n- 0085 remains immutable `INVALID_EXECUTION` with attempt `1/1` consumed and no admissible Trend science. 0076 remains sealed at its Stage7 pre-marker incident; 0072/0073 remain paused; 0083 remains immutable FAIL. `workflow run                         31381953131 / attempt 1`, CAPTURE-0001 sealed/no-retry, CAPTURE-0002 permanently claimed/no-refetch, and Phase6 closeout remain immutable.\n- Factor L/S remains forbidden unless 0086 produces an admissible PASS. Production/signature/order/withdrawal/transfer authority remains false.\n'''
              current.write_text(state, encoding='utf-8')
          PY
      - name: Remove one-time workflow and commit handoff
        run: |
          set -euo pipefail
          rm .github/workflows/0086-pre-run-handoff-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/governance/no_drift.py docs/CURRENT_STATE.md .github/workflows/0086-pre-run-handoff-once.yml
          git commit -m "research(0086): record authorized RUN handoff"
          git push origin HEAD:research/0086-factor-atlas-run-v1
