name: 0053 support implementation synthetic contract

on:
  push:
    branches:
      - research/brrk-leadership-intraday-support-0053-implementation

permissions:
  contents: read

jobs:
  synthetic-contract:
    if: contains(github.event.head_commit.message, 'trigger 0053 support synthetic contract')
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Compile support counter
        run: python -m py_compile research/brrk_leadership_intraday_support_0053/support_funnel.py
      - name: Run synthetic support contracts only
        run: python -m unittest research.brrk_leadership_intraday_support_0053.test_support_funnel
      - name: Enforce zero-result implementation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/brrk_leadership_intraday_support_0053')
          forbidden=['SUPPORT_RESULT.json','PRIMARY_RESULT.json','RESULT_SUMMARY.json','EXECUTION.json','RUN_ONCE.marker']
          hit=[x for x in forbidden if (p/x).exists()]
          if hit: raise SystemExit(f'forbidden result artifacts: {hit}')
          print('ZERO_RESULT_IMPLEMENTATION_PASS')
          print('REAL_4H_SUPPORT_MEASUREMENT_NOT_EXECUTED=true')
          PY
