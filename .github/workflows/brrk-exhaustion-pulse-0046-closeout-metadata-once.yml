name: BRRK exhaustion pulse 0046 closeout metadata once

on:
  push:
    branches:
      - research/brrk-exhaustion-pulse-0046-closeout
    paths:
      - .github/workflows/brrk-exhaustion-pulse-0046-closeout-metadata-once.yml

permissions:
  contents: write

env:
  BASE_MAIN_SHA: 'aef20ae0e452fa8d737a64846ba433aebcb55628'

jobs:
  closeout-central-registry-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-exhaustion-pulse-0046-closeout
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify closeout result files already exist and no research execution occurs here
        run: |
          test -f research/brrk_exhaustion_pulse_0046/PRIMARY_RESULT.json
          test -f research/brrk_exhaustion_pulse_0046/EXECUTION.json
          test -f research/brrk_exhaustion_pulse_0046/RUN_ONCE.marker
          test -f research/brrk_exhaustion_pulse_0046/RESULT.md
          test ! -e research/brrk_exhaustion_pulse_0046/PREDICTOR_PATH.json
          test ! -e research/brrk_exhaustion_pulse_0046/CALIBRATION_LOCK.json
          echo 'METADATA_ONLY_NO_RESEARCH_EXECUTION=true'

      - name: Mechanically update only 0046 central research record
        run: |
          python - <<'PY'
          import copy
          import json
          import subprocess
          from pathlib import Path

          rid = 'BRRK-EXHAUSTION-PULSE-0046'
          registry_path = Path('config/research_registry.json')
          current = json.loads(registry_path.read_text())
          base = json.loads(subprocess.check_output(
              ['git', 'show', 'aef20ae0e452fa8d737a64846ba433aebcb55628:config/research_registry.json'],
              text=True,
          ))

          current_other = [r for r in current['records'] if r.get('research_id') != rid]
          base_other = [r for r in base['records'] if r.get('research_id') != rid]
          assert current_other == base_other, 'non-0046 registry record drift before closeout update'
          assert current.get('research_governance_debt') == base.get('research_governance_debt')

          matches = [r for r in current['records'] if r.get('research_id') == rid]
          assert len(matches) == 1
          rec = matches[0]
          assert rec['governance_mode'] == 'PROGRAM_GOVERNED_V1'
          assert rec['result_status'] == 'PREREGISTERED_NOT_RUN'
          assert rec['actual_variants_evaluated'] == 0
          assert rec['declared_variant_budget'] == 1
          assert rec['production_authorized'] is False

          rec['actual_variants_evaluated'] = 1
          rpc = rec['research_process_complexity']
          rpc['actual_parameter_candidates_evaluated'] = copy.deepcopy(rpc['declared_parameter_candidates'])
          rec['result_status'] = 'FAIL_NO_FUTURE_ONLY_PULSE_VALIDATION_ELIGIBILITY'
          rec['failure_reason'] = (
              'Frozen Transition Pulse candidate passed specificity, anti-stickiness and ARL0 gates but failed '
              'all preregistered TRUE_EXHAUSTION sensitivity/timing gates: primary TRUE PRE14_7 0/9, '
              'TRUE episode PRE14_7 0/5, severe TRUE PRE14_7 0/7, and zero qualifying PRE21_0 onsets.'
          )
          rec['promotion_state'] = 'NONE'
          rec['evidence_refs'] = [
              'research/brrk_exhaustion_pulse_0046/PRIMARY_RESULT.json',
              'research/brrk_exhaustion_pulse_0046/EXECUTION.json',
              'research/brrk_exhaustion_pulse_0046/RUN_ONCE.marker',
          ]
          rec['decision_refs'] = [
              'research/brrk_exhaustion_pulse_0046/RESULT.md',
              'research/brrk_exhaustion_pulse_0046/README.md',
              'docs/CURRENT_STATE.md',
          ]
          notes = list(rec.get('notes', []))
          notes.extend([
              'Pre-result implementation merged at f23d2aac6fa8699af12b784ca03489061e331865 after standing synthetic equivalence/firewall/no-drift checks.',
              'Controlled run 31417259266 completed the first label-blind calibration but failed before PRIMARY_RESULT creation because the initial evaluator raised on a frozen peak preceding complete S1-S4 availability; zero artifacts were uploaded and this remains infrastructure-failure evidence, not a research result.',
              'PR #165 repaired only the exact already-frozen 0045 session-window compatibility and merged at aef20ae0e452fa8d737a64846ba433aebcb55628; detector/calibration/threshold/gates/denominators were unchanged.',
              'Valid result run 31419044159 attempt 1 from head 88f7c7e769352ea9d7b4cac881d2836678576b8e reproduced the run-1 predictor and full calibration lock before labels, then executed the frozen historical evaluation exactly once.',
              'Valid artifact 9074623455 digest sha256:2938e8c0a776255848b13990200cd77bec85ab15e143596a477fc08f3b63c2a0; full PRIMARY_RESULT SHA256 5c0e9aa4864b0044d5033573be78cdee3c0802db2d8b98d24fc0afcc21abbf8c.',
              'Binding negative result: zero of nine primary TRUE events pulsed in PRE14_7, zero of five TRUE episodes hit, zero of seven severe TRUE events hit, zero qualifying PRE21_0 onsets; only one pulse occurred across 1,021 eligible sessions.',
              'Specificity/anti-stickiness passed: continuation false pulses 0/6, raw alarm occupancy about 0.196%, median and p90 alarm spells both one session, truncated ARL0 365.0472.',
              '0046 is permanently closed to same-ID rerun, threshold/ARL/age/axis/model/pulse rescue, event filtering, dynamic-gross mapping and portfolio economics.'
          ])
          rec['notes'] = notes
          rec['evidence_scorecard'] = {
              'temporal_novelty': 'RESEARCHER_EXPOSED_DEVELOPMENT_HISTORY_2023-08-07_TO_2026-08-02_NOT_INDEPENDENT_OOS',
              'statistical_sufficiency': 'EIGHT_MACRO_EPISODES_CALIBRATION_ARL0_PASS_BUT_PRIMARY_TRUE_0_OF_9_TRUE_EPISODE_0_OF_5_SEVERE_TRUE_0_OF_7_AND_ZERO_PRE21_0_ONSETS',
              'governance_integrity': 'HIGH_PREREGISTERED_SINGLE_CANDIDATE_PRE_RESULT_BOUNDARY_RUN1_FAILURE_PRESERVED_REPAIR_PARENT_SEMANTICS_ONLY_RUN1_LOCK_REPRODUCED_BEFORE_SINGLE_VALID_RESULT_NO_RETUNING',
              'operational_realism': 'TRANSITION_PULSE_DIAGNOSTIC_ONLY_EXTREMELY_SPARSE_ONE_PULSE_1021_ELIGIBLE_SESSIONS_NO_PORTFOLIO_TRANSLATION',
              'derived_confidence': 'HIGH_CONFIDENCE_CURRENT_0046_PULSE_CANDIDATE_IS_NOT_ELIGIBLE_FOR_FUTURE_ONLY_PULSE_VALIDATION_OR_DYNAMIC_GROSS',
              'confidence_rule_ref': 'research/brrk_exhaustion_pulse_0046/RUN_INTERFACE.json'
          }

          registry_path.write_text(json.dumps(current, indent=2) + '\n')

          updated = json.loads(registry_path.read_text())
          assert [r for r in updated['records'] if r.get('research_id') != rid] == base_other
          assert updated.get('research_governance_debt') == base.get('research_governance_debt')
          u = [r for r in updated['records'] if r.get('research_id') == rid][0]
          assert u['actual_variants_evaluated'] == 1
          assert u['result_status'] == 'FAIL_NO_FUTURE_ONLY_PULSE_VALIDATION_ELIGIBILITY'
          assert u['production_authorized'] is False
          print('ONLY_0046_CENTRAL_RECORD_UPDATED=true')
          PY

      - name: Prove registry diff is limited to central registry file
        run: |
          git diff --check
          mapfile -t changed < <(git diff --name-only)
          printf 'workflow_mutation_changed=%s\n' "${changed[*]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'config/research_registry.json'
          python -m json.tool config/research_registry.json >/dev/null

      - name: Commit mechanical metadata closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json
          git commit -m 'governance: close out BRRK exhaustion pulse 0046 result'
          git push origin HEAD:research/brrk-exhaustion-pulse-0046-closeout
