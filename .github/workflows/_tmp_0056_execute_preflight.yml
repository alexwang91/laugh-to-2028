name: 0056 zero-result execution preflight

on:
  push:
    branches:
      - research/0056-simple-beta-router-execute-preflight

permissions:
  contents: read

env:
  SCIENTIFIC_HEAD: 186a7f7d57c957c98798ecd828533ffe20dedb83
  RESULT_BRANCH: research/0056-simple-beta-router-result
  RESULT_DIR: /tmp/0056-result
  SCI_DIR: research/brrk_simple_eth_sol_beta_router_0056
  MARKET: research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen scientific HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_HEAD }}
          fetch-depth: 0
      - name: Verify exact scientific HEAD
        run: |
          test "$(git rev-parse HEAD)" = "$SCIENTIFIC_HEAD"
          echo "SCIENTIFIC_HEAD_LOCKED=$SCIENTIFIC_HEAD"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 requests==2.32.5
      - name: Mount untouched durable result branch worktree
        run: |
          git fetch origin "$RESULT_BRANCH:$RESULT_BRANCH"
          rm -rf "$RESULT_DIR"
          git worktree add "$RESULT_DIR" "$RESULT_BRANCH"
          test "$(git -C "$RESULT_DIR" rev-parse HEAD)" = "$SCIENTIFIC_HEAD"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "$RESULT_DIR/$SCI_DIR/$f"
          done
      - name: Zero-result preflight only
        run: |
          python -m research.brrk_simple_eth_sol_beta_router_0056.run_once preflight \
            --market "$MARKET" \
            --result "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" | tee /tmp/0056-preflight.json
          grep -q 'PREFLIGHT_PASS_ZERO_RESULT' /tmp/0056-preflight.json
          grep -q '"actual_variants_evaluated": 0' /tmp/0056-preflight.json
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "$RESULT_DIR/$SCI_DIR/$f"
          done
