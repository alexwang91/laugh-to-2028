name: BRRK exhaustion state 0044 implementation handoff once

on:
  push:
    branches:
      - research/brrk-exhaustion-state-0044-runonce
    paths:
      - .github/workflows/brrk-exhaustion-state-0044-current-state-patch-once.yml

permissions:
  contents: write

jobs:
  patch-current-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-exhaustion-state-0044-runonce
          fetch-depth: 0
      - name: Patch current state
        run: python research/governance/patch_current_state_0044_impl_once.py
      - name: Commit patch and self-delete
        run: |
          git rm .github/workflows/brrk-exhaustion-state-0044-current-state-patch-once.yml
          git rm research/governance/patch_current_state_0044_impl_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'docs: hand off 0044 pre-result implementation'
          git push origin HEAD:research/brrk-exhaustion-state-0044-runonce
