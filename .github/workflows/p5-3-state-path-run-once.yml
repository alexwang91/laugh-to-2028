name: P5.3 state-path evidence RUN ONCE

on:
  push:
    branches:
      - "p5-3/state-model-implementation"
    paths:
      - "research/cycle_exit/RUN_ONCE_P5_3_STATE_PATHS.marker"

permissions:
  contents: write

concurrency:
  group: p5-3-state-path-run-once
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "p5-3/state-model-implementation"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Guard one-time authority and frozen dependencies
        run: |
          set -euo pipefail
          test ! -e research/results/p5_3_state_paths/summary.json
          test "$(sha256sum research/cycle_exit/RUN_ONCE_P5_3_STATE_PATHS.marker | awk '{print $1}')" = "7b3ec6c999a8c2a86bc5aa405861ee0e01ecc7f79b4d66805b350d22b6cf62b7"
          test "$(git hash-object research/cycle_exit/p5_3_state_model_contract.json)" = "400ec97f8a0e522c5776ce1f6a98fc6d7e069267"
          test "$(git hash-object research/cycle_exit/p5_3_state_path_evidence_contract.json)" = "2c3f5a200c1c1a1ddad2d93ddd9f455e5a610efd"
          test "$(cat research/results/p5_2_feature_evidence/summary.sha256)" = "3f6dc3c512d22ac8f71d43ed155f2602cd40d5caf3d617c0e130e170727e0627"
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/cycle_exit/p5_3_state_path_evidence_contract.json').read_text())
          assert c['status'] == 'FROZEN_BEFORE_FIRST_STATE_PATH_RUN'
          assert c['profiles'] == ['EARLY','BALANCED','CONSERVATIVE']
          assert c['selection']['profile_selected'] is False
          assert c['selection']['state_model_production_selected'] is False
          assert c['research_integrity']['no_p5_4_gross_mapping'] is True
          assert c['research_integrity']['production_authorization'] == 'NONE'
          PY
      - name: Execute deterministic frozen P5.3 state-path evidence
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python research/cycle_exit/run_p5_3_state_paths.py
      - name: Validate immutable P5.3 state-path result
        run: python research/cycle_exit/validate_p5_3_state_path_result.py
      - name: Commit immutable result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/p5_3_state_paths
          git diff --cached --quiet && { echo "No P5.3 result files staged"; exit 1; }
          git commit -m "Research: commit immutable P5.3 state-path evidence"
          git push origin HEAD:p5-3/state-model-implementation
