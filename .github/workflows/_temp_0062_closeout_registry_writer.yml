name: Temp 0062 closeout registry writer
on:
  push:
    branches: [tools/0062-closeout-registry-writer-v1]
    paths: ['.github/workflows/_temp_0062_closeout_registry_writer.yml']
permissions:
  contents: write
  actions: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0062-closeout-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: 0062-closeout-registry
          path: /tmp/0062-closeout-registry
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: alexwang91/laugh-to-2028
          run-id: 31754250670
      - name: Verify exact artifact and write only registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "a20361dcaeae9dadd76fc7463386711f838fefa7"
          test "$(git hash-object /tmp/0062-closeout-registry/research_registry.json)" = "a1e34c10d8dadfeea27cff16310199472a2d1ef7"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/0062-closeout-registry/BUILD_REPORT.json').read_text())
          assert r['research_id']=='BRRK-BTC-RISK-SIGNAL-ATLAS-0062'
          assert r['result_status']=='FAIL_NO_SIGNAL_ATLAS_FAMILY_INFORMATION'
          assert r['promotion_state']=='NO_PROMOTION'
          assert r['actual_variants_evaluated']==185
          assert r['production_authorized'] is False
          assert set(r['evidence_scorecard'])=={'temporal_novelty','statistical_sufficiency','governance_integrity','operational_realism'}
          PY
          cp /tmp/0062-closeout-registry/research_registry.json config/research_registry.json
          python -m research.governance.validate
          test "$(git diff --name-only)" = "config/research_registry.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json
          test "$(git diff --cached --name-only)" = "config/research_registry.json"
          git commit -m 'research: register immutable 0062 closeout result'
          git push origin HEAD:research/0062-closeout-v1
