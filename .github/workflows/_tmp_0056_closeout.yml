name: Temporary 0056 read-only closeout

on:
  push:
    branches:
      - research/0056-simple-beta-router-result

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify immutable runtime and materialize read-only closeout
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json
          from pathlib import Path

          RID = 'BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056'
          SCI_HEAD = '186a7f7d57c957c98798ecd828533ffe20dedb83'
          PAYLOAD = 'd1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193'
          RUN_ID = 31604126017
          ARTIFACT_ID = 9144363833
          ARTIFACT_NAME = 'brrk-0056-portfolio-economics-runtime-bundle'
          ARTIFACT_DIGEST = 'sha256:f3617a29d19e322a8c1a376c37d4eb3fde6b40314aaabf160d18df1502df7384'
          base = Path('research/brrk_simple_eth_sol_beta_router_0056')

          def load(name):
              return json.loads((base / name).read_text())
          def canon_sha(value):
              raw=json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode()
              return hashlib.sha256(raw).hexdigest()

          attempt=load('RUN_ATTEMPT.marker')
          result=load('PRIMARY_RESULT.json')
          execution=load('EXECUTION.json')
          marker=load('RUN_ONCE.marker')

          assert attempt['research_id'] == RID
          assert attempt['git_head_sha'] == SCI_HEAD
          assert attempt['payload_sha256'] == PAYLOAD
          assert attempt['same_id_recomputation_allowed'] is False
          assert result['research_id'] == RID
          assert result['execution_head_sha'] == SCI_HEAD
          assert result['payload_sha256'] == PAYLOAD
          assert result['classification'] == 'INVALID_EXECUTION'
          m=result['measurement']
          assert m['classification'] == 'INVALID_EXECUTION'
          assert m['error_type'] == 'RouterProtocolError'
          assert m['error'] == 'price index timezone must be UTC'
          assert m['actual_variants_evaluated'] == 1
          assert 'metrics_by_cost_bps' not in m
          assert 'gates' not in m
          assert execution['classification'] == 'INVALID_EXECUTION'
          assert execution['actual_variants_evaluated'] == 1
          assert execution['git_head_sha'] == SCI_HEAD
          assert execution['payload_sha256'] == PAYLOAD
          assert marker['classification'] == 'INVALID_EXECUTION'
          assert marker['status'] == 'VALID_PORTFOLIO_ECONOMICS_EXECUTION_COMPLETE_CLOSED_TO_SAME_ID_RERUN'
          assert marker['git_head_sha'] == SCI_HEAD
          assert marker['same_id_rerun_allowed'] is False
          assert marker['same_id_retuning_allowed'] is False
          assert marker['same_id_rescue_allowed'] is False
          assert marker['finalized_without_remeasurement'] is True
          assert execution['attempt_marker_sha256'] == canon_sha(attempt)
          assert execution['primary_result_sha256'] == canon_sha(result)
          assert marker['attempt_marker_sha256'] == canon_sha(attempt)
          assert marker['primary_result_sha256'] == canon_sha(result)
          assert marker['execution_sha256'] == canon_sha(execution)

          source_text=Path('research/brrk_beta_handoff_0047/engine.py').read_text()
          impl_text=(base/'engine.py').read_text()
          assert 'if frame.index.tz is not None:' in source_text
          assert 'UTC-normalized tz-naive dates' in source_text
          assert 'if index.tz is None or str(index.tz) != "UTC":' in impl_text
          assert 'price index timezone must be UTC' in impl_text

          ci={
            'research_id': RID,
            'status': 'READ_ONLY_CLOSEOUT_CONTRACT_PASS',
            'scientific_engine_imported': False,
            'portfolio_remeasurement_executed': False,
            'runtime_hash_chain_verified': True,
            'classification_verified': 'INVALID_EXECUTION',
            'failure_stage': 'G0_INTERFACE_INTEGRITY',
            'source_loader_timezone_contract': 'UTC_NORMALIZED_TZ_NAIVE_DAILY_DATES',
            '0056_engine_timezone_contract': 'TZ_AWARE_UTC_REQUIRED',
            'interface_mismatch_verified_from_source_text': True,
            'terminal_wealth_computed': False,
            'cagr_computed': False,
            'G1_G4_reached': False,
            'same_id_rerun_allowed': False,
          }
          (base/'CLOSEOUT_CI.json').write_text(json.dumps(ci, indent=2) + '\n')

          closeout={
            'research_id': RID,
            'status': 'INVALID_EXECUTION_CLOSED',
            'closed': True,
            'development_not_independent_oos': True,
            'researcher_exposed_history': True,
            'execution_head_sha': SCI_HEAD,
            'payload_sha256': PAYLOAD,
            'execution_identity': {
              'github_actions_run': RUN_ID,
              'runtime_artifact_id': ARTIFACT_ID,
              'runtime_artifact_name': ARTIFACT_NAME,
              'runtime_artifact_digest': ARTIFACT_DIGEST,
              'started_at_utc': execution['started_at_utc'],
              'completed_at_utc': execution['completed_at_utc'],
            },
            'runtime_hashes': {
              'attempt_marker_sha256': marker['attempt_marker_sha256'],
              'primary_result_sha256': marker['primary_result_sha256'],
              'execution_sha256': marker['execution_sha256'],
            },
            'binding_failure': {
              'stage': 'G0_INTERFACE_INTEGRITY',
              'error_type': 'RouterProtocolError',
              'error': 'price index timezone must be UTC',
              'source_loader_contract': '0047/0048 frozen loader emits UTC-normalized tz-naive daily DatetimeIndex values',
              '0056_implementation_contract': '0056 validate_price_frames requires timezone-aware DatetimeIndex with tz string UTC',
              'diagnosis': 'IMPLEMENTATION_INTERFACE_INCOMPATIBILITY_NOT_DATA_CORRUPTION_AND_NOT_ECONOMIC_STRATEGY_FAILURE',
            },
            'economic_result': {
              'terminal_wealth_available': False,
              'net_cagr_available': False,
              'maximum_drawdown_available': False,
              'G1_primary_economic_dominance_reached': False,
              'G2_cost_survival_reached': False,
              'G3_temporal_robustness_reached': False,
              'G4_dependence_robustness_reached': False,
              'rm60_economic_efficacy_established': False,
              'rm60_economic_efficacy_rejected': False,
            },
            'authority': {
              'portfolio_economics_execution_attempted': True,
              'economic_conclusion_authorized': False,
              'corrected_interface_rerun_under_0056_allowed': False,
              'same_id_rerun_allowed': False,
              'same_id_retuning_allowed': False,
              'same_id_rescue_allowed': False,
              'result_informed_continuation_requires_new_research_id': True,
              'canonical_strategy_changed': False,
              'phase6_changed': False,
              'production_authorized': False,
              'signature_authorized': False,
              'order_submission_authorized': False,
            },
            'interpretation': '0056 is closed as INVALID_EXECUTION because the immutable upstream market loader and the frozen 0056 input validator use incompatible timezone representations. No terminal wealth, CAGR, G1-G4 economic statistic, or evidence about RM60 portfolio efficacy was produced. Correcting the interface and evaluating the same economic question requires a new research ID and full prospective governance; 0056 itself may never be rerun.',
          }
          (base/'CLOSEOUT.json').write_text(json.dumps(closeout, indent=2) + '\n')

          result_md=f'''# 0056 Simple ETH/SOL Beta Router Result\n\nFinal classification: **INVALID_EXECUTION / CLOSED**.\n\n0056 did **not** produce a strategy PASS or economic FAIL. The unique exactly-once DEVELOPMENT run stopped at the frozen G0 input-integrity boundary before terminal wealth, CAGR, MDD, cost-survival, temporal-robustness or bootstrap economics were available.\n\n## Binding failure\n\nThe immutable primary result records:\n\n```text\nclassification       INVALID_EXECUTION\nerror_type           RouterProtocolError\nerror                price index timezone must be UTC\nexecution HEAD       {SCI_HEAD}\npayload SHA256       {PAYLOAD}\nActions run          {RUN_ID}\n```\n\nThe cause is an implementation/interface mismatch, not damaged market data:\n\n- the frozen 0047/0048 market loader explicitly normalizes daily dates to a **tz-naive UTC-normalized** `DatetimeIndex`;\n- the frozen 0056 implementation rejects tz-naive indexes and requires a timezone-aware index whose timezone string is `UTC`.\n\nThose contracts are incompatible at the 0056 G0 boundary.\n\n## Economic interpretation\n\nNo router/static wealth paths were admitted past G0. Therefore 0056 provides **no evidence that RM60 works and no evidence that RM60 fails economically**. In particular, none of G1-G4 was reached and no terminal wealth or CAGR may be inferred or reconstructed under 0056.\n\n## Exactly-once closure\n\n`RUN_ATTEMPT.marker` was durably pushed and remote-blob verified before the unique evaluate call. The result and execution bundle were then durably persisted, and `RUN_ONCE.marker` was finalized from existing hashes without remeasurement.\n\n```text\nsame-ID rerun allowed       false\nsame-ID retuning allowed    false\nsame-ID rescue allowed      false\nfinalized without rerun     true\n```\n\nFixing the timezone interface and evaluating the same mechanism requires a **new research ID**. It cannot be repaired and rerun as 0056.\n\n## Authority\n\nCanonical BRRK, Phase 6, production authorization, signing authority and order submission remain unchanged and false where applicable.\n'''
          (base/'RESULT.md').write_text(result_md)

          # Update only the 0056 registry record, preserving all other bytes.
          reg_path=Path('config/research_registry.json')
          reg=reg_path.read_text()
          needle='"research_id": "BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056"'
          pos=reg.index(needle)
          start=reg.rfind('    {', 0, pos)
          end_marker='\n    }\n  ],\n  "research_governance_debt"'
          end=reg.index(end_marker, pos)+len('\n    }')
          seg=reg[start:end]
          assert seg.count('"actual_variants_evaluated": 0') == 1
          seg=seg.replace('"actual_variants_evaluated": 0', '"actual_variants_evaluated": 1', 1)
          assert seg.count('"actual_parameter_candidates_evaluated": []') == 1
          seg=seg.replace('"actual_parameter_candidates_evaluated": []', '"actual_parameter_candidates_evaluated": [\n          "RM60_SIGN_ROUTER_ATTEMPT_TERMINATED_AT_G0_INTERFACE_VALIDATION"\n        ]', 1)
          assert '"result_status": "PREREGISTERED_NOT_RUN"' in seg
          seg=seg.replace('"result_status": "PREREGISTERED_NOT_RUN"', '"result_status": "INVALID_EXECUTION_CLOSED"', 1)
          assert '"failure_reason": null' in seg
          seg=seg.replace('"failure_reason": null', '"failure_reason": "G0 implementation/interface mismatch: immutable 0047/0048 loader emits UTC-normalized tz-naive daily indexes while frozen 0056 validate_price_frames requires timezone-aware UTC; no economic gate was reached."', 1)
          old='"evidence_refs": []'
          assert old in seg
          new='''"evidence_refs": [\n        "run:31604126017",\n        "artifact:brrk-0056-portfolio-economics-runtime-bundle",\n        "research/brrk_simple_eth_sol_beta_router_0056/PRIMARY_RESULT.json",\n        "research/brrk_simple_eth_sol_beta_router_0056/RUN_ONCE.marker",\n        "research/brrk_simple_eth_sol_beta_router_0056/CLOSEOUT.json"\n      ],\n      "evidence_scorecard": {\n        "temporal_novelty": "NOT_ESTABLISHED_INVALID_EXECUTION_BEFORE_ECONOMIC_PATH",\n        "statistical_sufficiency": "NOT_ESTABLISHED_G1_G4_NOT_REACHED",\n        "governance_integrity": "HIGH_EXACTLY_ONCE_HASH_BOUND_FAIL_CLOSED",\n        "operational_realism": "INVALID_INTERFACE_CONTRACT_SOURCE_TZ_NAIVE_VS_0056_TZ_AWARE_REQUIREMENT",\n        "derived_confidence": "HIGH",\n        "confidence_rule_ref": "research/brrk_simple_eth_sol_beta_router_0056/CLOSEOUT.json"\n      }'''
          seg=seg.replace(old, new, 1)
          decision_anchor='"research/brrk_simple_eth_sol_beta_router_0056/DATASET_DECLARATION.json",\n        "docs/CURRENT_STATE.md"'
          assert decision_anchor in seg
          seg=seg.replace(decision_anchor, '"research/brrk_simple_eth_sol_beta_router_0056/DATASET_DECLARATION.json",\n        "research/brrk_simple_eth_sol_beta_router_0056/CLOSEOUT.json",\n        "docs/CURRENT_STATE.md"', 1)
          note='"The sole 60-day router horizon predates 0054/0055 failure as 0048 baseline B3; no alternative lookback or same-line rescue is authorized."'
          assert note in seg
          seg=seg.replace(note, note+',\n        "Unique run 31604126017 closed INVALID_EXECUTION at G0 because the immutable source loader is tz-naive while the frozen 0056 validator requires tz-aware UTC. No economic conclusion was produced; same-ID rerun is forbidden."', 1)
          reg=reg[:start]+seg+reg[end:]
          reg_path.write_text(reg)

          # README closeout handoff.
          rp=base/'README.md'
          rd=rp.read_text()
          old_status='Status: **CONTROLLED-EXECUTION BOUNDARY ON BRANCH / ZERO RESULT / REAL HISTORICAL RUN NOT RUN**'
          assert old_status in rd
          rd=rd.replace(old_status, 'Status: **INVALID_EXECUTION / CLOSED / NO ECONOMIC CONCLUSION**', 1)
          anchor='## Current authority\n'
          assert anchor in rd
          close_section=f'''## Immutable 0056 closeout\n\nThe unique DEVELOPMENT run `31604126017` at scientific HEAD `{SCI_HEAD}` closed as **`INVALID_EXECUTION`** before any economic gate. The frozen 0047/0048 loader supplies UTC-normalized tz-naive daily indexes, while frozen 0056 `validate_price_frames()` requires timezone-aware UTC. No terminal wealth, CAGR or G1-G4 economic statistic exists.\n\nThe attempt marker was durable before evaluate, so the interface mismatch cannot be corrected and rerun under 0056. Any corrected execution of the same mechanism requires a new research ID and complete prospective governance. `CLOSEOUT.json` and `RESULT.md` are authoritative for interpretation.\n\n'''
          rd=rd.replace(anchor, close_section+anchor, 1)
          rd=rd.replace('controlled execution boundary FROZEN ON BRANCH / ZERO RESULT', f'controlled execution boundary MERGED AT {SCI_HEAD}', 1)
          rd=rd.replace('historical execution          NOT RUN', 'historical execution          UNIQUE RUN 31604126017 / COMPLETE', 1)
          rd=rd.replace('result                        PREREGISTERED_NOT_RUN', 'result                        INVALID_EXECUTION / CLOSED', 1)
          rd=rd.replace('actual variants evaluated     0', 'actual variants evaluated     1', 1)
          tail='After this controlled-execution boundary merges green, the only allowed next action is the unique staged DEVELOPMENT execution from the exact merged boundary HEAD: zero-result preflight, durable attempt marker, exactly one real evaluation, durable result/execution bundle, then marker-only finalization. No real 0056 historical evaluation is authorized while this boundary remains unmerged.'
          if tail in rd:
              rd=rd.replace(tail, '0056 is permanently closed. Do not rerun, retune or repair it. A corrected timezone-interface execution of the same frozen economic mechanism requires a new research ID; 0056 itself provides no economic efficacy conclusion.', 1)
          rp.write_text(rd)

          # CURRENT_STATE closeout handoff.
          sp=Path('docs/CURRENT_STATE.md')
          st=sp.read_text()
          old_main='Current `main` research merge: **`9417bc3370613f1818d11aebf91bf733ac5ecbcc`**'
          old_branch='Current research branch: **`research/0056-simple-beta-router-controlled-run`**'
          assert old_main in st and old_branch in st
          st=st.replace(old_main, f'Current `main` research merge: **`{SCI_HEAD}`**', 1)
          st=st.replace(old_branch, 'Current research branch: **`research/0056-simple-beta-router-result`**', 1)
          old_exec='BRRK simple ETH/SOL Beta router 0056  CONTROLLED-RUN BOUNDARY / ZERO RESULT / REAL HISTORICAL RUN NOT RUN'
          assert old_exec in st
          st=st.replace(old_exec, 'BRRK simple ETH/SOL Beta router 0056  INVALID_EXECUTION / CLOSED / NO ECONOMIC CONCLUSION', 1)
          assert '## 18. 0056 immutable INVALID_EXECUTION closeout' not in st
          st += f'''\n\n---\n\n## 18. 0056 immutable INVALID_EXECUTION closeout\n\nThe exactly-once 0056 DEVELOPMENT execution is complete and permanently closed. Older 0056 controlled-run next-step prose above is historical and superseded by this section.\n\n```text\nresearch ID                           {RID}\ncontrolled-run merge                  {SCI_HEAD}\nunique Actions run                    {RUN_ID}\nruntime artifact                      {ARTIFACT_NAME}\nresult                                INVALID_EXECUTION / CLOSED\nG0                                    FAIL / INTERFACE INTEGRITY\nerror                                 price index timezone must be UTC\nterminal wealth / CAGR                NOT PRODUCED\nG1 / G2 / G3 / G4                    NOT REACHED\nactual variants evaluated             1\nsame-ID rerun / retune / rescue       false / false / false\n```\n\nRoot cause is a frozen implementation-interface mismatch: the immutable 0047/0048 loader defines UTC-normalized **tz-naive** daily indexes, while the 0056 validator requires a timezone-aware `UTC` index. This is not market-data corruption and is not evidence that RM60 succeeds or fails economically.\n\n`RUN_ATTEMPT.marker` was durably remote-verified before the one evaluate call. `PRIMARY_RESULT.json` and `EXECUTION.json` were then durably persisted, and `RUN_ONCE.marker` was finalized from existing hashes without remeasurement. The hash chain is preserved in `CLOSEOUT.json`.\n\n0056 cannot be repaired and rerun. Any corrected interface execution of the same economic mechanism requires a **new research ID** and must treat this invalid execution as exposed evidence.\n\n```text\nCanonical BRRK-0011                    NO CHANGE\nPhase 6                                NO CHANGE\nproduction_authorized_components       []\nproduction_authorized                  false\nsignature_authorized                   false\norder_submission_authorized            false\n```\n'''
          sp.write_text(st)

          # Remove this helper from the final tree before governance checks/commit.
          helper=Path('.github/workflows/_tmp_0056_closeout.yml')
          helper.unlink()
          PY
      - name: Validate registry and no-drift without scientific remeasurement
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift
          test ! -e .github/workflows/_tmp_0056_closeout.yml
      - name: Commit immutable closeout
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Research closeout [DRIFT_0]: seal immutable 0056 invalid execution'
          git push origin HEAD:research/0056-simple-beta-router-result
