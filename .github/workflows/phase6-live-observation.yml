name: Phase 6 live shadow observation

on:
  pull_request:
    paths:
      - 'research/governance/phase6_live_collector.py'
      - 'research/governance/test_phase6_live_collector.py'
      - 'research/governance/phase6_live_account_identity_contract.json'
      - 'research/governance/phase6_live_observation_gate.json'
      - 'research/governance/phase6_live_evidence_contract.json'
      - '.github/workflows/phase6-live-observation.yml'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
  workflow_dispatch:
    inputs:
      emergency_drill:
        description: 'Run a zero-authority hypothetical emergency drill. Never scheduled-decision credit.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  collector-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned execution test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Compile zero-authority collector
        run: python -m py_compile research/governance/phase6_live_collector.py research/governance/test_phase6_live_collector.py
      - name: Run collector unit tests
        run: python -m unittest -v research.governance.test_phase6_live_collector
      - name: Verify repository gate remains unarmed in plumbing PR
        if: github.event_name == 'pull_request'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          gate = json.loads(Path('research/governance/phase6_live_observation_gate.json').read_text())
          assert gate['collector_armed'] is False
          assert gate['schedule_configured'] is False
          assert gate['elapsed_evidence_credit_authorized'] is False
          assert gate['armed_commit'] is None
          PY
      - name: Static no-signer/no-submit boundary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('research/governance/phase6_live_collector.py')
          tree = ast.parse(path.read_text())
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom):
                  imports.add(node.module or '')
          forbidden = {'beta_bot.executor', 'hyperliquid.exchange', 'eth_account', 'web3'}
          assert imports.isdisjoint(forbidden), imports.intersection(forbidden)
          PY

  live-observation:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned execution test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Read arm state
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path('research/governance/phase6_live_observation_gate.json').read_text())
          print('armed=' + ('true' if gate.get('collector_armed') is True else 'false'))
          PY
      - name: Collect read-only Phase 6 observation
        id: collect
        shell: bash
        run: |
          EXTRA=()
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.emergency_drill }}" == "true" ]]; then
            EXTRA+=(--emergency-drill)
          fi
          python -m research.governance.phase6_live_collector collect \
            --output-dir phase6_evidence \
            --event-name "${{ github.event_name }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow-sha "${{ github.sha }}" \
            "${EXTRA[@]}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          row = json.loads(Path('phase6_evidence/evidence_metadata.json').read_text())
          print('decision_slug=' + row['decision_slug'])
          PY
      - name: Upload unarmed preflight diagnostic
        if: always() && steps.gate.outputs.armed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase6-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_evidence/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Upload armed evidence bundle
        if: success() && steps.gate.outputs.armed == 'true'
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-evidence-${{ steps.collect.outputs.decision_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_evidence/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Create hash-bound receipt after evidence upload
        if: success() && steps.gate.outputs.armed == 'true'
        run: |
          python -m research.governance.phase6_live_collector finalize-receipt \
            --evidence-dir phase6_evidence \
            --output phase6_receipt/receipt.json \
            --artifact-id "${{ steps.evidence.outputs.artifact-id }}" \
            --artifact-url "${{ steps.evidence.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.evidence.outputs.artifact-digest }}"
      - name: Upload separate receipt artifact before credit
        if: success() && steps.gate.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase6-receipt-${{ steps.collect.outputs.decision_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_receipt/receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
