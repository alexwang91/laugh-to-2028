name: 0087 registry domain repair

on:
  push:
    branches:
      - research/0087-options-vrp-spec-freeze-v1
    paths:
      - .github/workflows/0087-domain-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace invalid domain with frozen allowed enum
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/research_registry.json')
          data = json.loads(p.read_text())
          rid = 'BRRK-OPTIONS-VOLATILITY-RISK-PREMIUM-0087'
          matches = [x for x in data['records'] if x.get('research_id') == rid]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one 0087 record, got {len(matches)}')
          r = matches[0]
          if r.get('research_domain') != 'VOLATILITY_RELATIVE_VALUE':
              raise SystemExit(f'unexpected pre-fix domain: {r.get("research_domain")!r}')
          r['research_domain'] = 'OPTIONS_VOLATILITY'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/research_registry.json
          git rm .github/workflows/0087-domain-fix.yml
          git commit -m 'fix(0087): use canonical OPTIONS_VOLATILITY domain'
          git push origin HEAD:research/0087-options-vrp-spec-freeze-v1
