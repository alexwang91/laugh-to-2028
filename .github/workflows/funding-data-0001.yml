name: FUNDING DATA 0001 Source Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/funding-data-0001.yml'
      - 'research/requirements.txt'
      - 'research/funding_router/**'
      - 'research/pit_universe/run_archive_discovery.py'

permissions:
  contents: read

concurrency:
  group: funding-data-0001-${{ github.ref }}
  cancel-in-progress: false

# Split into two jobs (backlog F11): `research` (contents: read) executes
# PR-supplied Python; `persist` (contents: write) only copies artifact files
# and runs git, never repository code, so the two never share a write-scoped
# token in the same job environment.
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic parser tests
        working-directory: research/funding_router
        run: python -m unittest -v test_funding_data_audit.py
      - name: Audit official funding data sources
        working-directory: research/funding_router
        shell: bash
        run: |
          set -o pipefail
          python run_funding_data_audit.py | tee funding_data_0001.log
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-data-0001-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/funding_router/funding_data_0001.log
            research/funding_router/funding_data_0001_outputs/**
            research/funding_router/FUNDING-DATA-0001-SOURCE-AUDIT.json

  persist:
    needs: research
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: funding-data-0001-results
          path: /tmp/artifact
      - name: Persist validated evidence
        shell: bash
        run: |
          set -euo pipefail
          # actions/upload-artifact@v4 roots the archive at the least common
          # ancestor of every path in the research job's `path:` list above.
          # Those three paths all share the research/funding_router/ prefix,
          # so upload-artifact strips it and the download has no such prefix
          # (verified with `unzip -l` on the uploaded artifact: files sit at
          # its root, e.g. funding_data_0001_outputs/..., not
          # research/funding_router/funding_data_0001_outputs/...). Re-check
          # this if the upload `path:` list above ever changes.
          SRC='/tmp/artifact'
          DEST='research/results/funding_data_0001'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/funding_data_0001_outputs/." "$DEST/"
          cp "$SRC/funding_data_0001.log" "$DEST/funding_data_0001.log"
          cp "$SRC/FUNDING-DATA-0001-SOURCE-AUDIT.json" "$DEST/FUNDING-DATA-0001-SOURCE-AUDIT.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Persist FUNDING-DATA-0001 exact evidence'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
