name: FUNDING DATA 0001 Source Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/funding-data-0001.yml'
      - 'research/requirements.txt'
      - 'research/funding_router/**'
      - 'research/pit_universe/run_archive_discovery.py'

permissions:
  contents: write

concurrency:
  group: funding-data-0001-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic parser tests
        working-directory: research/funding_router
        run: python -m unittest -v test_funding_data_audit.py
      - name: Audit official funding data sources
        working-directory: research/funding_router
        shell: bash
        run: |
          set -o pipefail
          python run_funding_data_audit.py | tee funding_data_0001.log
      - name: Persist validated evidence on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/funding-data-0001
          mkdir -p /tmp/funding-data-0001
          cp -R research/funding_router/funding_data_0001_outputs/. /tmp/funding-data-0001/
          cp research/funding_router/funding_data_0001.log /tmp/funding-data-0001/funding_data_0001.log
          cp research/funding_router/FUNDING-DATA-0001-SOURCE-AUDIT.json /tmp/funding-data-0001/FUNDING-DATA-0001-SOURCE-AUDIT.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

          DEST='research/results/funding_data_0001'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R /tmp/funding-data-0001/. "$DEST/"

          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Persist FUNDING-DATA-0001 exact evidence'
          git pull --rebase origin "$HEAD_REF"
          git push origin "HEAD:$HEAD_REF"
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-data-0001-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/funding_router/funding_data_0001.log
            research/funding_router/funding_data_0001_outputs/**
            research/funding_router/FUNDING-DATA-0001-SOURCE-AUDIT.json
