name: 0053 post-capture contract temporary

on:
  push:
    branches:
      - research/brrk-leadership-intraday-support-0053-capture-v2

permissions:
  contents: read

jobs:
  contract:
    if: contains(github.event.head_commit.message, 'trigger 0053 post-capture contract')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 0053 post-capture contracts
        run: python -m unittest research.brrk_leadership_intraday_support_0053.test_preregistration_contract
      - name: Verify canonical payload hash and non-measurement boundary
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('research/brrk_leadership_intraday_support_0053')
          raw=(p/'MARKET_4H_PAYLOAD.json').read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          if sha!='471b54991ae648b79433285f073ea7bc813663319b6e2389c1682dad1a319135': raise SystemExit('payload hash drift '+sha)
          e=json.loads((p/'MARKET_4H_EVIDENCE.json').read_text())
          if e['common_coverage']['bar_count']!=13097 or not e['common_coverage']['contiguous']: raise SystemExit('common coverage drift')
          forbidden=['SUPPORT_RESULT.json','PRIMARY_RESULT.json','RESULT_SUMMARY.json','EXECUTION.json','RUN_ONCE.marker']
          hit=[x for x in forbidden if (p/x).exists()]
          if hit: raise SystemExit('measurement/result artifact exists '+repr(hit))
          print('POST_CAPTURE_CONTRACT_PASS')
          print('SUPPORT_FUNNEL_NOT_COMPUTED=true')
          PY
