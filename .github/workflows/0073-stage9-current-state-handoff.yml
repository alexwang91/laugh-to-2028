name: 0073 Stage9 CURRENT_STATE handoff repair

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0073-stage9-current-state-handoff.yml'
      - 'docs/CURRENT_STATE.md'
      - 'research/brrk_crypto_delta_neutral_carry_strategy_0073/RESULT.md'

permissions:
  contents: write

jobs:
  repair-handoff:
    if: github.head_ref == 'research/0073-stage9-result-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0073-stage9-result-v1
      - name: Apply exact Stage9 governance-only handoff replacement
        shell: python
        run: |
          from pathlib import Path

          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert text.count(anchor) == 1, f'immutable anchor count must remain exactly one, got {text.count(anchor)}'

          old_next = '''0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is merged at `8ccf14ecf0e1e2b0ccfa94ad3600105fb321380b`. Stage 6 CONTROLLED BOUNDARY is merged at `ac13585c54c031440e5b35e183d7fea9a46e2830`. Stage 7 ZERO-RESULT PREFLIGHT is merged at `91807d0824f61c734e1a07c36f6e8fa84a39da13` with `PREFLIGHT_PASS_ZERO_RESULT`. Stage 8 CONTROLLED ATTEMPT is complete and sealed on PR #359 / `research/0073-stage8-controlled-attempt-v1` with classification `INCONCLUSIVE_INSUFFICIENT_SUPPORT`; attempt `1/1` is consumed, controlled scientific/history reads are `0`, scientific engine calls are `1/1`, and scientific source-network fetches are `0`. The create-only chain `RUN_ATTEMPT.marker` → `PRIMARY_RESULT.json` → `EVIDENCE.json` → `EXECUTION.json` → `RUN_ONCE.marker` is complete. Formal completion remains 7/10 until PR #359 merges; after merge it becomes 8/10 and the only legal next lifecycle action is an independent Stage 9 RESULT interpretation with zero source rereads and zero scientific recomputation.'''
          new_next = '''0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is merged at `8ccf14ecf0e1e2b0ccfa94ad3600105fb321380b`. Stage 6 CONTROLLED BOUNDARY is merged at `ac13585c54c031440e5b35e183d7fea9a46e2830`. Stage 7 ZERO-RESULT PREFLIGHT is merged at `91807d0824f61c734e1a07c36f6e8fa84a39da13` with `PREFLIGHT_PASS_ZERO_RESULT`. Stage 8 CONTROLLED ATTEMPT immutable result bundle is merged at `822736132cb1d04348a74538d1a4ea02d6f4ed5f` with classification `INCONCLUSIVE_INSUFFICIENT_SUPPORT`; attempt `1/1` is permanently consumed, controlled scientific/history reads are `0`, scientific engine calls are `1/1`, and scientific source-network fetches are `0`. Stage 9 RESULT is in progress on PR #360 / `research/0073-stage9-result-v1` as governance-only interpretation with zero source rereads and zero scientific recomputation. Formal completion is `8/10` until #360 merges; after merge the only legal next lifecycle action is an independent Stage 10 immutable CLOSEOUT.'''

          old_line = '0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION MERGED / STAGE-6 CONTROLLED BOUNDARY MERGED / STAGE-7 ZERO-RESULT PREFLIGHT MERGED / STAGE-8 CONTROLLED ATTEMPT SEALED `INCONCLUSIVE_INSUFFICIENT_SUPPORT` / FORMAL COMPLETION 7/10 UNTIL #359 MERGE / CONTROLLED ATTEMPT 1/1 CONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 1/1 / SOURCE NETWORK FETCHES 0 / NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          new_line = '0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION MERGED / STAGE-6 CONTROLLED BOUNDARY MERGED / STAGE-7 ZERO-RESULT PREFLIGHT MERGED / STAGE-8 CONTROLLED ATTEMPT SEALED+MERGED `INCONCLUSIVE_INSUFFICIENT_SUPPORT` / STAGE-9 RESULT IN PROGRESS / FORMAL COMPLETION 8/10 UNTIL #360 MERGE / CONTROLLED ATTEMPT 1/1 CONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 1/1 / SOURCE NETWORK FETCHES 0 / NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'

          if old_next in text:
              assert text.count(old_next) == 1
              text = text.replace(old_next, new_next)
          else:
              assert new_next in text, 'neither old nor Stage9 exact-next paragraph present'

          if old_line in text:
              assert text.count(old_line) == 1
              text = text.replace(old_line, new_line)
          else:
              assert new_line in text, 'neither old nor Stage9 0073 state line present'

          assert text.count(anchor) == 1
          p.write_text(text)
      - name: Commit handoff only if changed
        shell: bash
        run: |
          if git diff --quiet -- docs/CURRENT_STATE.md; then
            echo 'CURRENT_STATE_ALREADY_STAGE9'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          git commit -m 'research(0073): sync Stage9 current-state handoff'
          git push origin HEAD:research/0073-stage9-result-v1
