name: Temporary 0047 prereg v2 atomic rebuild

on:
  push:
    branches:
      - research/brrk-beta-handoff-0047-prereg-v2
    paths:
      - .github/workflows/tmp-0047-prereg-v2-atomic-rebuild.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-beta-handoff-0047-prereg-v2
          fetch-depth: 0

      - name: Fetch verified prereg source branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin research/brrk-beta-handoff-0047-prereg:refs/remotes/origin/research/brrk-beta-handoff-0047-prereg

      - name: Atomically materialize the already-verified preregistration tree
        shell: bash
        run: |
          set -euo pipefail
          SRC=origin/research/brrk-beta-handoff-0047-prereg
          mkdir -p research/brrk_beta_handoff_0047 research/governance

          for path in \
            config/research_registry.json \
            config/dataset_exposure_registry.json \
            docs/CURRENT_STATE.md \
            research/brrk_beta_handoff_0047/PREREGISTRATION.json \
            research/brrk_beta_handoff_0047/DATASET_DECLARATION.json \
            research/brrk_beta_handoff_0047/README.md \
            research/brrk_beta_handoff_0047/test_preregistration_contract.py \
            research/governance/test_brrk_beta_handoff_0047_prereg_contract.py
          do
            git show "$SRC:$path" > "$path"
          done

      - name: Verify scientific and governance invariants before first governed-path introduction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          rid = 'BRRK-BETA-HANDOFF-EVENT-STUDY-0047'
          dsid = 'BRRK-BETA-HANDOFF-0047-EXPOSED-HIST-V1'
          xid = 'BRRK-BETA-HANDOFF-0047-DEVELOPMENT-DATA-REGISTRATION-20260810T232616Z'
          here = Path('research/brrk_beta_handoff_0047')

          prereg = json.loads((here/'PREREGISTRATION.json').read_text())
          decl = json.loads((here/'DATASET_DECLARATION.json').read_text())
          rr = json.loads(Path('config/research_registry.json').read_text())
          dr = json.loads(Path('config/dataset_exposure_registry.json').read_text())

          assert prereg['research_id'] == rid
          assert prereg['result_status'] == 'PREREGISTERED_NOT_RUN'
          assert prereg['declared_variant_budget'] == 1
          assert prereg['actual_variants_evaluated'] == 0
          assert prereg['parameter_candidate_count'] == 1
          assert prereg['production_authorized'] is False
          assert prereg['universe'] == ['BTC','ETH','SOL']
          assert decl['dataset_slice']['dataset_slice_id'] == dsid
          assert decl['dataset_slice']['end'] == '2026-08-02T00:00:00Z'
          assert decl['dataset_slice']['data_budget'] == 'DEVELOPMENT'
          assert decl['dataset_slice']['contamination_state'] == 'RESEARCHER_EXPOSED_HISTORY'
          assert decl['exposure_event']['exposure_id'] == xid

          r = [x for x in rr['records'] if x.get('research_id') == rid]
          d = [x for x in dr['dataset_slices'] if x.get('dataset_slice_id') == dsid]
          e = [x for x in dr['exposure_events'] if x.get('exposure_id') == xid]
          assert r == [prereg]
          assert d == [decl['dataset_slice']]
          assert e == [decl['exposure_event']]

          forbidden = [
              'run_once.py','RUN_INTERFACE.json','PRIMARY_RESULT.json','EXECUTION.json',
              'RUN_ONCE.marker','RESULT.md','handoff_model.py','hazard_model.py'
          ]
          assert all(not (here/f).exists() for f in forbidden)

          design = Path('research/governance/BRRK_BETA_HANDOFF_EVENT_STUDY_0047_DESIGN_FREEZE_2026-08-11.md').read_text()
          assert 'DESIGN FROZEN / NOT PREREGISTERED / NOT RUN' in design

          expected_needles = [
              'TREND_HORIZONS=20_60_120_240',
              'FAST_WEIGHTS=0.15_0.25_0.30_0.30',
              'SLOW_WEIGHTS=0.10_0.20_0.30_0.40',
              'RELATIVE_ACCEL=REL_FAST_MINUS_REL_SLOW',
              'REALIZED_TARGET_HORIZONS=20_60',
              'CROSS_CORRELATION_LAGS=-14_TO_14',
              'TRANSMISSION_MODEL=POOLED_EPISODE_PRESERVING_VAR7_WITH_EPISODE_INTERCEPTS',
              'GRANGER_PANEL=ALL_SIX_DIRECTED_PAIRS',
              'IRF=GENERALIZED_BTC_SHOCK_HORIZONS_0_TO_14',
              'EPISODE_BOOTSTRAP=10000_SEED_470047',
              'ORACLE=ONE_SWITCH_BTC_TO_ETH_OR_SOL_5BPS_PER_ABS_WEIGHT_CHANGE',
          ]
          params = set(prereg['research_process_complexity']['declared_parameter_candidates'])
          assert all(x in params for x in expected_needles)
          assert prereg['research_process_complexity']['actual_parameter_candidates_evaluated'] == []
          PY

      - name: Remove temporary write-enabled workflow before atomic governed commit
        shell: bash
        run: rm .github/workflows/tmp-0047-prereg-v2-atomic-rebuild.yml

      - name: Commit all governed 0047 paths and registration atomically
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/tmp-0047-prereg-v2-atomic-rebuild.yml
          git commit -m 'research prereg: atomically register 0047 frozen handoff anatomy'
          git push origin HEAD:research/brrk-beta-handoff-0047-prereg-v2
