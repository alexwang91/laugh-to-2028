name: P5.3 V2 market-state implementation

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_3_v2_architecture_contract.json"
      - "research/cycle_exit/p5_3_v2_market_state.py"
      - "research/cycle_exit/p5_3_v2_state_path_evidence_contract.json"
      - "research/cycle_exit/run_p5_3_v2_state_paths.py"
      - "research/cycle_exit/validate_p5_3_v2_state_path_result.py"
      - "research/results/p5_3_v2_market_state/**"
      - "execution/plan-b-bot/tests/test_p5_3_v2_architecture_prereg.py"
      - "execution/plan-b-bot/tests/test_p5_3_v2_market_state.py"
      - ".github/workflows/p5-3-v2-market-state-implementation.yml"
      - ".github/workflows/p5-3-v2-market-state-run-once.yml"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_3_v2_market_state.py"
      - "research/cycle_exit/p5_3_v2_state_path_evidence_contract.json"
      - "research/cycle_exit/run_p5_3_v2_state_paths.py"
      - "research/cycle_exit/validate_p5_3_v2_state_path_result.py"
      - "research/results/p5_3_v2_market_state/**"
      - "execution/plan-b-bot/tests/test_p5_3_v2_market_state.py"
      - ".github/workflows/p5-3-v2-market-state-implementation.yml"

permissions:
  contents: read

jobs:
  implementation-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Lock immutable dependencies
        run: |
          set -euo pipefail
          test "$(git hash-object research/cycle_exit/p5_3_v2_architecture_contract.json)" = "9cf1c2217ee24d836408061faf9e971ad0fe8668"
          test "$(git hash-object research/cycle_exit/p5_3_v2_market_state.py)" = "606c4ef936c2eb05007d46311aa2e4c6269f26fa"
          test "$(cat research/results/p5_3_state_paths/summary.sha256)" = "a2e5be8d605af5a2c8206235402fe3a66b08fd994eaa8a71e84cfb1e3cbfed8f"
          test "$(cat research/results/p5_2_feature_evidence/summary.sha256)" = "3f6dc3c512d22ac8f71d43ed155f2602cd40d5caf3d617c0e130e170727e0627"
      - name: Run prereg and exact V1 signal-parity tests
        run: |
          pytest -q \
            execution/plan-b-bot/tests/test_p5_3_v2_architecture_prereg.py \
            execution/plan-b-bot/tests/test_p5_3_v2_market_state.py
      - name: Compile runner and validator
        run: |
          python -m py_compile \
            research/cycle_exit/p5_3_v2_market_state.py \
            research/cycle_exit/run_p5_3_v2_state_paths.py \
            research/cycle_exit/validate_p5_3_v2_state_path_result.py
      - name: Enforce pre-result boundary or validate immutable result
        run: |
          set -euo pipefail
          if test -e research/results/p5_3_v2_market_state/summary.json; then
            python research/cycle_exit/validate_p5_3_v2_state_path_result.py
          else
            test ! -d research/results/p5_3_v2_market_state
          fi
