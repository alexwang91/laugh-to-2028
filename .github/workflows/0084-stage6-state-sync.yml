name: 0084 Stage6 CURRENT_STATE one-shot sync

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/0084-stage6-controlled-boundary-v1' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Synchronize Stage6 handoff and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          immutable = 'workflow run                         31381953131 / attempt 1'
          assert s.count(immutable) == 1

          old_next = "0074 remains immutable `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN`. Governance resolution #381 merged at `f50618f233aef5e8e9872695ab87b67ab294a3a4`; 0075 is permanently stopped at `7/10 BLOCKED_PRE_ATTEMPT_FROZEN_IMPLEMENTATION_INCOMPLETE`, attempt `0/1` unconsumed, reads `0`, engine `0/1`, Stage8 network `0`, values exposed `false`, no marker/result, and #379 is closed unmerged. Guarded 0084 OWNER-FIRST writer tooling merged at `896e307b83e5fa96553286b7752042b0e418cb22`; replacement 0084 Stage1 OWNER-FIRST merged at `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d`; Stage2 DESIGN merged at `075d8b5b7de97836350314d517ad483d5de67219`; Stage3 PREREGISTRATION merged at `046e34b020a4f628967fb942947b06ca30c7289c`; Stage4 IMPLEMENTATION merged at `3574c33a199580637efa74b230564c7eb23d5725`. 0084 Stage5 NONHISTORICAL QUALIFICATION is active on `research/0084-stage5-nonhistorical-qualification-v1` / PR #387. Formal completion is `4/10` until Stage5 merges; attempt `0/1`, controlled reads `0`, scientific engine `0`, scientific source-network fetches `0`. No 0084 controlled history is legal at Stage5. Require exact-head mandatory CI SUCCESS, then expected-head merge Stage5; only then create a separate Stage6 CONTROLLED-EXECUTION BOUNDARY branch from resulting main."
          new_next = "0074 remains immutable `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN`. Governance resolution #381 merged at `f50618f233aef5e8e9872695ab87b67ab294a3a4`; 0075 is permanently stopped at `7/10 BLOCKED_PRE_ATTEMPT_FROZEN_IMPLEMENTATION_INCOMPLETE`, attempt `0/1` unconsumed, reads `0`, engine `0/1`, Stage8 network `0`, values exposed `false`, no marker/result, and #379 is closed unmerged. Guarded 0084 OWNER-FIRST writer tooling merged at `896e307b83e5fa96553286b7752042b0e418cb22`; replacement 0084 Stage1 OWNER-FIRST merged at `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d`; Stage2 DESIGN merged at `075d8b5b7de97836350314d517ad483d5de67219`; Stage3 PREREGISTRATION merged at `046e34b020a4f628967fb942947b06ca30c7289c`; Stage4 IMPLEMENTATION merged at `3574c33a199580637efa74b230564c7eb23d5725`; Stage5 NONHISTORICAL QUALIFICATION merged at `61b7e3a45c82604520ea9f76c6878a2707481fc2`. 0084 Stage6 CONTROLLED-EXECUTION BOUNDARY is active on `research/0084-stage6-controlled-boundary-v1` / PR #388. Formal completion is `5/10` until Stage6 merges; attempt `0/1`, controlled reads `0`, scientific engine `0`, scientific source-network fetches `0`. Stage6 binds identity/staging only and may not expose scientific payload values."
          assert s.count(old_next) == 1
          s = s.replace(old_next, new_next, 1)

          old_84 = "0084 = AUTHORIZED 0075 REPLACEMENT BY GOVERNANCE MERGE `f50618f233aef5e8e9872695ab87b67ab294a3a4` / GUARDED OWNER-FIRST WRITER TOOLING MERGED AT `896e307b83e5fa96553286b7752042b0e418cb22` / OWNER-FIRST STAGE1 MERGED AT `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d` / STAGE2 DESIGN MERGED AT `075d8b5b7de97836350314d517ad483d5de67219` / STAGE3 PREREGISTRATION MERGED AT `046e34b020a4f628967fb942947b06ca30c7289c` / STAGE4 IMPLEMENTATION MERGED AT `3574c33a199580637efa74b230564c7eb23d5725` / STAGE5 NONHISTORICAL QUALIFICATION ACTIVE ON PR #387 `research/0084-stage5-nonhistorical-qualification-v1` / FORMAL COMPLETION 4/10 UNTIL STAGE5 MERGE / FULL TEN-STAGE LIFECYCLE REQUIRED / NO INHERITED RESULT OR STAGE CREDIT / ATTEMPT 0/1 / READS 0 / ENGINE 0 / NETWORK 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new_84 = "0084 = AUTHORIZED 0075 REPLACEMENT BY GOVERNANCE MERGE `f50618f233aef5e8e9872695ab87b67ab294a3a4` / GUARDED OWNER-FIRST WRITER TOOLING MERGED AT `896e307b83e5fa96553286b7752042b0e418cb22` / OWNER-FIRST STAGE1 MERGED AT `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d` / STAGE2 DESIGN MERGED AT `075d8b5b7de97836350314d517ad483d5de67219` / STAGE3 PREREGISTRATION MERGED AT `046e34b020a4f628967fb942947b06ca30c7289c` / STAGE4 IMPLEMENTATION MERGED AT `3574c33a199580637efa74b230564c7eb23d5725` / STAGE5 NONHISTORICAL QUALIFICATION MERGED AT `61b7e3a45c82604520ea9f76c6878a2707481fc2` / STAGE6 CONTROLLED-EXECUTION BOUNDARY ACTIVE ON PR #388 `research/0084-stage6-controlled-boundary-v1` / FORMAL COMPLETION 5/10 UNTIL STAGE6 MERGE / FULL TEN-STAGE LIFECYCLE REQUIRED / NO INHERITED RESULT OR STAGE CREDIT / ATTEMPT 0/1 / READS 0 / ENGINE 0 / NETWORK 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          assert s.count(old_84) == 1
          s = s.replace(old_84, new_84, 1)
          assert s.count(immutable) == 1
          p.write_text(s, encoding='utf-8')
          PY

          git rm .github/workflows/0084-stage6-state-sync.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/0084-stage6-state-sync.yml' 'docs/CURRENT_STATE.md' | sort)"
          git commit -m 'governance(0084): synchronize Stage6 CURRENT_STATE'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
