name: Temp 0063 exactly-once historical execution

on:
  push:
    branches: [tools/0062-execution-v1]
    paths: ['.github/workflows/_temp_0062_execute_once.yml']

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  execute-once:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout durable result branch
        uses: actions/checkout@v4
        with:
          ref: research/0063-result-v1
          path: result
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout exact merged controlled boundary
        uses: actions/checkout@v4
        with:
          ref: e17b96cd3358062ebd9eb88fae050ff865a9fb39
          path: science
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: science/execution/plan-b-bot/requirements-dev.txt

      - name: Install pinned scientific runtime
        run: pip install -r science/execution/plan-b-bot/requirements-dev.txt

      - name: Zero-result preflight before consuming attempt
        shell: bash
        run: |
          set -euo pipefail
          boundary=e17b96cd3358062ebd9eb88fae050ff865a9fb39
          test "$(git -C science rev-parse HEAD)" = "$boundary"
          test "$(git -C result rev-parse HEAD)" = "$boundary"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "science/research/brrk_idle_cash_sweep_robustness_0063/$f"
            test ! -e "result/research/brrk_idle_cash_sweep_robustness_0063/$f"
          done
          cd science
          python -m research.brrk_idle_cash_sweep_robustness_0063.run_once preflight \
            --boundary-sha "$boundary" | tee /tmp/0063-preflight.json
          grep -q 'PREFLIGHT_PASS_ZERO_RESULT_GIT_IDENTITY_ONLY' /tmp/0063-preflight.json
          grep -q '"historical_csv_content_reads": 0' /tmp/0063-preflight.json
          grep -q '"scientific_engine_calls": 0' /tmp/0063-preflight.json

      - name: Create attempt marker without historical content read
        shell: bash
        run: |
          set -euo pipefail
          cd science
          python -m research.brrk_idle_cash_sweep_robustness_0063.run_once start \
            --boundary-sha e17b96cd3358062ebd9eb88fae050ff865a9fb39 \
            --workflow-run-id "$GITHUB_RUN_ID" | tee /tmp/0063-attempt.json
          test -f research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker
          test ! -e research/brrk_idle_cash_sweep_robustness_0063/PRIMARY_RESULT.json

      - name: Durably persist attempt marker before any historical read
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result/research/brrk_idle_cash_sweep_robustness_0063
          cp science/research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker result/research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker
          cmp science/research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker result/research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker
          git -C result config user.name 'github-actions[bot]'
          git -C result config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C result add research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker
          test "$(git -C result diff --cached --name-only)" = "research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker"
          git -C result commit -m '0063 persist attempt marker before historical read'
          git -C result push origin HEAD:research/0063-result-v1
          remote_sha="$(git -C result ls-remote origin refs/heads/research/0063-result-v1 | cut -f1)"
          test "$remote_sha" = "$(git -C result rev-parse HEAD)"
          echo "DURABLE_ATTEMPT_COMMIT=$remote_sha"

      - name: Unique historical measurement after durable attempt
        shell: bash
        run: |
          set -euo pipefail
          cd science
          python -m research.brrk_idle_cash_sweep_robustness_0063.run_once evaluate \
            --boundary-sha e17b96cd3358062ebd9eb88fae050ff865a9fb39 | tee /tmp/0063-measurement.json
          test -f research/brrk_idle_cash_sweep_robustness_0063/PRIMARY_RESULT.json
          test -f research/brrk_idle_cash_sweep_robustness_0063/EVIDENCE.json
          test -f research/brrk_idle_cash_sweep_robustness_0063/EXECUTION.json
          test ! -e research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker

      - name: Durably persist result evidence and execution
        shell: bash
        run: |
          set -euo pipefail
          for f in PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json; do
            cp "science/research/brrk_idle_cash_sweep_robustness_0063/$f" "result/research/brrk_idle_cash_sweep_robustness_0063/$f"
            cmp "science/research/brrk_idle_cash_sweep_robustness_0063/$f" "result/research/brrk_idle_cash_sweep_robustness_0063/$f"
          done
          git -C result add \
            research/brrk_idle_cash_sweep_robustness_0063/PRIMARY_RESULT.json \
            research/brrk_idle_cash_sweep_robustness_0063/EVIDENCE.json \
            research/brrk_idle_cash_sweep_robustness_0063/EXECUTION.json
          staged="$(git -C result diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            research/brrk_idle_cash_sweep_robustness_0063/EVIDENCE.json \
            research/brrk_idle_cash_sweep_robustness_0063/EXECUTION.json \
            research/brrk_idle_cash_sweep_robustness_0063/PRIMARY_RESULT.json | sort)"
          test "$staged" = "$expected"
          git -C result commit -m '0063 persist unique historical measurement'
          git -C result push origin HEAD:research/0063-result-v1
          remote_sha="$(git -C result ls-remote origin refs/heads/research/0063-result-v1 | cut -f1)"
          test "$remote_sha" = "$(git -C result rev-parse HEAD)"
          echo "DURABLE_MEASUREMENT_COMMIT=$remote_sha"

      - name: Finalize only from persisted hashes without historical re-read
        shell: bash
        run: |
          set -euo pipefail
          cd science
          python -m research.brrk_idle_cash_sweep_robustness_0063.run_once finalize \
            --boundary-sha e17b96cd3358062ebd9eb88fae050ff865a9fb39 | tee /tmp/0063-finalize.json
          test -f research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker

      - name: Durably persist final marker
        shell: bash
        run: |
          set -euo pipefail
          cp science/research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker result/research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker
          cmp science/research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker result/research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker
          git -C result add research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker
          test "$(git -C result diff --cached --name-only)" = "research/brrk_idle_cash_sweep_robustness_0063/RUN_ONCE.marker"
          git -C result commit -m '0063 finalize exactly-once historical execution'
          git -C result push origin HEAD:research/0063-result-v1
          remote_sha="$(git -C result ls-remote origin refs/heads/research/0063-result-v1 | cut -f1)"
          test "$remote_sha" = "$(git -C result rev-parse HEAD)"
          echo "DURABLE_FINAL_COMMIT=$remote_sha"

      - name: Emit frozen result summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('result/research/brrk_idle_cash_sweep_robustness_0063')
          p=json.loads((base/'PRIMARY_RESULT.json').read_text())
          e=json.loads((base/'EXECUTION.json').read_text())
          print(json.dumps({
            'classification':p['classification'],
            'baseline_cagr':None if p['baseline'] is None else p['baseline']['cagr'],
            'primary_cagr':None if p['primary'] is None else p['primary']['cagr'],
            'baseline_mdd':None if p['baseline'] is None else p['baseline']['max_drawdown'],
            'primary_mdd':None if p['primary'] is None else p['primary']['max_drawdown'],
            'positive_chronological_blocks':p['positive_chronological_blocks'],
            'mbb_lcb':None if p['bootstrap'] is None else p['bootstrap']['lcb'],
            'core_stress_pass':p['core_stress_pass'],
            'actual_variants_evaluated':p['actual_variants_evaluated'],
            'input_read_counts':e['input_read_counts'],
            'scientific_engine_calls':e['scientific_engine_calls'],
            'network_fetches':e['network_fetches'],
            'reruns':e['reruns'],
            'retunes':e['retunes'],
            'rescues':e['rescues']
          },sort_keys=True))
          PY
