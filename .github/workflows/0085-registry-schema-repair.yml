name: 0085 registry schema repair

on:
  push:
    branches:
      - research/0085-trend-spec-freeze-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0085-trend-spec-freeze-v1
          fetch-depth: 0
      - name: Apply mechanical registry compatibility repair and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          rid='BRRK-MULTI-HORIZON-TREND-VOL-TARGET-0085'
          p=Path('config/research_registry.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          row=next(r for r in data['records'] if r.get('research_id')==rid)
          row['governance_mode']='PROGRAM_GOVERNED_V1'
          row['lineage_edges']=[]
          notes=row.setdefault('notes',[])
          note='Lifecycle grouping is governed by PROSPECTIVE_FIVE_GATE_LIFECYCLE_V1; registry governance_mode remains PROGRAM_GOVERNED_V1 for schema compatibility.'
          if note not in notes:
              notes.append(note)
          p.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          rm -f .github/workflows/0085-registry-schema-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add config/research_registry.json .github/workflows/0085-registry-schema-repair.yml
          git commit -m 'research: repair 0085 registry schema compatibility'
          git push origin HEAD:research/0085-trend-spec-freeze-v1
