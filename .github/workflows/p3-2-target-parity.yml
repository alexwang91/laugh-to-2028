name: P3.2 target research-live parity

on:
  pull_request:
    paths:
      - "execution/plan-b-bot/beta_bot/target_engine.py"
      - "execution/plan-b-bot/beta_bot/target_math.py"
      - "execution/plan-b-bot/beta_bot/data_contract.py"
      - "execution/plan-b-bot/requirements.txt"
      - "execution/plan-b-bot/requirements-dev.txt"
      - "execution/plan-b-bot/pyproject.toml"
      - "research/integration/p3_2_target_parity.py"
      - "research/integration/p3_2_golden_compare.py"
      - "research/results/p3_2_target_parity/**"
      - "research/regime_kelly/**"
      - "research/hybrid_meta/**"
      - "research/risk_metric_fix/**"
      - "research/core/crypto_rotation_backtest.py"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
      - ".github/workflows/p3-2-target-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements.txt
      - name: Install pinned P3.2 runtime
        working-directory: execution/plan-b-bot
        run: pip install -r requirements-dev.txt
      - name: Run independent multi-date BRRK target parity
        run: python research/integration/p3_2_target_parity.py
      - name: Enforce committed historical golden vectors
        run: python research/integration/p3_2_golden_compare.py
