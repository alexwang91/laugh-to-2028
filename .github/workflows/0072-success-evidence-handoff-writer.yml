name: 0072 success evidence handoff writer

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0072-success-evidence-handoff-writer.yml'

permissions:
  contents: write

jobs:
  write-handoff:
    if: github.head_ref == 'governance/0072-capture-0002-success-evidence-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/0072-capture-0002-success-evidence-v1
          fetch-depth: 1
      - name: Update 0072 CURRENT_STATE mechanically
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          old = 'CAPTURE-0002 ONE-SHOT EXECUTION REQUEST+TRIGGER IN PROGRESS'
          new = 'CAPTURE-0002 ONE-SHOT EXECUTION SUCCESS / SUCCESS EVIDENCE IN PROGRESS'
          if old not in s:
              raise SystemExit('expected old 0072 state not found')
          s = s.replace(old, new)
          anchor = '- Stage 3 CAPTURE-0002 one-shot execution request/trigger PR #337 is in progress; PR validation is zero source network and the unique marker may authorize source fetch only on its first landing on main after all-green expected-head merge.\n'
          replacement = ('- Stage 3 CAPTURE-0002 one-shot execution request/trigger #337 merge `06ac1682b8a6de08ac75d53f0463f46727d60605`; unique workflow run `32428715027` attempt 1 SUCCESS. Durable execution-claim/raw/support artifacts are `9428322109` / `9428326636` / `9428327167`; CAPTURE-0002 is permanently claimed and automatic refetch/second fetch is forbidden.\n'
                         '- CAPTURE-0002 support truth: exactly 15 ZIP + 15 paired CHECKSUM objects completed; BTC/ETH/SOL x five frozen archive families = 15/15 PASS; each family-asset object has 31 rows covering 2026-07-01..2026-07-31, HTTP 200 and reported missingness zero. `premiumIndexKlines` remains raw support only and is not perpetual funding. No lifecycle credit is earned by capture success.\n')
          if anchor not in s:
              raise SystemExit('expected #337 anchor not found')
          s = s.replace(anchor, replacement)
          start = s.index('## Exact next step\n', s.index('## 0072 carry atlas'))
          end = s.index('\n## No-drift authority', start)
          next_step = '''## Exact next step

Persist CAPTURE-0002 metadata/support success evidence in PR #339 with mandatory CURRENT_STATE handoff. Require all standing CI SUCCESS on exact head and expected-head merge if unchanged/open/mergeable/non-draft. Then freeze the complete Stage-3 preregistration from merged DESIGN plus the 15/15 metadata support truth, without reading raw values, adding an eleventh family, substituting sources/families, or changing thresholds/horizons based on results. Full Stage 3 remains 2/10; Stage-8 attempt remains 0/1 and controlled scientific-history reads remain 0.
'''
          s = s[:start] + next_step + s[end:]
          if 'workflow run                         31381953131 / attempt 1' not in s:
              raise SystemExit('immutable 0043 line lost')
          p.write_text(s)
      - name: Commit handoff
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(0072): hand off CAPTURE-0002 success evidence'
          git push origin HEAD:governance/0072-capture-0002-success-evidence-v1
