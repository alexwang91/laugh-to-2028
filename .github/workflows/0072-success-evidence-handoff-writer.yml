name: 0072 success evidence handoff writer

on:
  push:
    branches:
      - governance/0072-capture-0002-success-evidence-v1

permissions:
  contents: write

jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/0072-capture-0002-success-evidence-v1
          fetch-depth: 0
      - name: Refresh CURRENT_STATE from completed CAPTURE-0002
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          immutable='workflow run                         31381953131 / attempt 1'
          assert immutable in s
          old='CAPTURE-0002 ONE-SHOT EXECUTION REQUEST+TRIGGER IN PROGRESS'
          new='CAPTURE-0002 ONE-SHOT EXECUTION SUCCESS / SUCCESS EVIDENCE IN PROGRESS'
          assert old in s
          s=s.replace(old,new)
          old_anchor='- Stage 3 CAPTURE-0002 one-shot execution request/trigger PR #337 is in progress; PR validation is zero source network and the unique marker may authorize source fetch only on its first landing on main after all-green expected-head merge.'
          new_anchor='- Stage 3 CAPTURE-0002 one-shot execution request/trigger #337 merge `06ac1682b8a6de08ac75d53f0463f46727d60605`; unique workflow run `32428715027` attempt 1 = SUCCESS; durable execution-claim/raw/support artifacts `9428322109` / `9428326636` / `9428327167`; BTC/ETH/SOL x five frozen archive families = 15/15 support PASS; CAPTURE-0002 is permanently claimed and automatic refetch/second fetch is forbidden.'
          assert old_anchor in s
          s=s.replace(old_anchor,new_anchor)
          old_next='Require all standing CI SUCCESS on PR #337 exact head after this handoff writer removes its one-time request. Merge only if head is unchanged, open, mergeable and non-draft. The merge first-lands the unique CAPTURE-0002 trigger marker on main; the guarded workflow must durably create the fixed execution-claim artifact before any source network request and may then fetch only the 30 already-frozen `data.binance.vision` objects at most once. Any claim/raw/partial/failure/support artifact permanently blocks refetch. No fapi, Bybit, ad-hoc host, CAPTURE-0001 retry, raw-value exposure or Stage-8 action is permitted. Full Stage 3 remains 2/10 until support metadata and full preregistration merge.'
          new_next='Persist the completed CAPTURE-0002 metadata/support success evidence in #339, with no raw payload in git and no lifecycle credit. After #339 merges, freeze the complete Stage-3 preregistration from merged DESIGN plus the already frozen 15/15 support truth. Do not add an eleventh family, substitute a source/family, refetch CAPTURE-0002, or use raw values to choose thresholds/horizons. Full Stage 3 remains 2/10 until that complete preregistration merges.'
          assert old_next in s
          s=s.replace(old_next,new_next)
          assert immutable in s
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          git diff --cached --quiet && exit 0
          git commit -m 'docs(0072): record CAPTURE-0002 execution success handoff'
          git push origin HEAD:governance/0072-capture-0002-success-evidence-v1
