name: P5.3 V2 market-state evidence RUN ONCE

on:
  push:
    branches:
      - "p5-3/v2-market-state-implementation"
    paths:
      - "research/cycle_exit/RUN_ONCE_P5_3_V2_MARKET_STATE.marker"

permissions:
  contents: write

concurrency:
  group: p5-3-v2-market-state-run-once
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "p5-3/v2-market-state-implementation"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Guard one-time authority and frozen dependencies
        run: |
          set -euo pipefail
          test ! -e research/results/p5_3_v2_market_state/summary.json
          test "$(sha256sum research/cycle_exit/RUN_ONCE_P5_3_V2_MARKET_STATE.marker | awk '{print $1}')" = "f6be856543912e219476a3737bb6333cc1c62a33bb3480f4111b5487852d8877"
          test "$(git hash-object research/cycle_exit/p5_3_v2_architecture_contract.json)" = "9cf1c2217ee24d836408061faf9e971ad0fe8668"
          test "$(git hash-object research/cycle_exit/p5_3_v2_market_state.py)" = "606c4ef936c2eb05007d46311aa2e4c6269f26fa"
          test "$(cat research/results/p5_3_state_paths/summary.sha256)" = "a2e5be8d605af5a2c8206235402fe3a66b08fd994eaa8a71e84cfb1e3cbfed8f"
          test "$(cat research/results/p5_2_feature_evidence/summary.sha256)" = "3f6dc3c512d22ac8f71d43ed155f2602cd40d5caf3d617c0e130e170727e0627"
          pytest -q execution/plan-b-bot/tests/test_p5_3_v2_market_state.py
      - name: Execute deterministic frozen V2 market-state evidence
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python research/cycle_exit/run_p5_3_v2_state_paths.py
      - name: Validate immutable V2 result
        run: python research/cycle_exit/validate_p5_3_v2_state_path_result.py
      - name: Commit immutable V2 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/p5_3_v2_market_state
          git diff --cached --quiet && { echo "No P5.3 V2 result files staged"; exit 1; }
          git commit -m "Research: commit immutable P5.3 V2 market-state evidence"
          git push origin HEAD:p5-3/v2-market-state-implementation
