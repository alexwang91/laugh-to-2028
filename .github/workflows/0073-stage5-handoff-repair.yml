name: 0073 Stage5 handoff repair

on:
  push:
    branches:
      - research/0073-stage5-nonhistorical-qualification-v1
    paths:
      - .github/workflows/0073-stage5-handoff-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0073-stage5-nonhistorical-qualification-v1
          fetch-depth: 0
      - name: Repair governance-only handoff and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          old = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is in progress on PR #355 / `research/0073-stage4-implementation-v1`. Formal completion remains 3/10 until Stage 4 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0. Require all standing CI SUCCESS on the exact Stage-4 head and expected-head merge. Only after Stage 4 merges may a separate Stage 5 NONHISTORICAL QUALIFICATION branch run synthetic fixtures only. No controlled scientific/history payload read is legal in Stage 4 or Stage 5."
          new = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is in progress on PR #356 / `research/0073-stage5-nonhistorical-qualification-v1`. Formal completion remains 4/10 until Stage 5 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0. Require all standing CI SUCCESS on the exact Stage-5 head and expected-head merge. Only after Stage 5 merges may a separate Stage 6 CONTROLLED BOUNDARY branch begin. No controlled scientific/history payload read is legal in Stage 5."
          if old not in s:
              raise SystemExit('expected Exact next step text not found')
          s = s.replace(old, new, 1)
          old2 = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION IN PROGRESS / FORMAL COMPLETION 3/10 UNTIL STAGE-4 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new2 = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION IN PROGRESS / FORMAL COMPLETION 4/10 UNTIL STAGE-5 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          if old2 not in s:
              raise SystemExit('expected no-drift 0073 text not found')
          s = s.replace(old2, new2, 1)
          anchor = 'workflow run                         31381953131 / attempt 1'
          if anchor not in s:
              raise SystemExit('immutable workflow anchor missing')
          p.write_text(s)
          PY
          git rm .github/workflows/0073-stage5-handoff-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          git commit -m 'docs(0073): hand off merged Stage4 to Stage5'
          git push origin HEAD:research/0073-stage5-nonhistorical-qualification-v1
