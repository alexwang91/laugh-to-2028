name: 0055 authority-scan guard fix

on:
  push:
    branches:
      - research/brrk-leadership-4h-structural-readiness-0055-controlled-run

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, 'trigger 0055 guard fix')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-4h-structural-readiness-0055-controlled-run
      - name: Exclude already-validated authority subtrees from forbidden metric scan
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/brrk_leadership_4h_structural_readiness_0055/run_once.py')
          s=p.read_text()
          old='''    if isinstance(value, Mapping):\n        for key, child in value.items():\n            lowered = str(key).lower()\n            hits = [token for token in forbidden if token.lower() in lowered]\n            if hits:\n                raise RuntimeError(f"Forbidden predictive/economic metric key at {path}.{key}: {hits}")\n            _scan_forbidden_metric_keys(child, forbidden, f"{path}.{key}")\n'''
          new='''    if isinstance(value, Mapping):\n        for key, child in value.items():\n            # Authority keys are mandatory frozen boolean attestations and are\n            # validated exactly before this scanner runs. Do not classify their\n            # names (e.g. portfolio_economics_executed=false) as metric output.\n            if str(key) == "authority":\n                continue\n            lowered = str(key).lower()\n            hits = [token for token in forbidden if token.lower() in lowered]\n            if hits:\n                raise RuntimeError(f"Forbidden predictive/economic metric key at {path}.{key}: {hits}")\n            _scan_forbidden_metric_keys(child, forbidden, f"{path}.{key}")\n'''
          if old not in s: raise SystemExit('target scanner snippet not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'Y_Wang'
          git config user.email '40142450+alexwang91@users.noreply.github.com'
          git add research/brrk_leadership_4h_structural_readiness_0055/run_once.py
          git commit -m 'Research execution boundary [DRIFT_0]: exclude validated authority from metric scan'
          git push origin HEAD:research/brrk-leadership-4h-structural-readiness-0055-controlled-run
