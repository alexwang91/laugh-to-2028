name: Temporary 0057 implementation handoff

on:
  push:
    branches:
      - research/0057-implementation-tooling

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0057-simple-beta-router-interface-replication-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record successful synthetic implementation evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          base=Path('research/brrk_simple_eth_sol_beta_router_interface_replication_0057')
          bp=base/'IMPLEMENTATION_BOUNDARY.json'
          b=json.loads(bp.read_text())
          assert b['actual_variants_evaluated']==0
          b['synthetic_contract_evidence']={
            'github_actions_run':31611937198,
            '0056_immutable_engine_tests_passed':15,
            '0057_adapter_tests_passed':7,
            'total_synthetic_contract_tests_passed':22,
            'zero_result_guard_passed':True,
            'governance_validate_passed_with_only_legacy_debt_warnings':True,
            'no_drift_passed':True,
            'real_0057_historical_payload_loaded':False,
            'real_0057_portfolio_economics_executed':False,
            'actual_historical_variants_evaluated':0
          }
          bp.write_text(json.dumps(b,indent=2)+'\n')

          rp=base/'README.md'
          r=rp.read_text()
          r=r.replace('Status: **NUMERICAL PREREGISTRATION / NOT IMPLEMENTED / NOT RUN**','Status: **IMPLEMENTATION-ONLY / SYNTHETIC CONTRACTS PASS / REAL HISTORICAL RUN NOT RUN**',1)
          r=r.replace('numerical preregistration      FROZEN ON BRANCH / NOT YET MERGED','numerical preregistration      MERGED AT bc61a6a2250d8deecf2f20d2fe2006b28ad4b819',1)
          r=r.replace('implementation                 ABSENT','implementation                 FROZEN ON BRANCH / SYNTHETIC ONLY',1)
          r=r.replace('No real historical portfolio evaluation is authorized until this preregistration merges, a separate implementation-only stage merges, and a separate controlled-execution boundary merges.','Synthetic run `31611937198` passed 15 immutable 0056 engine tests plus 7 new 0057 adapter tests and a zero-result guard. No real market payload was loaded; actual historical variants remain 0. Real historical portfolio evaluation is still forbidden until this implementation stage merges and a separate controlled-execution boundary merges.',1)
          rp.write_text(r)

          sp=Path('docs/CURRENT_STATE.md')
          s=sp.read_text()
          s=s.replace('Current `main` research merge: **`21f758260ea80040bbb38aec26e2091814e37fd9`**','Current `main` research merge: **`bc61a6a2250d8deecf2f20d2fe2006b28ad4b819`**',1)
          s=s.replace('Current research branch: **`research/0057-simple-beta-router-interface-replication-prereg`**','Current research branch: **`research/0057-simple-beta-router-interface-replication-implementation`**',1)
          s=s.replace('BRRK Beta router interface replication 0057 NUMERICAL PREREG FROZEN ON BRANCH / NOT RUN','BRRK Beta router interface replication 0057 IMPLEMENTATION-ONLY / SYNTHETIC PASS / REAL RUN NOT RUN',1)
          if '## 20. 0057 implementation-only handoff' not in s:
              s += '''\n\n---\n\n## 20. 0057 implementation-only handoff\n\n0057 preregistration merged at `bc61a6a2250d8deecf2f20d2fe2006b28ad4b819`. The implementation adds only a deterministic interface adapter and synthetic contract tests; it does not copy or modify the frozen 0056 portfolio engine.\n\nThe adapter validates immutable tz-naive ETH/SOL source indexes, copies frames, applies only `index.tz_localize("UTC")`, proves calendar/order/row-count/close-value invariance, then delegates unchanged portfolio economics to immutable 0056 engine blob `b0fc1ac267a66593e7e2c4687aff81491bfcdf5a`. The wrapper may only replace the top-level research ID and add provenance metadata; metrics, gates, classification, targets, diagnostics and bootstrap outputs remain delegated unchanged.\n\nSynthetic Actions run `31611937198` passed all 15 immutable 0056 engine tests and 7 new 0057 adapter tests. The zero-result guard confirmed `REAL_0057_HISTORICAL_PAYLOAD_NOT_LOADED=true`, `REAL_0057_PORTFOLIO_ECONOMICS_NOT_EXECUTED=true`, and `ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0`. Governance validation and no-drift also passed.\n\nNo `run_once.py`, `RUN_INTERFACE.json`, `RESULT_SCHEMA.json`, controlled-execution boundary, runtime marker or historical result is present. Next legal stage after implementation merge is a separate controlled-execution boundary.\n'''
          sp.write_text(s)
          PY
      - name: Validate final implementation-only surface
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift
          python -m json.tool research/brrk_simple_eth_sol_beta_router_interface_replication_0057/IMPLEMENTATION_BOUNDARY.json >/dev/null
          git diff --check -- research/brrk_simple_eth_sol_beta_router_interface_replication_0057
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md research/brrk_simple_eth_sol_beta_router_interface_replication_0057/README.md research/brrk_simple_eth_sol_beta_router_interface_replication_0057/IMPLEMENTATION_BOUNDARY.json
          git commit -m 'Research implementation [DRIFT_0]: finalize 0057 zero-result handoff'
          python -m research.governance.no_drift
          git push origin HEAD:research/0057-simple-beta-router-interface-replication-implementation
