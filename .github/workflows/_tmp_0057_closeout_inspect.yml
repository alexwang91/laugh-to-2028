name: Temporary 0057 immutable closeout materialization

on:
  push:
    branches:
      - research/0057-interface-replication-closeout-tooling

permissions:
  contents: write

env:
  TARGET_BRANCH: research/0057-simple-beta-router-interface-replication-closeout
  RESULT_BRANCH: research/0057-simple-beta-router-interface-replication-result
  RESULT_HEAD: bc54b904e7ee6f6392adca849e9bf21b66673b5f
  SCI_HEAD: 1d0b8fcf3ee49c180e90593afdb71047b34a28a7
  SCI_DIR: research/brrk_simple_eth_sol_beta_router_interface_replication_0057

jobs:
  closeout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copy exact durable runtime artifacts from result branch
        run: |
          test "$(git rev-parse HEAD)" = "$SCI_HEAD"
          git fetch origin "$RESULT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$RESULT_HEAD"
          git checkout FETCH_HEAD -- \
            "$SCI_DIR/RUN_ATTEMPT.marker" \
            "$SCI_DIR/PRIMARY_RESULT.json" \
            "$SCI_DIR/EXECUTION.json" \
            "$SCI_DIR/RUN_ONCE.marker"
          test "$(git hash-object "$SCI_DIR/RUN_ATTEMPT.marker")" = "613d2fbeb57a1421b1b6f551ccf2243174d2333b"
          test "$(git hash-object "$SCI_DIR/PRIMARY_RESULT.json")" = "2452b7fa7ea337f441d2d86ea0b41cd6de86048a"
          test "$(git hash-object "$SCI_DIR/EXECUTION.json")" = "1a02e841e9e28987768210b7e9b04989377b5f38"
          test "$(git hash-object "$SCI_DIR/RUN_ONCE.marker")" = "aad9087e798b4673365472c9c2a72bf1119d53c9"
      - name: Verify immutable hash chain and write closeout documents
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          RID='BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-INTERFACE-REPLICATION-0057'
          CLASS='FAIL_SIMPLE_BETA_ROUTER_COST_FRAGILE'
          SCI_HEAD='1d0b8fcf3ee49c180e90593afdb71047b34a28a7'
          RESULT_HEAD='bc54b904e7ee6f6392adca849e9bf21b66673b5f'
          BASE=Path('research/brrk_simple_eth_sol_beta_router_interface_replication_0057')

          def load(name):
              return json.loads((BASE/name).read_text(encoding='utf-8'))
          def canonical_sha(name):
              v=load(name)
              b=json.dumps(v,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()
              return hashlib.sha256(b).hexdigest()
          def dump(path, value):
              Path(path).write_text(json.dumps(value,indent=2,ensure_ascii=False,allow_nan=False)+'\n',encoding='utf-8')

          attempt=load('RUN_ATTEMPT.marker')
          result=load('PRIMARY_RESULT.json')
          execution=load('EXECUTION.json')
          marker=load('RUN_ONCE.marker')
          m=result['measurement']

          assert attempt['research_id']==RID and attempt['git_head_sha']==SCI_HEAD
          assert result['research_id']==RID and result['execution_head_sha']==SCI_HEAD
          assert execution['research_id']==RID and execution['git_head_sha']==SCI_HEAD
          assert marker['research_id']==RID and marker['git_head_sha']==SCI_HEAD
          assert result['classification']==execution['classification']==marker['classification']==CLASS
          assert m['actual_variants_evaluated']==execution['actual_variants_evaluated']==1
          assert m['gates']=={
              'G0_INTEGRITY': True,
              'G1_PRIMARY_ECONOMIC_DOMINANCE_5BPS': True,
              'G2_COST_SURVIVAL': False,
              'G3_TEMPORAL_ROBUSTNESS': True,
              'G4_DEPENDENCE_AWARE_ROBUSTNESS': False,
          }
          assert m['delegated_scientific_engine']=={
              'research_id':'BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056',
              'git_blob_sha':'b0fc1ac267a66593e7e2c4687aff81491bfcdf5a',
              'portfolio_outputs_modified_by_0057_adapter':False,
          }
          assert m['source_interface_adapter']['operation']=='COPY_THEN_INDEX_TZ_LOCALIZE_UTC_ONLY'
          assert m['source_interface_adapter']['calendar_order_rowcount_close_values_changed'] is False

          ah=canonical_sha('RUN_ATTEMPT.marker')
          rh=canonical_sha('PRIMARY_RESULT.json')
          eh=canonical_sha('EXECUTION.json')
          assert ah=='28e80c8135ff741aa3776f921ae4c92cc15d0ea8a29cb37e0a88b547429d938a'
          assert rh=='9920697ece45d5df73711dcf38045a8dc2f265759df4d88fee131b0cb64ece31'
          assert execution['attempt_marker_sha256']==ah
          assert execution['primary_result_sha256']==rh
          assert marker['attempt_marker_sha256']==ah
          assert marker['primary_result_sha256']==rh
          assert marker['execution_sha256']==eh=='17079b7d45d9444736bbb1b5c7411596ba826fdd36f6a6506e386646c177543e'
          assert marker['finalized_without_remeasurement'] is True
          for obj in (execution, marker, result['authority']):
              assert obj['same_id_rerun_allowed'] is False
              assert obj['same_id_retuning_allowed'] is False
              assert obj['same_id_rescue_allowed'] is False
          assert result['authority']['production_authorized'] is False

          p=m['metrics_by_cost_bps']
          # These are read-only assertions against the persisted result, not recomputation.
          assert p['5']['ROUTER']['terminal_wealth']==31.736778934550063
          assert p['5']['B1_STATIC_SOL']['terminal_wealth']==30.665104796033276
          assert p['10']['ROUTER']['terminal_wealth']==28.298380741150353
          assert p['10']['B1_STATIC_SOL']['terminal_wealth']==30.649764573523747
          assert p['20']['ROUTER']['terminal_wealth']==22.491038661976667
          assert p['20']['B1_STATIC_SOL']['terminal_wealth']==30.61908412850534
          assert m['temporal_positive_block_count']==3
          assert all(x<=0 for x in m['bootstrap_5bps']['lcbs'])

          closeout={
            'research_id':RID,
            'status':CLASS,
            'closed':True,
            'development_not_independent_oos':True,
            'researcher_exposed_history':True,
            'execution_head_sha':SCI_HEAD,
            'result_branch_head_sha':RESULT_HEAD,
            'payload_sha256':result['payload_sha256'],
            'execution_identity':{
              'github_actions_run':31618590484,
              'runtime_artifact_id':9150295821,
              'runtime_artifact_name':'brrk-0057-interface-replication-runtime-bundle',
              'runtime_artifact_digest':'sha256:b1acb281f148270e2fdda92f99e6a84b17eddb014a6a76bf79a08c975877427d',
              'started_at_utc':execution['started_at_utc'],
              'completed_at_utc':execution['completed_at_utc'],
            },
            'runtime_git_blobs':{
              'RUN_ATTEMPT.marker':'613d2fbeb57a1421b1b6f551ccf2243174d2333b',
              'PRIMARY_RESULT.json':'2452b7fa7ea337f441d2d86ea0b41cd6de86048a',
              'EXECUTION.json':'1a02e841e9e28987768210b7e9b04989377b5f38',
              'RUN_ONCE.marker':'aad9087e798b4673365472c9c2a72bf1119d53c9',
            },
            'runtime_hashes':{
              'attempt_marker_sha256':ah,
              'primary_result_sha256':rh,
              'execution_sha256':eh,
            },
            'gates':m['gates'],
            'economic_result':{
              'best_static_5bps':m['best_static_5bps'],
              'metrics_by_cost_bps':m['metrics_by_cost_bps'],
              'log_terminal_advantage_by_cost_bps':m['log_terminal_advantage_by_cost_bps'],
              'temporal_block_relative_log_growth_vs_best_static_5bps':m['temporal_block_relative_log_growth_vs_best_static_5bps'],
              'temporal_positive_block_count':m['temporal_positive_block_count'],
              'bootstrap_5bps':m['bootstrap_5bps'],
              'diagnostics':m['diagnostics'],
            },
            'binding_failure':{
              'gate':'G2_COST_SURVIVAL',
              'reason':'Router beats all frozen static benchmarks at 5 bps but falls below static SOL at both 10 bps and 20 bps; classification precedence therefore closes at cost fragility. G4 also independently fails because all simultaneous dependence-aware LCBs are nonpositive.',
            },
            'authority':{
              'economic_conclusion_authorized':True,
              'simple_beta_router_economic_eligibility':False,
              'eth_sol_micro_timing_line_closed':True,
              'same_id_rerun_allowed':False,
              'same_id_retuning_allowed':False,
              'same_id_rescue_allowed':False,
              'next_continuation_requires_new_research_id':True,
              'next_problem_family':'BETA_TO_BTC_CONTINUATION_VALUE_FULL_CYCLE_EXIT',
              'canonical_strategy_changed':False,
              'phase6_changed':False,
              'production_authorized':False,
              'signature_authorized':False,
              'order_submission_authorized':False,
            },
            'interpretation':'The exact frozen RM60 ETH/SOL router is economically positive at the 5 bps primary cost assumption but does not survive the prospectively frozen 10/20 bps cost stresses and also lacks positive simultaneous dependence-aware bootstrap lower bounds. The valid preregistered decision is therefore FAIL_SIMPLE_BETA_ROUTER_COST_FRAGILE. The ETH/SOL micro-timing line is closed; any continuation must be a new-ID Beta-to-BTC continuation-value/full-cycle exit problem rather than a router rescue.'
          }
          dump(BASE/'CLOSEOUT.json',closeout)

          closeout_ci={
            'research_id':RID,
            'status':'READ_ONLY_CLOSEOUT_CONTRACT_PASS',
            'scientific_engine_imported':False,
            'source_loader_imported':False,
            'interface_adapter_imported':False,
            'portfolio_remeasurement_executed':False,
            'runtime_git_blob_identity_verified':True,
            'runtime_hash_chain_verified':True,
            'result_branch_head_verified':RESULT_HEAD,
            'classification_verified':CLASS,
            'gates_verified':m['gates'],
            'adapter_provenance_verified':True,
            'delegated_0056_engine_provenance_verified':True,
            'artifact_identity':{
              'run':31618590484,
              'artifact_id':9150295821,
              'name':'brrk-0057-interface-replication-runtime-bundle',
              'digest':'sha256:b1acb281f148270e2fdda92f99e6a84b17eddb014a6a76bf79a08c975877427d',
            },
            'actual_variants_evaluated':1,
            'same_id_rerun_allowed':False,
            'production_authorized':False,
          }
          dump(BASE/'CLOSEOUT_CI.json',closeout_ci)

          result_md=f'''# 0057 Simple ETH/SOL Beta Router Interface Replication Result\n\nFinal classification: **{CLASS} / CLOSED**.\n\nThe unique exactly-once DEVELOPMENT run was valid: G0 passed, the prospectively frozen timezone representation adapter preserved calendar/order/row-count/close values, and portfolio economics were delegated to immutable 0056 engine blob `b0fc1ac267a66593e7e2c4687aff81491bfcdf5a`.\n\n## Frozen gate result\n\n```text\nG0 integrity                         PASS\nG1 5bps economic dominance           PASS\nG2 10/20bps cost survival            FAIL\nG3 temporal robustness               PASS (3/4 blocks)\nG4 dependence-aware robustness       FAIL\nclassification                       {CLASS}\n```\n\n## Economic result\n\n| Cost | Router wealth | Router CAGR | Static SOL wealth | Static SOL CAGR | Router vs SOL |\n|---|---:|---:|---:|---:|---:|\n| 5 bps | 31.7368 | 81.3247% | 30.6651 | 80.2558% | +3.50% terminal wealth |\n| 10 bps | 28.2984 | 77.7808% | 30.6498 | 80.2403% | loses |\n| 20 bps | 22.4910 | 70.8894% | 30.6191 | 80.2092% | loses |\n\nAt 5 bps the router strictly beat ETH, SOL and initial-50/50 buy-and-hold, so G1 passed. But 114 switches produced total executed L1 turnover of 229; at both 10 and 20 bps the router fell below static SOL, so the frozen G2 cost-survival gate failed.\n\nThe four relative-log-growth blocks versus full-horizon best static SOL were `{m['temporal_block_relative_log_growth_vs_best_static_5bps']}`, giving 3/4 positive blocks and a G3 pass. The simultaneous 95% moving-block-bootstrap LCBs were `{m['bootstrap_5bps']['lcbs']}`; all are nonpositive, so G4 also fails.\n\nMandatory diagnostics: router 5bps MDD `{m['diagnostics']['maximum_drawdown_5bps']['ROUTER']:.6f}`, switch count `{m['diagnostics']['router_switch_count']}`, L1 turnover `{m['diagnostics']['router_total_executed_l1_turnover_5bps']}`, average holding `{m['diagnostics']['router_average_holding_duration_days']:.4f}` days, median holding `{m['diagnostics']['router_median_holding_duration_days']:.1f}` days, longest underperformance interval `{m['diagnostics']['longest_underperformance_interval_days_vs_b_star_5bps']}` days.\n\n## Closure\n\nThis is a valid economic FAIL, not an invalid execution. Same-ID rerun, retuning and rescue are permanently false. Per preregistration, the ETH/SOL micro-timing line stops here. Any continuation must use a new research ID for the Beta→BTC continuation-value/full-cycle exit problem. Canonical BRRK, Phase 6 and all production authority remain unchanged.\n'''
          (BASE/'RESULT.md').write_text(result_md,encoding='utf-8')

          # Update registry in place; preserve all preregistered scientific fields.
          rp=Path('config/research_registry.json')
          reg=json.loads(rp.read_text(encoding='utf-8'))
          matches=[r for r in reg['records'] if r.get('research_id')==RID]
          assert len(matches)==1
          rec=matches[0]
          assert rec['result_status']=='PREREGISTERED_NOT_RUN'
          assert rec['actual_variants_evaluated']==0
          rec['actual_variants_evaluated']=1
          rec['result_status']=CLASS
          rec['failure_reason']='G2 cost survival failed: router terminal wealth beats all statics at 5 bps, but is below B1 static SOL at both 10 bps and 20 bps. G4 also fails with all simultaneous dependence-aware LCBs <= 0; frozen precedence classifies at G2.'
          rec['promotion_state']='NO_PROMOTION'
          rec['evidence_refs']=[
              'run:31618590484',
              'artifact:brrk-0057-interface-replication-runtime-bundle',
              str(BASE/'PRIMARY_RESULT.json'),
              str(BASE/'EXECUTION.json'),
              str(BASE/'RUN_ONCE.marker'),
              str(BASE/'CLOSEOUT.json'),
          ]
          rec['evidence_scorecard']={
              'temporal_novelty':'RESEARCHER_EXPOSED_DEVELOPMENT_NOT_INDEPENDENT_OOS',
              'statistical_sufficiency':'G4_FAIL_ALL_SIMULTANEOUS_95PCT_DEPENDENCE_AWARE_LCBS_NONPOSITIVE',
              'governance_integrity':'HIGH_EXACTLY_ONCE_HASH_BOUND_FINALIZED_WITHOUT_REMEASUREMENT',
              'operational_realism':'CAUSAL_SPOT_FULL_CYCLE_ACCOUNTING_WITH_PREDECLARED_5_10_20_BPS_COST_PANEL',
              'derived_confidence':'HIGH_FOR_FROZEN_DEVELOPMENT_DECISION',
              'confidence_rule_ref':str(BASE/'CLOSEOUT.json'),
          }
          if str(BASE/'CLOSEOUT.json') not in rec['decision_refs']:
              rec['decision_refs'].insert(-1,str(BASE/'CLOSEOUT.json'))
          rec['research_process_complexity']['actual_parameter_candidates_evaluated']=['RM60_SIGN_ROUTER_WITH_FROZEN_TZ_LOCALIZE_UTC_ADAPTER']
          rec['notes'].extend([
              'Unique run 31618590484 validly classified FAIL_SIMPLE_BETA_ROUTER_COST_FRAGILE; G0/G1/G3 passed, G2/G4 failed.',
              'At 5 bps router terminal wealth 31.7368 exceeded static SOL 30.6651, but at 10/20 bps router wealth 28.2984/22.4910 fell below static SOL 30.6498/30.6191.',
              'The ETH/SOL micro-timing line is closed by the preregistered stopping rule; continuation requires a new-ID Beta-to-BTC continuation-value/full-cycle exit study.'
          ])
          rp.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          # Human handoffs: preserve prior document and add immutable closure state.
          readme=BASE/'README.md'
          rt=readme.read_text(encoding='utf-8')
          if '## Immutable closeout' not in rt:
              rt += f'''\n\n## Immutable closeout\n\nUnique DEVELOPMENT run `31618590484` completed exactly once with classification `{CLASS}`. G0/G1/G3 passed; G2/G4 failed. The router is not eligible for promotion, same-ID recomputation is permanently forbidden, and the ETH/SOL micro-timing line is closed. See `PRIMARY_RESULT.json`, `EXECUTION.json`, `RUN_ONCE.marker`, `RESULT.md`, and `CLOSEOUT.json`.\n'''
          readme.write_text(rt,encoding='utf-8')

          cs=Path('docs/CURRENT_STATE.md')
          ct=cs.read_text(encoding='utf-8')
          old='BRRK Beta router interface replication 0057 CONTROLLED-RUN BOUNDARY / ZERO RESULT / REAL HISTORICAL RUN NOT RUN'
          assert old in ct
          ct=ct.replace(old,'BRRK Beta router interface replication 0057 FAIL_SIMPLE_BETA_ROUTER_COST_FRAGILE / CLOSED',1)
          section=f'''\n\n---\n\n## 22. 0057 immutable economic result and closure\n\n`BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-INTERFACE-REPLICATION-0057` completed its unique exactly-once DEVELOPMENT execution in Actions run `31618590484` on frozen scientific HEAD `{SCI_HEAD}`. Final classification: **`{CLASS}`**.\n\n```text\nG0 integrity                           PASS\nG1 5bps dominance                     PASS\nG2 10/20bps cost survival             FAIL\nG3 temporal robustness                PASS / 3 of 4 blocks\nG4 dependence-aware robustness        FAIL\nrouter terminal wealth 5bps           31.7367789346\nstatic SOL terminal wealth 5bps       30.6651047960\nrouter terminal wealth 10bps          28.2983807412\nstatic SOL terminal wealth 10bps      30.6497645735\nrouter terminal wealth 20bps          22.4910386620\nstatic SOL terminal wealth 20bps      30.6190841285\nrouter switches                       114\nrouter executed L1 turnover           229.0\nbootstrap LCBs                        [-0.00054859, -0.00139527, -0.00114094]\nactual variants evaluated             1\nsame-ID rerun/retune/rescue           false / false / false\n```\n\n0057 is a valid economic FAIL, not an invalid execution. The interface correction worked, but the router's low-cost edge over static SOL did not survive the frozen higher-cost stresses and was not dependence-robust. Per preregistration, **stop the ETH/SOL micro-timing line**. The next legal scientific continuation is a new-ID **Beta→BTC continuation-value / full-cycle exit** problem, not another router rescue.\n\nCanonical BRRK-0011, Phase 6, signing, order submission and production authorization remain unchanged.\n'''
          if '## 22. 0057 immutable economic result and closure' not in ct:
              ct += section
          cs.write_text(ct,encoding='utf-8')

          print('READ_ONLY_HASH_CHAIN_VERIFIED=true')
          print('CLASSIFICATION='+CLASS)
          print('SCIENTIFIC_ENGINE_IMPORTED=false')
          print('PORTFOLIO_REMEASUREMENT_EXECUTED=false')
          PY
      - name: Validate governance and no drift without scientific imports
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift
          test "$(git diff --name-only "$SCI_HEAD"...HEAD | grep -c '^$' || true)" -ge 0
      - name: Commit immutable closeout surface
        run: |
          git config user.name 'Y_Wang'
          git config user.email '40142450+alexwang91@users.noreply.github.com'
          git add \
            "$SCI_DIR/RUN_ATTEMPT.marker" \
            "$SCI_DIR/PRIMARY_RESULT.json" \
            "$SCI_DIR/EXECUTION.json" \
            "$SCI_DIR/RUN_ONCE.marker" \
            "$SCI_DIR/RESULT.md" \
            "$SCI_DIR/CLOSEOUT.json" \
            "$SCI_DIR/CLOSEOUT_CI.json" \
            "$SCI_DIR/README.md" \
            config/research_registry.json \
            docs/CURRENT_STATE.md
          git commit -m 'Research closeout [0057]: preserve cost-fragile router failure'
          git push origin "HEAD:$TARGET_BRANCH"
