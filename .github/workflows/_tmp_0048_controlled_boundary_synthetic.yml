name: 0048 controlled-boundary synthetic contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/brrk_leadership_rotation_0048/**'
      - '.github/workflows/_tmp_0048_controlled_boundary_synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Compile controlled runner
        run: python -m py_compile research/brrk_leadership_rotation_0048/run_once.py
      - name: Verify zero-result runtime boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          here = Path('research/brrk_leadership_rotation_0048')
          forbidden = {
              'PRIMARY_RESULT.json', 'RESULT_SUMMARY.json', 'EXECUTION.json',
              'RUN_ATTEMPT.marker', 'RUN_ONCE.marker', 'RESULT.md',
              'portfolio.py', 'portfolio_result.json',
          }
          present = {p.name for p in here.iterdir() if p.is_file()}
          overlap = sorted(forbidden & present)
          if overlap:
              raise SystemExit(f'zero-result boundary violated: {overlap}')
          PY
      - name: Run prereg, engine and controlled-run contracts
        run: |
          python -m unittest \
            research.brrk_leadership_rotation_0048.test_preregistration_contract \
            research.brrk_leadership_rotation_0048.test_engine_contract \
            research.brrk_leadership_rotation_0048.test_run_interface_contract
