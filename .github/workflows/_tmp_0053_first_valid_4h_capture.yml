name: 0053 first valid Binance 4h capture

on:
  push:
    branches:
      - research/brrk-leadership-intraday-support-0053-capture-v2

permissions:
  contents: write

jobs:
  capture:
    if: contains(github.event.head_commit.message, 'trigger amended 0053 first valid 4h capture')
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-intraday-support-0053-capture-v2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture exact frozen 4h payload and register provenance
        run: |
          python - <<'PY'
          from __future__ import annotations
          import datetime as dt, hashlib, json, math, time, urllib.parse, urllib.request
          from pathlib import Path

          RID='BRRK-LEADERSHIP-INTRADAY-SUPPORT-0053'
          SLICE='BRRK-LEADERSHIP-INTRADAY-SUPPORT-0053-BINANCE-4H-HIST-V1'
          SYMBOLS=['BTCUSDT','ETHUSDT','SOLUSDT']
          STEP=14_400_000
          START_MS=int(dt.datetime(2020,8,11,tzinfo=dt.timezone.utc).timestamp()*1000)
          END_EXCL_MS=int(dt.datetime(2026,8,3,tzinfo=dt.timezone.utc).timestamp()*1000)
          END_INCL_MS=END_EXCL_MS-1
          HERE=Path('research/brrk_leadership_intraday_support_0053')
          contract=json.loads((HERE/'DATA_RETRIEVAL_CONTRACT.json').read_text())
          API=contract['source']['rest_endpoint']
          expected='https://data-api.binance.vision/api/v3/klines'
          if API != expected:
              raise SystemExit(f'capture endpoint drift: {API!r} != {expected!r}')
          for n in ['MARKET_4H_PAYLOAD.json','MARKET_4H_EVIDENCE.json','DATASET_DECLARATION.json']:
              if (HERE/n).exists(): raise SystemExit(f'create-only violation: {n}')

          def iso(ms):
              return dt.datetime.fromtimestamp(ms/1000,tz=dt.timezone.utc).isoformat().replace('+00:00','Z')

          def get_page(symbol,start_ms):
              q=urllib.parse.urlencode({'symbol':symbol,'interval':'4h','startTime':start_ms,'endTime':END_INCL_MS,'limit':1000})
              url=API+'?'+q
              last=None
              for attempt in range(6):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'BRRK-0053-data-capture/1.1'})
                      with urllib.request.urlopen(req,timeout=30) as r: body=r.read()
                      x=json.loads(body)
                      if not isinstance(x,list): raise RuntimeError(f'non-list response {x!r}')
                      return x
                  except Exception as exc:
                      last=exc
                      if attempt<5: time.sleep(min(2**attempt,16))
              raise RuntimeError(f'capture failed {symbol} start={start_ms}: {last!r}')

          all_rows={}; stats={}
          for symbol in SYMBOLS:
              rows=[]; cursor=START_MS
              while cursor<END_EXCL_MS:
                  page=get_page(symbol,cursor)
                  page=[r for r in page if START_MS<=int(r[0])<END_EXCL_MS]
                  if not page: break
                  rows.extend(page)
                  nxt=int(page[-1][0])+STEP
                  if nxt<=cursor: raise RuntimeError(f'non-advancing page {symbol}')
                  cursor=nxt
                  time.sleep(0.05)
              if not rows: raise RuntimeError(f'zero rows {symbol}')
              opens=[int(r[0]) for r in rows]
              if opens!=sorted(opens) or len(opens)!=len(set(opens)): raise RuntimeError(f'ordering/duplicate failure {symbol}')
              for i,(ot,r) in enumerate(zip(opens,rows)):
                  if ot%STEP: raise RuntimeError(f'4h alignment failure {symbol} {ot}')
                  if i and ot-opens[i-1]!=STEP: raise RuntimeError(f'gap {symbol} {opens[i-1]}->{ot}')
                  if len(r)<12: raise RuntimeError(f'field-count failure {symbol} {ot}')
                  for j in [1,2,3,4]:
                      v=float(r[j])
                      if not math.isfinite(v) or v<=0: raise RuntimeError(f'OHLC failure {symbol} {ot} {j}')
                  for j in [5,7,9,10]:
                      v=float(r[j])
                      if not math.isfinite(v) or v<0: raise RuntimeError(f'volume failure {symbol} {ot} {j}')
                  if int(r[8])<0: raise RuntimeError(f'trade-count failure {symbol} {ot}')
              all_rows[symbol]=rows
              stats[symbol]={'raw_bar_count':len(rows),'first_open_time':iso(opens[0]),'last_open_time':iso(opens[-1]),'first_open_ms':opens[0],'last_open_ms':opens[-1]}

          common=sorted(set.intersection(*(set(int(r[0]) for r in all_rows[s]) for s in SYMBOLS)))
          if not common: raise RuntimeError('empty common index')
          if any(common[i]-common[i-1]!=STEP for i in range(1,len(common))): raise RuntimeError('common-index gap')

          payload={'interval':'4h','start_ms':START_MS,'end_exclusive_ms':END_EXCL_MS,'symbols':{s:all_rows[s] for s in SYMBOLS}}
          raw=json.dumps(payload,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()
          sha=hashlib.sha256(raw).hexdigest()
          (HERE/'MARKET_4H_PAYLOAD.json').write_bytes(raw)
          now=dt.datetime.now(dt.timezone.utc).isoformat().replace('+00:00','Z')
          exposure='BRRK-LEADERSHIP-INTRADAY-SUPPORT-0053-RAW-DATA-'+now.replace('-','').replace(':','').replace('.','')
          evidence={
            'schema_version':1,'evidence_id':'BRRK-LEADERSHIP-INTRADAY-SUPPORT-0053-FIRST-4H-CAPTURE-EVIDENCE-V1','research_id':RID,
            'evidence_type':'DATASET_PROVENANCE_AND_EXPOSURE_ONLY','research_result_status':'NO_SUPPORT_MEASUREMENT_NO_PREDICTIVE_RESULT_CAPTURE_METADATA_ONLY','retrieved_at':now,
            'source':{'endpoint':API,'venue':'Binance Spot','interval':'4h','symbols':SYMBOLS},
            'requested_window':{'start_inclusive':'2020-08-11T00:00:00Z','end_inclusive':'2026-08-02T20:00:00Z','end_exclusive':'2026-08-03T00:00:00Z'},
            'raw_identity':{'sha256':sha,'size_bytes':len(raw),'path':str(HERE/'MARKET_4H_PAYLOAD.json'),'canonical_json':'sort_keys=true,separators=(comma,colon),UTF-8'},
            'per_symbol':stats,
            'common_coverage':{'start':iso(common[0]),'end':iso(common[-1]),'bar_count':len(common),'interval_ms':STEP,'contiguous':True},
            'integrity':{'strictly_ascending':True,'no_duplicates':True,'internal_4h_gaps':0,'utc_4h_aligned':True,'finite_positive_ohlc':True,'nonnegative_volume_quote_volume_trades':True,'no_synthetic_fill':True,'no_alternate_venue':True},
            'prior_infrastructure_failure':{'run_id':31511625959,'job_id':93846583481,'failure':'HTTP_451_BEFORE_FIRST_ROW','scientific_dataset_created':False},
            'explicit_non_claims':['NO_TRACK_A_B_C_SUPPORT_COUNTS','NO_ETH_SOL_WINNER_LABELS','NO_MODEL_FIT','NO_CALIBRATION_FIT','NO_NLL_BRIER_AUC','NO_PORTFOLIO_ECONOMICS','NO_0048_RERUN']
          }
          (HERE/'MARKET_4H_EVIDENCE.json').write_text(json.dumps(evidence,indent=2)+'\n')
          slice_obj={
            'dataset_slice_id':SLICE,'dataset_id':'BINANCE-SPOT-BTC-ETH-SOL-UTC-4H-OHLCV-TRADES','dataset_version':'first-complete-valid-capture-sha256-'+sha,
            'source':'BINANCE_OFFICIAL_MARKET_DATA_ONLY_API_V3_KLINES_BTCUSDT_ETHUSDT_SOLUSDT_4H','assets':['BTC','ETH','SOL'],
            'fields':['4h_open','4h_high','4h_low','4h_close','4h_volume','4h_quote_volume','4h_trades'],'resolution':'4H','start':iso(common[0]),'end':iso(common[-1]),
            'transformation':'RAW_CANONICAL_BINANCE_4H_PAYLOAD_HASH_FROZEN_THEN_COMMON_CONTIGUOUS_BTC_ETH_SOL_INDEX; SUPPORT_FUNNEL_NOT_COMPUTED_DURING_CAPTURE',
            'pit_publication_semantics':'RESEARCHER_EXPOSED_DEVELOPMENT_HISTORY; a 4h bar is usable only after its Binance close_time; capture releases raw history only; no bar after 2026-08-02T20:00:00Z enters 0053.',
            'data_budget':'DEVELOPMENT','contamination_state':'RESEARCHER_EXPOSED_HISTORY','consumed':True,'researcher_exposed_history':True,'provenance_status':'FACT',
            'evidence_refs':['research/brrk_leadership_intraday_support_0053/MARKET_4H_EVIDENCE.json','research/brrk_leadership_intraday_support_0053/MARKET_4H_PAYLOAD.json']
          }
          declaration={'research_id':RID,'dataset_slice':slice_obj,'market_payload_sha256':sha,'capture_status':'FIRST_COMPLETE_VALID_CAPTURE_FROZEN','support_measurement_executed':False,'predictive_model_executed':False}
          (HERE/'DATASET_DECLARATION.json').write_text(json.dumps(declaration,indent=2)+'\n')

          dpath=Path('config/dataset_exposure_registry.json'); d=json.loads(dpath.read_text())
          if any(x.get('dataset_slice_id')==SLICE for x in d['dataset_slices']): raise RuntimeError('dataset slice already registered')
          d['dataset_slices'].append(slice_obj)
          d['exposure_events'].append({'exposure_id':exposure,'research_id':RID,'dataset_slice_ref':SLICE,'timestamp':now,'release_type':'RAW_DATA','result_informed_followup':False,'provenance_status':'FACT','evidence_ref':'research/brrk_leadership_intraday_support_0053/MARKET_4H_EVIDENCE.json'})
          dpath.write_text(json.dumps(d,indent=2)+'\n')

          rpath=Path('config/research_registry.json'); rr=json.loads(rpath.read_text()); matches=[x for x in rr['records'] if x.get('research_id')==RID]
          if len(matches)!=1: raise RuntimeError(f'research registry count {len(matches)}')
          row=matches[0]; row['development_dataset_refs']=[SLICE]; row['result_status']='PREREGISTERED_DATA_CAPTURED_NOT_MEASURED'; row['research_process_complexity']['validation_exposure_event_refs']=[exposure]
          row.setdefault('notes',[]).append('First complete valid 4h payload captured and frozen before support measurement; market SHA256 '+sha+'.')
          rpath.write_text(json.dumps(rr,indent=2)+'\n')

          # Post-capture contract: frozen local prereg remains unchanged; registry may record only the pre-authorized capture state.
          (HERE/'test_preregistration_contract.py').write_text('''import hashlib,json\nfrom pathlib import Path\nimport unittest\nHERE=Path(__file__).resolve().parent; ROOT=HERE.parents[1]; SLICE="BRRK-LEADERSHIP-INTRADAY-SUPPORT-0053-BINANCE-4H-HIST-V1"\nclass Test0053Preregistration(unittest.TestCase):\n def test_frozen_prereg_unchanged(self):\n  p=json.loads((HERE/"PREREGISTRATION.json").read_text()); self.assertEqual(p["objective_type"],"DATA_QUALITY"); self.assertEqual(p["actual_variants_evaluated"],0); self.assertEqual(p["development_dataset_refs"],[]); self.assertEqual(p["result_status"],"PREREGISTERED_DATA_NOT_CAPTURED")\n def test_capture_hash_and_registry(self):\n  dec=json.loads((HERE/"DATASET_DECLARATION.json").read_text()); ev=json.loads((HERE/"MARKET_4H_EVIDENCE.json").read_text()); raw=(HERE/"MARKET_4H_PAYLOAD.json").read_bytes(); self.assertEqual(hashlib.sha256(raw).hexdigest(),dec["market_payload_sha256"]); self.assertEqual(dec["market_payload_sha256"],ev["raw_identity"]["sha256"]); self.assertFalse(dec["support_measurement_executed"]); self.assertFalse(dec["predictive_model_executed"]); reg=json.loads((ROOT/"config/dataset_exposure_registry.json").read_text()); self.assertEqual(len([x for x in reg["dataset_slices"] if x.get("dataset_slice_id")==SLICE]),1)\n def test_research_registry_capture_only(self):\n  reg=json.loads((ROOT/"config/research_registry.json").read_text()); row=[x for x in reg["records"] if x.get("research_id")=="BRRK-LEADERSHIP-INTRADAY-SUPPORT-0053"][0]; self.assertEqual(row["development_dataset_refs"],[SLICE]); self.assertEqual(row["result_status"],"PREREGISTERED_DATA_CAPTURED_NOT_MEASURED"); self.assertEqual(row["actual_variants_evaluated"],0)\n def test_no_measurement_or_predictive_artifacts(self):\n  for n in ["SUPPORT_RESULT.json","PRIMARY_RESULT.json","RESULT_SUMMARY.json","EXECUTION.json","RUN_ONCE.marker"]: self.assertFalse((HERE/n).exists(),n)\nif __name__=="__main__": unittest.main()\n''')

          cpath=Path('docs/CURRENT_STATE.md'); s=cpath.read_text(); s=s.replace('BRRK intraday support 0053             PREREGISTERED / SOURCE AMENDMENT / DATA NOT CAPTURED','BRRK intraday support 0053             PREREGISTERED / DATA CAPTURED / NOT MEASURED'); s=s.replace('4h data retrieval                      SOURCE AMENDED / NOT CAPTURED','4h data retrieval                      FIRST COMPLETE VALID CAPTURE / HASH FROZEN'); s=s.replace('4h payload SHA256                      NOT FROZEN','4h payload SHA256                      '+sha); cpath.write_text(s)

          print('CAPTURE_COMPLETE'); print('market_payload_sha256='+sha); print('common_start='+iso(common[0])); print('common_end='+iso(common[-1])); print('common_bar_count='+str(len(common))); [print(s+'_raw_bar_count='+str(stats[s]['raw_bar_count'])) for s in SYMBOLS]; print('SUPPORT_FUNNEL_NOT_COMPUTED=true')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_leadership_intraday_support_0053 config/research_registry.json config/dataset_exposure_registry.json docs/CURRENT_STATE.md
          git commit -m 'Data capture [DRIFT_0]: freeze first complete valid 0053 Binance 4h payload'
          git rm .github/workflows/_tmp_0053_first_valid_4h_capture.yml .0053_capture_v2_trigger
          git commit -m 'Governance tooling: remove temporary 0053 capture workflow'
          git push origin HEAD:research/brrk-leadership-intraday-support-0053-capture-v2
