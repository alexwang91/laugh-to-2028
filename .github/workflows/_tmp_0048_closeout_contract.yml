name: 0048 immutable closeout contract

on:
  push:
    branches:
      - 'research/brrk-leadership-rotation-0048-execute-once'

permissions:
  contents: read

jobs:
  closeout-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Compile frozen engine and runner
        run: |
          python -m py_compile research/brrk_leadership_rotation_0048/engine.py
          python -m py_compile research/brrk_leadership_rotation_0048/run_once.py
      - name: Assert immutable result bundle exists and no portfolio translation exists
        run: |
          python - <<'PY'
          from pathlib import Path
          here = Path('research/brrk_leadership_rotation_0048')
          required = {
              'RUN_ATTEMPT.marker', 'PRIMARY_RESULT.json', 'RESULT_SUMMARY.json',
              'EXECUTION.json', 'RUN_ONCE.marker', 'RESULT.md', 'CLOSEOUT.json',
          }
          present = {p.name for p in here.iterdir() if p.is_file()}
          missing = sorted(required - present)
          if missing:
              raise SystemExit(f'missing immutable closeout artifacts: {missing}')
          forbidden = sorted({'portfolio.py', 'portfolio_result.json'} & present)
          if forbidden:
              raise SystemExit(f'forbidden portfolio translation artifacts: {forbidden}')
          PY
      - name: Run prereg engine runner and closeout contracts
        run: |
          python -m unittest \
            research.brrk_leadership_rotation_0048.test_preregistration_contract \
            research.brrk_leadership_rotation_0048.test_engine_contract \
            research.brrk_leadership_rotation_0048.test_run_interface_contract \
            research.brrk_leadership_rotation_0048.test_closeout_contract
