name: 0074 guarded OWNER-FIRST registry writer

on:
  pull_request:
    paths:
      - 'research/governance/owner_first_requests/0074.json'
      - '.github/workflows/0074-owner-first-writer.yml'

permissions:
  contents: write

jobs:
  write-owner-first:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/0074-stage1-owner-first-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Append canonical 0074 owner record and handoff, then self-delete
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          req_path = Path('research/governance/owner_first_requests/0074.json')
          wf_path = Path('.github/workflows/0074-owner-first-writer.yml')
          req = json.loads(req_path.read_text(encoding='utf-8'))
          assert req['schema_version'] == 1
          assert req['target_branch'] == 'research/0074-stage1-owner-first-v1'
          assert req['new_research_id'] == 'BRRK-CRYPTO-MULTI-HORIZON-TREND-0074'
          assert req['roadmap_merge'] == '169d9adf6531dc099a43541df413fef079322adf'
          assert req['0073_closeout_merge'] == 'da62a1ef2258eb27f5a4cede2415c567f19d3e76'
          assert req['controlled_reads'] == 0
          assert req['attempt_consumed'] == 0
          assert req['scientific_engine_calls'] == 0
          assert req['source_network_fetches'] == 0
          assert req['production_authorized'] is False

          record = req['record']
          assert record['research_id'] == req['new_research_id']
          assert record['governance_mode'] == 'PROGRAM_GOVERNED_V1'
          assert record['created_before_result'] is True
          assert record['actual_variants_evaluated'] == 0
          assert record['universe'] == ['BTC', 'ETH', 'SOL']
          assert record['production_authorized'] is False
          assert record['governed_path_prefixes'] == [req['governed_path_prefix']]

          registry_path = Path('config/research_registry.json')
          raw = registry_path.read_text(encoding='utf-8')
          data = json.loads(raw)
          rid = req['new_research_id']
          assert not any(row.get('research_id') == rid for row in data['records'])
          marker = '\n  ],\n  "research_governance_debt": ['
          pos = raw.rfind(marker)
          assert pos > 0, 'registry records/debt boundary not found'
          rendered = json.dumps(record, indent=2, ensure_ascii=False)
          rendered = '\n'.join('    ' + line for line in rendered.splitlines())
          updated = raw[:pos] + ',\n' + rendered + raw[pos:]
          parsed = json.loads(updated)
          assert len(parsed['records']) == len(data['records']) + 1
          assert parsed['records'][-1]['research_id'] == rid
          assert parsed['research_governance_debt'] == data['research_governance_debt']
          registry_path.write_text(updated, encoding='utf-8')

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          immutable = 'workflow run                         31381953131 / attempt 1'
          assert state.count(immutable) == 1
          old_next = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is merged at `8ccf14ecf0e1e2b0ccfa94ad3600105fb321380b`. Stage 6 CONTROLLED BOUNDARY is merged at `ac13585c54c031440e5b35e183d7fea9a46e2830`. Stage 7 ZERO-RESULT PREFLIGHT is merged at `91807d0824f61c734e1a07c36f6e8fa84a39da13` with `PREFLIGHT_PASS_ZERO_RESULT`. Stage 8 CONTROLLED ATTEMPT immutable result bundle is merged at `822736132cb1d04348a74538d1a4ea02d6f4ed5f` with classification `INCONCLUSIVE_INSUFFICIENT_SUPPORT`; attempt `1/1` is permanently consumed, controlled scientific/history reads are `0`, scientific engine calls are `1/1`, and scientific source-network fetches are `0`. Stage 9 RESULT is merged at `7ff4fb207280b617451b30e8957e28168d080e76`. Stage 10 immutable CLOSEOUT is in progress on PR #361 / `research/0073-stage10-closeout-v1`; it performs zero source rereads and zero scientific recomputation. Formal completion is `9/10` until #361 merges; after merge 0073 becomes `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`, and the only legal roadmap action is owner-first Stage1 for 0074."
          new_next = "0073 completed immutable Stage 10 closeout at merge `da62a1ef2258eb27f5a4cede2415c567f19d3e76` and remains `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. 0074 Stage 1 OWNER-FIRST is in progress on PR #362 / `research/0074-stage1-owner-first-v1`; formal completion remains `0/10` until Stage 1 merges. 0074 attempt is `0/1`, controlled scientific/history reads are `0`, scientific engine calls are `0`, and source-network fetches are `0`. The next legal action is exact-head CI completion and expected-head merge of Stage 1, then a separate Stage 2 DESIGN branch."
          assert old_next in state
          state = state.replace(old_next, new_next, 1)
          old_auth = "0073 = STAGE-1→8 MERGED / STAGE-9 RESULT MERGED / STAGE-10 IMMUTABLE CLOSEOUT IN PROGRESS / `INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN` / FORMAL COMPLETION 9/10 UNTIL #361 MERGE / CONTROLLED ATTEMPT 1/1 CONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 1/1 / SOURCE NETWORK FETCHES 0 / NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new_auth = "0073 = 10/10 COMPLETE / `INCONCLUSIVE_INSUFFICIENT_SUPPORT` / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 1/1 / SOURCE NETWORK FETCHES 0 / NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.\n0074 = OWNER-FIRST REGISTRATION IN PROGRESS ON #362 / FORMAL COMPLETION 0/10 UNTIL OWNER-FIRST MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          assert old_auth in state
          state = state.replace(old_auth, new_auth, 1)
          assert state.count(immutable) == 1
          state_path.write_text(state, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json docs/CURRENT_STATE.md
          git rm research/governance/owner_first_requests/0074.json .github/workflows/0074-owner-first-writer.yml
          git commit -m 'governance(0074): register OWNER-FIRST and sync handoff'
          python -m research.governance.validate
          python -m research.governance.no_drift
          git diff --check HEAD^ HEAD
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
