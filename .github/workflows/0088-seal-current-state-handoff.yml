name: 0088 seal CURRENT_STATE handoff

on:
  push:
    branches:
      - "research/0088-factor-ls-result-v1"
    paths:
      - ".github/workflows/0088-seal-current-state-handoff.yml"

permissions:
  contents: write

jobs:
  append-and-self-delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "research/0088-factor-ls-result-v1"
          fetch-depth: 0
      - name: Append immutable 0088 SEAL handoff and self-delete
        run: |
          set -euo pipefail
          echo '' | base64 -d >> docs/CURRENT_STATE.md
          rm .github/workflows/0088-seal-current-state-handoff.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md .github/workflows/0088-seal-current-state-handoff.yml
          git commit -m "docs(0088): record immutable Factor L/S FAIL handoff"
          git push origin HEAD:research/0088-factor-ls-result-v1
