name: 0086 objective type schema fix

on:
  push:
    branches:
      - research/0086-factor-atlas-spec-freeze-clean-v2

permissions:
  contents: write

jobs:
  fix-objective-type:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0086-factor-atlas-spec-freeze-clean-v2
          fetch-depth: 0
      - name: Set governed objective type without changing frozen science
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/research_registry.json')
          data = json.loads(p.read_text())
          rid = 'BRRK-CROSS-SECTIONAL-FACTOR-ATLAS-0086'
          matches = [r for r in data['records'] if r.get('research_id') == rid]
          if len(matches) != 1:
              raise SystemExit(f'expected one 0086 record, found {len(matches)}')
          r = matches[0]
          if r.get('objective_type') != 'FACTOR_ATLAS_VALIDATION':
              raise SystemExit(f"unexpected prior objective_type={r.get('objective_type')!r}")
          r['objective_type'] = 'ALPHA_DISCOVERY'
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
      - name: Remove bootstrap and commit schema-only fix
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0086-objective-type-schema-fix.yml
          git add config/research_registry.json
          git diff --cached --check
          git commit -m "research(0086): classify objective as alpha discovery"
          git push origin HEAD:research/0086-factor-atlas-spec-freeze-clean-v2
