name: Temporary Phase6 observation closeout audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/governance/phase6_observation_closeout_audit.py'
      - '.github/workflows/tmp-phase6-observation-closeout-audit.yml'

permissions:
  contents: read
  actions: write

jobs:
  audit:
    if: github.head_ref == 'governance/phase6-observation-closeout-audit-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit already-persisted Phase6 evidence before drill
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m research.governance.phase6_observation_closeout_audit \
            --output phase6_closeout_audit_before.json
          python -m json.tool phase6_closeout_audit_before.json
      - name: Dispatch exactly one missing zero-authority emergency drill and wait to terminal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          before = json.loads(Path('phase6_closeout_audit_before.json').read_text())
          if before['requirements']['emergency_drills'] >= 1:
              print('A verified emergency drill already exists; no dispatch.')
              raise SystemExit(0)

          headers = {
              'Authorization': f'Bearer {token}',
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'phase6-closeout-drill-dispatch-v1',
          }
          dispatch_started = datetime.now(timezone.utc)
          url = f'https://api.github.com/repos/{repo}/actions/workflows/research-governance.yml/dispatches'
          body = json.dumps({'ref': 'main', 'inputs': {'emergency_drill': 'true'}}).encode()
          request = urllib.request.Request(url, data=body, headers=headers, method='POST')
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status == 204, response.status
          print('Dispatched zero-authority Phase6 emergency drill at', dispatch_started.isoformat())

          run_id = None
          deadline = time.time() + 20 * 60
          while time.time() < deadline and run_id is None:
              query = urllib.parse.urlencode({'event': 'workflow_dispatch', 'per_page': 20})
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/research-governance.yml/runs?{query}',
                  headers=headers,
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  rows = json.loads(response.read().decode())['workflow_runs']
              for row in rows:
                  created = datetime.fromisoformat(row['created_at'].replace('Z', '+00:00'))
                  if created >= dispatch_started.replace(microsecond=0) and row.get('head_branch') == 'main':
                      run_id = int(row['id'])
                      break
              if run_id is None:
                  time.sleep(5)
          if run_id is None:
              raise SystemExit('Timed out locating dispatched emergency-drill run')
          print('Emergency-drill workflow run:', run_id)
          Path('phase6_emergency_drill_run_id.txt').write_text(str(run_id) + '\n')

          while time.time() < deadline:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}', headers=headers
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  row = json.loads(response.read().decode())
              print('run', run_id, row['status'], row.get('conclusion'))
              if row['status'] == 'completed':
                  break
              time.sleep(10)
          else:
              raise SystemExit(f'Timed out waiting for emergency-drill run {run_id}')

          # The overall workflow may contain unrelated governance jobs. The closeout
          # auditor independently requires the attempt-1 Phase6 observation job and
          # its evidence+receipt pair to be valid, which is the frozen evidence rule.
          time.sleep(5)
          PY
      - name: Re-audit after emergency drill and require every frozen Phase6 acceptance gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m research.governance.phase6_observation_closeout_audit \
            --output phase6_closeout_audit_after.json
          python -m json.tool phase6_closeout_audit_after.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('phase6_closeout_audit_after.json').read_text())
          req = audit['requirements']
          assert req['elapsed_requirement_met'] is True, req
          assert req['scheduled_decision_requirement_met'] is True, req
          assert req['emergency_drill_requirement_met'] is True, req
          assert req['critical_reconciliation_errors_observed'] == 0, req
          assert req['unexplained_target_drift_observed'] == 0, req
          assert req['schedule_failures_observed'] == 0, req
          assert req['missing_expected_schedule_dates'] == [], req
          assert req['duplicate_decision_timestamps'] == [], req
          assert req['phase6_acceptance_preliminary'] is True, req
          print('PHASE6_FROZEN_ACCEPTANCE_GATES_PASS')
          PY
      - name: Upload read-only before/after audits
        uses: actions/upload-artifact@v4
        with:
          name: phase6-observation-closeout-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            phase6_closeout_audit_before.json
            phase6_closeout_audit_after.json
            phase6_emergency_drill_run_id.txt
          if-no-files-found: error
          retention-days: 30
          overwrite: false
