name: Temporary Phase6 observation closeout audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/governance/phase6_observation_closeout_audit.py'
      - '.github/workflows/tmp-phase6-observation-closeout-audit.yml'

permissions:
  contents: write
  actions: read

jobs:
  audit-and-finalize:
    if: github.head_ref == 'governance/phase6-observation-closeout-audit-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Re-audit already-persisted Phase6 evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m research.governance.phase6_observation_closeout_audit \
            --output phase6_closeout_audit_after.json
          python -m json.tool phase6_closeout_audit_after.json
          python - <<'PY'
          import json
          from pathlib import Path
          audit = json.loads(Path('phase6_closeout_audit_after.json').read_text())
          req = audit['requirements']
          assert req['elapsed_requirement_met'] is True, req
          assert req['scheduled_decision_requirement_met'] is True, req
          assert req['emergency_drill_requirement_met'] is True, req
          assert req['critical_reconciliation_errors_observed'] == 0, req
          assert req['unexplained_target_drift_observed'] == 0, req
          assert req['schedule_failures_observed'] == 0, req
          assert req['missing_expected_schedule_dates'] == [], req
          assert req['duplicate_decision_timestamps'] == [], req
          assert req['phase6_acceptance_preliminary'] is True, req
          assert len(audit['creditable_schedule_records']) == 16, audit['creditable_schedule_records']
          assert len(audit['creditable_emergency_drill_records']) == 1, audit['creditable_emergency_drill_records']
          print('PHASE6_FROZEN_ACCEPTANCE_GATES_PASS')
          PY
      - name: Persist closeout accounting and append continuity handoff
        run: |
          cp phase6_closeout_audit_after.json research/governance/PHASE6_OBSERVATION_CLOSEOUT_2026-08-25.json
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Phase 6 live observation closeout — 2026-08-25'
          if marker not in text:
              text = text.rstrip() + '''\n\n## Phase 6 live observation closeout — 2026-08-25\n\n- Frozen Phase-6 live-observation thresholds were checked against live GitHub Actions evidence without replay/backfill: elapsed `15` days, `16` genuine schedule-origin decisions, and `1` separately evidenced zero-authority emergency drill.\n- Every credited schedule decision is attempt-1 schedule-origin and has an already-persisted create-only evidence artifact plus separate hash-bound receipt; missing expected dates `[]`, duplicate decision timestamps `[]`.\n- Observed critical reconciliation errors `0`, unexplained target drift `0`, schedule failures `0`; production/signature/order authority remains false.\n- Emergency drill run `32822137245` is `workflow_dispatch`-origin and is not scheduled-decision credit.\n- Closeout audit workflow run `32822011836`; audit artifact id `9553575209`, digest `sha256:2482e5f575b544ccc3168776d70b5ce0dfc3baef24dcf4de9fb7cb5caaf77096`.\n- Persisted closeout inventory: `research/governance/PHASE6_OBSERVATION_CLOSEOUT_2026-08-25.json`. Repository recording creates no evidence or credit and does not alter the frozen Phase-6 contract.\n- Phase 6 R1 evidence closeout = `PASS_FROZEN_LIVE_OBSERVATION_GATES`; this grants no production authority and does not authorize any paused/invalid historical research ID.\n- 0076 remains sealed at Stage7 pre-marker read-boundary incident with no replacement, retroactive marker, same-ID Stage8, rerun, retune, rescue or recompute. 0072/0073 Carry remain paused; 0083 remains immutable FAIL.\n- Next legal frontier: R2 public `CONTROLLED_RESEARCH_RUNNER_V1`, then prospective lifecycle-gate compression amendment only after runner qualification.\n'''
              path.write_text(text, encoding='utf-8')
          PY
          git rm .github/workflows/tmp-phase6-observation-closeout-audit.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md research/governance/PHASE6_OBSERVATION_CLOSEOUT_2026-08-25.json
          git commit -m 'governance: persist Phase6 live observation closeout'
          git push origin "HEAD:${GITHUB_HEAD_REF}"
