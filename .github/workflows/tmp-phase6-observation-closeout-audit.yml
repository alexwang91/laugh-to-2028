name: Temporary Phase6 observation closeout audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/governance/phase6_observation_closeout_audit.py'
      - '.github/workflows/tmp-phase6-observation-closeout-audit.yml'

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: github.head_ref == 'governance/phase6-observation-closeout-audit-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply redirect-safe and event-filtered audit transport in ephemeral checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/governance/phase6_observation_closeout_audit.py')
          text = path.read_text(encoding='utf-8')

          old_import = "import urllib.parse\nimport urllib.request\n"
          new_import = "import urllib.error\nimport urllib.parse\nimport urllib.request\n"
          assert text.count(old_import) == 1
          text = text.replace(old_import, new_import, 1)

          start = text.index('def _request_bytes(url: str, token: str) -> bytes:')
          end = text.index('\n\ndef _read_json_from_zip', start)
          new_request_bytes = '''def _request_bytes(url: str, token: str) -> bytes:\n    class NoRedirect(urllib.request.HTTPRedirectHandler):\n        def redirect_request(self, req, fp, code, msg, headers, newurl):\n            return None\n\n    request = urllib.request.Request(\n        url,\n        headers={\n            "Authorization": f"Bearer {token}",\n            "Accept": "application/vnd.github+json",\n            "X-GitHub-Api-Version": "2022-11-28",\n            "User-Agent": "phase6-observation-closeout-audit-v1",\n        },\n    )\n    opener = urllib.request.build_opener(NoRedirect())\n    try:\n        with opener.open(request, timeout=30) as response:\n            return response.read()\n    except urllib.error.HTTPError as exc:\n        if exc.code not in (301, 302, 303, 307, 308):\n            raise\n        location = exc.headers.get("Location")\n        if not location:\n            raise AuditError("artifact download redirect missing Location") from exc\n    redirected = urllib.request.Request(\n        location, headers={"User-Agent": "phase6-observation-closeout-audit-v1"}\n    )\n    with urllib.request.urlopen(redirected, timeout=60) as response:\n        return response.read()\n'''
          text = text[:start] + new_request_bytes + text[end:]

          start = text.index('def _list_runs(repo: str, token: str) -> list[dict[str, Any]]:')
          end = text.index('\n\ndef _artifacts', start)
          new_list_runs = '''def _list_runs(repo: str, token: str) -> list[dict[str, Any]]:\n    runs: list[dict[str, Any]] = []\n    first = _parse_iso(FIRST_ELIGIBLE_DECISION)\n    for event_name in ("schedule", "workflow_dispatch"):\n        page = 1\n        while True:\n            query = urllib.parse.urlencode({"event": event_name, "per_page": 100, "page": page})\n            payload = _request_json(\n                f"{API_ROOT}/repos/{repo}/actions/workflows/{WORKFLOW_FILE}/runs?{query}", token\n            )\n            rows = payload.get("workflow_runs", [])\n            if not isinstance(rows, list):\n                raise AuditError("workflow_runs must be a list")\n            if not rows:\n                break\n            stop = False\n            for row in rows:\n                if not isinstance(row, dict):\n                    continue\n                created = _parse_iso(str(row["created_at"]))\n                if created < first - timedelta(days=1):\n                    stop = True\n                    continue\n                runs.append(row)\n            if stop or len(rows) < 100:\n                break\n            page += 1\n            if page > 10:\n                raise AuditError(f"unexpected {event_name} workflow-run pagination >10 pages")\n    return runs\n'''
          text = text[:start] + new_list_runs + text[end:]
          path.write_text(text, encoding='utf-8')
          PY
      - name: Audit only already-persisted Phase6 evidence and receipts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m research.governance.phase6_observation_closeout_audit \
            --output phase6_closeout_audit.json
          python -m json.tool phase6_closeout_audit.json
      - name: Upload read-only audit result
        uses: actions/upload-artifact@v4
        with:
          name: phase6-observation-closeout-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_closeout_audit.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
