name: Temporary Stablecoin exact registry bind cleanup

on:
  push:
    branches:
      - research/stablecoin-liquidity-0001-run-interface

permissions:
  contents: write

jobs:
  clean-bind-once:
    if: contains(github.event.head_commit.message, '[STABLECOIN_CLEAN_BIND_RUN_INTERFACE_V1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/stablecoin-liquidity-0001-run-interface
          fetch-depth: 0
      - name: Restore main formatting and apply exact Stablecoin-only text patch
        run: |
          set -euo pipefail
          git checkout origin/main -- config/research_registry.json
          python - <<'PY'
          from pathlib import Path

          path = Path('config/research_registry.json')
          text = path.read_text(encoding='utf-8')
          start = text.index('      "research_id": "STABLECOIN-LIQUIDITY-0001"')
          end = text.index('  ],\n  "research_governance_debt":', start)
          before = text[:start]
          block = text[start:end]
          after = text[end:]

          old = '      "validation_dataset_refs": [],'
          new = '      "validation_dataset_refs": ["STABLECOIN-LIQUIDITY-0001-DEFILLAMA-HIST-V1"],'
          if block.count(old) != 1:
              raise SystemExit(f'unexpected validation_dataset_refs occurrences: {block.count(old)}')
          block = block.replace(old, new, 1)

          old = '        "validation_exposure_event_refs": [],'
          new = '        "validation_exposure_event_refs": ["STABLECOIN-LIQUIDITY-0001-RAW-DATA-20260808T141719Z"],'
          if block.count(old) != 1:
              raise SystemExit(f'unexpected validation_exposure_event_refs occurrences: {block.count(old)}')
          block = block.replace(old, new, 1)

          old_notes = '''      "notes": [
        "No formal research path exists yet; this registry commit must precede path creation to preserve prospective provenance.",
        "Dataset refs intentionally remain empty until exact source, fields, coverage window, transformations and PIT publication semantics can be frozen truthfully before full historical retrieval.",
        "DefiLlama is a source candidate from the pre-run source audit, not yet a bound dataset source in this registry record.",
        "Historical third-party data without verifiable publication timestamps must be labeled reconstructed/researcher-exposed history, never pristine PIT or temporally unseen evidence.",
        "Forward snapshots collected only after a frozen data contract may later qualify as TEMPORALLY_UNSEEN if their raw vintages are immutable and retrieval/hash provenance is preserved.",
        "ONCHAIN-HOLDER-COST-0001 remains backlog and is not registered, run or evaluated by this change."
      ]'''
          new_notes = '''      "notes": [
        "Formal research path, frozen Data Contract, first-capture provenance and Stage-1 Run Interface now exist prospectively under the registered governed prefix.",
        "Validation dataset STABLECOIN-LIQUIDITY-0001-DEFILLAMA-HIST-V1 is reconstructed RESEARCHER_EXPOSED_HISTORY and was exposed as RAW_DATA before Stage-1; it is not sealed or temporally unseen.",
        "The exact Stage-1 baseline/augmented design, PIT alignment, label, walk-forward purge, normalization, Ridge alpha=1.0, HAC lag=19, release policy and one-shot execution lock are frozen in research/stablecoin_liquidity_0001/RUN_INTERFACE.json before any real Stage-1 model evaluation.",
        "No Stage-1 feature computation, model fit, OOS prediction or research result has occurred at this binding state.",
        "ONCHAIN-HOLDER-COST-0001 remains backlog and is not registered, run or evaluated by this change."
      ]'''
          if block.count(old_notes) != 1:
              raise SystemExit('unexpected Stablecoin notes block')
          block = block.replace(old_notes, new_notes, 1)

          # Guard result-bearing fields before writing.
          required = [
              '      "actual_variants_evaluated": 0,',
              '      "result_status": "PREREGISTERED_NOT_RUN",',
              '      "promotion_state": "NONE",',
              '      "evidence_refs": [],',
              '      "production_authorized": false,'
          ]
          for needle in required:
              if needle not in block:
                  raise SystemExit(f'missing pre-result invariant: {needle}')
          path.write_text(before + block + after, encoding='utf-8')
          PY
      - name: Verify no semantic collateral outside Stablecoin block
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base = json.loads(subprocess.check_output(['git','show','origin/main:config/research_registry.json'], text=True))
          head = json.loads(Path('config/research_registry.json').read_text())
          b = {r['research_id']: r for r in base['records']}
          h = {r['research_id']: r for r in head['records']}
          assert b.keys() == h.keys()
          for rid in b:
              if rid != 'STABLECOIN-LIQUIDITY-0001':
                  assert b[rid] == h[rid], rid
          rb=h['STABLECOIN-LIQUIDITY-0001']
          assert rb['validation_dataset_refs']==['STABLECOIN-LIQUIDITY-0001-DEFILLAMA-HIST-V1']
          assert rb['research_process_complexity']['validation_exposure_event_refs']==['STABLECOIN-LIQUIDITY-0001-RAW-DATA-20260808T141719Z']
          assert rb['result_status']=='PREREGISTERED_NOT_RUN'
          assert rb['actual_variants_evaluated']==0
          assert rb['evidence_refs']==[]
          assert base['research_governance_debt']==head['research_governance_debt']
          PY
      - name: Remove temporary workflow and commit minimal patch
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-stablecoin-run-interface-bind-clean.yml
          git add config/research_registry.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Research [DRIFT_0]: minimize Stablecoin run-interface registry binding'
          git push origin HEAD:research/stablecoin-liquidity-0001-run-interface
