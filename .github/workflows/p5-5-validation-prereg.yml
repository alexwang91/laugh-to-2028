name: P5.5 validation preregistration

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_5_validation_contract*.json"
      - "execution/plan-b-bot/tests/test_p5_5_validation_prereg.py"
      - ".github/workflows/p5-5-validation-prereg.yml"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_5_validation_contract*.json"
      - "execution/plan-b-bot/tests/test_p5_5_validation_prereg.py"
      - ".github/workflows/p5-5-validation-prereg.yml"

permissions:
  contents: read

jobs:
  prereg:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Validate immutable upstream dependencies
        run: |
          set -euo pipefail
          python research/cycle_exit/validate_p5_3_v2_state_path_result.py
          test "$(cat research/results/p5_3_v2_market_state/summary.sha256)" = "05d5d68a59c8b13f1122d98ed75d03934defdc9d73c7dd92e038c92fd97d2e52"
          test "$(git hash-object research/cycle_exit/p5_4_behavior_mapping_contract.json)" = "595a8488616ac8d333335cf2bc9cc509d808d7e8"
          test "$(git hash-object research/cycle_exit/p5_4_behavior_mapping.py)" = "a6842ddb572f7af7da928a7a8a0c6f1582ef7c56"
          test ! -e research/results/p5_5_joint_validation/summary.json
      - name: Validate frozen P5.5 contract
        run: pytest -q execution/plan-b-bot/tests/test_p5_5_validation_prereg.py
