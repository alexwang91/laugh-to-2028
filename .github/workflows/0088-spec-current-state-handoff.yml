name: 0088 spec current-state handoff

on:
  push:
    branches:
      - research/0088-factor-ls-spec-freeze-v1

permissions:
  contents: write

jobs:
  append-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0088-factor-ls-spec-freeze-v1
          fetch-depth: 0
      - name: Append truthful 0088 SPEC handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text()
          heading = '## 0088 Factor L/S SPEC_FREEZE — 2026-08-26'
          if heading not in text:
              addition = '''\n\n## 0088 Factor L/S SPEC_FREEZE — 2026-08-26\n\n- `BRRK-FACTOR-LS-0088` is a new separately governed Factor L/S research ID unlocked only by immutable 0086 `PASS_VALIDATED_FACTOR_ATLAS`. It is not a 0076 replacement, retry, continuation, rescue, or recomputation and inherits zero 0076 lifecycle/attempt credit.\n- Central `config/research_registry.json` owner registration preceded creation of `research/brrk_factor_ls_0088/`.\n- SPEC freezes all three immutable 0086 passing directions with no reselection or sign change: `MOM60_RAW=-1`, `RVOL20_RAW=-1`, `LIQ30_RAW=+1`. Exactly one equal-weight signed-rank composite and one top/bottom-tercile weekly L/S construction are admissible.\n- The portfolio uses PIT Binance USD-M USDT perpetual top-30 liquidity membership, Monday UTC-close decisions, FWD5 holding, long gross +1/short gross -1, explicit turnover, source-native funding-rate attribution, C0/C1/C2 costs, beta/capacity/concentration gates, 8-week MBB inference and frozen G0-G9 adjudication.\n- Controlled attempt remains `0/1`; controlled reads remain `0`; scientific engine remains `0/1`; scientific values remain unexposed. BUILD may use synthetic/nonhistorical fixtures only. ARM is metadata/schema/identity-only. Any RUN requires separate irreversible user authorization and `ControlledResearchRunnerV1SourceQualified`.\n- 0086 remains immutable PASS and cannot be rerun or reinterpreted. 0085 remains immutable INVALID_EXECUTION. 0076 remains sealed; 0072/0073 remain paused; 0083 remains immutable FAIL; 0087 remains source-metadata blocked. Phase6 closeout and common-runner qualification remain unchanged.\n- `workflow run                         31381953131 / attempt 1`, CAPTURE-0001 sealed/no-retry and CAPTURE-0002 permanently claimed/no-refetch remain immutable. Production/signature/order/withdrawal/transfer authority remains false.\n'''
              p.write_text(text.rstrip() + addition + '\n')
          PY
      - name: Remove handoff workflow and commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0088-spec-current-state-handoff.yml
          git add docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "docs(0088): record Factor L/S SPEC handoff"
          git push origin HEAD:research/0088-factor-ls-spec-freeze-v1
