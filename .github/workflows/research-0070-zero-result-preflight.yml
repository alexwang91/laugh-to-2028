name: 0070 zero-result preflight

on:
  push:
    branches:
      - main
    paths:
      - "research/brrk_sol_long_sideways_early_warning_episode_robustness_0070/RUN_INTERFACE.json"
      - "research/brrk_sol_long_sideways_early_warning_episode_robustness_0070/CONTROLLED_EXECUTION_BOUNDARY.json"
      - "research/brrk_sol_long_sideways_early_warning_episode_robustness_0070/run_once.py"

permissions:
  contents: read

concurrency:
  group: research-0070-zero-result-preflight
  cancel-in-progress: false

jobs:
  zero-result-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Exact merged-boundary zero-result preflight
        env:
          PYTHONHASHSEED: "0"
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python -m research.brrk_sol_long_sideways_early_warning_episode_robustness_0070.run_once \
            preflight --boundary-sha "${GITHUB_SHA}" | tee /tmp/0070-preflight.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('/tmp/0070-preflight.json').read_text())
          assert p['status'] == 'PREFLIGHT_PASS_ZERO_RESULT_GIT_IDENTITY_ONLY'
          assert p['historical_or_0069_content_reads'] == 0
          assert p['market_payload_reads'] == 0
          assert p['market_loader_calls'] == 0
          assert p['frozen_prediction_reconstruction_calls'] == 0
          assert p['network_fetches'] == 0
          assert p['controlled_attempt_consumed'] == 0
          assert p['runtime_artifacts_present'] == []
          assert p['production_authorized'] is False
          assert p['signature_authorized'] is False
          assert p['order_submission_authorized'] is False
          PY
