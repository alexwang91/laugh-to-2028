name: 0073 Stage4 handoff repair

on:
  push:
    branches:
      - research/0073-stage4-implementation-v1
    paths:
      - .github/workflows/0073-stage4-handoff-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0073-stage4-implementation-v1
          fetch-depth: 0
      - name: Repair CURRENT_STATE and self-delete
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          old = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is in progress on PR #354 / `research/0073-stage3-preregistration-v1`. Formal completion remains 2/10 until Stage 3 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0. Require all standing CI SUCCESS on the exact Stage-3 head and expected-head merge. Only after Stage 3 merges may a separate Stage 4 IMPLEMENTATION branch encode the prospectively frozen contract. No controlled scientific/history payload read is legal in Stage 3 or Stage 4."
          new = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is in progress on PR #355 / `research/0073-stage4-implementation-v1`. Formal completion remains 3/10 until Stage 4 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0. Require all standing CI SUCCESS on the exact Stage-4 head and expected-head merge. Only after Stage 4 merges may a separate Stage 5 NONHISTORICAL QUALIFICATION branch run synthetic fixtures only. No controlled scientific/history payload read is legal in Stage 4 or Stage 5."
          if old not in s:
              raise SystemExit('exact next-step block not found; fail closed')
          s = s.replace(old, new, 1)
          old2 = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION IN PROGRESS / FORMAL COMPLETION 2/10 UNTIL STAGE-3 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new2 = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION IN PROGRESS / FORMAL COMPLETION 3/10 UNTIL STAGE-4 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          if old2 not in s:
              raise SystemExit('0073 no-drift line not found; fail closed')
          s = s.replace(old2, new2, 1)
          anchor = 'workflow run                         31381953131 / attempt 1'
          if s.count(anchor) != 1:
              raise SystemExit('immutable historical anchor missing/duplicated; fail closed')
          p.write_text(s)
          Path('.github/workflows/0073-stage4-handoff-repair.yml').unlink()
      - name: Commit repaired handoff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0073-stage4-handoff-repair.yml
          git commit -m "governance(0073): repair Stage4 CURRENT_STATE handoff"
          git push origin HEAD:research/0073-stage4-implementation-v1