name: 0088 build current-state handoff

on:
  push:
    branches:
      - research/0088-factor-ls-build-v1

permissions:
  contents: write

jobs:
  append-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0088-factor-ls-build-v1
          fetch-depth: 0
      - name: Append truthful 0088 BUILD handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text()
          heading = '## 0088 Factor L/S BUILD — 2026-08-26'
          if heading not in text:
              addition = "\n\n## 0088 Factor L/S BUILD — 2026-08-26\n\n- SPEC_FREEZE and the prospective invalid-week transition clarification are merged.\n- Synthetic/nonhistorical BUILD implements the frozen portfolio transition state machine, exact turnover, funding accounting, C0/C1/C2 costs, beta/capacity/concentration diagnostics, 8-week moving-block bootstrap with 10,000 replicates and seed `880088`, G0-G9, and PASS/FAIL/INCONCLUSIVE classifications.\n- Unsupported Mondays create no observation, remove the immediately preceding observation when its terminal transition cannot be truthfully accounted, reset state to zero, and force full-entry turnover at the next admissible Monday. Support admission is return-blind.\n- Controlled attempt remains `0/1`; controlled reads remain `0`; scientific engine remains `0/1`; controlled values remain unexposed.\n- Next gate is ARM. ARM must bind exact controlled price/funding identities, declared hashes/sizes, schema/timestamps, read budget, marker/result paths, source-qualified runner interface, and engine budget before any RUN authorization.\n- 0086 remains immutable `PASS_VALIDATED_FACTOR_ATLAS`; 0085 remains immutable `INVALID_EXECUTION`; 0076 remains sealed; 0072/0073 remain paused; 0083 remains immutable FAIL; 0087 remains source-metadata blocked. Phase6 closeout and common-runner qualification remain unchanged.\n- `workflow run                         31381953131 / attempt 1`, CAPTURE-0001 sealed/no-retry, and CAPTURE-0002 permanently claimed/no-refetch remain immutable. Production/signature/order/withdrawal/transfer authority remains false.\n"
              p.write_text(text.rstrip() + addition)
          PY
      - name: Remove handoff workflow and commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0088-build-current-state-handoff.yml
          git add docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "docs(0088): record Factor L/S BUILD handoff"
          git push origin HEAD:research/0088-factor-ls-build-v1
