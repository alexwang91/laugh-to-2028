name: Temporary 0056 formal-path rebuild

on:
  push:
    branches:
      - research/0056-simple-beta-router-prereg

permissions:
  contents: write

jobs:
  rebuild-formal-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0056-simple-beta-router-prereg
          fetch-depth: 0
      - name: Restore frozen prereg files after owner registration
        shell: bash
        run: |
          set -euo pipefail
          test ! -e research/brrk_simple_eth_sol_beta_router_0056
          python - <<'PY'
          import json
          from pathlib import Path
          rid = 'BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056'
          registry = json.loads(Path('config/research_registry.json').read_text())
          matches = [r for r in registry['records'] if r.get('research_id') == rid]
          assert len(matches) == 1
          assert matches[0]['governed_path_prefixes'] == ['research/brrk_simple_eth_sol_beta_router_0056/']
          assert matches[0]['result_status'] == 'PREREGISTERED_NOT_RUN'
          assert matches[0]['actual_variants_evaluated'] == 0
          PY
          git fetch origin research/0056-simple-beta-router-prereg-rebuild-source
          mkdir -p research/brrk_simple_eth_sol_beta_router_0056
          for f in DATASET_DECLARATION.json PREREGISTRATION.json README.md; do
            git show origin/research/0056-simple-beta-router-prereg-rebuild-source:research/brrk_simple_eth_sol_beta_router_0056/$f > research/brrk_simple_eth_sol_beta_router_0056/$f
          done
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/brrk_simple_eth_sol_beta_router_0056')
          pr = json.loads((p/'PREREGISTRATION.json').read_text())
          ds = json.loads((p/'DATASET_DECLARATION.json').read_text())
          assert pr['research_id'] == 'BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056'
          assert pr['result_status'] == 'PREREGISTERED_NOT_RUN'
          assert pr['actual_variants_evaluated'] == 0
          assert pr['variant_budget']['declared_variant_budget'] == 1
          assert pr['data_contract']['payload_sha256'] == 'd1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193'
          assert ds['research_id'] == pr['research_id']
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_simple_eth_sol_beta_router_0056
          git rm .github/workflows/_temp_0056_rebuild_formal_path.yml
          git commit -m 'Research prereg [DRIFT_0]: freeze 0056 numerical contract after owner registration'
          git push origin HEAD:research/0056-simple-beta-router-prereg
