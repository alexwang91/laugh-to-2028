name: 0084 post-closeout CURRENT_STATE sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/0084-post-closeout-current-state-sync.yml'
      - 'docs/CURRENT_STATE.md'

permissions:
  contents: write

jobs:
  sync-state:
    if: github.head_ref == 'governance/0084-post-closeout-state-sync-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/0084-post-closeout-state-sync-v1
      - name: Apply exact post-closeout handoff replacement
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert text.count(anchor) == 1, f'immutable anchor count must remain exactly one, got {text.count(anchor)}'

          old_next = '''0074 remains immutable `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN`. Governance resolution #381 merged at `f50618f233aef5e8e9872695ab87b67ab294a3a4`; 0075 is permanently stopped at `7/10 BLOCKED_PRE_ATTEMPT_FROZEN_IMPLEMENTATION_INCOMPLETE`, attempt `0/1` unconsumed, reads `0`, engine `0/1`, Stage8 network `0`, values exposed `false`, no marker/result, and #379 is closed unmerged. Guarded 0084 OWNER-FIRST writer tooling merged at `896e307b83e5fa96553286b7752042b0e418cb22`; replacement 0084 Stage1 OWNER-FIRST merged at `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d`; Stage2 DESIGN merged at `075d8b5b7de97836350314d517ad483d5de67219`; Stage3 PREREGISTRATION merged at `046e34b020a4f628967fb942947b06ca30c7289c`; Stage4 IMPLEMENTATION merged at `3574c33a199580637efa74b230564c7eb23d5725`; Stage5 NONHISTORICAL QUALIFICATION merged at `61b7e3a45c82604520ea9f76c6878a2707481fc2`; Stage6 CONTROLLED-EXECUTION BOUNDARY merged at `3e22ee336f82e14a8eea63d1d9afb07085699d07`; Stage7 ZERO-RESULT PREFLIGHT merged at `641ccf6bcd358c0255f65546bfcde1c06e861b51` with `PREFLIGHT_PASS_ZERO_RESULT`; Stage8 authorization gate merged at `d449475350a38df75c3a08bffc626beeff0ebc9d`; Stage8 controlled-attempt incident is merged at `eab63e048b051e96a03426ddc095f5c2a07d6a9f`; Stage9 RESULT is merged at `7775079deb51b6e6a522ee83e9c171a9c0adf998`; terminal interpretation remains `INVALID_EXECUTION / POST_MARKER_FROZEN_EXECUTION_INTERFACE_INCOMPLETE`. Stage10 CLOSEOUT is active on `research/0084-stage10-closeout-v1`; formal completion is `9/10` until Stage10 merges. Attempt `1/1` is permanently consumed; controlled scientific-history reads are `0`; scientific engine is `0/1`; Stage8 scientific source-network fetches are `0`; scientific values exposed are `false`; no admissible scientific result bundle or `RUN_ONCE.marker` exists. Stage10 may only seal this state; no reread, recompute, repair, rerun, retune, rescue, second marker, or second attempt is legal.'''
          new_next = '''0074 remains immutable `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN`. Governance resolution #381 merged at `f50618f233aef5e8e9872695ab87b67ab294a3a4`; 0075 is permanently stopped at `7/10 BLOCKED_PRE_ATTEMPT_FROZEN_IMPLEMENTATION_INCOMPLETE`, attempt `0/1` unconsumed, reads `0`, engine `0/1`, Stage8 network `0`, values exposed `false`, no marker/result, and #379 is closed unmerged. Guarded 0084 OWNER-FIRST writer tooling merged at `896e307b83e5fa96553286b7752042b0e418cb22`; replacement 0084 Stage1 OWNER-FIRST merged at `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d`; Stage2 DESIGN merged at `075d8b5b7de97836350314d517ad483d5de67219`; Stage3 PREREGISTRATION merged at `046e34b020a4f628967fb942947b06ca30c7289c`; Stage4 IMPLEMENTATION merged at `3574c33a199580637efa74b230564c7eb23d5725`; Stage5 NONHISTORICAL QUALIFICATION merged at `61b7e3a45c82604520ea9f76c6878a2707481fc2`; Stage6 CONTROLLED-EXECUTION BOUNDARY merged at `3e22ee336f82e14a8eea63d1d9afb07085699d07`; Stage7 ZERO-RESULT PREFLIGHT merged at `641ccf6bcd358c0255f65546bfcde1c06e861b51` with `PREFLIGHT_PASS_ZERO_RESULT`; Stage8 authorization gate merged at `d449475350a38df75c3a08bffc626beeff0ebc9d`; Stage8 controlled-attempt incident is merged at `eab63e048b051e96a03426ddc095f5c2a07d6a9f`; Stage9 RESULT is merged at `7775079deb51b6e6a522ee83e9c171a9c0adf998`; Stage10 CLOSEOUT merged at `4304456742c5bccea10433457e10fa3bb0e0af1e`. 0084 is immutable `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN`, reason `POST_MARKER_FROZEN_EXECUTION_INTERFACE_INCOMPLETE`; attempt `1/1` permanently consumed; controlled scientific-history reads `0`; scientific engine `0/1`; Stage8 scientific source-network fetches `0`; scientific values exposed `false`; no admissible scientific result bundle and no `RUN_ONCE.marker`. Current merged governance requires an `0084 PASS immutable closeout` before 0076 may launch, so 0076 remains blocked. Do not reinterpret 0084 or start 0076 without a separate prospective merged governance amendment.'''

          old_line = '0084 = AUTHORIZED 0075 REPLACEMENT BY GOVERNANCE MERGE `f50618f233aef5e8e9872695ab87b67ab294a3a4` / GUARDED OWNER-FIRST WRITER TOOLING MERGED AT `896e307b83e5fa96553286b7752042b0e418cb22` / OWNER-FIRST STAGE1 MERGED AT `a0b4c6b4943850e29ad5392d33be7ab1fb86c65d` / STAGE2 DESIGN MERGED AT `075d8b5b7de97836350314d517ad483d5de67219` / STAGE3 PREREGISTRATION MERGED AT `046e34b020a4f628967fb942947b06ca30c7289c` / STAGE4 IMPLEMENTATION MERGED AT `3574c33a199580637efa74b230564c7eb23d5725` / STAGE5 NONHISTORICAL QUALIFICATION MERGED AT `61b7e3a45c82604520ea9f76c6878a2707481fc2` / STAGE6 CONTROLLED-EXECUTION BOUNDARY MERGED AT `3e22ee336f82e14a8eea63d1d9afb07085699d07` / STAGE7 ZERO-RESULT PREFLIGHT MERGED AT `641ccf6bcd358c0255f65546bfcde1c06e861b51` / `PREFLIGHT_PASS_ZERO_RESULT` / STAGE8 AUTHORIZATION GATE MERGED AT `d449475350a38df75c3a08bffc626beeff0ebc9d` / STAGE8 CONTROLLED-ATTEMPT INCIDENT MERGED AT `eab63e048b051e96a03426ddc095f5c2a07d6a9f` / STAGE9 RESULT MERGED AT `7775079deb51b6e6a522ee83e9c171a9c0adf998` / STAGE10 CLOSEOUT IN PROGRESS ON `research/0084-stage10-closeout-v1` / TERMINAL INTERPRETATION `INVALID_EXECUTION / POST_MARKER_FROZEN_EXECUTION_INTERFACE_INCOMPLETE` / FORMAL COMPLETION 9/10 UNTIL STAGE10 MERGE / FULL TEN-STAGE LIFECYCLE REQUIRED / NO INHERITED RESULT OR STAGE CREDIT / ATTEMPT 1/1 CONSUMED / READS 0 / ENGINE 0/1 / NETWORK 0 / SCIENTIFIC VALUES EXPOSED FALSE / NO ADMISSIBLE SCIENTIFIC RESULT / NO RUN_ONCE.marker / NO SECOND MARKER-RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          new_line = '0084 = 10/10 COMPLETE / `INVALID_EXECUTION / POST_MARKER_FROZEN_EXECUTION_INTERFACE_INCOMPLETE` / CLOSED TO SAME-ID RERUN / STAGE10 IMMUTABLE CLOSEOUT MERGED AT `4304456742c5bccea10433457e10fa3bb0e0af1e` / GOVERNANCE REPLACEMENT AUTHORITY `f50618f233aef5e8e9872695ab87b67ab294a3a4` / ATTEMPT 1/1 CONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0/1 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / SCIENTIFIC VALUES EXPOSED FALSE / NO ADMISSIBLE SCIENTIFIC RESULT / NO RUN_ONCE.marker / NO SECOND MARKER-RERUN-RETUNE-RESCUE-RECOMPUTE / 0076 PASS PREREQUISITE UNSATISFIED / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'

          assert text.count(old_next) == 1, f'expected exactly one stale Stage10 next-step paragraph, got {text.count(old_next)}'
          assert text.count(old_line) == 1, f'expected exactly one stale Stage10 authority line, got {text.count(old_line)}'
          text = text.replace(old_next, new_next)
          text = text.replace(old_line, new_line)
          assert text.count(anchor) == 1
          assert old_next not in text
          assert old_line not in text
          p.write_text(text)
      - name: Commit state sync if changed
        shell: bash
        run: |
          if git diff --quiet -- docs/CURRENT_STATE.md; then
            echo 'CURRENT_STATE_ALREADY_POST_CLOSEOUT'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          git commit -m 'governance(0084): sync immutable post-closeout state'
          git push origin HEAD:governance/0084-post-closeout-state-sync-v1
