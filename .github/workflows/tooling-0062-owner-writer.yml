name: Tooling 0063 prereg writer fixed artifact v2

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write
  actions: read

jobs:
  apply-prereg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean formal prereg v2 branch
        uses: actions/checkout@v4
        with:
          ref: research/0063-prereg-v2
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned governance runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Download exact validated prereg artifact
        uses: actions/download-artifact@v4
        with:
          name: 0063-prereg-package-v2
          path: /tmp/0063-prereg-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: alexwang91/laugh-to-2028
          run-id: 31758022864
      - name: Verify and apply prereg package atomically
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "aeff95faa60f5e7f5c209c143a329e7e45545286"
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/0063-prereg-artifact/BUILD_REPORT.json').read_text())
          assert r['research_id']=='BRRK-IDLE-CASH-SWEEP-ROBUSTNESS-0063'
          assert r['owner_first_commit_sha']=='aeff95faa60f5e7f5c209c143a329e7e45545286'
          assert r['dtb3_raw_sha256']=='4d8aee67dbd528ce38ff8482e9bb02dd5ccf2c6cd461f606fe90007151ab6879'
          assert r['candidate_economics_computed'] is False
          assert r['baseline_equity_read'] is False
          assert r['baseline_weights_read'] is False
          assert r['historical_variants_evaluated']==0
          assert r['run_attempt_marker_absent'] is True
          assert r['governance_validate']=='PASS'
          assert r['future_enforcement']=='PASS'
          PY
          test "$(sha256sum /tmp/0063-prereg-artifact/package/research/brrk_idle_cash_sweep_robustness_0063/DTB3_RAW.csv | awk '{print $1}')" = "4d8aee67dbd528ce38ff8482e9bb02dd5ccf2c6cd461f606fe90007151ab6879"
          cp -a /tmp/0063-prereg-artifact/package/. .
          python -m research.governance.validate
          python -m research.governance.enforce_future --base aeff95faa60f5e7f5c209c143a329e7e45545286
          test ! -e research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker
          test ! -e research/brrk_idle_cash_sweep_robustness_0063/PRIMARY_RESULT.json
          cat >/tmp/expected <<'EOF'
          config/dataset_exposure_registry.json
          docs/CURRENT_STATE.md
          research/brrk_idle_cash_sweep_robustness_0063/CAPTURE_REPORT.json
          research/brrk_idle_cash_sweep_robustness_0063/DATASET_DECLARATION.json
          research/brrk_idle_cash_sweep_robustness_0063/DTB3_RAW.csv
          research/brrk_idle_cash_sweep_robustness_0063/PREREGISTRATION.json
          EOF
          sed -i 's/^          //' /tmp/expected
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort >/tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort >/tmp/staged
          diff -u <(sort /tmp/expected) /tmp/staged
          git commit -m 'research: freeze 0063 numerical and data preregistration'
          test "$(git rev-parse HEAD^)" = "aeff95faa60f5e7f5c209c143a329e7e45545286"
          git push origin HEAD:research/0063-prereg-v2
