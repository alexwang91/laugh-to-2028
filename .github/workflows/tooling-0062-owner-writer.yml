name: Tooling 0066 implementation handoff patch

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0066-implementation-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update implementation-only CURRENT_STATE
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f642240c6c5162dfd8274745b8449490966849b7"
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          old="0066 = `PREREGISTERED / IMPLEMENTATION ABSENT / NOT RUN`."
          new="0066 = `IMPLEMENTED / NOT RUN / CONTROLLED BOUNDARY ABSENT`."
          assert s.count(old)==1
          s=s.replace(old,new)
          anchor="Historical actual variants evaluated = 0 / 1704.\n"
          insert=(
              "Historical actual variants evaluated = 0 / 1704.\n"
              "Implementation-only engine/event/model modules are present on the implementation branch.\n"
              "Runtime observability commit = `f642240c6c5162dfd8274745b8449490966849b7`; it adds phase/progress logging and suppresses only the sklearn penalty-deprecation FutureWarning without changing any frozen model parameter or mathematical path.\n"
              "Bounded artificial implementation validation run = `31801841347`; synthetic unit tests, full 1632/64/8 configuration enumeration audit, zero-result assertions and clean-worktree assertions all passed.\n"
              "The cancelled full-artificial tooling run `31792978620` was implementation-only synthetic validation, not a historical execution attempt, and created no runtime result marker.\n"
          )
          assert s.count(anchor)==1
          s=s.replace(anchor,insert)
          oldnext="Merge 0066 numerical/data PREREGISTRATION after fresh standing CI. Only then begin IMPLEMENTATION-ONLY using synthetic/artificial data; do not read 0066 historical outcomes or compute event counts, indicator associations, classifier metrics or portfolio economics during implementation."
          newnext="Open and merge the 0066 IMPLEMENTATION-ONLY PR after fresh standing CI. Then freeze and merge a CONTROLLED-EXECUTION BOUNDARY with exact implementation blobs. Do not create RUN_ATTEMPT.marker or read historical 0066 outcomes before that boundary is merged."
          assert s.count(oldnext)==1
          s=s.replace(oldnext,newnext)
          p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/CURRENT_STATE.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m 'docs: hand off repaired 0066 implementation state'
          git push origin HEAD:research/0066-implementation-v1
