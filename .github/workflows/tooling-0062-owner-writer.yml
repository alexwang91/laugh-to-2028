name: Tooling 0066 owner-first preregistration

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write

jobs:
  owner-first:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0066-prereg-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Add only 0066 owner record before prereg files
        shell: bash
        env:
          DESIGN_MERGE: b42f1d9dcc0574f185e04aad3bc8eca61fd2531d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DESIGN_MERGE"
          cp config/research_registry.json /tmp/research_registry.before.json
          python - <<'PY'
          import copy,json,hashlib
          from pathlib import Path
          p=Path('config/research_registry.json')
          reg=json.loads(p.read_text())
          rid='BRRK-BTC-SOL-PATH-EVENT-EARLY-WARNING-0066'
          assert not any(x.get('research_id')==rid for x in reg['records'])
          template=next(x for x in reg['records'] if x.get('research_id')=='BRRK-MULTI-ARCHITECTURE-GROSS-CONTROLLER-0065')
          r=copy.deepcopy(template)
          for k in ['evidence_scorecard','confidence_level','confidence_components','derived_confidence']:
              r.pop(k,None)
          r.update({
            'research_id':rid,
            'research_family_id':'BRRK_PATH_EVENT_EARLY_WARNING',
            'research_domain':'RISK_CONTROL',
            'research_governance_version':1,
            'governance_mode':'PROGRAM_GOVERNED_V1',
            'objective_type':'PORTFOLIO_INTEGRATION',
            'created_at':'2026-08-14',
            'created_before_result':True,
            'question':'Can price-only BTC/SOL decline and sideways episode onsets be predicted within 1/3/5/10/20 sessions by the frozen 0062 indicator atlas, and can validation-frozen warnings improve the closed 0064 net portfolio economics?',
            'hypothesis':'Some duration-graded price-path events have prospectively detectable precursor structure in the frozen 0062 signal universe, but any economic benefit must survive temporal recurrence, dependence-aware inference and transaction costs.',
            'hypothesis_origin':'USER_PROPOSED_EVENT_FIRST_RESEARCH_IDEA_2026_08_14_PLUS_PROSPECTIVE_METHOD_DESIGN; P05 quadratic architecture explicitly RESULT_INFORMED by closed 0065 but not privileged.',
            'economic_mechanism':'If measurable precursor states precede sustained declines or capital-inefficient sideways regimes, a causal outer gross controller may preserve risk-asset exposure in normal periods while selectively increasing cash before adverse event onset.',
            'primary_target':'BTC_SOL_PRICE_PATH_EVENT_ONSET_WITHIN_1_3_5_10_20_SESSIONS_AND_0064_RELATIVE_NET_WEALTH',
            'primary_metric':'PR_AUC_LIFT_WITH_SIMULTANEOUS_LCB_AND_NET_CALENDAR_CAGR_VS_0064',
            'secondary_metrics':['ROC_AUC','Brier_score','temporal_block_recurrence','terminal_wealth','maximum_drawdown','outer_turnover','PBO_CSCV'],
            'feature_families':['0062_TIER_A_185_CELLS','0062_17_FAMILY_SCORES'],
            'horizon':[1,3,5,10,20],
            'universe':['BTC','SOL'],
            'development_dataset_refs':['BRRK-LEADERSHIP-ROTATION-0048-EXPOSED-HIST-V1','research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json'],
            'validation_dataset_refs':['SAME_FROZEN_RESEARCHER_EXPOSED_DEVELOPMENT_HISTORY_CAUSAL_WALK_FORWARD'],
            'sealed_dataset_refs':[],
            'declared_variant_budget':1704,
            'actual_variants_evaluated':0,
            'parameter_candidate_count':1632,
            'stopping_rule':'Exactly one frozen historical execution after DESIGN, owner-first preregistration, implementation-only merge and controlled-boundary merge. No result-informed early stopping, pruning, rerun, retune or rescue.',
            'success_criteria':'At least one supported predictive track passes G0-G5 and at least one economic controller passes E0-E5 for full PASS; predictive-only pass is separately classified if economics fail.',
            'failure_criteria':'No supported predictive track passes the frozen early-warning gates, or predictive evidence exists but no controller passes the frozen economic gates.',
            'allowed_followup':'After immutable closeout, only a new research ID may use exposed 0066 findings as RESULT_INFORMED motivation; genuinely future validation is preferred.',
            'forbidden_followup':'Same-ID event threshold changes, onset relabeling, signal pruning, warning-horizon changes, model/grid changes, controller remapping, cost changes, rerun, retune or rescue after attempt consumption.',
            'researcher_decisions':['Event taxonomy is price-only and independent of indicator values.','All 202 signal units are evaluated in the atlas; selection into predictive controllers is validation-only under frozen rules.','P05 quadratic classifier is included without privilege and is explicitly result-informed from closed 0065.'],
            'lineage_edges':[],
            'result_status':'PREREGISTERED_NOT_RUN',
            'failure_reason':None,
            'promotion_state':'NONE',
            'evidence_refs':[],
            'decision_refs':['research/governance/BRRK_BTC_SOL_PATH_EVENT_EARLY_WARNING_0066_DESIGN_FREEZE_2026-08-14.md'],
            'production_relevance':'Research-only BTC-to-cash outer gross study; no automatic production authority.',
            'production_authorized':False,
            'provenance_status':'PROSPECTIVE_FROZEN',
            'governed_path_prefixes':['research/brrk_btc_sol_path_event_early_warning_0066'],
            'notes':['Owner-first registration only; no 0066 historical event atlas, model metric or portfolio result exists.','Indicator-atlas hypothesis cells are counted separately from the declared 1704 model/controller variant budget.','production_authorized=false; signature_authorized=false; order_submission_authorized=false.']
          })
          rpc=r.get('research_process_complexity',{})
          rpc.update({
            'declared_parameter_candidates':1632,
            'actual_parameter_candidates_evaluated':0,
            'universes_evaluated':2,
            'horizons_evaluated':5,
            'rebalance_variants':8,
            'feature_representations':8,
            'special_cases_introduced':0,
            'validation_exposure_event_refs':0,
            'related_family_trials':1704
          })
          r['research_process_complexity']=rpc
          reg['records'].append(r)
          p.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          before=json.load(open('/tmp/research_registry.before.json'))
          def canon(x): return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          assert len(reg['records'])==len(before['records'])+1
          assert all(canon(a)==canon(b) for a,b in zip(before['records'],reg['records'][:-1]))
          assert reg['records'][-1]['research_id']==rid
          assert reg['records'][-1]['result_status']=='PREREGISTERED_NOT_RUN'
          assert reg['records'][-1]['promotion_state']=='NONE'
          assert reg['records'][-1]['actual_variants_evaluated']==0
          assert reg['records'][-1]['declared_variant_budget']==1704
          assert reg['records'][-1]['production_authorized'] is False
          assert reg['records'][-1]['lineage_edges']==[]
          assert 'evidence_scorecard' not in reg['records'][-1]
          PY
          PYTHONPATH=. python -m research.governance.validate
          test "$(git diff --name-only)" = "config/research_registry.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json
          git commit -m 'research: register 0066 preregistration owner'
          git push origin HEAD:research/0066-prereg-v1
