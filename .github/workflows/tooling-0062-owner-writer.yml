name: Tooling 0066 implementation synthetic validation

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write

jobs:
  implementation-validation:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0066-implementation-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Patch NaN-safe validation percentile implementation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('research/brrk_btc_sol_path_event_early_warning_0066/models.py')
          s=p.read_text()
          old='''def empirical_percentile(values: np.ndarray, reference: np.ndarray) -> np.ndarray:\n    ref = np.sort(np.asarray(reference, dtype=float)[np.isfinite(reference)])\n    v = np.asarray(values, dtype=float)\n    if len(ref) == 0:\n        raise ValueError("empty percentile calibration reference")\n    return np.searchsorted(ref, v, side="right").astype(float) / float(len(ref))\n'''
          new='''def empirical_percentile(values: np.ndarray, reference: np.ndarray) -> np.ndarray:\n    ref = np.sort(np.asarray(reference, dtype=float)[np.isfinite(reference)])\n    v = np.asarray(values, dtype=float)\n    if len(ref) == 0:\n        raise ValueError("empty percentile calibration reference")\n    out = np.full(v.shape, np.nan, dtype=float)\n    mask = np.isfinite(v)\n    out[mask] = np.searchsorted(ref, v[mask], side="right").astype(float) / float(len(ref))\n    return out\n'''
          if old in s:
              p.write_text(s.replace(old,new,1))
          else:
              assert 'out = np.full(v.shape, np.nan, dtype=float)' in s
          PY
          git diff --check
      - name: Compile implementation-only modules
        run: |
          python -m py_compile \
            research/brrk_btc_sol_path_event_early_warning_0066/event_engine.py \
            research/brrk_btc_sol_path_event_early_warning_0066/models.py \
            research/brrk_btc_sol_path_event_early_warning_0066/engine.py \
            research/brrk_btc_sol_path_event_early_warning_0066/test_engine_synthetic.py
      - name: Run synthetic-only unit contracts
        run: pytest -q research/brrk_btc_sol_path_event_early_warning_0066/test_engine_synthetic.py
      - name: Assert historical runtime artifacts absent
        shell: bash
        run: |
          set -euo pipefail
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_btc_sol_path_event_early_warning_0066/$f"
          done
      - name: Persist patch only after tests pass
        shell: bash
        run: |
          set -euo pipefail
          CHANGED="$(git diff --name-only)"
          if [ -n "$CHANGED" ]; then
            test "$CHANGED" = "research/brrk_btc_sol_path_event_early_warning_0066/models.py"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add research/brrk_btc_sol_path_event_early_warning_0066/models.py
            git commit -m 'research: make 0066 validation percentiles NaN-safe'
            git push origin HEAD:research/0066-implementation-v1
          fi
