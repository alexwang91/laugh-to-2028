name: Tooling 0065 registry closeout

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write

jobs:
  registry-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0065-result-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Update only 0065 released research record
        shell: bash
        run: |
          set -euo pipefail
          cp config/research_registry.json /tmp/research_registry.before.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/research_registry.json')
          reg=json.loads(p.read_text())
          rid='BRRK-MULTI-ARCHITECTURE-GROSS-CONTROLLER-0065'
          matches=[x for x in reg['records'] if x.get('research_id')==rid]
          assert len(matches)==1
          r=matches[0]
          assert r['result_status']=='PREREGISTERED_NOT_RUN'
          assert r['actual_variants_evaluated']==0
          assert r['declared_variant_budget']==71
          r['actual_variants_evaluated']=71
          r['parameter_candidate_count']=63
          r['research_process_complexity']['actual_parameter_candidates_evaluated']=71
          r['result_status']='FAIL_NO_ROBUST_MULTI_ARCHITECTURE_IMPROVEMENT'
          r['failure_reason']='All eight frozen final architectures were validly evaluated in one exactly-once tournament. Descriptive best A04 THEORY_QUADRATIC_HESSIAN_RIDGE improved CAGR to 0.661265451355094 versus 0064 0.6557689400699214 and improved MDD to -0.2963539206683067, but failed frozen G4 temporal recurrence with only 2/4 positive chronological blocks and failed G5 simultaneous dependence-aware inference with LCB -0.00023941640352518253. No architecture passed the full gate sequence; PBO/CSCV was 0.6285714285714286.'
          r['promotion_state']='NO_PROMOTION'
          r['evidence_refs']=[
            'run:31789144276',
            'research/brrk_multi_architecture_gross_controller_0065/RUN_ATTEMPT.marker',
            'research/brrk_multi_architecture_gross_controller_0065/PRIMARY_RESULT.json',
            'research/brrk_multi_architecture_gross_controller_0065/EVIDENCE.json',
            'research/brrk_multi_architecture_gross_controller_0065/EXECUTION.json',
            'research/brrk_multi_architecture_gross_controller_0065/RUN_ONCE.marker',
            'research/brrk_multi_architecture_gross_controller_0065/CLOSEOUT.json'
          ]
          r['decision_refs']=[
            'research/governance/BRRK_MULTI_ARCHITECTURE_GROSS_CONTROLLER_0065_DESIGN_FREEZE_2026-08-14.md',
            'research/brrk_multi_architecture_gross_controller_0065/PREREGISTRATION.json',
            'research/brrk_multi_architecture_gross_controller_0065/DATASET_DECLARATION.json',
            'research/brrk_multi_architecture_gross_controller_0065/IMPLEMENTATION_CONTRACT.json',
            'research/brrk_multi_architecture_gross_controller_0065/CONTROLLED_EXECUTION_BOUNDARY.json',
            'research/brrk_multi_architecture_gross_controller_0065/CLOSEOUT.json'
          ]
          r['researcher_decisions']=[
            'All 63 validation tuning configurations and all 8 final architectures executed inside the single frozen scientific engine call.',
            'A04 is recorded as descriptive best only; no post-hoc promotion because G4/G5 failed.',
            'Same-ID rerun, retune, interaction pruning, Hessian-guided refinement, remapping and rescue are permanently forbidden.'
          ]
          r['notes']=[
            'The method-first tournament evaluated the complete frozen architecture set rather than sequential one-off strategy trials.',
            'A04 THEORY_QUADRATIC_HESSIAN_RIDGE was the only method with CAGR above 0064, at 66.1265451355094% versus 65.5768940069921%, with MDD -29.6353920668307% versus -33.6647126808358%.',
            'A04 failed temporal recurrence (2/4 positive blocks) and simultaneous LCB (-0.00023941640352518253), so it has no promotion authority.',
            'PBO/CSCV=0.6285714285714286 indicates material architecture-selection instability.',
            'Any continuation must be a new RESULT_INFORMED research ID; future-only validation is preferred for a higher evidentiary tier.',
            'production_authorized=false; signature_authorized=false; order_submission_authorized=false.'
          ]
          r['evidence_scorecard']={
            'temporal_novelty':'RESEARCHER_EXPOSED_DEVELOPMENT_NOT_INDEPENDENT_OOS',
            'statistical_sufficiency':'0_OF_8_FULL_GATE_PASS;_A04_G2_G3_PASS_BUT_G4_2_OF_4_AND_G5_SIMULTANEOUS_LCB_NEGATIVE;_PBO_0.628571',
            'governance_integrity':'HIGH_PROSPECTIVE_8_ARCH_63_TUNING_EXACTLY_ONCE_MARKET1_EQUITY1_WEIGHTS1_DTB3_1_LOADER1_ENGINE1_NO_RERUN',
            'operational_realism':'COMMON_CAUSAL_OUTER_GROSS_MAP_10BPS_TURNOVER_0064_PASSIVE_CASH_NO_LEVERAGE_NO_SHORT',
            'derived_confidence':'HIGH_FOR_NO_ROBUST_WINNER_ON_FROZEN_DEVELOPMENT_HISTORY',
            'confidence_rule_ref':'research/brrk_multi_architecture_gross_controller_0065/CLOSEOUT.json'
          }
          p.write_text(json.dumps(reg,indent=2,ensure_ascii=False)+'\n')
          PY
          python - <<'PY'
          import json,hashlib
          before=json.load(open('/tmp/research_registry.before.json'))
          after=json.load(open('config/research_registry.json'))
          rid='BRRK-MULTI-ARCHITECTURE-GROSS-CONTROLLER-0065'
          def canon(x): return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          b={x['research_id']:x for x in before['records']}
          a={x['research_id']:x for x in after['records']}
          assert set(a)==set(b)
          assert all(canon(a[k])==canon(b[k]) for k in b if k!=rid)
          r=a[rid]
          assert r['result_status']=='FAIL_NO_ROBUST_MULTI_ARCHITECTURE_IMPROVEMENT'
          assert r['actual_variants_evaluated']==71
          assert r['promotion_state']=='NO_PROMOTION'
          assert len(r['evidence_refs'])==7
          assert r['production_authorized'] is False
          PY
          PYTHONPATH=. python -m research.governance.validate
          test "$(git diff --name-only)" = "config/research_registry.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json
          git commit -m 'research: register 0065 tournament closeout'
          git push origin HEAD:research/0065-result-v1
