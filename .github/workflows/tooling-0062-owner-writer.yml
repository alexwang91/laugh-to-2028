name: Tooling 0064 post-merge zero-result preflight

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  post-merge-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 876fdf657bd11bc4aeb9d0dcd3859886ee099568
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Verify exact merged boundary identities and zero-result state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "876fdf657bd11bc4aeb9d0dcd3859886ee099568"
          test "$(git rev-parse HEAD:research/brrk_idle_cash_passive_accrual_robustness_0064/RUN_INTERFACE.json)" = "1289d808bd5da99dd4de295f70360f4673536cee"
          test "$(git rev-parse HEAD:research/brrk_idle_cash_passive_accrual_robustness_0064/RESULT_SCHEMA.json)" = "3dd860f51b96f769db75a50e50acf850db35bf19"
          test "$(git rev-parse HEAD:research/brrk_idle_cash_passive_accrual_robustness_0064/run_once.py)" = "f9af95b99c862ead8e8907cd06042884c0892b7b"
          test "$(git rev-parse HEAD:research/brrk_idle_cash_passive_accrual_robustness_0064/engine.py)" = "4060a307be2204c11952cb52e2fc718a5343d8e1"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_idle_cash_passive_accrual_robustness_0064/$f"
          done
      - name: Run exact merged-boundary Git-only preflight
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python research/brrk_idle_cash_passive_accrual_robustness_0064/run_once.py preflight --boundary-sha 876fdf657bd11bc4aeb9d0dcd3859886ee099568 | tee /tmp/preflight.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/preflight.json'))
          assert p['research_id']=='BRRK-IDLE-CASH-PASSIVE-ACCRUAL-ROBUSTNESS-0064'
          assert p['status']=='PREFLIGHT_PASS_ZERO_RESULT_GIT_IDENTITY_ONLY'
          assert p['boundary_sha']=='876fdf657bd11bc4aeb9d0dcd3859886ee099568'
          assert p['historical_csv_content_reads']==0
          assert p['scientific_engine_calls']==0
          assert p['runtime_artifacts_present']==[]
          PY
          PYTHONPATH=. python -m research.governance.validate
