name: Tooling 0065 synthetic implementation

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  synthetic-implementation:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0065-implementation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Reassert zero historical result state
        shell: bash
        run: |
          set -euo pipefail
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_multi_architecture_gross_controller_0065/$f"
          done
      - name: Compile and run synthetic method contracts only
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research/brrk_multi_architecture_gross_controller_0065/engine.py
          PYTHONPATH=. pytest -q research/brrk_multi_architecture_gross_controller_0065/test_engine.py
      - name: Verify implementation identity and no I/O primitives
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object research/brrk_multi_architecture_gross_controller_0065/engine.py)" = "762b608dd9eb5feedc06867ce07f02d0de8ea928"
          python - <<'PY'
          import json
          p=json.load(open('research/brrk_multi_architecture_gross_controller_0065/PREREGISTRATION.json'))
          c=json.load(open('research/brrk_multi_architecture_gross_controller_0065/IMPLEMENTATION_CONTRACT.json'))
          from research.brrk_multi_architecture_gross_controller_0065.engine import frozen_configurations, ARCHITECTURES
          assert sum(len(v) for v in frozen_configurations().values()) == 63
          assert len(ARCHITECTURES) == 8
          assert c['declared_variant_budget'] == 71
          assert c['historical_portfolio_reads_during_implementation'] == 0
          assert c['historical_0065_CAGR_computed_during_implementation'] is False
          assert p['trial_accounting']['declared_variant_budget'] == 71
          PY
          ! grep -nE '(^|[^A-Za-z_])(open\(|Path\(|requests\.|urlopen|read_csv|read_json)' research/brrk_multi_architecture_gross_controller_0065/engine.py
          PYTHONPATH=. python -m research.governance.validate
