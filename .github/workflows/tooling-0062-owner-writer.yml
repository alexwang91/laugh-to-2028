name: Tooling 0066 prereg atlas multiplicity patch

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write

jobs:
  prereg-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0066-prereg-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace only preregistered indicator-atlas multiplicity procedure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/brrk_btc_sol_path_event_early_warning_0066/PREREGISTRATION.json')
          x=json.loads(p.read_text())
          assert x['stage']=='NUMERICAL_DATA_PREREGISTRATION_FROZEN_NOT_RUN'
          assert x['trial_accounting']['actual_variants_evaluated_before_run']==0
          x['indicator_atlas']['final_multiplicity']=(
              'Across all supported FINAL signal/asset/target/horizon cells, compute a one-sided Mann-Whitney U test '
              'equivalent to testing TRAIN-oriented ROC-AUC > 0.50, then apply Holm-Bonferroni step-down correction '
              'at familywise alpha=0.05 across the entire supported atlas family. PR-AUC, PR-AUC lift, Brier and block '
              'metrics remain mandatory descriptive outputs. No FINAL re-orientation, screening or cell deletion is allowed.'
          )
          x['simultaneous_inference']['indicator_atlas_correction']=(
              'Holm-Bonferroni familywise correction of one-sided Mann-Whitney U / ROC-AUC>0.50 p-values across all '
              'supported FINAL indicator-atlas cells; this is separate from the 4000-replicate MBB used for confirmatory '
              'predictor tracks and economic controllers.'
          )
          x['simultaneous_inference']['predictive_bootstrap']=(
              'Do not retrain, re-orient, re-screen or recalibrate. Resample aligned FINAL prediction-date blocks and '
              'recompute each supported final predictor track PR-AUC lift. Replicates with a degenerate class for a track '
              'are omitted for that track; a track with <95% valid replicates is MEASUREMENT_INCONCLUSIVE for G5. '
              'One max-stat q95 correction spans all confirmatory predictive architecture/asset/target tracks.'
          )
          p.write_text(json.dumps(x,indent=2,ensure_ascii=False)+'\n')
          PY
          git diff --check
          test "$(git diff --name-only)" = "research/brrk_btc_sol_path_event_early_warning_0066/PREREGISTRATION.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_btc_sol_path_event_early_warning_0066/PREREGISTRATION.json
          git commit -m 'research: freeze efficient 0066 atlas multiplicity correction'
          git push origin HEAD:research/0066-prereg-v1
