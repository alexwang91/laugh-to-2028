name: Tooling 0066 bounded artificial implementation validation

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  bounded-artificial-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0066-implementation-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Assert implementation-only zero-result state
        shell: bash
        run: |
          set -euo pipefail
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_btc_sol_path_event_early_warning_0066/$f"
          done
      - name: Run bounded synthetic unit and contract tests
        shell: bash
        run: |
          set -euo pipefail
          pytest -q research/brrk_btc_sol_path_event_early_warning_0066/test_engine_synthetic.py
      - name: Audit full frozen configuration enumeration without full-history fitting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from research.brrk_btc_sol_path_event_early_warning_0066 import models as mdl
          cfg=mdl.frozen_configurations()
          expected={
              'P01_FAMILY_RIDGE_LOGIT':4,
              'P02_RAW_ELASTIC_NET_LOGIT':9,
              'P03_VALIDATION_SCREENED_SIGNAL_LOGIT':3,
              'P04_PCR_LOGIT':12,
              'P05_THEORY_QUADRATIC_LOGIT':4,
              'P06_SHALLOW_GBDT_CLASSIFIER':8,
              'P07_DISCRETE_TIME_HAZARD_LOGIT':4,
          }
          assert {k:len(v) for k,v in cfg.items()} == expected
          per_track=sum(expected[a] for a in mdl.BASE_ARCHITECTURES[:6])
          assert per_track == 40
          assert per_track*40 + expected['P07_DISCRETE_TIME_HAZARD_LOGIT']*8 == 1632
          assert 1632 + 64 + 8 == 1704
          print('0066 bounded implementation validation: grid=1632 final_predictors=64 controllers=8 total=1704')
          PY
      - name: Reassert no runtime artifacts and no repository mutation
        shell: bash
        run: |
          set -euo pipefail
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_btc_sol_path_event_early_warning_0066/$f"
          done
          test -z "$(git status --porcelain)"
