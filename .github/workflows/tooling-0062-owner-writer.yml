name: Tooling 0064 registry closeout writer

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: write

jobs:
  registry-closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0064-result-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Update only 0064 released research record
        shell: bash
        run: |
          set -euo pipefail
          BEFORE="$(git rev-parse HEAD:config/research_registry.json)"
          cp config/research_registry.json /tmp/research_registry.before.json
          python - <<'PY'
          import json
          from pathlib import Path
          rid='BRRK-IDLE-CASH-PASSIVE-ACCRUAL-ROBUSTNESS-0064'
          p=Path('config/research_registry.json')
          r=json.loads(p.read_text())
          rows=[x for x in r['records'] if x.get('research_id')==rid]
          assert len(rows)==1
          o=rows[0]
          assert o['result_status']=='PREREGISTERED_NOT_RUN'
          assert o['actual_variants_evaluated']==0
          assert o['promotion_state']=='NONE'
          assert o['evidence_refs']==[]
          o['actual_variants_evaluated']=20
          o['research_process_complexity']['actual_parameter_candidates_evaluated']=20
          o['result_status']='PASS_PASSIVE_CASH_ACCRUAL_ROBUSTNESS'
          o['failure_reason']=None
          o['promotion_state']='NO_PROMOTION'
          o['evidence_refs']=[
            'run:31783619793',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/RUN_ATTEMPT.marker',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/PRIMARY_RESULT.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/EVIDENCE.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/EXECUTION.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/RUN_ONCE.marker',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/CLOSEOUT.json'
          ]
          for ref in [
            'research/brrk_idle_cash_passive_accrual_robustness_0064/PREREGISTRATION.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/DATASET_DECLARATION.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/IMPLEMENTATION_CONTRACT.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/CONTROLLED_EXECUTION_BOUNDARY.json',
            'research/brrk_idle_cash_passive_accrual_robustness_0064/CLOSEOUT.json'
          ]:
              if ref not in o['decision_refs']:
                  o['decision_refs'].append(ref)
          o['production_relevance']='DEVELOPMENT PASS satisfying the requested reliable full-cycle net-CAGR-above-BRRK-0011 stop condition; future-only validation eligible; no automatic canonical or production authority.'
          o['notes']=[n for n in o.get('notes',[]) if 'have not been computed' not in n and 'RUN_ATTEMPT.marker is absent' not in n]
          o['notes'] += [
            'Unique historical attempt run 31783619793 completed exactly once on frozen boundary 876fdf657bd11bc4aeb9d0dcd3859886ee099568.',
            'Frozen primary 50% DTB3 realization / 100-bps annual fee passed all G0-G6 gates: CAGR 0.6557689400699214 > baseline 0.6516609785339962; MDD noninferior; 4/4 blocks positive; MBB LCB positive; 9/9 core stresses positive.',
            'The DEVELOPMENT-stage optimization stop condition is satisfied. 0064 is permanently closed to same-ID rerun, recomputation, retune and rescue.',
            'Evidence remains researcher-exposed DEVELOPMENT history rather than independent OOS; future-only confirmation is eligible and separate.',
            'production_authorized=false; signature_authorized=false; order_submission_authorized=false.'
          ]
          o['evidence_scorecard']={
            'temporal_novelty':'RESEARCHER_EXPOSED_DEVELOPMENT_NOT_INDEPENDENT_OOS_FUTURE_ONLY_CONFIRMATION_ELIGIBLE',
            'statistical_sufficiency':'G0_G6_ALL_PASS_PRIMARY_CAGR_PLUS_0_4108PP_MDD_NONINFERIOR_4_OF_4_BLOCKS_POSITIVE_MBB_L60_4000_LCB_POSITIVE_CORE_STRESS_9_OF_9',
            'governance_integrity':'HIGH_EXACTLY_ONCE_HASH_BOUND_FINALIZED_EQUITY1_WEIGHTS1_DTB3_1_ENGINE1_DURABLE_ATTEMPT_PARENT_NO_RERUN',
            'operational_realism':'UNCHANGED_BRRK0011_RISK_ASSET_PATH_PASSIVE_IDLE_CASH_CARRY_WITH_50PCT_DTB3_REALIZATION_AND_100BPS_ANNUAL_CONTINUOUS_ACCOUNT_COST_NO_SWEEP_COST'
          }
          p.write_text(json.dumps(r,indent=2,ensure_ascii=False)+'\n')
          PY
          python - <<'PY'
          import json, hashlib
          before=json.load(open('/tmp/research_registry.before.json'))
          after=json.load(open('config/research_registry.json'))
          rid='BRRK-IDLE-CASH-PASSIVE-ACCRUAL-ROBUSTNESS-0064'
          def canon(x): return hashlib.sha256(json.dumps(x,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode()).hexdigest()
          b={x['research_id']:x for x in before['records']}
          a={x['research_id']:x for x in after['records']}
          assert set(a)==set(b)
          assert all(canon(a[k])==canon(b[k]) for k in a if k!=rid)
          o=a[rid]
          assert o['result_status']=='PASS_PASSIVE_CASH_ACCRUAL_ROBUSTNESS'
          assert o['actual_variants_evaluated']==20
          assert o['research_process_complexity']['actual_parameter_candidates_evaluated']==20
          assert o['promotion_state']=='NO_PROMOTION'
          assert len(o['evidence_refs'])==7
          assert set(o['evidence_scorecard'])=={'temporal_novelty','statistical_sufficiency','governance_integrity','operational_realism'}
          assert o['production_authorized'] is False
          PY
          PYTHONPATH=. python -m research.governance.validate
          test "$(git diff --name-only)" = "config/research_registry.json"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json
          git commit -m 'research: register 0064 PASS closeout'
          git push origin HEAD:research/0064-result-v1
