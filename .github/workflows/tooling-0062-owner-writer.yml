name: Tooling 0066 exact merged boundary preflight

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  exact-merge-preflight:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b1af358577349c58a8468a3822775152b5aaad34
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Exact merged boundary zero-result preflight
        shell: bash
        run: |
          set -euo pipefail
          BOUNDARY_SHA=b1af358577349c58a8468a3822775152b5aaad34
          test "$(git rev-parse HEAD)" = "$BOUNDARY_SHA"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_btc_sol_path_event_early_warning_0066/$f"
          done
          python -m research.brrk_btc_sol_path_event_early_warning_0066.run_once preflight --boundary-sha "$BOUNDARY_SHA" | tee /tmp/0066-preflight.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/0066-preflight.json'))
          assert p['status']=='PREFLIGHT_PASS_ZERO_RESULT_GIT_IDENTITY_ONLY'
          assert p['boundary_sha']=='b1af358577349c58a8468a3822775152b5aaad34'
          assert p['market_loader_calls']==0
          assert p['scientific_engine_calls']==0
          assert all(v==0 for v in p['historical_content_reads'].values())
          assert p['runtime_artifacts_present']==[]
          PY
          test -z "$(git status --porcelain)"
