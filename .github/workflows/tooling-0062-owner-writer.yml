name: Tooling 0064 durable-attempt topology synthetic

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  topology-synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 876fdf657bd11bc4aeb9d0dcd3859886ee099568
          fetch-depth: 0
      - name: Reconfirm exact zero-result boundary without content read
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "876fdf657bd11bc4aeb9d0dcd3859886ee099568"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_idle_cash_passive_accrual_robustness_0064/$f"
          done
      - name: Prove durable-attempt parent topology in isolated toy repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/attempt-topology
          mkdir /tmp/attempt-topology
          cd /tmp/attempt-topology
          git init -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          echo frozen > boundary.txt
          git add boundary.txt
          git commit -q -m boundary
          BOUNDARY="$(git rev-parse HEAD)"

          echo attempt > RUN_ATTEMPT.marker
          git add RUN_ATTEMPT.marker
          git commit -q -m attempt
          ATTEMPT="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$BOUNDARY"

          git reset --mixed "$BOUNDARY" >/dev/null
          test "$(git rev-parse HEAD)" = "$BOUNDARY"
          test -f RUN_ATTEMPT.marker
          echo primary > PRIMARY_RESULT.json
          echo evidence > EVIDENCE.json
          echo execution > EXECUTION.json
          echo final > RUN_ONCE.marker

          git read-tree "$ATTEMPT"
          git add RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker
          TREE="$(git write-tree)"
          FINAL="$(printf '%s\n' 'final result' | git commit-tree "$TREE" -p "$ATTEMPT")"
          git merge-base --is-ancestor "$ATTEMPT" "$FINAL"
          test "$(git rev-parse "$FINAL^")" = "$ATTEMPT"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            git cat-file -e "$FINAL:$f"
          done
          test "$(git show "$FINAL:RUN_ATTEMPT.marker")" = attempt
          printf 'BOUNDARY=%s\nATTEMPT=%s\nFINAL=%s\n' "$BOUNDARY" "$ATTEMPT" "$FINAL"
