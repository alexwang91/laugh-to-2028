name: Tooling 0066 full artificial tournament validation

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  full-artificial-tournament:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0066-implementation-v1
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Assert implementation-only zero-result state
        shell: bash
        run: |
          set -euo pipefail
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_btc_sol_path_event_early_warning_0066/$f"
          done
      - name: Execute all frozen 0066 paths on artificial data only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import numpy as np
          import pandas as pd
          from research.brrk_btc_sol_path_event_early_warning_0066.engine import evaluate_program

          seed=660066
          rng=np.random.default_rng(seed)
          idx=pd.date_range('2020-01-01','2026-08-02',freq='D')
          n=len(idx)
          frames={}
          # Purely artificial cyclic regimes: repeated falls, flats and recoveries.
          for j,asset in enumerate(('BTC','ETH','SOL')):
              r=rng.normal(0.00055-0.00005*j,0.014+0.0025*j,n)
              for start in range(380+j*7,n-260,310):
                  r[start:start+18] += -0.0085*(1+0.12*j)
                  r[start+70:start+115] *= 0.10
                  r[start+160:start+205] += 0.0045
              close=100.0*np.exp(np.cumsum(r))
              op=close*np.exp(rng.normal(0,0.0015,n))
              high=np.maximum(op,close)*(1+np.abs(rng.normal(0.004,0.0015,n)))
              low=np.minimum(op,close)*(1-np.abs(rng.normal(0.004,0.0015,n)))
              vol=np.exp(rng.normal(10.0+0.1*j,0.35,n))*(1+3*np.abs(r))
              frames[asset]=pd.DataFrame({
                  'open':op,'high':high,'low':low,'close':close,
                  'volume':vol,'quote_volume':vol*close,
                  'trades':np.maximum(10.0,vol/1200.0),
              },index=idx)

          pidx=pd.date_range('2024-01-01','2026-08-02',freq='D')
          m=len(pidx)
          base_r=pd.Series(rng.normal(0.0015,0.017,m),index=pidx)
          base_gross=pd.Series(np.clip(rng.normal(0.74,0.04,m),0.55,0.90),index=pidx)
          rf=pd.Series(np.full(m,0.00011),index=pidx)
          out=evaluate_program(frames,base_r,base_gross,rf,bootstrap_replicates=4000)
          p=out['primary_result']
          assert p['indicator_atlas_hypothesis_cells']==8080
          assert p['actual_validation_tuning_configs_evaluated']==1632
          assert p['final_predictor_track_count']==64
          assert p['final_controller_count']==8
          assert p['actual_variants_evaluated']==1704
          assert len(p['controllers'])==8
          assert p['production_authorized'] is False
          assert p['signature_authorized'] is False
          assert p['order_submission_authorized'] is False
          assert len(out['evidence']['indicator_warning_atlas']['cells'])==8080
          print(json.dumps({
              'ARTIFICIAL_ONLY':True,
              'classification':p['classification'],
              'event_onset_count':p['event_onset_count'],
              'indicator_cells':p['indicator_atlas_hypothesis_cells'],
              'tuning_configs':p['actual_validation_tuning_configs_evaluated'],
              'predictor_tracks':p['final_predictor_track_count'],
              'controllers':p['final_controller_count'],
              'variant_budget':p['actual_variants_evaluated'],
              'controller_statuses':{k:v.get('status') for k,v in p['controllers'].items()},
          },indent=2,sort_keys=True))
          PY
      - name: Reassert no historical runtime artifacts were created
        shell: bash
        run: |
          set -euo pipefail
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "research/brrk_btc_sol_path_event_early_warning_0066/$f"
          done
          test -z "$(git status --porcelain)"
