name: Tooling 0064 implementation synthetic-only

on:
  push:
    branches:
      - tools/0062-owner-writer-v1
    paths:
      - '.github/workflows/tooling-0062-owner-writer.yml'

permissions:
  contents: read

jobs:
  synthetic-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0064-implementation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Assert implementation zero-result boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "85086ef04d684c08a1a15ae39bd40b60f2b16b05"
          test ! -e research/brrk_idle_cash_passive_accrual_robustness_0064/RUN_ATTEMPT.marker
          test ! -e research/brrk_idle_cash_passive_accrual_robustness_0064/PRIMARY_RESULT.json
          test ! -e research/brrk_idle_cash_passive_accrual_robustness_0064/EVIDENCE.json
          test ! -e research/brrk_idle_cash_passive_accrual_robustness_0064/EXECUTION.json
          test ! -e research/brrk_idle_cash_passive_accrual_robustness_0064/RUN_ONCE.marker
      - name: Run committed synthetic contracts only
        run: PYTHONPATH=. pytest -q research/brrk_idle_cash_passive_accrual_robustness_0064/test_contract.py
      - name: Validate implementation contract and governance
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python -m research.governance.validate
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('research/brrk_idle_cash_passive_accrual_robustness_0064/IMPLEMENTATION_CONTRACT.json').read_text())
          assert c['research_id']=='BRRK-IDLE-CASH-PASSIVE-ACCRUAL-ROBUSTNESS-0064'
          assert c['candidate_cell_count']==20
          assert c['primary_cell']=={'yield_realization':0.5,'annual_spread_fee_bps':100}
          assert c['actual_variants_evaluated']==0
          assert c['implementation_invariants']['network_access'] is False
          assert c['implementation_invariants']['file_io_in_scientific_engine'] is False
          assert c['implementation_invariants']['historical_dataset_read_in_implementation_tests'] is False
          assert c['implementation_invariants']['historical_outcome_computation_in_implementation_tests'] is False
          assert c['implementation_invariants']['cash_yield_floor'] is False
          assert c['implementation_invariants']['sweep_transaction_cost'] is False
          PY
