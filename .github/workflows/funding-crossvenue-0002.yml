name: FUNDING CROSSVENUE 0002 Overlap Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/funding-crossvenue-0002.yml'
      - 'research/requirements.txt'
      - 'research/funding_router/FUNDING-CROSSVENUE-0002-OVERLAP-AUDIT.json'
      - 'research/funding_router/run_crossvenue_funding_audit.py'
      - 'research/funding_router/run_crossvenue_funding_audit_throttled.py'
      - 'research/funding_router/test_crossvenue_funding_audit.py'
      - 'research/funding_router/run_funding_data_audit.py'
      - 'research/pit_universe/run_archive_discovery.py'

permissions:
  contents: write

concurrency:
  group: funding-crossvenue-0002-${{ github.ref }}
  cancel-in-progress: false

jobs:
  overlap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic alignment tests
        working-directory: research/funding_router
        run: python -m unittest -v test_crossvenue_funding_audit.py
      - name: Run preregistered overlap audit with API-safe pacing
        working-directory: research/funding_router
        shell: bash
        run: |
          set -o pipefail
          python run_crossvenue_funding_audit_throttled.py | tee funding_crossvenue_0002.log
      - name: Persist compact validated evidence on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/funding-crossvenue-0002
          mkdir -p /tmp/funding-crossvenue-0002
          SRC='research/funding_router/funding_crossvenue_0002_outputs'
          cp "$SRC/funding_crossvenue_0002_report.json" /tmp/funding-crossvenue-0002/
          cp "$SRC/paired_8h_blocks.csv" /tmp/funding-crossvenue-0002/
          cp "$SRC/coverage.csv" /tmp/funding-crossvenue-0002/
          cp "$SRC/annual_metrics.csv" /tmp/funding-crossvenue-0002/
          cp "$SRC/hyperliquid_event_count_distribution.csv" /tmp/funding-crossvenue-0002/
          cp research/funding_router/funding_crossvenue_0002.log /tmp/funding-crossvenue-0002/
          cp research/funding_router/FUNDING-CROSSVENUE-0002-OVERLAP-AUDIT.json /tmp/funding-crossvenue-0002/

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

          DEST='research/results/funding_crossvenue_0002'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R /tmp/funding-crossvenue-0002/. "$DEST/"

          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Persist FUNDING-CROSSVENUE-0002 exact evidence'
          git pull --rebase origin "$HEAD_REF"
          git push origin "HEAD:$HEAD_REF"
      - name: Upload exact audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-crossvenue-0002-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/funding_router/funding_crossvenue_0002.log
            research/funding_router/funding_crossvenue_0002_outputs/**
            research/funding_router/FUNDING-CROSSVENUE-0002-OVERLAP-AUDIT.json
