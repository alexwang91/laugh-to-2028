name: FUNDING CROSSVENUE 0002 Overlap Audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/funding-crossvenue-0002.yml'
      - 'research/requirements.txt'
      - 'research/funding_router/FUNDING-CROSSVENUE-0002-OVERLAP-AUDIT.json'
      - 'research/funding_router/run_crossvenue_funding_audit.py'
      - 'research/funding_router/run_crossvenue_funding_audit_throttled.py'
      - 'research/funding_router/test_crossvenue_funding_audit.py'
      - 'research/funding_router/run_funding_data_audit.py'
      - 'research/pit_universe/run_archive_discovery.py'

permissions:
  contents: read

concurrency:
  group: funding-crossvenue-0002-${{ github.ref }}
  cancel-in-progress: false

# Split into two jobs (backlog F11): `research` (contents: read) executes
# PR-supplied Python; `persist` (contents: write) only copies artifact files
# and runs git, never repository code, so the two never share a write-scoped
# token in the same job environment.
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic alignment tests
        working-directory: research/funding_router
        run: python -m unittest -v test_crossvenue_funding_audit.py
      - name: Run preregistered overlap audit with API-safe pacing
        working-directory: research/funding_router
        shell: bash
        run: |
          set -o pipefail
          python run_crossvenue_funding_audit_throttled.py | tee funding_crossvenue_0002.log
      - name: Upload exact audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-crossvenue-0002-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/funding_router/funding_crossvenue_0002.log
            research/funding_router/funding_crossvenue_0002_outputs/**
            research/funding_router/FUNDING-CROSSVENUE-0002-OVERLAP-AUDIT.json

  persist:
    needs: research
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: funding-crossvenue-0002-results
          path: /tmp/artifact
      - name: Persist compact validated evidence
        shell: bash
        run: |
          set -euo pipefail
          SRC='/tmp/artifact/research/funding_router/funding_crossvenue_0002_outputs'
          DEST='research/results/funding_crossvenue_0002'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp "$SRC/funding_crossvenue_0002_report.json" "$DEST/"
          cp "$SRC/paired_8h_blocks.csv" "$DEST/"
          cp "$SRC/coverage.csv" "$DEST/"
          cp "$SRC/annual_metrics.csv" "$DEST/"
          cp "$SRC/hyperliquid_event_count_distribution.csv" "$DEST/"
          cp /tmp/artifact/research/funding_router/funding_crossvenue_0002.log "$DEST/"
          cp /tmp/artifact/research/funding_router/FUNDING-CROSSVENUE-0002-OVERLAP-AUDIT.json "$DEST/"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Persist FUNDING-CROSSVENUE-0002 exact evidence'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
