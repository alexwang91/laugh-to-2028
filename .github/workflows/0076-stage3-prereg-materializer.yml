name: 0076 Stage3 preregistration materializer

on:
  push:
    branches:
      - research/0076-stage3-preregistration-v1

permissions:
  contents: write

jobs:
  materialize-stage3:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0076-stage3-preregistration-v1
          fetch-depth: 0

      - name: Update canonical registry and CURRENT_STATE, validate, self-delete
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW='.github/workflows/0076-stage3-prereg-materializer.yml'
          python - <<'PY'
          import json
          from pathlib import Path

          reg_path = Path('config/research_registry.json')
          data = json.loads(reg_path.read_text(encoding='utf-8'))
          rid = 'BRRK-CRYPTO-CROSS-SECTIONAL-LS-0076'
          matches = [r for r in data['records'] if r.get('research_id') == rid]
          assert len(matches) == 1
          r = matches[0]
          assert r['declared_variant_budget'] == 1
          assert r['parameter_candidate_count'] == 1
          assert r['actual_variants_evaluated'] == 0
          r['feature_families'] = ['CROSS_SECTIONAL_PRICE_MOMENTUM_SINGLE_BASELINE']
          r['horizon'] = ['MONDAY_CLOSE_TO_NEXT_MONDAY_CLOSE_DAILY_MARK_TO_MARKET']
          r['universe'] = ['POINT_IN_TIME_BINANCE_USDM_USDT_PERPETUALS_2021_01_THROUGH_2026_07']
          rpc = r['research_process_complexity']
          rpc['universes_evaluated'] = 1
          rpc['horizons_evaluated'] = 1
          rpc['rebalance_variants'] = 1
          rpc['feature_representations'] = 1
          decisions = r['researcher_decisions']
          additions = [
              'Stage2 selected exactly one independently justified baseline route: CROSS_SECTIONAL_MOMENTUM_SINGLE_BASELINE; the insufficient-support route and all alternate factor families are unavailable under this ID.',
              'Stage3 freezes one MOM60 parameterization, Monday-close weekly rebalance, deterministic beta-neutral projection, Binance USD-M perpetual source/cache contract, C0/C1/C2 costs, dependence-aware inference and G0-G11 terminal gates before controlled history.',
              'Use no 0075/0084 scientific result and perform no candidate/window/sign search; source-cache reuse transfers bytes/identities only.'
          ]
          for x in additions:
              if x not in decisions:
                  decisions.append(x)
          prereg = 'research/brrk_crypto_cross_sectional_ls_0076/PREREGISTRATION.md'
          if prereg not in r['decision_refs']:
              r['decision_refs'].append(prereg)
          reg_path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          old = "Prospective 0076 routing amendment #395 is merged at `5d773d9546e32b784381093ce5324001f7282e29`. 0076 Stage1 OWNER-FIRST merged at `4f9f4b3bf009af2b8affc41f29835c099b7fda70`. Stage2 DESIGN is active and prospectively selects exactly one separately justified baseline route: `CROSS_SECTIONAL_MOMENTUM_SINGLE_BASELINE`; zero inherited validated factors; formal completion 1/10 until Stage2 merge; attempt 0/1; controlled reads 0; scientific engine 0/1; scientific source-network fetches 0; scientific values exposed false; zero production/signature/order authority."
          new = "Prospective 0076 routing amendment #395 is merged at `5d773d9546e32b784381093ce5324001f7282e29`. 0076 Stage1 OWNER-FIRST merged at `4f9f4b3bf009af2b8affc41f29835c099b7fda70`; Stage2 DESIGN merged at `3d2a91558a1829314541f66304a5c463b164ef1c`. Stage3 PREREGISTRATION is active and freezes exactly one `CROSS_SECTIONAL_MOMENTUM_SINGLE_BASELINE` candidate with MOM60, Monday-close weekly rebalance, deterministic beta-neutral projection, Binance USD-M perpetual source/cache contract and frozen economic/statistical gates; formal completion 2/10 until Stage3 merge; inherited validated factors 0; attempt 0/1; controlled reads 0; scientific engine 0/1; scientific source-network fetches 0; scientific values exposed false; zero production/signature/order authority."
          assert state.count(old) == 1
          state_path.write_text(state.replace(old, new), encoding='utf-8')
          PY

          grep -F 'workflow run                         31381953131 / attempt 1' docs/CURRENT_STATE.md >/dev/null
          python -m research.governance.validate
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json docs/CURRENT_STATE.md research/brrk_crypto_cross_sectional_ls_0076/PREREGISTRATION.md
          git rm "$WORKFLOW"
          git diff --cached --check
          git commit -m 'research(0076): freeze Stage3 preregistration contract'
          git push origin HEAD:research/0076-stage3-preregistration-v1
