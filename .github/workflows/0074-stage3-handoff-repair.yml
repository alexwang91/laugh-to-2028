name: 0074 Stage3 handoff repair

on:
  push:
    branches: [research/0074-stage3-preregistration-v1]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage3-preregistration-v1
          fetch-depth: 0
      - name: Synchronize CURRENT_STATE and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          immutable = 'workflow run                         31381953131 / attempt 1'
          assert s.count(immutable) == 1
          old = "0073 completed immutable Stage 10 closeout at merge `da62a1ef2258eb27f5a4cede2415c567f19d3e76` and remains `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. 0074 Stage 1 OWNER-FIRST is in progress on PR #362 / `research/0074-stage1-owner-first-v1`; formal completion remains `0/10` until Stage 1 merges. 0074 attempt is `0/1`, controlled scientific/history reads are `0`, scientific engine calls are `0`, and source-network fetches are `0`. The next legal action is exact-head CI completion and expected-head merge of Stage 1, then a separate Stage 2 DESIGN branch."
          new = "0073 completed immutable Stage 10 closeout at merge `da62a1ef2258eb27f5a4cede2415c567f19d3e76` and remains `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. 0074 Stage 2 DESIGN merged at `08eafc22c3772bd021bc7e3c201c5dc63ac81e64`; Stage 3 PREREGISTRATION is in progress on `research/0074-stage3-preregistration-v1`; formal completion is `2/10` until Stage 3 merges. 0074 attempt is `0/1`, controlled scientific/history reads are `0`, scientific engine calls are `0`, and source-network fetches are `0`. The next legal action is exact-head CI completion and expected-head merge of Stage 3, then a separate Stage 4 IMPLEMENTATION branch."
          assert old in s
          s = s.replace(old, new, 1)
          old2 = "0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN IN PROGRESS ON #363 / FORMAL COMPLETION 1/10 UNTIL STAGE-2 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new2 = "0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / STAGE-3 PREREGISTRATION IN PROGRESS / FORMAL COMPLETION 2/10 UNTIL STAGE-3 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          assert old2 in s
          s = s.replace(old2, new2, 1)
          assert s.count(immutable) == 1
          p.write_text(s, encoding='utf-8')
          PY
          rm .github/workflows/0074-stage3-handoff-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md .github/workflows/0074-stage3-handoff-repair.yml
          git commit -m 'docs(0074): hand off merged design to Stage 3'
          git push origin HEAD:research/0074-stage3-preregistration-v1
