name: Temporary 0056 implementation build

on:
  push:
    branches:
      - research/0056-simple-beta-router-implementation

permissions:
  contents: write

jobs:
  build-implementation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Materialize frozen implementation and handoff
        env:
          ENGINE_GZ_B64: 
          TEST_GZ_B64: 
          BOUNDARY_GZ_B64: 
        run: |
          python - <<'PY2'
          import base64, gzip, os
          from pathlib import Path

          root = Path('research/brrk_simple_eth_sol_beta_router_0056')
          root.mkdir(parents=True, exist_ok=True)
          for env, name in [
              ('ENGINE_GZ_B64', 'engine.py'),
              ('TEST_GZ_B64', 'test_engine.py'),
              ('BOUNDARY_GZ_B64', 'IMPLEMENTATION_BOUNDARY.json'),
          ]:
              data = gzip.decompress(base64.b64decode(os.environ[env]))
              (root / name).write_bytes(data)

          readme = root.joinpath('README.md').read_text(encoding='utf-8')
          def repl(text, old, new):
              if text.count(old) != 1:
                  raise SystemExit(f'README anchor count {text.count(old)} for {old!r}')
              return text.replace(old, new, 1)
          readme = repl(readme,
              'Status: **NUMERICAL PREREGISTRATION FROZEN ON BRANCH / NOT IMPLEMENTED / NOT RUN**',
              'Status: **NUMERICAL PREREGISTRATION MERGED / IMPLEMENTATION-ONLY ON BRANCH / REAL HISTORICAL RUN FORBIDDEN**')
          implementation_section = (
              "\n\n## Implementation-only boundary\n\n"
              "The implementation branch now contains a pure deterministic engine and synthetic-only contract tests. The engine has **no filesystem market loader, no network fetch, no `run_once.py`, no result writer and no controlled-execution authority**. It accepts already-materialized ETH/SOL close frames; the later controlled-run layer must independently verify the frozen 0047 market-evidence identity before calling it.\n\n"
              "Synthetic tests cover the exact RM60 sign/zero semantics, next-period timing, L1 cost debits, no-rebalance B2 accounting, 5/10/20 bps panel, fixed 531/531/530/530 global blocks, project-standard `np.random.default_rng` moving-block bootstrap, G0-G4 classification precedence and mandatory diagnostics. A full 2183-row **synthetic** UTC calendar is allowed only to test mechanics; any synthetic classification has zero scientific authority and is never persisted as a research result.\n\n"
              "Real `MARKET_EVIDENCE.json` loading and any historical 0056 evaluation remain forbidden until a separate controlled-execution boundary merges.\n"
          )
          marker = '\n## Current authority\n'
          if readme.count(marker) != 1:
              raise SystemExit('README current-authority marker mismatch')
          readme = readme.replace(marker, implementation_section + marker, 1)
          readme = repl(readme, 'numerical preregistration     FROZEN ON PREREG BRANCH', 'numerical preregistration     MERGED AT 85bbc8583b625da670267cbb3db4928fbe1ade6f')
          readme = repl(readme, 'implementation                ABSENT', 'implementation                IMPLEMENTATION-ONLY ON BRANCH')
          readme = repl(readme, 'result                        ABSENT', 'result                        PREREGISTERED_NOT_RUN')
          readme = repl(readme,
              'After this preregistration merges, the only allowed next stage is an **implementation-only** branch with synthetic/contracts-only testing and no real 0056 historical result.',
              'After this implementation-only branch merges green, the only allowed next stage is a **separate controlled-execution boundary**. No real 0056 historical evaluation is authorized by the implementation merge itself.')
          root.joinpath('README.md').write_text(readme, encoding='utf-8')

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          nonlocal_state = [state]
          def srep(old, new):
              if nonlocal_state[0].count(old) != 1:
                  raise SystemExit(f'CURRENT_STATE anchor count {nonlocal_state[0].count(old)} for {old!r}')
              nonlocal_state[0] = nonlocal_state[0].replace(old, new, 1)
          srep('Current `main` research merge: **`16a23ce2115647beead7f7abdab68a6b4cb406fe`**', 'Current `main` research merge: **`85bbc8583b625da670267cbb3db4928fbe1ade6f`**')
          srep('Current research branch: **`research/0056-simple-beta-router-prereg`**', 'Current research branch: **`research/0056-simple-beta-router-implementation`**')
          srep('BRRK simple ETH/SOL Beta router 0056  DESIGN FROZEN / NUMERICAL PREREG NOT YET FROZEN / NOT IMPLEMENTED / NOT RUN', 'BRRK simple ETH/SOL Beta router 0056  PREREG MERGED / IMPLEMENTATION-ONLY / REAL HISTORICAL RUN FORBIDDEN')
          srep('numerical preregistration               FROZEN ON PREREG BRANCH', 'numerical preregistration               MERGED AT 85bbc8583b625da670267cbb3db4928fbe1ade6f')
          srep('implementation                          ABSENT', 'implementation                          IMPLEMENTATION-ONLY ON BRANCH')
          srep(
              'The numerical preregistration is now frozen before implementation or any 0056 economic output. It binds the immutable daily payload SHA256, 2122 common causal origins, NAV/cost and benchmark recursion, 5/10/20 bps L1 cost panel, 531/531/530/530 chronological blocks, 60-day moving-block bootstrap with 10,000 replicates and seed 1844716895, plus the complete G0-G4 classification hierarchy. After this preregistration merges, the only allowed continuation is a separate implementation-only branch that must not load or execute the real historical payload during implementation tests.',
              'The numerical preregistration merged at `85bbc8583b625da670267cbb3db4928fbe1ade6f`. The current implementation-only branch mechanically encodes the immutable 2122-origin RM60 router, NAV/cost and benchmark recursion, 5/10/20 bps L1 cost panel, 531/531/530/530 chronological blocks, 60-day moving-block bootstrap with 10,000 replicates and seed 1844716895, and G0-G4 result taxonomy. Its tests are synthetic-only; loading or evaluating the real historical payload remains forbidden until a separately merged controlled-execution boundary.'
          )
          srep('No 0056 implementation, controlled-run workflow, historical result or run marker exists at this stage. Older next-step prose above is historical and is superseded by this section.', '0056 implementation-only engine/tests now exist on the active branch; no controlled-run workflow, historical result or run marker exists at this stage. Older next-step prose above is historical and is superseded by this section.')
          state_path.write_text(nonlocal_state[0], encoding='utf-8')
          PY2
      - name: Run synthetic implementation contracts
        run: |
          python -m py_compile research/brrk_simple_eth_sol_beta_router_0056/engine.py research/brrk_simple_eth_sol_beta_router_0056/test_engine.py
          python -m unittest -v research.brrk_simple_eth_sol_beta_router_0056.test_engine
      - name: Enforce zero-result implementation boundary
        run: |
          python - <<'PY2'
          from pathlib import Path
          base = Path('research/brrk_simple_eth_sol_beta_router_0056')
          surface = (base/'engine.py').read_text() + '\n' + (base/'test_engine.py').read_text()
          forbidden_tokens = [
              'MARKET_EVIDENCE.json',
              'brrk_beta_handoff_0047',
              'load_frozen_market_evidence',
              'requests.get',
              'urllib.request',
              'Path(',
              '.read_text(',
              'open(',
          ]
          hits = [token for token in forbidden_tokens if token in surface]
          if hits:
              raise SystemExit(f'Forbidden real-data/loading token in implementation surface: {hits}')
          forbidden_paths = [
              'run_once.py', 'RUN_INTERFACE.json', 'CONTROLLED_EXECUTION_BOUNDARY.json',
              'PRIMARY_RESULT.json', 'RESULT_SUMMARY.json', 'EXECUTION.json',
              'RUN_ATTEMPT.marker', 'RUN_ONCE.marker'
          ]
          present = [name for name in forbidden_paths if (base/name).exists()]
          if present:
              raise SystemExit(f'Forbidden execution/result artifacts present: {present}')
          print('REAL_0056_HISTORICAL_PAYLOAD_NOT_LOADED=true')
          print('REAL_0056_PORTFOLIO_ECONOMICS_NOT_EXECUTED=true')
          print('ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0')
          PY2
          git diff --check -- research/brrk_simple_eth_sol_beta_router_0056/engine.py research/brrk_simple_eth_sol_beta_router_0056/test_engine.py research/brrk_simple_eth_sol_beta_router_0056/IMPLEMENTATION_BOUNDARY.json research/brrk_simple_eth_sol_beta_router_0056/README.md
      - name: Commit implementation-only surface and remove helper
        run: |
          rm .github/workflows/_temp_0056_implementation_build.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Research implementation [DRIFT_0]: freeze 0056 synthetic-only engine'
          git push origin HEAD:research/0056-simple-beta-router-implementation
