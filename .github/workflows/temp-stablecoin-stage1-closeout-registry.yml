name: Temporary Stablecoin Stage-1 closeout registry patch

on:
  push:
    branches:
      - research/stablecoin-liquidity-0001-stage1-closeout

permissions:
  contents: write

jobs:
  closeout-once:
    if: contains(github.event.head_commit.message, '[STABLECOIN_STAGE1_CLOSEOUT_REGISTRY_V1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/stablecoin-liquidity-0001-stage1-closeout
          fetch-depth: 0
      - name: Patch only Stablecoin research record to terminal FAIL
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path=Path('config/research_registry.json')
          text=path.read_text(encoding='utf-8')
          start=text.index('    {\n      "research_id": "STABLECOIN-LIQUIDITY-0001",')
          end=text.index('\n  ],\n  "research_governance_debt":', start)
          raw_block=text[start:end]
          record=json.loads(raw_block)

          assert record['governance_mode']=='PROGRAM_GOVERNED_V1'
          assert record['result_status']=='PREREGISTERED_NOT_RUN'
          assert record['actual_variants_evaluated']==0
          assert record['declared_variant_budget']==1
          assert record['evidence_refs']==[]
          assert record['promotion_state']=='NONE'
          assert record['production_authorized'] is False
          assert record['validation_dataset_refs']==['STABLECOIN-LIQUIDITY-0001-DEFILLAMA-HIST-V1']
          assert record['research_process_complexity']['validation_exposure_event_refs']==['STABLECOIN-LIQUIDITY-0001-RAW-DATA-20260808T141719Z']

          record['actual_variants_evaluated']=1
          complexity=record['research_process_complexity']
          complexity['actual_parameter_candidates_evaluated']=['RIDGE_ALPHA_1.0']
          complexity['universes_evaluated']=['CANONICAL_BRRK_BTC_ETH_SOL_BNB']
          complexity['horizons_evaluated']=['20_CALENDAR_DAYS']
          complexity['rebalance_variants']=['DAILY_00UTC_CANONICAL_P3_2']
          complexity['feature_representations']=['STABLECOIN_LIQUIDITY_STATE_V1']
          complexity['special_cases_introduced']=[]

          record['result_status']='FAIL_NO_INCREMENTAL_INFORMATION'
          record['failure_reason']='PRIMARY_MEAN_LOSS_DIFFERENTIAL_NONPOSITIVE'
          record['promotion_state']='NO_PROMOTION'
          record['evidence_refs']=['research/stablecoin_liquidity_0001/STAGE1_PRIMARY_RESULT.json']
          record['evidence_scorecard']={
              'temporal_novelty':'RECONSTRUCTED_HISTORY_RESEARCHER_EXPOSED_HISTORY_NOT_TEMPORALLY_UNSEEN',
              'statistical_sufficiency':'PRIMARY_TEST_N_933_EXCEEDS_730_BUT_MEAN_LOSS_DIFFERENTIAL_IS_NEGATIVE_AND_ONE_SIDED_HAC_P_0.8935',
              'governance_integrity':'HIGH_PREREGISTERED_ONE_SHOT_PRIMARY_ONLY_NO_RESCUE',
              'operational_realism':'MECHANISM_TEST_ONLY_NO_EDGE_OR_PRODUCTION_TRANSLATION',
              'derived_confidence':'MEDIUM',
              'confidence_rule_ref':'research/stablecoin_liquidity_0001/RUN_INTERFACE.json'
          }
          record['notes']=[
              'Stage-1 executed exactly once under STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1 on merge dd50ec35085eee2a2883dc1b29e3dd21ec52b043 / workflow run 31264048473.',
              'Primary result: FAIL_NO_INCREMENTAL_INFORMATION; valid OOS=933; mean baseline-minus-augmented squared-error differential=-5430210.12771038; HAC lag=19; t=-1.2454264237630361; one-sided p=0.8935124773215692.',
              'The frozen failure rule mean_primary_loss_differential <= 0 triggered STOP. No alternative lag, alpha, horizon, feature representation, secondary metric, prediction table or coefficient path was evaluated or released to rescue the result.',
              'No Stage-2 robustness research is eligible from this failed Stage-1 ID; Edge Registry remains unchanged and no portfolio or production authority is created.',
              'RUN_ONCE_STAGE1.marker is retained permanently; this research ID may not be rerun.',
              'ONCHAIN-HOLDER-COST-0001 remains separate backlog and is not started by this closeout.'
          ]

          dumped=json.dumps(record,indent=2,ensure_ascii=False)
          replacement='\n'.join('    '+line for line in dumped.splitlines())
          path.write_text(text[:start]+replacement+text[end:],encoding='utf-8')
          PY
      - name: Prove only Stablecoin record changed semantically
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          base=json.loads(subprocess.check_output(['git','show','origin/main:config/research_registry.json'],text=True))
          head=json.loads(Path('config/research_registry.json').read_text(encoding='utf-8'))
          b={r['research_id']:r for r in base['records']}
          h={r['research_id']:r for r in head['records']}
          assert b.keys()==h.keys()
          for rid in b:
              if rid!='STABLECOIN-LIQUIDITY-0001':
                  assert b[rid]==h[rid], rid
          r=h['STABLECOIN-LIQUIDITY-0001']
          assert r['actual_variants_evaluated']==1
          assert r['result_status']=='FAIL_NO_INCREMENTAL_INFORMATION'
          assert r['failure_reason']=='PRIMARY_MEAN_LOSS_DIFFERENTIAL_NONPOSITIVE'
          assert r['promotion_state']=='NO_PROMOTION'
          assert r['evidence_refs']==['research/stablecoin_liquidity_0001/STAGE1_PRIMARY_RESULT.json']
          assert r['production_authorized'] is False
          assert base['research_governance_debt']==head['research_governance_debt']
          PY
          python -m research.governance.validate
      - name: Remove helper and commit terminal registry state
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-stablecoin-stage1-closeout-registry.yml
          git add config/research_registry.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Research [DRIFT_0]: close Stablecoin Stage-1 registry as FAIL_STOP'
          git push origin HEAD:research/stablecoin-liquidity-0001-stage1-closeout
