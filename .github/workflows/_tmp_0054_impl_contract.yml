name: 0054 synthetic implementation contract

on:
  push:
    branches:
      - research/brrk-leadership-4h-readiness-0054-implementation

permissions:
  contents: read

jobs:
  synthetic-contract:
    if: contains(github.event.head_commit.message, 'trigger 0054 synthetic implementation contract')
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Compile 0054 implementation
        run: python -m py_compile research/brrk_leadership_4h_native_readiness_0054/engine.py research/brrk_leadership_4h_native_readiness_0054/test_engine.py
      - name: Enforce synthetic-only implementation test surface
        run: |
          python - <<'PY'
          from pathlib import Path
          test=Path('research/brrk_leadership_4h_native_readiness_0054/test_engine.py').read_text()
          forbidden=['MARKET_4H_PAYLOAD.json','measure_frozen_readiness(']
          hit=[x for x in forbidden if x in test]
          if hit: raise SystemExit(f'real-payload surface referenced by implementation tests: {hit}')
          print('SYNTHETIC_ONLY_TEST_SURFACE_PASS')
          PY
      - name: Run 0054 synthetic contracts only
        run: python -m unittest research.brrk_leadership_4h_native_readiness_0054.test_engine
      - name: Enforce zero-result implementation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/brrk_leadership_4h_native_readiness_0054')
          forbidden=['METHOD_RESULT.json','RESULT_SUMMARY.json','EXECUTION.json','RUN_ATTEMPT.marker','RUN_ONCE.marker','PREDICTIVE_RESULT.json','PORTFOLIO_RESULT.json','WINNER_LABELS.json']
          hit=[x for x in forbidden if (p/x).exists()]
          if hit: raise SystemExit(f'forbidden 0054 result artifacts: {hit}')
          print('ZERO_RESULT_IMPLEMENTATION_PASS')
          print('REAL_0054_MEASUREMENT_NOT_EXECUTED=true')
          print('REAL_0053_PAYLOAD_NOT_LOADED_BY_TESTS=true')
          PY
