name: 0060 prereg handoff

on:
  push:
    branches:
      - research/0060-prereg-owner-first-rebuild

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0060-prereg-owner-first-rebuild
          fetch-depth: 0
      - name: Update CURRENT_STATE only
        run: |
          set -euo pipefail
          git config user.name 'Y_Wang'
          git config user.email '40142450+alexwang91@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          s=s.replace('Current `main` research merge: **`f79f5c6b19b1e0e01647fdac2923f5943ff80bf1`**','Current `main` research merge: **`142733887c0e8c0652e29afa9eb99c9c4ede4a42`**')
          s=s.replace('Current research branch: **`research/0060-btc-cash-absolute-risk-diagnostic-design`**','Current research branch: **`research/0060-btc-cash-absolute-risk-diagnostic-prereg`**')
          s=s.replace('BRRK BTC->Cash absolute risk 0060     DESIGN FROZEN / PREREG ABSENT / NOT RUN','BRRK BTC->Cash absolute risk 0060     NUMERICAL/DATA PREREG FROZEN / NOT IMPLEMENTED / NOT RUN')
          s += '''\n\n---\n\n## 0060 numerical/data preregistration handoff\n\n`BRRK-BTC-CASH-ABSOLUTE-RISK-DIAGNOSTIC-0060` now has a central `PROGRAM_GOVERNED_V1` owner and a prospectively frozen numerical/data contract. No 0060 historical target value, Spearman statistic, bootstrap result, plot or portfolio economic output has been computed.\n\n```text\nstage                                  NUMERICAL/DATA PREREG FROZEN / NOT IMPLEMENTED / NOT RUN\ndataset                                BRRK-LEADERSHIP-ROTATION-0048-EXPOSED-HIST-V1\npayload SHA256                         d1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193\nasset consumed                         BTC close only\nhistory                                RESEARCHER_EXPOSED / DEVELOPMENT / NOT INDEPENDENT OOS\nhorizons                               20 / 60 / 120 / 240 all co-primary\ntarget families                        terminal loss + adverse excursion both co-primary\nco-primary association cells           8\nG1 minimum shared origins              1440\nG2                                     all eight full-sample Spearman rho > 0\nG3                                     >=3/4 chronological blocks positive in all eight cells\nbootstrap                              non-circular MBB / length 240 / 10000 / seed 1844716895\nG4                                     all eight simultaneous one-sided 95% LCB > 0\nactual variants evaluated              0\nBTC/Cash threshold or gross map        FORBIDDEN UNDER 0060\nportfolio economics                    FORBIDDEN UNDER 0060\n```\n\nThe state is one fixed equal-weight BTC-only A1/A2/A3 representation. All eight raw coordinates are required; causal normalization is trailing252/min60/sample-ddof1/zero-std-NaN/clip3. Missing required coordinates invalidate an origin. There is no feature tournament, fitted weight, horizon selection or target-family selection.\n\nClassification precedence is `INVALID_EXECUTION -> FAIL_INSUFFICIENT_CAUSAL_SUPPORT -> FAIL_NO_JOINT_DOWNSIDE_INFORMATION -> FAIL_TEMPORAL_INSTABILITY -> FAIL_DEPENDENCE_AWARE_ROBUSTNESS -> PASS_ABSOLUTE_RISK_INFORMATION_STAGE_ELIGIBLE`. PASS only permits a new-ID translation study.\n\n**Exact next step after prereg merge:** implementation-only with synthetic/toy/contract tests. Real historical target computation remains forbidden until a separately merged controlled-execution boundary.\n'''
          p.write_text(s)
          PY
          git rm .github/workflows/_tmp_0060_prereg_handoff.yml
          git add docs/CURRENT_STATE.md
          git commit -m 'Research preregistration [0060]: materialize CURRENT_STATE handoff'
          git push origin HEAD:research/0060-prereg-owner-first-rebuild
