name: LEVERAGE-0041 RUN ONCE

on:
  push:
    branches:
      - "p4-5/leverage-0041-implementation-runonce"
    paths:
      - "research/leverage_0041/RUN_ONCE_LEVERAGE_0041.marker"

permissions:
  contents: write

concurrency:
  group: leverage-0041-run-once
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "p4-5/leverage-0041-implementation-runonce"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Guard single-run authority and immutable boundaries
        run: |
          set -euo pipefail
          test ! -e research/results/leverage_0041/summary.json
          test "$(sha256sum research/leverage_0041/RUN_ONCE_LEVERAGE_0041.marker | awk '{print $1}')" = "55f06b1549593e847b42ae71c2e82d4c4a23931bdbfc671a6af9d05859e16ca5"
          test "$(git hash-object research/leverage_0041/LEVERAGE-0041.json)" = "d133c5c79a923911840068ff24a06a952c595726"
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/leverage_0041/LEVERAGE-0041.json").read_text())
          c = json.loads(Path("research/leverage_0041/LEVERAGE-0041-STUDY-IMPLEMENTATION-V1.json").read_text())
          assert p["production_authorized"] is False
          assert c["status"] == "FROZEN_BEFORE_FIRST_ECONOMIC_RUN"
          assert c["result_observed_before_freeze"] is False
          assert c["owner_run_once_authorized"] is True
          assert c["production_authorized"] is False
          assert c["one_time_boundary"]["marker_sha256"] == "55f06b1549593e847b42ae71c2e82d4c4a23931bdbfc671a6af9d05859e16ca5"
          PY
      - name: Download pinned ROUTER-DATA-0004 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/router-data-0004
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8906907321/zip" \
            -o /tmp/router-data-0004.zip
          test "$(sha256sum /tmp/router-data-0004.zip | awk '{print $1}')" = "99c0d463cc94294a6701056c34488d36c03ecff810ae7c6f5db5844e30d790d8"
          unzip -q /tmp/router-data-0004.zip -d /tmp/router-data-0004
          test "$(find /tmp/router-data-0004 -name vwap_slippage.csv | wc -l)" -eq 1
      - name: Execute deterministic LEVERAGE-0041 one-time study
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python research/leverage_0041/run_leverage_0041_once.py \
            --router-artifact-dir /tmp/router-data-0004
      - name: Validate immutable result before commit
        run: python research/leverage_0041/validate_leverage_0041_result.py
      - name: Commit immutable LEVERAGE-0041 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/leverage_0041/
          git diff --cached --quiet && { echo "No result files created"; exit 1; }
          git commit -m "Research: commit immutable LEVERAGE-0041 one-time result"
          git push origin HEAD:p4-5/leverage-0041-implementation-runonce
