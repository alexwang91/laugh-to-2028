name: PIT DISP 0015 Dynamic Universe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pit-disp-0015.yml'
      - 'research/requirements.txt'
      - 'research/crypto_rotation_backtest.py'
      - 'research/core/crypto_rotation_backtest.py'
      - 'research/pit_universe/run_archive_discovery.py'
      - 'research/pit_universe/run_dynamic_dispersion.py'
      - 'research/pit_universe/run_dynamic_dispersion_with_exports.py'
      - 'research/pit_universe/PIT-DISP-0015-DYNAMIC-UNIVERSE.json'
      - 'research/regime_kelly/**'
      - 'research/hybrid_meta/**'
      - 'research/risk_metric_fix/**'
      - 'research/dispersion_overlay/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/pit-disp-0015.yml'
      - 'research/requirements.txt'
      - 'research/crypto_rotation_backtest.py'
      - 'research/core/crypto_rotation_backtest.py'
      - 'research/pit_universe/run_archive_discovery.py'
      - 'research/pit_universe/run_dynamic_dispersion.py'
      - 'research/pit_universe/run_dynamic_dispersion_with_exports.py'
      - 'research/pit_universe/PIT-DISP-0015-DYNAMIC-UNIVERSE.json'
      - 'research/regime_kelly/**'
      - 'research/hybrid_meta/**'
      - 'research/risk_metric_fix/**'
      - 'research/dispersion_overlay/**'

permissions:
  contents: read

concurrency:
  group: pit-disp-0015-${{ github.ref }}
  cancel-in-progress: false

# Split into two jobs (backlog F11): `research` (contents: read) executes
# PR-supplied Python; `persist` (contents: write) only copies artifact files
# and runs git, never repository code, so the two never share a write-scoped
# token in the same job environment. `persist` also now checks the PR is
# same-repository, matching every other experiment workflow -- the original
# single-job version only checked `event_name == 'pull_request'`. A direct
# `push` to main still runs `research` (as before) but never ran `persist`
# even before this split, since persist required a pull_request event; that
# is unchanged here.
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run frozen survivorship-aware dispersion test
        working-directory: research/pit_universe
        shell: bash
        run: |
          set -o pipefail
          python run_dynamic_dispersion_with_exports.py | tee dynamic_dispersion.log
      - name: Upload exact research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-disp-0015-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/pit_universe/dynamic_dispersion.log
            research/pit_universe/dynamic_dispersion_report.json
            research/pit_universe/PIT-DISP-0015-DYNAMIC-UNIVERSE.json
            research/pit_universe/daily_equity.csv
            research/pit_universe/daily_weights.csv
            research/pit_universe/daily_dynamic_universe_count.csv
            research/pit_universe/dispersion_scale.csv
            research/pit_universe/inactive_eligible_audit.csv
            research/pit_universe/pnl_daily.svg
            docs/pnl.svg

  persist:
    needs: research
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pit-disp-0015-results
          path: /tmp/artifact
      - name: Persist validated outputs
        shell: bash
        run: |
          set -euo pipefail
          SRC='/tmp/artifact/research/pit_universe'
          out='research/results/pit_disp_0015'
          mkdir -p "$out"
          cp "$SRC/dynamic_dispersion_report.json" "$out/"
          cp "$SRC/daily_equity.csv" "$out/"
          cp "$SRC/daily_weights.csv" "$out/"
          cp "$SRC/daily_dynamic_universe_count.csv" "$out/"
          cp "$SRC/dispersion_scale.csv" "$out/"
          cp "$SRC/inactive_eligible_audit.csv" "$out/"
          cp "$SRC/pnl_daily.svg" "$out/"
          cp /tmp/artifact/docs/pnl.svg docs/pnl.svg

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$out" docs/pnl.svg
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Record validated PIT 0015 outputs'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
