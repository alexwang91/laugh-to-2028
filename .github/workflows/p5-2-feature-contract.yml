name: P5.2 feature-family contract

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_2_feature_contract.json"
      - "research/cycle_exit/p5_2_features.py"
      - "research/cycle_exit/run_p5_2_feature_evidence.py"
      - "research/cycle_exit/validate_p5_2_feature_result.py"
      - "execution/plan-b-bot/tests/test_p5_2_feature_contract.py"
      - ".github/workflows/p5-2-feature-contract.yml"
      - ".github/workflows/p5-2-feature-run-once.yml"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_2_feature_contract.json"
      - "research/cycle_exit/p5_2_features.py"
      - "research/cycle_exit/run_p5_2_feature_evidence.py"
      - "research/cycle_exit/validate_p5_2_feature_result.py"
      - "execution/plan-b-bot/tests/test_p5_2_feature_contract.py"
      - ".github/workflows/p5-2-feature-contract.yml"

permissions:
  contents: read

jobs:
  contract-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Run frozen P5.2 contract tests
        run: pytest -q execution/plan-b-bot/tests/test_p5_2_feature_contract.py
      - name: Run blinded data-access preflight only
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: |
          python research/cycle_exit/run_p5_2_feature_evidence.py --preflight-only
          test ! -e research/results/p5_2_feature_evidence/summary.json
