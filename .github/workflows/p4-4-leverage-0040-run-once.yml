name: P4.4 LEVERAGE-0040 RUN ONCE

on:
  push:
    branches:
      - "p4-4/leverage-0040-one-time-study-v2"
    paths:
      - "research/leverage_0040/RUN_ONCE_LEVERAGE_0040.marker"

permissions:
  contents: write

concurrency:
  group: leverage-0040-run-once
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "p4-4/leverage-0040-one-time-study-v2"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Guard one-time marker and result absence
        run: |
          set -euo pipefail
          test ! -e research/results/leverage_0040/summary.json
          test "$(sha256sum research/leverage_0040/RUN_ONCE_LEVERAGE_0040.marker | awk '{print $1}')" = "f54cdf362f60cad19d6c429ac4e008047b45d2cb537a95c96e2bc6dac5ce733a"
      - name: Download pinned ROUTER-DATA-0004 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/router-data-0004
          curl --fail --location -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/8906907321/zip" -o /tmp/router-data-0004.zip
          test "$(sha256sum /tmp/router-data-0004.zip | awk '{print $1}')" = "99c0d463cc94294a6701056c34488d36c03ecff810ae7c6f5db5844e30d790d8"
          unzip -q /tmp/router-data-0004.zip -d /tmp/router-data-0004
          test "$(find /tmp/router-data-0004 -name vwap_slippage.csv | wc -l)" -eq 1
      - name: Execute preregistered study exactly once through R1 authority
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python research/leverage_0040/run_leverage_0040_once_r1.py --router-artifact-dir /tmp/router-data-0004
      - name: Validate immutable result before commit
        run: python research/leverage_0040/validate_leverage_0040_result.py
      - name: Commit immutable study result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/leverage_0040/
          git diff --cached --quiet && { echo "No result files created"; exit 1; }
          git commit -m "Research: commit immutable LEVERAGE-0040 one-time result"
          git push origin HEAD:p4-4/leverage-0040-one-time-study-v2
