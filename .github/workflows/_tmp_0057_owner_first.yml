name: Temporary 0057 owner-first prereg staging

on:
  push:
    branches:
      - research/0057-simple-beta-router-interface-replication-prereg

permissions:
  contents: write

jobs:
  owner-first:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Add 0057 owner before formal path exists
        run: |
          python - <<'PY'
          from __future__ import annotations
          import copy, json
          from datetime import datetime, timezone
          from pathlib import Path

          RID56='BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056'
          RID57='BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-INTERFACE-REPLICATION-0057'
          PREFIX='research/brrk_simple_eth_sol_beta_router_interface_replication_0057/'
          DESIGN='research/governance/BRRK_SIMPLE_ETH_SOL_BETA_ROUTER_INTERFACE_REPLICATION_0057_DESIGN_FREEZE_2026-08-12.md'
          FORMAL=Path(PREFIX)
          assert not FORMAL.exists(), '0057 formal path must not exist before owner-first commit'

          reg_path=Path('config/research_registry.json')
          text=reg_path.read_text()
          obj=json.loads(text)
          assert sum(r.get('research_id')==RID57 for r in obj['records'])==0
          src=next(r for r in obj['records'] if r.get('research_id')==RID56)
          r=copy.deepcopy(src)

          r['research_id']=RID57
          r['research_family_id']='BRRK_DYNAMIC_LEADERSHIP_ROUTER'
          r['research_domain']='PORTFOLIO_INTEGRATION'
          r['research_governance_version']=1
          r['governance_mode']='PROGRAM_GOVERNED_V1'
          r['objective_type']='PORTFOLIO_INTEGRATION'
          r['created_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          r['created_before_result']=True
          r['question']='Does the exact frozen 0056 RM60 ETH/SOL Beta-router economic mechanism meet its inherited after-cost full-cycle wealth gates when the already-identified source/validator timezone representation mismatch is corrected by one deterministic tz_localize(UTC) adapter?'
          r['hypothesis']='After applying only the prospectively frozen representation adapter, the unchanged 0056 causal RM60 sign router can be evaluated on the same immutable DEVELOPMENT history; economic eligibility remains governed solely by the unchanged 0056 wealth, cost, temporal and dependence-aware G0-G4 gates.'
          r['hypothesis_origin']='MEASUREMENT_FIX_AFTER_0056_INVALID_EXECUTION_WITH_NO_ECONOMIC_OUTPUT;_ONLY_EXPOSED_NEW_INFORMATION_IS_SOURCE_TZ_NAIVE_VS_0056_TZ_AWARE_INTERFACE_MISMATCH'
          r['economic_mechanism']='Identical to 0056: within a fully invested ETH/SOL Beta sleeve, use only the sign of 60-day SOL/ETH relative log momentum to choose the next held asset, with executed-L1 transaction costs and frozen static ETH/SOL/initial-50/50 benchmarks. 0057 changes only the source representation bridge: after proving the immutable 0047/0048 tz-naive daily source contract, copy ETH/SOL frames and apply index.tz_localize(UTC) only, then delegate all portfolio economics to the immutable 0056 engine.'
          r['primary_target']='CAUSAL_AFTER_COST_FULL_CYCLE_ETH_SOL_BETA_ROUTER_ECONOMIC_ELIGIBILITY'
          r['primary_metric']='NET_TERMINAL_WEALTH_AND_NET_CAGR_WITH_INHERITED_0056_G0_G4_CLASSIFICATION'
          r['secondary_metrics']=copy.deepcopy(src['secondary_metrics'])
          r['feature_families']=copy.deepcopy(src['feature_families'])
          r['horizon']=src['horizon']
          r['universe']=copy.deepcopy(src['universe'])
          r['development_dataset_refs']=copy.deepcopy(src['development_dataset_refs'])
          r['validation_dataset_refs']=[]
          r['sealed_dataset_refs']=[]
          r['declared_variant_budget']=1
          r['actual_variants_evaluated']=0
          r['parameter_candidate_count']=1
          r['stopping_rule']='After 0057 numerical preregistration, implementation-only and controlled-execution boundary each merge separately, execute exactly one DEVELOPMENT measurement. A valid result permanently closes 0057 to same-ID rerun, retuning, alternate adapter, threshold/lookback/model/benchmark/cost/partition/bootstrap changes or rescue. A durable attempt marker also closes automatic same-ID recomputation after any invalid execution.'
          r['success_criteria']=[
            'G0 interface/data/integrity passes, including exact immutable source identity, frozen tz-naive source contract, exact tz_localize(UTC)-only adapter, unchanged calendar labels/order/row count/close arrays, adapted UTC-aware contract, immutable 0056 engine blob and one-variant budget.',
            'G1 primary 5 bps router terminal wealth strictly dominates every frozen static benchmark using the inherited 1e-12 log-ratio numerical tolerance.',
            'G2 router terminal wealth strictly dominates every frozen static benchmark at both inherited 10 bps and 20 bps stress costs.',
            'G3 router relative log growth versus the full-horizon best static benchmark is positive in at least 3 of the inherited 4 frozen chronological blocks.',
            'G4 all three inherited simultaneous one-sided 95% moving-block-bootstrap lower bounds for router-minus-static mean daily net log growth are above zero.',
            'Only all inherited G0-G4 gates passing produces PASS_SIMPLE_BETA_ROUTER_ECONOMIC_ELIGIBILITY.',
            'Canonical BRRK, Phase 6, leverage, signing, order submission and production authorization remain unchanged.'
          ]
          r['failure_criteria']=[
            'Any source/blob/payload/adapter/calendar/value/engine-blob/timing/accounting/variant-budget breach is INVALID_EXECUTION rather than an economic result.',
            'Failure to beat all three static benchmarks at primary 5 bps produces FAIL_NO_SIMPLE_BETA_ROUTER_ECONOMIC_UPLIFT.',
            'Primary dominance with failure to beat all three static benchmarks at either 10 or 20 bps produces FAIL_SIMPLE_BETA_ROUTER_COST_FRAGILE.',
            'Primary and cost dominance with positive relative block growth in fewer than 3 of 4 inherited frozen blocks produces FAIL_SIMPLE_BETA_ROUTER_TEMPORALLY_CONCENTRATED.',
            'Primary, cost and temporal gates passing with any simultaneous dependence-aware lower bound <=0 produces FAIL_SIMPLE_BETA_ROUTER_ECONOMIC_UPLIFT_NOT_DEPENDENCE_ROBUST.',
            'MDD, turnover, a favorable subperiod or any descriptive statistic cannot rescue a failed inherited wealth/robustness gate.'
          ]
          r['allowed_followup']=[
            'Only PASS_SIMPLE_BETA_ROUTER_ECONOMIC_ELIGIBILITY may motivate a new separately designed and preregistered research ID for a fixed BTC anchor plus causal routed Beta sleeve.',
            'A later BTC-anchor integration study may consume the frozen 0057 router immutably but cannot retune RM60 or the interface adapter under the new portfolio context.',
            'A later genuine future-only validation of the exact frozen router requires a separate registered protocol and cannot be claimed from 0057 exposed history.'
          ]
          r['forbidden_followup']=[
            'No same-ID or same-line rescue sweep over 20d, 30d, 90d, 120d or any other lookback after 0057 output.',
            'No alternate adapter, tz_convert, time shift, resampling, row mutation, fill/interpolation, refetch, provider substitution or alternate market loader.',
            'No same-ID magnitude threshold, hysteresis threshold, volatility filter, EMA, MACD, RSI, CORE4 overlay, BTC filter, supervised model, neural model or ensemble.',
            'No same-ID periodic rebalancing change to B2, alternate benchmark family, cost schedule, temporal partition, bootstrap block length/seed or relaxed PASS gate.',
            'No same-ID BTC allocation, cash timing, dynamic gross, leverage, shorting or oracle/hindsight exit.',
            'If a valid 0057 result fails its inherited decision, stop the ETH/SOL micro-timing line and move any continuation to a new-ID Beta-to-BTC continuation-value problem.',
            'No canonical BRRK modification, Phase 6 modification, signing, order submission or production authorization.'
          ]
          r['researcher_decisions']=[
            '0057 exists only because 0056 permanently closed INVALID_EXECUTION before any economic output; 0057 is a new-ID measurement fix, not a 0056 rerun or result rescue.',
            'The only new implementation freedom is the prospectively fixed adapter: validate immutable tz-naive source frames, copy them, apply index.tz_localize(UTC), and prove calendar/order/row-count/close-value invariance.',
            'The immutable 0056 engine blob b0fc1ac267a66593e7e2c4687aff81491bfcdf5a remains the scientific portfolio calculator; 0057 may not rewrite its RM60, cost, benchmark, temporal, bootstrap or classification mechanics.',
            'The 60-day horizon, 5/10/20 bps costs, 2122-period window, 531/531/530/530 blocks, block-60 bootstrap, 10000 replicates, seed 1844716895 and 1e-12 tolerance are inherited rather than reselected.',
            'No 0056 terminal wealth, CAGR or G1-G4 output exists, so no economic outcome can inform 0057 specification selection.',
            'All history remains researcher-exposed DEVELOPMENT data; a 0057 PASS is mechanism/economic eligibility only and is not independent OOS or production evidence.'
          ]
          rpc=copy.deepcopy(src['research_process_complexity'])
          rpc['declared_parameter_candidates']=copy.deepcopy(src['research_process_complexity']['declared_parameter_candidates']) + ['SOURCE_ADAPTER=TZ_NAIVE_TO_UTC_AWARE_BY_TZ_LOCALIZE_ONLY']
          rpc['actual_parameter_candidates_evaluated']=[]
          rpc['universes_evaluated']=copy.deepcopy(src['research_process_complexity']['universes_evaluated'])
          rpc['horizons_evaluated']=copy.deepcopy(src['research_process_complexity']['horizons_evaluated'])
          rpc['rebalance_variants']=copy.deepcopy(src['research_process_complexity']['rebalance_variants'])
          rpc['feature_representations']=copy.deepcopy(src['research_process_complexity']['feature_representations'])
          rpc['special_cases_introduced']=copy.deepcopy(src['research_process_complexity']['special_cases_introduced']) + ['SOURCE_INTERFACE_ADAPTER=TZ_LOCALIZE_UTC_ONLY_WITH_PRE_POST_IDENTITY_ATTESTATION']
          rpc['validation_exposure_event_refs']=[]
          rpc['related_family_trials']=1
          r['research_process_complexity']=rpc
          r['lineage_edges']=[
            {'relation':'MEASUREMENT_FIX','ref_research_id':RID56,'provenance_status':'FACT','evidence_ref':'research/brrk_simple_eth_sol_beta_router_0056/CLOSEOUT.json'},
            {'relation':'PARAMETER_DESCENDANT','ref_research_id':RID56,'provenance_status':'FACT','evidence_ref':'research/brrk_simple_eth_sol_beta_router_0056/PREREGISTRATION.json'}
          ]
          r['result_status']='PREREGISTERED_NOT_RUN'
          r['failure_reason']=None
          r['promotion_state']='NONE'
          r['evidence_refs']=[]
          r.pop('evidence_scorecard',None)
          r['decision_refs']=[DESIGN,'docs/CURRENT_STATE.md']
          r['production_relevance']='Research-only interface-corrected replication of the simple ETH/SOL Beta routing economics on researcher-exposed DEVELOPMENT history. A PASS can only make a separately governed BTC-anchor plus routed-Beta study eligible; it cannot modify canonical BRRK, Phase 6 or production authority.'
          r['production_authorized']=False
          r['provenance_status']='FACT'
          r['governed_path_prefixes']=[PREFIX]
          r['notes']=[
            '0057 is DEVELOPMENT-only on researcher-exposed history and makes no independent-OOS claim.',
            '0056 remains immutable INVALID_EXECUTION_CLOSED and cannot be rerun or repaired.',
            '0057 changes only source representation compatibility through tz_localize(UTC) on validated copied tz-naive indexes; all 0056 scientific mechanics/gates are inherited unchanged.',
            'No 0057 economic output is authorized before prereg merge, implementation-only merge and a separately merged controlled-execution boundary.'
          ]

          record=json.dumps(r,indent=6,ensure_ascii=False)
          # Align the first record line to the existing records-array indentation.
          record='    '+record.lstrip()
          marker='\n  ],\n  "research_governance_debt"'
          idx=text.index(marker)
          # Existing last record closes immediately before marker; append with comma.
          assert text[:idx].rstrip().endswith('}')
          text=text[:idx].rstrip()+',\n'+record+'\n'+text[idx:]
          parsed=json.loads(text)
          assert sum(x.get('research_id')==RID57 for x in parsed['records'])==1
          reg_path.write_text(text)

          state_path=Path('docs/CURRENT_STATE.md')
          state=state_path.read_text()
          assert 'Current `main` research merge: **`dbf95e0b5179e5d58c4e2527aa1c841625f134b2`**' in state
          assert 'Current research branch: **`research/0057-simple-beta-router-interface-replication-design`**' in state
          state=state.replace('Current `main` research merge: **`dbf95e0b5179e5d58c4e2527aa1c841625f134b2`**','Current `main` research merge: **`21f758260ea80040bbb38aec26e2091814e37fd9`**',1)
          state=state.replace('Current research branch: **`research/0057-simple-beta-router-interface-replication-design`**','Current research branch: **`research/0057-simple-beta-router-interface-replication-prereg`**',1)
          state=state.replace('BRRK Beta router interface replication 0057 DESIGN FROZEN / PREREG ABSENT / NOT RUN','BRRK Beta router interface replication 0057 PREREG STAGING / OWNER REGISTERED / FORMAL FILES NEXT',1)
          state_path.write_text(state)
          PY
      - name: Validate owner-first state
        run: |
          test ! -e research/brrk_simple_eth_sol_beta_router_interface_replication_0057
          python -m research.governance.validate
          python -m research.governance.no_drift
          git diff --check -- config/research_registry.json
      - name: Commit owner first and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_tmp_0057_owner_first.yml
          git add config/research_registry.json docs/CURRENT_STATE.md
          git commit -m 'Research prereg [DRIFT_0]: register 0057 owner before formal path'
          git push origin HEAD:research/0057-simple-beta-router-interface-replication-prereg
