name: 0072 push-run metadata probe

on:
  pull_request:
    paths:
      - '.github/workflows/0072-push-run-metadata-probe.yml'

permissions:
  contents: read
  actions: read

jobs:
  push-run-metadata-probe:
    if: github.head_ref == 'research/0072-access-probe-push-run-metadata-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Query #330 originating push-run and artifact metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          repo = 'alexwang91/laugh-to-2028'
          target_sha = '788c59e1def18bd9cf9b38f8b832a326d8249f72'
          token = os.environ['GH_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + token,
              'User-Agent': '0072-push-run-metadata-only-probe',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get_json(url):
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r)

          q = urllib.parse.urlencode({
              'head_sha': target_sha,
              'event': 'push',
              'per_page': 100,
          })
          runs_url = f'https://api.github.com/repos/{repo}/actions/runs?{q}'
          data = get_json(runs_url)

          runs = []
          for row in data.get('workflow_runs', []):
              runs.append({
                  'id': row.get('id'),
                  'name': row.get('name'),
                  'event': row.get('event'),
                  'status': row.get('status'),
                  'conclusion': row.get('conclusion'),
                  'head_sha': row.get('head_sha'),
                  'head_branch': row.get('head_branch'),
                  'run_attempt': row.get('run_attempt'),
                  'workflow_id': row.get('workflow_id'),
                  'created_at': row.get('created_at'),
                  'updated_at': row.get('updated_at'),
                  'html_url': row.get('html_url'),
              })
          print('0072_PUSH_RUN_METADATA=' + json.dumps(runs, sort_keys=True, separators=(',', ':')))

          artifacts_out = {}
          for row in runs:
              run_id = row['id']
              artifacts = get_json(f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/artifacts?per_page=100')
              artifacts_out[str(run_id)] = [
                  {
                      'id': a.get('id'),
                      'name': a.get('name'),
                      'size_in_bytes': a.get('size_in_bytes'),
                      'expired': a.get('expired'),
                      'created_at': a.get('created_at'),
                      'updated_at': a.get('updated_at'),
                  }
                  for a in artifacts.get('artifacts', [])
              ]
          print('0072_PUSH_RUN_ARTIFACT_METADATA=' + json.dumps(artifacts_out, sort_keys=True, separators=(',', ':')))
          PY
