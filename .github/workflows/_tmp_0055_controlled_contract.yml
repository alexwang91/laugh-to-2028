name: 0055 controlled-run fault contract

on:
  push:
    branches:
      - research/brrk-leadership-4h-structural-readiness-0055-controlled-run

jobs:
  controlled-contract:
    if: contains(github.event.head_commit.message, 'trigger 0055 controlled contract')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-4h-structural-readiness-0055-controlled-run
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 requests==2.32.5
      - name: Compile controlled runner
        run: python -m py_compile research/brrk_leadership_4h_structural_readiness_0055/run_once.py research/brrk_leadership_4h_structural_readiness_0055/test_run_interface.py
      - name: Enforce controlled tests are synthetic only
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research/brrk_leadership_4h_structural_readiness_0055/test_run_interface.py').read_text()
          if 'MARKET_4H_PAYLOAD.json' in s:
              raise SystemExit('controlled tests must not name real market payload')
          print('CONTROLLED_TESTS_SYNTHETIC_ONLY=true')
          PY
      - name: Run implementation and controlled-run synthetic contracts
        run: |
          python -m unittest research.brrk_leadership_4h_structural_readiness_0055.test_engine
          python -m unittest research.brrk_leadership_4h_structural_readiness_0055.test_run_interface
      - name: Enforce controlled boundary remains zero-result
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/brrk_leadership_4h_structural_readiness_0055')
          for name in ['RUN_ATTEMPT.marker','METHOD_RESULT.json','EXECUTION.json','RUN_ONCE.marker','RESULT.md','CLOSEOUT.json']:
              if (p/name).exists(): raise SystemExit(f'forbidden pre-run artifact exists: {name}')
          print('REAL_0055_MEASUREMENT_NOT_EXECUTED=true')
          print('REAL_0053_PAYLOAD_NOT_LOADED_BY_CONTROLLED_TESTS=true')
          PY
