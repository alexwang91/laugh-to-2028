name: 0072 CAPTURE-0002 postmerge status probe

on:
  pull_request:
    paths:
      - '.github/workflows/0072-capture-0002-postmerge-status.yml'

permissions:
  contents: read
  actions: read

jobs:
  status-probe:
    if: github.head_ref == 'diagnostic/0072-capture-0002-postmerge-status-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Query fixed CAPTURE-0002 artifact metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          names = [
            '0072-capture-execution-claim-BRRK-CRYPTO-CARRY-ATLAS-0072-CAPTURE-0002',
            '0072-capture-raw-BRRK-CRYPTO-CARRY-ATLAS-0072-CAPTURE-0002',
            '0072-capture-support-BRRK-CRYPTO-CARRY-ATLAS-0072-CAPTURE-0002',
          ]
          token = os.environ['GH_TOKEN']
          out = {}
          for name in names:
            url = 'https://api.github.com/repos/alexwang91/laugh-to-2028/actions/artifacts?name=' + urllib.parse.quote(name) + '&per_page=100'
            req = urllib.request.Request(url, headers={
              'Accept':'application/vnd.github+json',
              'Authorization':'Bearer ' + token,
              'User-Agent':'0072-capture-0002-postmerge-status',
              'X-GitHub-Api-Version':'2022-11-28',
            })
            with urllib.request.urlopen(req, timeout=20) as r:
              data = json.load(r)
            out[name] = [
              {
                'id': a.get('id'),
                'expired': a.get('expired'),
                'created_at': a.get('created_at'),
                'size_in_bytes': a.get('size_in_bytes'),
                'workflow_run_id': (a.get('workflow_run') or {}).get('id'),
                'workflow_head_sha': (a.get('workflow_run') or {}).get('head_sha'),
              }
              for a in data.get('artifacts', [])
            ]
          print('CAPTURE_0002_POSTMERGE_ARTIFACT_METADATA=' + json.dumps(out, sort_keys=True, separators=(',',':')))
          PY
