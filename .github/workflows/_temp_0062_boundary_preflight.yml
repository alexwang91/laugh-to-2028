name: Temp 0062 boundary preflight
on:
  push:
    branches: [tools/0062-boundary-preflight]
    paths: ['.github/workflows/_temp_0062_boundary_preflight.yml']
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0062-controlled-boundary-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Verify boundary head and runtime absence
        run: |
          test "$(git rev-parse HEAD)" = "b634d64b6a245d857b1276c4360c1a83442fb52e"
          test ! -e research/brrk_btc_risk_signal_atlas_0062/RUN_ATTEMPT.marker
          test ! -e research/brrk_btc_risk_signal_atlas_0062/PRIMARY_RESULT.json
          test ! -e research/brrk_btc_risk_signal_atlas_0062/EVIDENCE.json
          test ! -e research/brrk_btc_risk_signal_atlas_0062/EXECUTION.json
          test ! -e research/brrk_btc_risk_signal_atlas_0062/RUN_ONCE.marker
      - name: Run frozen synthetic implementation contracts
        run: python -m unittest discover -s research/brrk_btc_risk_signal_atlas_0062 -p 'test_*.py' -v
      - name: Compile exactly-once runner
        run: python -m py_compile research/brrk_btc_risk_signal_atlas_0062/run_once.py
      - name: Controlled preflight without market content read
        run: |
          python -m research.brrk_btc_risk_signal_atlas_0062.run_once preflight \
            --expected-head-sha b634d64b6a245d857b1276c4360c1a83442fb52e \
            --market research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json | tee /tmp/preflight.json
          grep -q '"market_content_read": false' /tmp/preflight.json
