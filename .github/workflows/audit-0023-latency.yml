name: AUDIT 0023 Extra Beta Latency

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-0023-latency.yml'
      - 'research/requirements.txt'
      - 'research/asym_beta/**'
      - 'research/regime_kelly/**'
      - 'research/hybrid_meta/**'
      - 'research/risk_metric_fix/**'
      - 'research/core/**'

permissions:
  contents: read

concurrency:
  group: audit-0023-latency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic audit tests
        working-directory: research/asym_beta
        run: python -m unittest -v test_audit_0023_latency.py
      - name: Run no-trading-change latency audit
        working-directory: research/asym_beta
        shell: bash
        run: |
          set -o pipefail
          python run_audit_0023_latency.py | tee audit_0023_latency.log
      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-0023-latency-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/asym_beta/AUDIT-0023-LATENCY.json
            research/asym_beta/audit_0023_latency.log
            research/results/audit_0023_latency/**
