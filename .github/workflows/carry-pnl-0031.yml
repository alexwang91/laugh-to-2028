name: CARRY PNL 0031

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/carry-pnl-0031.yml'
      - 'research/requirements.txt'
      - 'research/carry/**'
      - 'research/asym_beta/run_asym_beta_0021.py'
      - 'research/results/pit_disp_0015/daily_equity.csv'
      - 'research/results/funding_pnl_0003/**'

permissions:
  contents: read

concurrency:
  group: carry-pnl-0031-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carry-pnl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic unit tests
        working-directory: research/carry
        run: python -m unittest -v test_carry_pnl_0031.py
      - name: Run preregistered naive carry PNL
        working-directory: research/carry
        shell: bash
        run: |
          set -o pipefail
          python run_carry_pnl_0031.py | tee carry_pnl_0031.log
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carry-pnl-0031-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/carry/CARRY-PNL-0031.json
            research/carry/carry_pnl_0031.log
            research/results/carry_pnl_0031/**
