name: 0074 Stage7 handoff repair

on:
  push:
    branches:
      - research/0074-stage7-zero-result-preflight-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage7-zero-result-preflight-v1
      - name: Repair exact CURRENT_STATE handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert anchor in s
          old = "0073 completed immutable Stage 10 closeout at merge `da62a1ef2258eb27f5a4cede2415c567f19d3e76` and remains `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. 0074 Stage 4 IMPLEMENTATION merged at `b74263cd6ab2bddd37544702fec0a187b7433151`; Stage 5 NONHISTORICAL QUALIFICATION is in progress on PR #366 / `research/0074-stage5-nonhistorical-qualification-v1`; formal completion is `4/10` until Stage 5 merges. 0074 attempt is `0/1`, controlled scientific/history reads are `0`, scientific engine calls are `0`, and source-network fetches are `0`. The next legal action is synthetic-only qualification plus exact-head CI and expected-head merge of Stage 5, then a separate Stage 6 CONTROLLED BOUNDARY branch."
          new = "0073 completed immutable Stage 10 closeout at merge `da62a1ef2258eb27f5a4cede2415c567f19d3e76` and remains `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. 0074 Stage 6 CONTROLLED BOUNDARY merged at `3d48f2fd837334e184dd3a9de3b8a003fa7c23a0`; Stage 7 ZERO-RESULT PREFLIGHT is in progress on PR #368 / `research/0074-stage7-zero-result-preflight-v1`; formal completion is `6/10` until Stage 7 merges. 0074 attempt is `0/1`, controlled scientific/history reads are `0`, scientific engine calls are `0`, and Stage8 scientific source-network fetches are `0`. The next legal action is Stage 7 zero-result mechanical preflight plus exact-head CI and expected-head merge, with no controlled-history read or attempt consumption."
          assert old in s
          s = s.replace(old, new, 1)
          old2 = "0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / STAGE-3 PREREGISTRATION MERGED AT `beae11d807886bfec65aa5cc8a26f79e92e5a0e9` / STAGE-4 IMPLEMENTATION MERGED AT `b74263cd6ab2bddd37544702fec0a187b7433151` / STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c1bf177d98e14f54c26374cf52151c9ad90733e8` / STAGE-6 CONTROLLED BOUNDARY IN PROGRESS ON #367 / FORMAL COMPLETION 5/10 UNTIL STAGE-6 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new2 = "0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / STAGE-3 PREREGISTRATION MERGED AT `beae11d807886bfec65aa5cc8a26f79e92e5a0e9` / STAGE-4 IMPLEMENTATION MERGED AT `b74263cd6ab2bddd37544702fec0a187b7433151` / STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c1bf177d98e14f54c26374cf52151c9ad90733e8` / STAGE-6 CONTROLLED BOUNDARY MERGED AT `3d48f2fd837334e184dd3a9de3b8a003fa7c23a0` / STAGE-7 ZERO-RESULT PREFLIGHT IN PROGRESS ON #368 / FORMAL COMPLETION 6/10 UNTIL STAGE-7 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          assert old2 in s
          s = s.replace(old2, new2, 1)
          assert anchor in s
          p.write_text(s)
          PY
      - name: Self-delete repair workflow
        run: rm .github/workflows/0074-stage7-handoff-repair.yml
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0074-stage7-handoff-repair.yml
          git commit -m 'governance(0074): synchronize Stage7 handoff'
          git push origin HEAD:research/0074-stage7-zero-result-preflight-v1
