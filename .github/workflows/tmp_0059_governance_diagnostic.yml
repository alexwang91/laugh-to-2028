name: Temporary 0059 governance diagnostic

on:
  push:
    branches:
      - research/0059-beta-deterioration-btc-takeover-diagnostic-implementation

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0059-beta-deterioration-btc-takeover-diagnostic-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Capture governance output
        shell: bash
        run: |
          set +e
          mkdir -p governance_diag
          python -m research.governance.validate > governance_diag/validate.txt 2>&1
          echo "$?" > governance_diag/validate.code
          python -m research.governance.no_drift > governance_diag/no_drift.txt 2>&1
          echo "$?" > governance_diag/no_drift.code
          git diff --name-status 2e62245655008a74234b65d38d774b0d71847f05...HEAD > governance_diag/diff.txt
          cat governance_diag/validate.txt
          cat governance_diag/no_drift.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: 0059-governance-diagnostic
          path: governance_diag
          if-no-files-found: error
