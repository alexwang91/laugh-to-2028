name: 0059 execute exactly once

on:
  push:
    branches:
      - research/0059-beta-deterioration-btc-takeover-diagnostic-execute-once

permissions:
  contents: write

concurrency:
  group: brrk-0059-unique-development-execution
  cancel-in-progress: false

env:
  SCIENTIFIC_HEAD: 3bbe0d236f5e88abb6b60a701a12d78a3e925e45
  RESULT_BRANCH: research/0059-beta-deterioration-btc-takeover-diagnostic-result
  RESULT_DIR: /tmp/0059-result
  SCI_DIR: research/brrk_beta_deterioration_btc_takeover_diagnostic_0059
  MARKET: research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen scientific HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SCIENTIFIC_HEAD }}
          fetch-depth: 0

      - name: Verify exact scientific HEAD and live main race lock
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCIENTIFIC_HEAD"
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          test "$REMOTE_MAIN" = "$SCIENTIFIC_HEAD"
          echo "SCIENTIFIC_HEAD_LOCKED=$SCIENTIFIC_HEAD"
          echo "LIVE_MAIN_LOCKED=$REMOTE_MAIN"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt

      - name: Install boundary-tested pinned runtime
        run: python -m pip install --disable-pip-version-check -r execution/plan-b-bot/requirements-dev.txt

      - name: Mount durable result branch and verify zero-result remote state
        run: |
          set -euo pipefail
          git fetch origin "$RESULT_BRANCH:$RESULT_BRANCH"
          rm -rf "$RESULT_DIR"
          git worktree add "$RESULT_DIR" "$RESULT_BRANCH"
          git -C "$RESULT_DIR" config user.name 'Y_Wang'
          git -C "$RESULT_DIR" config user.email '40142450+alexwang91@users.noreply.github.com'
          test "$(git -C "$RESULT_DIR" rev-parse HEAD)" = "$SCIENTIFIC_HEAD"
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "$RESULT_DIR/$SCI_DIR/$f"
          done
          REMOTE_RESULT=$(git ls-remote origin "refs/heads/$RESULT_BRANCH" | awk '{print $1}')
          test "$REMOTE_RESULT" = "$SCIENTIFIC_HEAD"
          echo "REMOTE_ZERO_RESULT_STATE=true"

      - name: Zero-result controlled preflight
        run: |
          set -euo pipefail
          python -m research.brrk_beta_deterioration_btc_takeover_diagnostic_0059.run_once preflight \
            --market "$MARKET" \
            --result "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" > /tmp/0059-preflight.json
          grep -q 'PREFLIGHT_ZERO_RESULT_PASS' /tmp/0059-preflight.json
          grep -q '"actual_variants_evaluated": 0' /tmp/0059-preflight.json
          grep -q '"attempt_marker_exists": false' /tmp/0059-preflight.json
          grep -q '"result_exists": false' /tmp/0059-preflight.json
          grep -q '"execution_exists": false' /tmp/0059-preflight.json
          grep -q '"final_marker_exists": false' /tmp/0059-preflight.json
          echo "PREFLIGHT_ZERO_RESULT_CONFIRMED=true"

      - name: Reconfirm live main immediately before irreversible attempt
        run: |
          set -euo pipefail
          REMOTE_MAIN=$(git ls-remote origin refs/heads/main | awk '{print $1}')
          REMOTE_RESULT=$(git ls-remote origin "refs/heads/$RESULT_BRANCH" | awk '{print $1}')
          test "$REMOTE_MAIN" = "$SCIENTIFIC_HEAD"
          test "$REMOTE_RESULT" = "$SCIENTIFIC_HEAD"
          echo "IRREVERSIBLE_BOUNDARY_RACE_CHECK_PASS=true"

      - name: Create irreversible 0059 attempt marker before any historical target computation
        run: |
          set -euo pipefail
          python -m research.brrk_beta_deterioration_btc_takeover_diagnostic_0059.run_once start-attempt \
            --market "$MARKET" \
            --result "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" > /tmp/0059-attempt.json
          test -f "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker"
          test ! -e "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json"
          test ! -e "$RESULT_DIR/$SCI_DIR/EXECUTION.json"
          test ! -e "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker"
          grep -q '"candidate_count": 1' /tmp/0059-attempt.json
          grep -q '"same_id_recomputation_allowed": false' /tmp/0059-attempt.json
          grep -q '"same_id_retuning_allowed": false' /tmp/0059-attempt.json
          grep -q '"same_id_rescue_allowed": false' /tmp/0059-attempt.json
          git -C "$RESULT_DIR" add "$SCI_DIR/RUN_ATTEMPT.marker"
          git -C "$RESULT_DIR" commit -m 'Research result [0059]: persist irreversible single-candidate attempt marker'
          git -C "$RESULT_DIR" push origin "HEAD:$RESULT_BRANCH"

      - name: Verify durable remote attempt lock before evaluation
        run: |
          set -euo pipefail
          git fetch origin "$RESULT_BRANCH"
          REMOTE_BLOB=$(git rev-parse "origin/$RESULT_BRANCH:$SCI_DIR/RUN_ATTEMPT.marker")
          LOCAL_BLOB=$(git -C "$RESULT_DIR" rev-parse "HEAD:$SCI_DIR/RUN_ATTEMPT.marker")
          test "$REMOTE_BLOB" = "$LOCAL_BLOB"
          test -n "$REMOTE_BLOB"
          echo "DURABLE_ATTEMPT_LOCK=true"
          echo "SAME_ID_RECOMPUTATION_AUTHORITY=false"

      - name: Execute immutable 0059 historical mechanism diagnostic exactly once
        run: |
          set -euo pipefail
          python -m research.brrk_beta_deterioration_btc_takeover_diagnostic_0059.run_once evaluate \
            --market "$MARKET" \
            --result "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" > /tmp/0059-primary-result.stdout.json
          test -f "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json"
          test -f "$RESULT_DIR/$SCI_DIR/EXECUTION.json"
          test ! -e "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker"
          git -C "$RESULT_DIR" add "$SCI_DIR/PRIMARY_RESULT.json" "$SCI_DIR/EXECUTION.json"
          git -C "$RESULT_DIR" commit -m 'Research result [0059]: persist unique lossless mechanism-diagnostic bundle'
          git -C "$RESULT_DIR" push origin "HEAD:$RESULT_BRANCH"

      - name: Verify durable remote result bundle
        run: |
          set -euo pipefail
          git fetch origin "$RESULT_BRANCH"
          for f in PRIMARY_RESULT.json EXECUTION.json RUN_ATTEMPT.marker; do
            REMOTE_BLOB=$(git rev-parse "origin/$RESULT_BRANCH:$SCI_DIR/$f")
            LOCAL_BLOB=$(git -C "$RESULT_DIR" rev-parse "HEAD:$SCI_DIR/$f")
            test "$REMOTE_BLOB" = "$LOCAL_BLOB"
          done
          echo "DURABLE_RESULT_BUNDLE=true"

      - name: Finalize closure marker from existing hashes only
        run: |
          set -euo pipefail
          python -m research.brrk_beta_deterioration_btc_takeover_diagnostic_0059.run_once finalize \
            --market "$MARKET" \
            --result "$RESULT_DIR/$SCI_DIR/PRIMARY_RESULT.json" \
            --execution "$RESULT_DIR/$SCI_DIR/EXECUTION.json" \
            --attempt "$RESULT_DIR/$SCI_DIR/RUN_ATTEMPT.marker" \
            --marker "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker" \
            --expected-head-sha "$SCIENTIFIC_HEAD" > /tmp/0059-final-marker.stdout.json
          test -f "$RESULT_DIR/$SCI_DIR/RUN_ONCE.marker"
          git -C "$RESULT_DIR" add "$SCI_DIR/RUN_ONCE.marker"
          git -C "$RESULT_DIR" commit -m 'Research result [0059]: finalize immutable same-ID closure marker'
          git -C "$RESULT_DIR" push origin "HEAD:$RESULT_BRANCH"

      - name: Verify final marker durable and emit frozen scientific summary
        run: |
          set -euo pipefail
          git fetch origin "$RESULT_BRANCH"
          REMOTE_BLOB=$(git rev-parse "origin/$RESULT_BRANCH:$SCI_DIR/RUN_ONCE.marker")
          LOCAL_BLOB=$(git -C "$RESULT_DIR" rev-parse "HEAD:$SCI_DIR/RUN_ONCE.marker")
          test "$REMOTE_BLOB" = "$LOCAL_BLOB"
          python - <<'PY'
          import json
          from pathlib import Path
          d = Path('/tmp/0059-result/research/brrk_beta_deterioration_btc_takeover_diagnostic_0059')
          r = json.loads((d / 'PRIMARY_RESULT.json').read_text())
          m = json.loads((d / 'RUN_ONCE.marker').read_text())
          x = r.get('measurement', {})
          print('CLASSIFICATION=' + str(r.get('classification')))
          print('FINALIZED_WITHOUT_REMEASUREMENT=' + str(m.get('finalized_without_remeasurement')).lower())
          print('SAME_ID_RERUN_ALLOWED=' + str(m.get('same_id_rerun_allowed')).lower())
          print('SAME_ID_RETUNING_ALLOWED=' + str(m.get('same_id_retuning_allowed')).lower())
          print('SAME_ID_RESCUE_ALLOWED=' + str(m.get('same_id_rescue_allowed')).lower())
          print('ACTUAL_VARIANTS_EVALUATED=' + str(x.get('actual_variants_evaluated')))
          print('GATES=' + json.dumps(x.get('gates', {}), sort_keys=True))
          print('SHARED_ORIGIN_COUNT=' + str(x.get('shared_origin_count')))
          print('SHARED_ORIGIN_START=' + str(x.get('shared_origin_start')))
          print('SHARED_ORIGIN_END=' + str(x.get('shared_origin_end')))
          print('FULL_SAMPLE_RHO=' + json.dumps(x.get('full_sample_rho_by_horizon'), sort_keys=True))
          print('TEMPORAL_BLOCK_RHO=' + json.dumps(x.get('temporal_block_rho_by_horizon'), sort_keys=True))
          print('BOOTSTRAP_Q95=' + str(x.get('bootstrap_q95')))
          print('SIMULTANEOUS_LCB=' + json.dumps(x.get('simultaneous_lcb_by_horizon'), sort_keys=True))
          print('COMPONENT_TARGET_SPEARMAN=' + json.dumps(x.get('component_target_spearman'), sort_keys=True))
          print('COMPONENT_EFFECTIVE_RANK=' + str(x.get('component_effective_rank')))
          if r.get('classification') == 'INVALID_EXECUTION':
              print('ERROR_TYPE=' + str(x.get('error_type')))
              print('ERROR=' + str(x.get('error')))
          PY

      - name: Upload immutable 0059 runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: brrk-0059-beta-deterioration-btc-takeover-runtime-bundle
          if-no-files-found: error
          path: |
            /tmp/0059-result/research/brrk_beta_deterioration_btc_takeover_diagnostic_0059/RUN_ATTEMPT.marker
            /tmp/0059-result/research/brrk_beta_deterioration_btc_takeover_diagnostic_0059/PRIMARY_RESULT.json
            /tmp/0059-result/research/brrk_beta_deterioration_btc_takeover_diagnostic_0059/EXECUTION.json
            /tmp/0059-result/research/brrk_beta_deterioration_btc_takeover_diagnostic_0059/RUN_ONCE.marker
