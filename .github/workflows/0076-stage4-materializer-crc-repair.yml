name: 0076 Stage4 implementation envelope bypass

on:
  push:
    branches:
      - research/0076-stage4-implementation-v1

permissions:
  contents: write

jobs:
  materialize-with-envelope-bypass:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0076-stage4-implementation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Materialize exact embedded Stage4 payload with mechanical envelope/text repair
        shell: bash
        run: |
          set -euo pipefail
          DIR='research/brrk_crypto_cross_sectional_ls_0076'
          mkdir -p "$DIR"
          python - <<'PY'
          import base64, re, zlib
          from pathlib import Path
          src=Path('.github/workflows/0076-stage4-implementation-materializer.yml').read_text(encoding='utf-8')
          out=Path('research/brrk_crypto_cross_sectional_ls_0076')
          mapping={'ENGINE_B64':'engine.py','SMOKE_B64':'implementation_smoke.py','CONTRACT_B64':'IMPLEMENTATION_CONTRACT.json','IMPL_B64':'IMPLEMENTATION.md'}
          for key,name in mapping.items():
              m=re.search(r'^\s*'+re.escape(key)+r':\s*(\S+)\s*$',src,re.M); assert m,key
              blob=base64.b64decode(m.group(1),validate=True); assert blob[:2]==b'\x1f\x8b',key
              payload=zlib.decompress(blob[10:-8],-zlib.MAX_WBITS)
              if key=='SMOKE_B64':
                  assert payload.count(b'20T6')==5
                  payload=payload.replace(b'20T6',b'2026')
              (out/name).write_bytes(payload)
          PY

          python - <<'PY'
          import json
          from pathlib import Path
          reg=Path('config/research_registry.json')
          data=json.loads(reg.read_text(encoding='utf-8'))
          rid='BRRK-CRYPTO-CROSS-SECTIONAL-LS-0076'
          rows=[r for r in data['records'] if r.get('research_id')==rid]
          assert len(rows)==1
          r=rows[0]
          for ref in [
              'research/brrk_crypto_cross_sectional_ls_0076/IMPLEMENTATION.md',
              'research/brrk_crypto_cross_sectional_ls_0076/IMPLEMENTATION_CONTRACT.json',
              'research/brrk_crypto_cross_sectional_ls_0076/engine.py',
          ]:
              if ref not in r['decision_refs']:
                  r['decision_refs'].append(ref)
          decision='Stage4 implements one complete frozen payload-bytes-to-terminal-result scientific entrypoint; Stage8 requires no new scientific adapter/harness, subject to Stage5 synthetic qualification.'
          if decision not in r['researcher_decisions']:
              r['researcher_decisions'].append(decision)
          reg.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          state=Path('docs/CURRENT_STATE.md')
          text=state.read_text(encoding='utf-8')
          old='0076 Stage1 OWNER-FIRST merged at `4f9f4b3bf009af2b8affc41f29835c099b7fda70`; Stage2 DESIGN merged at `3d2a91558a1829314541f66304a5c463b164ef1c`. Stage3 PREREGISTRATION is active and freezes exactly one `CROSS_SECTIONAL_MOMENTUM_SINGLE_BASELINE` candidate with MOM60, Monday-close weekly rebalance, deterministic beta-neutral projection, Binance USD-M perpetual source/cache contract and frozen economic/statistical gates; formal completion 2/10 until Stage3 merge; inherited validated factors 0; attempt 0/1; controlled reads 0; scientific engine 0/1; scientific source-network fetches 0; scientific values exposed false; zero production/signature/order authority.'
          new='0076 Stage1 OWNER-FIRST merged at `4f9f4b3bf009af2b8affc41f29835c099b7fda70`; Stage2 DESIGN merged at `3d2a91558a1829314541f66304a5c463b164ef1c`; Stage3 PREREGISTRATION merged at `c0c587929af9fa71fab8ddb8a69d58ef03f36101`. Stage4 IMPLEMENTATION is active with one complete frozen payload-bytes-to-terminal-result scientific entrypoint covering authorized hash/read accounting, Binance USD-M kline/funding parsing, PIT universe, MOM60, beta-neutral long/short portfolio, C0/C1/C2 economics, inference, robustness, G0-G11 and create-only result serialization; formal completion 3/10 until Stage4 merge; inherited validated factors 0; attempt 0/1; controlled reads 0; scientific engine 0/1; scientific source-network fetches 0; scientific values exposed false; zero production/signature/order authority.'
          assert text.count(old)==1
          state.write_text(text.replace(old,new),encoding='utf-8')
          PY

          python -m py_compile "$DIR/engine.py" "$DIR/implementation_smoke.py"
          PYTHONPATH=. python -m research.brrk_crypto_cross_sectional_ls_0076.implementation_smoke
          python -m research.governance.validate
          grep -F 'workflow run                         31381953131 / attempt 1' docs/CURRENT_STATE.md >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DIR/engine.py" "$DIR/implementation_smoke.py" "$DIR/IMPLEMENTATION_CONTRACT.json" "$DIR/IMPLEMENTATION.md" config/research_registry.json docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'research(0076): implement complete frozen Stage4 engine'
          git push origin HEAD:research/0076-stage4-implementation-v1
