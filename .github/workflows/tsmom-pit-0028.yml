name: TSMOM PIT 0028 Daily Eligibility

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tsmom-pit-0028.yml'
      - 'research/requirements.txt'
      - 'research/tsmom/TSMOM-PIT-0028-DAILY-ELIGIBILITY.json'
      - 'research/tsmom/run_tsmom_pit_0028_eligibility.py'
      - 'research/tsmom/test_tsmom_pit_0028_eligibility.py'
      - 'research/tsmom/run_tsmom_perp_universe_audit.py'

permissions:
  contents: read

concurrency:
  group: tsmom-pit-0028-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-eligibility-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic eligibility tests
        working-directory: research/tsmom
        run: python -m unittest -v test_tsmom_pit_0028_eligibility.py
      - name: Build full historical daily PIT perpetual eligibility
        working-directory: research/tsmom
        shell: bash
        run: |
          set -o pipefail
          python run_tsmom_pit_0028_eligibility.py | tee tsmom_pit_0028.log
      - name: Upload exact construction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsmom-pit-0028-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/tsmom/TSMOM-PIT-0028-DAILY-ELIGIBILITY.json
            research/tsmom/tsmom_pit_0028.log
            research/tsmom/tsmom_pit_0028_outputs/**
