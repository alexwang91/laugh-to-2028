name: 0073 Stage6 handoff repair

on:
  push:
    branches:
      - research/0073-stage6-controlled-boundary-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0073-stage6-controlled-boundary-v1
          fetch-depth: 0
      - name: Repair CURRENT_STATE and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          old_next = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is in progress on PR #356 / `research/0073-stage5-nonhistorical-qualification-v1`. Formal completion remains 4/10 until Stage 5 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0. Require all standing CI SUCCESS on the exact Stage-5 head and expected-head merge. Only after Stage 5 merges may a separate Stage 6 CONTROLLED BOUNDARY branch begin. No controlled scientific/history payload read is legal in Stage 5."
          new_next = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is merged at `8ccf14ecf0e1e2b0ccfa94ad3600105fb321380b`. Stage 6 CONTROLLED BOUNDARY is in progress on PR #357 / `research/0073-stage6-controlled-boundary-v1`. Formal completion remains 5/10 until Stage 6 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0; scientific source-network fetches remain 0. Stage 6 must prospectively enumerate exact authorized objects without opening controlled content. Require exact-head standing CI SUCCESS and expected-head merge. Only after Stage 6 merges may a separate Stage 7 ZERO-RESULT PREFLIGHT branch begin."
          old_state = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION IN PROGRESS / FORMAL COMPLETION 4/10 UNTIL STAGE-5 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new_state = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION MERGED / STAGE-6 CONTROLLED BOUNDARY IN PROGRESS / FORMAL COMPLETION 5/10 UNTIL STAGE-6 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          if old_next not in s:
              raise SystemExit('expected Stage5 next-step handoff not found; fail closed')
          if old_state not in s:
              raise SystemExit('expected Stage5 no-drift state not found; fail closed')
          anchor = 'workflow run                         31381953131 / attempt 1'
          if anchor not in s:
              raise SystemExit('immutable workflow anchor missing; fail closed')
          s = s.replace(old_next, new_next, 1).replace(old_state, new_state, 1)
          if anchor not in s:
              raise SystemExit('immutable workflow anchor changed; fail closed')
          p.write_text(s)
          PY
          rm .github/workflows/0073-stage6-handoff-repair.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md .github/workflows/0073-stage6-handoff-repair.yml
          git commit -m 'governance(0073): advance CURRENT_STATE to Stage 6'
          git push origin HEAD:research/0073-stage6-controlled-boundary-v1