name: 0074 Stage10 CURRENT_STATE repair

on:
  push:
    branches:
      - research/0074-stage10-immutable-closeout-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage10-immutable-closeout-v1
          fetch-depth: 0
      - name: Synchronize Stage10 closeout handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert s.count(anchor) == 1
          next_text = (
              '0073 remains immutable `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. '
              '0074 Stage 9 RESULT merged at `43907d2913e7ed225c9ac1b90297fc7815d67085`; Stage 10 IMMUTABLE CLOSEOUT is in progress on PR #371 / '
              '`research/0074-stage10-immutable-closeout-v1`; formal completion is `9/10` until closeout merge. Terminal classification remains `INVALID_EXECUTION`; '
              'attempt is permanently `1/1 CONSUMED`; final controlled scientific-history reads are `402`; scientific engine invocation is `1/1` consumed but inadmissible non-frozen harness; '
              'scientific source-network fetches are `0`; scientific values exposed `true`; no admissible strategy-performance result exists. Same-ID rerun, recompute, retune, rescue, source substitution, history extension and candidate replacement remain forbidden. '
              'The next legal action is exact-head CI and expected-head merge of Stage 10. Only after that merge may 0075 begin on a separate prospective OWNER-FIRST branch.'
          )
          pat = re.compile(r'(?ms)(^## Exact next step\n\n).*?(?=\n\n## No-drift authority)')
          s, n = pat.subn(lambda m: m.group(1) + next_text, s, count=1)
          assert n == 1
          state_line = (
              '0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / '
              'STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / '
              'STAGE-3 PREREGISTRATION MERGED AT `beae11d807886bfec65aa5cc8a26f79e92e5a0e9` / '
              'STAGE-4 IMPLEMENTATION MERGED AT `b74263cd6ab2bddd37544702fec0a187b7433151` / '
              'STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c1bf177d98e14f54c26374cf52151c9ad90733e8` / '
              'STAGE-6 CONTROLLED BOUNDARY MERGED AT `3d48f2fd837334e184dd3a9de3b8a003fa7c23a0` / '
              'STAGE-7 ZERO-RESULT PREFLIGHT MERGED AT `4e2dd98519ce9d513318beb5678ac1e00be3a04b` / '
              'STAGE-8 CONTROLLED ATTEMPT MERGED AT `8a8f1d109a4eff80df9feb7cc0cdc818568d35a8` TERMINAL `INVALID_EXECUTION` / '
              'STAGE-9 RESULT MERGED AT `43907d2913e7ed225c9ac1b90297fc7815d67085` / STAGE-10 IMMUTABLE CLOSEOUT IN PROGRESS ON #371 / '
              'FORMAL COMPLETION 9/10 UNTIL STAGE-10 MERGE / CONTROLLED ATTEMPT 1/1 CONSUMED / ACTUAL CONTROLLED READS 402 / '
              'SCIENTIFIC ENGINE 1/1 CONSUMED INADMISSIBLE NON-FROZEN HARNESS / SCIENTIFIC SOURCE NETWORK FETCHES 0 / SCIENTIFIC VALUES EXPOSED TRUE / '
              'NO ADMISSIBLE STRATEGY-PERFORMANCE RESULT / RUN_ONCE SEALED WITH INCIDENT SUPPLEMENT / NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / '
              'PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          )
          s, n = re.subn(r'(?m)^0074 =.*$', state_line, s, count=1)
          assert n == 1
          assert s.count(anchor) == 1
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot writer
        run: rm .github/workflows/0074-stage10-current-state-repair.yml
      - name: Commit closeout handoff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0074-stage10-current-state-repair.yml
          git commit -m 'governance(0074): synchronize Stage10 closeout handoff'
          git push origin HEAD:research/0074-stage10-immutable-closeout-v1
