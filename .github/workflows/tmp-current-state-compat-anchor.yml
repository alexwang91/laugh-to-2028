name: tmp-current-state-compat-anchor

on:
  push:
    branches:
      - docs/refresh-current-state-20260811
    paths:
      - .github/workflows/tmp-current-state-compat-anchor.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append compatibility anchors only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text(encoding='utf-8')
          anchor = '''

---

## 14. Machine-readable handoff compatibility anchors

These lines are retained for standing drift-audit compatibility and do not grant authority:

```text
production_authorized_components = []
handoff_compatibility_version = 1.0
```
'''
          if 'production_authorized_components = []' not in text:
              p.write_text(text.rstrip() + anchor + '\n', encoding='utf-8')
          PY
      - name: Remove temporary workflow and persist docs-only update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-current-state-compat-anchor.yml
          git add docs/CURRENT_STATE.md
          git commit -m 'docs: retain CURRENT_STATE drift-audit compatibility anchors'
          git push origin HEAD:docs/refresh-current-state-20260811
