name: tmp-current-state-compat-anchor

on:
  push:
    branches:
      - docs/refresh-current-state-20260811
    paths:
      - .github/workflows/tmp-current-state-compat-anchor.yml

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Append compatibility anchors only
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Fq 'production_authorized_components = []' docs/CURRENT_STATE.md; then
            printf '\n\n---\n\n## 14. Machine-readable handoff compatibility anchors\n\nThese lines are retained for standing drift-audit compatibility and do not grant authority:\n\n    production_authorized_components = []\n    handoff_compatibility_version = 1.0\n' >> docs/CURRENT_STATE.md
          fi
          grep -F 'production_authorized_components = []' docs/CURRENT_STATE.md
          grep -F 'handoff_compatibility_version = 1.0' docs/CURRENT_STATE.md
      - name: Remove temporary workflow and persist docs-only update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-current-state-compat-anchor.yml
          git add docs/CURRENT_STATE.md
          git commit -m 'docs: retain CURRENT_STATE drift-audit compatibility anchors'
          git push origin HEAD:docs/refresh-current-state-20260811
