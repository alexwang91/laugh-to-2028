name: 0076 Stage6 materialize authorized submanifest

on:
  push:
    branches:
      - research/0076-stage6-controlled-execution-boundary-v1
    paths:
      - .github/workflows/0076-stage6-materialize-submanifest.yml

permissions:
  contents: write

env:
  ARTIFACT_ID: "9495175701"
  EXPECTED_PARENT_MANIFEST_SHA256: "2f70384dd84a601b69528ef3d770e0fa9c714b3e0888bec009e93b5067ecebf8"
  EXPECTED_SYMBOL_UNIVERSE_SHA256: "85337b0681d4e61fc60eef62f4f05b2ea6e43f7da9e7648b4d94032794f95dbd"
  EXPECTED_COUNT: "30336"
  EXPECTED_KLINE_COUNT: "15254"
  EXPECTED_FUNDING_COUNT: "15082"
  EXPECTED_SYMBOL_COUNT: "467"

jobs:
  materialize-metadata-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download pinned parent Stage6 artifact from GitHub Actions cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > /tmp/parent.zip
      - name: Derive and validate exact metadata-only authorized submanifest
        run: |
          python - <<'PY'
          import hashlib, json, os, zipfile
          from collections import Counter
          from pathlib import Path

          artifact = Path('/tmp/parent.zip')
          out = Path('research/brrk_crypto_cross_sectional_ls_0076/AUTHORIZED_OBJECT_SUBMANIFEST.json')
          evidence = Path('research/brrk_crypto_cross_sectional_ls_0076/STAGE6_SUBMANIFEST_VALIDATION.json')
          required = [
              'canonical_object_id','source_family','symbol','month','archive_path',
              'paired_checksum_path','paired_checksum_identity','payload_sha256',
              'frozen_object_role','scientific_content_read_budget'
          ]
          allowed = {'USD_M_MONTHLY_1D_PERPETUAL_KLINE','USD_M_MONTHLY_FUNDING_RATE'}
          with zipfile.ZipFile(artifact) as z:
              names = set(z.namelist())
              parent_bytes = z.read('AUTHORIZED_OBJECT_MANIFEST.json')
              universe_bytes = z.read('STAGE6_SYMBOL_UNIVERSE.json')
              assert hashlib.sha256(parent_bytes).hexdigest() == os.environ['EXPECTED_PARENT_MANIFEST_SHA256']
              assert hashlib.sha256(universe_bytes).hexdigest() == os.environ['EXPECTED_SYMBOL_UNIVERSE_SHA256']
              parent = json.loads(parent_bytes)
              universe = json.loads(universe_bytes)
              selected = []
              for obj in parent['objects']:
                  if obj['source_family'] not in allowed: continue
                  if not obj['symbol'].endswith('USDT'): continue
                  if not ('2021-01' <= obj['month'] <= '2026-07'): continue
                  assert all(k in obj for k in required)
                  assert obj['scientific_content_read_budget'] == 1
                  assert obj['staging_status'] == 'STAGED_HASH_VERIFIED_OFFLINE_READABLE'
                  selected.append(obj)
              ids = [o['canonical_object_id'] for o in selected]
              assert len(ids) == len(set(ids)) == int(os.environ['EXPECTED_COUNT'])
              fam = Counter(o['source_family'] for o in selected)
              assert fam['USD_M_MONTHLY_1D_PERPETUAL_KLINE'] == int(os.environ['EXPECTED_KLINE_COUNT'])
              assert fam['USD_M_MONTHLY_FUNDING_RATE'] == int(os.environ['EXPECTED_FUNDING_COUNT'])
              symbols = sorted({o['symbol'] for o in selected})
              assert len(symbols) == int(os.environ['EXPECTED_SYMBOL_COUNT'])
              missing_payload = []
              missing_checksum = []
              for o in selected:
                  payload_name = 'payloads/' + o['archive_path'].replace('/','__')
                  checksum_name = 'checksums/' + o['paired_checksum_path'].replace('/','__')
                  if payload_name not in names: missing_payload.append(o['canonical_object_id'])
                  if checksum_name not in names: missing_checksum.append(o['canonical_object_id'])
              assert not missing_payload and not missing_checksum

          doc = {
              'schema_version': 1,
              'research_id': 'BRRK-CRYPTO-CROSS-SECTIONAL-LS-0076',
              'stage': 6,
              'status': 'AUTHORIZED_OBJECT_SUBMANIFEST_COMPLETE',
              'derivation_mode': 'METADATA_ONLY_OBJECT_PATH_IDENTITY_FILTER',
              'parent_research_id': 'BRRK-CRYPTO-CROSS-SECTIONAL-FACTOR-ATLAS-0075',
              'parent_artifact_id': '9495175701',
              'parent_authorized_object_manifest_sha256': os.environ['EXPECTED_PARENT_MANIFEST_SHA256'],
              'parent_symbol_universe_sha256': os.environ['EXPECTED_SYMBOL_UNIVERSE_SHA256'],
              'authorized_payload_objects': len(selected),
              'counts_by_family': dict(sorted(fam.items())),
              'candidate_symbol_count': len(symbols),
              'candidate_month_start': '2021-01',
              'candidate_month_end': '2026-07',
              'scientific_content_read_budget_each': 1,
              'controlled_scientific_history_reads': 0,
              'scientific_engine_calls': 0,
              'stage8_scientific_source_network_fetches': 0,
              'scientific_values_exposed': False,
              'objects': selected,
          }
          raw = (json.dumps(doc, sort_keys=True, separators=(',',':')) + '\n').encode()
          out.write_bytes(raw)
          sub_sha = hashlib.sha256(raw).hexdigest()
          ev = {
              'schema_version': 1,
              'research_id': 'BRRK-CRYPTO-CROSS-SECTIONAL-LS-0076',
              'lifecycle_stage': 'STAGE6_CONTROLLED_EXECUTION_BOUNDARY',
              'validation_result': 'PASS',
              'authorized_object_submanifest_path': str(out),
              'authorized_object_submanifest_sha256': sub_sha,
              'authorized_objects': len(selected),
              'unique_canonical_object_ids': len(ids),
              'duplicate_canonical_object_ids': 0,
              'eligible_symbols': len(symbols),
              'counts_by_family': dict(sorted(fam.items())),
              'selected_objects_missing_staged_payload_filename': 0,
              'selected_objects_missing_checksum_filename': 0,
              'parent_manifest_sha256_verified': True,
              'parent_symbol_universe_sha256_verified': True,
              'scientific_payload_file_contents_opened': False,
              'scientific_rows_parsed': False,
              'stage8_attempt_consumed': 0,
              'controlled_scientific_history_reads': 0,
              'scientific_engine_consumed': 0,
              'scientific_source_network_fetches': 0,
              'scientific_values_exposed': False,
              'frozen_science_changed': False,
          }
          evidence.write_text(json.dumps(ev, indent=2, sort_keys=True) + '\n')
          print(json.dumps(ev, indent=2, sort_keys=True))
          PY
      - name: Commit durable manifest and remove one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/brrk_crypto_cross_sectional_ls_0076/AUTHORIZED_OBJECT_SUBMANIFEST.json
          git add research/brrk_crypto_cross_sectional_ls_0076/STAGE6_SUBMANIFEST_VALIDATION.json
          git rm .github/workflows/0076-stage6-materialize-submanifest.yml
          git commit -m "research(0076): materialize Stage6 authorized submanifest"
          git push origin HEAD:research/0076-stage6-controlled-execution-boundary-v1
