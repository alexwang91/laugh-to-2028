name: 0054 controlled-run CURRENT_STATE update

on:
  push:
    branches:
      - research/brrk-leadership-4h-readiness-0054-controlled-run

permissions:
  contents: write

jobs:
  update-state:
    if: contains(github.event.head_commit.message, 'trigger 0054 controlled state')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-4h-readiness-0054-controlled-run
      - name: Advance authoritative 0054 controlled-run handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          s=s.replace('Current `main` research merge: **`7bc88d3dc314d052fdddf0706369974621479e8f`**', 'Current `main` research merge: **`4b599be6c8f994878c81604feed51bd18136cea2`**')
          s=s.replace('Current research branch: **`research/brrk-leadership-4h-readiness-0054-implementation`**', 'Current research branch: **`research/brrk-leadership-4h-readiness-0054-controlled-run`**')
          s=s.replace('BRRK 4h-native readiness 0054          IMPLEMENTATION-ONLY / DATA REUSED / NO RESULT', 'BRRK 4h-native readiness 0054          CONTROLLED-RUN BOUNDARY / ZERO RESULT')
          s=s.replace('design status                           FROZEN / PREREGISTERED / IMPLEMENTATION-ONLY / NOT RUN', 'design status                           FROZEN / PREREGISTERED / IMPLEMENTATION MERGED / CONTROLLED-RUN BOUNDARY / NOT RUN')
          section='''\n\n## 14. 0054 controlled exactly-once methodology boundary\n\nThe zero-result implementation merge is `4b599be6c8f994878c81604feed51bd18136cea2`. `RUN_INTERFACE.json`, `RESULT_SCHEMA.json`, staged `run_once.py`, `test_run_interface.py` and `CONTROLLED_EXECUTION_BOUNDARY.json` now exist on the controlled-run branch.\n\n```text\npreflight authority                       REPEATABLE / ZERO RESULT\nattempt marker                            ABSENT\nmethod result                              ABSENT\nexecution artifact                        ABSENT\nfinal marker                              ABSENT\ntraining readiness                        UNKNOWN\ncalibration readiness                     UNKNOWN\nreserved suffix support                   UNKNOWN\n0054 classification                       UNKNOWN\nactual variants evaluated                 0\npost-2022 target values read              false\npredictive metrics                        FORBIDDEN / NONE\nportfolio economics                       FORBIDDEN / NONE\nproduction authority                      NO CHANGE\n```\n\nAfter this boundary merges fully green, the only permitted scientific action is the staged unique measurement: exact-head preflight -> durably persist attempt marker -> evaluate once -> durably persist method result/execution -> finalize marker without remeasurement. No execution is authorized before this boundary merges.\n'''
          if '## 14. 0054 controlled exactly-once methodology boundary' not in s:
              s += section
          p.write_text(s)
          PY
          git config user.name 'Y_Wang'
          git config user.email '40142450+alexwang91@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m 'Research execution boundary handoff: activate 0054 controlled-run zero-result state'
          git push origin HEAD:research/brrk-leadership-4h-readiness-0054-controlled-run
