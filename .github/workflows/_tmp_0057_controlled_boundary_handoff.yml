name: Temporary 0057 controlled-boundary handoff

on:
  push:
    branches:
      - research/0057-controlled-boundary-tooling

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0057-simple-beta-router-interface-replication-controlled-run
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record zero-result boundary evidence and handoff
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          RID='BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-INTERFACE-REPLICATION-0057'
          base=Path('research/brrk_simple_eth_sol_beta_router_interface_replication_0057')
          bp=base/'CONTROLLED_EXECUTION_BOUNDARY.json'
          b=json.loads(bp.read_text())
          assert b['research_id']==RID
          assert b['actual_variants_evaluated']==0
          b['boundary_fault_contract_evidence']={
            'initial_tooling_run':31613437898,
            'initial_tooling_failure':'TEST_RUNTIME_DEPENDENCY_ONLY_MISSING_REQUESTS_BEFORE_CONTROLLED_RUN_TEST_IMPORT',
            'initial_adapter_tests_passed':7,
            'initial_historical_payload_loaded':False,
            'initial_historical_portfolio_economics_executed':False,
            'successful_tooling_run':31613546954,
            'adapter_contract_tests_passed':7,
            'controlled_run_fault_contract_tests_passed':10,
            'total_boundary_tests_passed':17,
            'zero_result_guard_passed':True,
            'governance_validate_passed_with_only_legacy_debt_warnings':True,
            'no_drift_passed':True,
            'real_0057_historical_payload_loaded':False,
            'real_0057_portfolio_economics_executed':False,
            'actual_historical_variants_evaluated':0
          }
          bp.write_text(json.dumps(b,indent=2)+'\n')

          rp=base/'README.md'
          r=rp.read_text()
          r=r.replace('Status: **IMPLEMENTATION-ONLY / SYNTHETIC CONTRACTS PASS / REAL HISTORICAL RUN NOT RUN**','Status: **CONTROLLED-EXECUTION BOUNDARY ON BRANCH / ZERO RESULT / REAL HISTORICAL RUN NOT RUN**',1)
          r=r.replace('implementation                 FROZEN ON BRANCH / SYNTHETIC ONLY','implementation                 MERGED AT 6ea85e0b55566cc1aeed705eae35ad81f165e56d',1)
          r=r.replace('controlled execution boundary  ABSENT','controlled execution boundary  FROZEN ON BRANCH / ZERO RESULT',1)
          old='Synthetic run `31611937198` passed 15 immutable 0056 engine tests plus 7 new 0057 adapter tests and a zero-result guard. No real market payload was loaded; actual historical variants remain 0. Real historical portfolio evaluation is still forbidden until this implementation stage merges and a separate controlled-execution boundary merges.'
          new=old+' Controlled-boundary run `31613546954` additionally passed 7 adapter tests plus 10 exactly-once/fault-contract tests and a second zero-result guard. The first boundary tooling run `31613437898` failed only because the test environment omitted `requests`; it produced no research output. Historical evaluation remains forbidden until this boundary is merged and an explicit unique execution is separately triggered.'
          r=r.replace(old,new,1)
          rp.write_text(r)

          sp=Path('docs/CURRENT_STATE.md')
          s=sp.read_text()
          s=s.replace('Current research branch: **`research/0057-simple-beta-router-interface-replication-implementation`**','Current research branch: **`research/0057-simple-beta-router-interface-replication-controlled-run`**',1)
          s=s.replace('BRRK Beta router interface replication 0057 IMPLEMENTATION-ONLY / SYNTHETIC PASS / REAL RUN NOT RUN','BRRK Beta router interface replication 0057 CONTROLLED-RUN BOUNDARY / ZERO RESULT / REAL HISTORICAL RUN NOT RUN',1)
          if '## 21. 0057 controlled-execution boundary handoff' not in s:
              s += '''\n\n---\n\n## 21. 0057 controlled-execution boundary handoff\n\n0057 implementation merged at `6ea85e0b55566cc1aeed705eae35ad81f165e56d`. The controlled boundary now freezes `RUN_INTERFACE.json`, `RESULT_SCHEMA.json`, an exactly-once `run_once.py`, fault-contract tests and `CONTROLLED_EXECUTION_BOUNDARY.json`; no runtime marker or historical result exists.\n\nThe execution state machine is fixed as `preflight → durable RUN_ATTEMPT.marker → exactly one real evaluate → durable PRIMARY_RESULT.json + EXECUTION.json → marker-only RUN_ONCE.marker`. Evaluation cannot call the adapter before the attempt marker exists. Existing partial result artifacts block automatic recomputation. Finalization does not read market evidence and cannot call the 0047 loader, 0057 adapter or 0056 scientific engine.\n\nReal-data path is frozen as immutable market wrapper → 0047 `frames_from_market_evidence()` tz-naive frames → ETH/SOL selection → 0057 copy + `tz_localize("UTC")` adapter → immutable 0056 engine blob `b0fc1ac267a66593e7e2c4687aff81491bfcdf5a` → 0057 result schema. No alternate loader or portfolio-science rewrite is authorized.\n\nBoundary Actions run `31613546954` passed 7 adapter contracts plus 10 exactly-once/fault contracts, the zero-result static guard, governance validation and no-drift. It explicitly confirmed `REAL_0057_HISTORICAL_PAYLOAD_NOT_LOADED=true`, `REAL_0057_PORTFOLIO_ECONOMICS_NOT_EXECUTED=true`, and `ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0`. Earlier run `31613437898` failed only at test import because `requests` was missing and produced no historical output.\n\nAfter this boundary merges, 0057 will be technically eligible for exactly one DEVELOPMENT historical execution. That execution is irreversible once the durable attempt marker is pushed; it is not part of this boundary PR.\n'''
          sp.write_text(s)
          PY
      - name: Validate final zero-result boundary surface
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift
          python -m json.tool research/brrk_simple_eth_sol_beta_router_interface_replication_0057/CONTROLLED_EXECUTION_BOUNDARY.json >/dev/null
          git diff --check -- research/brrk_simple_eth_sol_beta_router_interface_replication_0057
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md research/brrk_simple_eth_sol_beta_router_interface_replication_0057/README.md research/brrk_simple_eth_sol_beta_router_interface_replication_0057/CONTROLLED_EXECUTION_BOUNDARY.json
          git commit -m 'Research controlled boundary [DRIFT_0]: finalize 0057 zero-result handoff'
          python -m research.governance.no_drift
          git push origin HEAD:research/0057-simple-beta-router-interface-replication-controlled-run
