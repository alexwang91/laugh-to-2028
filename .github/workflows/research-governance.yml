name: Research governance core

on:
  pull_request:
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'
  push:
    branches: [main]
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      emergency_drill:
        description: 'Run zero-authority hypothetical emergency drill; never scheduled-decision credit.'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  governance-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned execution test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Run governance unit tests
        run: python -m unittest discover -s research/governance -p 'test_*.py'
      - name: Verify Phase 6 live-observation preactivation gate
        run: python -m research.governance.phase6_live_observation_gate
      - name: Run STABLECOIN-LIQUIDITY-0001 data-contract unit tests
        run: python -m unittest discover -s research/stablecoin_liquidity_0001 -p 'test_*.py'
      - name: Validate canonical registries
        run: python -m research.governance.validate
      - name: Enforce post-boundary formal research registration
        if: github.event_name == 'pull_request'
        run: python -m research.governance.enforce_future --base "${{ github.event.pull_request.base.sha }}"
      - name: Run final no-drift regression
        run: python -m research.governance.no_drift
      - name: Emit deterministic audit twice
        run: |
          python -m research.governance.audit --json > /tmp/audit-a.json
          python -m research.governance.audit --json > /tmp/audit-b.json
          diff -u /tmp/audit-a.json /tmp/audit-b.json
          cat /tmp/audit-a.json

  phase6-live-observation:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned execution test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Read Phase 6 ARM state
        id: gate
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          gate = json.loads(Path('research/governance/phase6_live_observation_gate.json').read_text())
          print('armed=' + ('true' if gate.get('collector_armed') is True else 'false'))
          PY
      - name: Collect public/read-only Phase 6 observation
        id: collect
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python -m research.governance.phase6_pr_preflight \
              --output-dir phase6_evidence \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --workflow-sha "${{ github.sha }}"
          else
            EXTRA=()
            if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.emergency_drill }}" == "true" ]]; then
              EXTRA+=(--emergency-drill)
            fi
            python -m research.governance.phase6_live_run collect \
              --output-dir phase6_evidence \
              --event-name "${{ github.event_name }}" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --workflow-sha "${{ github.sha }}" \
              "${EXTRA[@]}"
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          path = Path('phase6_evidence/evidence_metadata.json')
          if path.exists():
              row = json.loads(path.read_text())
              print('decision_slug=' + row['decision_slug'])
          PY
      - name: Upload pull-request preflight diagnostic
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: phase6-pr-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_evidence/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Upload unarmed manual preflight diagnostic
        if: always() && github.event_name == 'workflow_dispatch' && steps.gate.outputs.armed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase6-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_evidence/
          if-no-files-found: error
          retention-days: 7
          overwrite: false
      - name: Upload armed evidence bundle
        if: success() && github.event_name != 'pull_request' && steps.gate.outputs.armed == 'true'
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-evidence-${{ steps.collect.outputs.decision_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_evidence/
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Create hash-bound receipt after evidence upload
        if: success() && github.event_name != 'pull_request' && steps.gate.outputs.armed == 'true'
        run: |
          python -m research.governance.phase6_live_collector finalize-receipt \
            --evidence-dir phase6_evidence \
            --output phase6_receipt/receipt.json \
            --artifact-id "${{ steps.evidence.outputs.artifact-id }}" \
            --artifact-url "${{ steps.evidence.outputs.artifact-url }}" \
            --artifact-digest "${{ steps.evidence.outputs.artifact-digest }}"
      - name: Upload separate receipt artifact before credit
        if: success() && github.event_name != 'pull_request' && steps.gate.outputs.armed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: phase6-receipt-${{ steps.collect.outputs.decision_slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: phase6_receipt/receipt.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false

  owner-first-registry-writer:
    name: Guarded OWNER-FIRST registry writer
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'research/0083-owner-first-v1'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1
      - name: Apply prospective owner-first request if present
        shell: bash
        run: |
          REQUEST='research/governance/owner_first_requests/0083.json'
          if [[ ! -f "$REQUEST" ]]; then
            echo 'No 0083 owner-first request present; no mutation.'
            exit 0
          fi

          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          request_path = Path('research/governance/owner_first_requests/0083.json')
          request = json.loads(request_path.read_text(encoding='utf-8'))
          assert request['schema_version'] == 1
          assert request['target_branch'] == 'research/0083-owner-first-v1'
          assert request['new_research_id'] == 'BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-REPLACEMENT-0083'
          assert request['template_research_id'] == 'BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-0071'
          assert request['governance_resolution_merge'] == 'b58960ee3bc9e5cc5976d889cc28026614525686'
          assert request['controlled_reads'] == 0
          assert request['attempt_consumed'] == 0
          assert request['production_authorized'] is False

          registry_path = Path('config/research_registry.json')
          raw = registry_path.read_text(encoding='utf-8')
          data = json.loads(raw)
          old_id = request['template_research_id']
          new_id = request['new_research_id']
          assert not any(row.get('research_id') == new_id for row in data['records'])
          source = next(row for row in data['records'] if row.get('research_id') == old_id)
          new = copy.deepcopy(source)

          def replace_token(value):
              if isinstance(value, str):
                  return value.replace('0071', '0083')
              if isinstance(value, list):
                  return [replace_token(item) for item in value]
              if isinstance(value, dict):
                  return {key: replace_token(item) for key, item in value.items()}
              return value

          new = replace_token(new)
          for key, value in request['top_level_overrides'].items():
              new[key] = value

          new['research_id'] = new_id
          new['created_at'] = request['created_at']
          new['created_before_result'] = True
          new['actual_variants_evaluated'] = 0
          new['result_status'] = 'PREREGISTERED_NOT_RUN'
          new['failure_reason'] = None
          new['promotion_state'] = 'NONE'
          new['evidence_refs'] = []
          new['production_authorized'] = False
          new['provenance_status'] = 'PROSPECTIVE_FROZEN'
          new['governed_path_prefixes'] = [request['governed_path_prefix']]
          new['lineage_edges'] = [{
              'relation': 'MEASUREMENT_FIX',
              'ref_research_id': old_id,
              'provenance_status': 'FACT',
              'evidence_ref': request['governance_resolution_path'],
          }]
          new['decision_refs'] = [request['governance_resolution_path'], 'docs/CURRENT_STATE.md']
          new['researcher_decisions'] = request['researcher_decisions'] + list(new.get('researcher_decisions', []))
          new['notes'] = request['notes']

          marker = '\n  ],\n  "research_governance_debt": ['
          pos = raw.rfind(marker)
          assert pos > 0, 'registry records/debt boundary not found'
          rendered = json.dumps(new, indent=2, ensure_ascii=False)
          rendered = '\n'.join('    ' + line for line in rendered.splitlines())
          updated = raw[:pos] + ',\n' + rendered + raw[pos:]
          parsed = json.loads(updated)
          assert len(parsed['records']) == len(data['records']) + 1
          assert parsed['records'][-1]['research_id'] == new_id
          assert parsed['research_governance_debt'] == data['research_governance_debt']
          registry_path.write_text(updated, encoding='utf-8')

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text(encoding='utf-8')
          immutable = 'workflow run                         31381953131 / attempt 1'
          assert state.count(immutable) == 1
          for old, replacement in request['current_state_replacements']:
              assert old in state, f'missing CURRENT_STATE anchor: {old}'
              state = state.replace(old, replacement, 1)
          assert state.count(immutable) == 1
          state_path.write_text(state, encoding='utf-8')
          PY

          python -m research.governance.validate
          python -m research.governance.no_drift
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json docs/CURRENT_STATE.md
          git rm "$REQUEST"
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' 'config/research_registry.json' 'docs/CURRENT_STATE.md' "$REQUEST" | sort)"
          git commit -m 'governance(0083): register replacement OWNER-FIRST'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
