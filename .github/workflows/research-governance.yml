name: Research governance core

on:
  pull_request:
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'
  push:
    branches: [main]
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'

jobs:
  governance-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run governance unit tests
        run: python -m unittest discover -s research/governance -p 'test_*.py'
      - name: Verify Phase 6 live-observation preactivation gate
        run: python -m research.governance.phase6_live_observation_gate
      - name: Run STABLECOIN-LIQUIDITY-0001 data-contract unit tests
        run: python -m unittest discover -s research/stablecoin_liquidity_0001 -p 'test_*.py'
      - name: Validate canonical registries
        run: python -m research.governance.validate
      - name: Enforce post-boundary formal research registration
        if: github.event_name == 'pull_request'
        run: python -m research.governance.enforce_future --base "${{ github.event.pull_request.base.sha }}"
      - name: Run final no-drift regression
        run: python -m research.governance.no_drift
      - name: Emit deterministic audit twice
        run: |
          python -m research.governance.audit --json > /tmp/audit-a.json
          python -m research.governance.audit --json > /tmp/audit-b.json
          diff -u /tmp/audit-a.json /tmp/audit-b.json
          cat /tmp/audit-a.json

  brrk-signal-attribution-diagnostic:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements.txt
      - name: Install canonical BRRK runtime dependencies
        working-directory: execution/plan-b-bot
        run: pip install -r requirements-dev.txt
      - name: Download frozen exposed Stablecoin raw artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9022927539/zip" -o /tmp/stablecoin.zip
          mkdir -p /tmp/stablecoin
          unzip -q /tmp/stablecoin.zip -d /tmp/stablecoin
          RAW=$(find /tmp/stablecoin -type f -print0 | xargs -0 sha256sum | awk '$1=="7cffe6fb3a21e891082c06c60e91491edfbc78e9c01e2d549805815a646d9ffd" {print $2; exit}')
          test -n "$RAW"
          echo "STABLECOIN_RAW=$RAW" >> "$GITHUB_ENV"
      - name: Execute frozen attribution audit
        run: |
          PYTHONPATH=. python research/governance/run_brrk_signal_attribution_audit.py \
            --stablecoin-raw "$STABLECOIN_RAW" \
            --output /tmp/brrk_signal_attribution_result.json
      - name: Upload attribution result
        uses: actions/upload-artifact@v4
        with:
          name: brrk-signal-attribution-${{ github.sha }}
          path: /tmp/brrk_signal_attribution_result.json
          if-no-files-found: error
          retention-days: 30
