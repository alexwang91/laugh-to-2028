name: Research governance core

on:
  pull_request:
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'
  push:
    branches: [main]
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'

permissions:
  contents: read
  actions: read

jobs:
  governance-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run governance unit tests
        run: python -m unittest discover -s research/governance -p 'test_*.py'
      - name: Run STABLECOIN-LIQUIDITY-0001 data-contract unit tests
        run: python -m unittest discover -s research/stablecoin_liquidity_0001 -p 'test_*.py'
      - name: Validate canonical registries
        run: python -m research.governance.validate
      - name: Enforce post-boundary formal research registration
        if: github.event_name == 'pull_request'
        run: python -m research.governance.enforce_future --base "${{ github.event.pull_request.base.sha }}"
      - name: Run final no-drift regression
        run: python -m research.governance.no_drift
      - name: Emit deterministic audit twice
        run: |
          python -m research.governance.audit --json > /tmp/audit-a.json
          python -m research.governance.audit --json > /tmp/audit-b.json
          diff -u /tmp/audit-a.json /tmp/audit-b.json
          cat /tmp/audit-a.json

  stablecoin-stage1-preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements.txt
      - name: Install frozen Stage-1 runtime
        working-directory: execution/plan-b-bot
        run: pip install -r requirements-dev.txt
      - name: Compile result executor and price capture
        run: |
          python -m py_compile research/stablecoin_liquidity_0001/stage1_execution.py
          python -m py_compile research/stablecoin_liquidity_0001/stage1_price_capture.py
      - name: Run synthetic Stage-1 execution self-test only
        run: python -m research.stablecoin_liquidity_0001.stage1_execution --self-test

  stablecoin-stage1-execution:
    needs: governance-core
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      contains(github.event.head_commit.message, '[STABLECOIN_STAGE1_EXECUTE_V1]')
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements.txt
      - name: Install frozen Stage-1 runtime
        working-directory: execution/plan-b-bot
        run: pip install -r requirements-dev.txt
      - name: Refuse any same-run prior Stage-1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_NAME: stablecoin-stage1-binance-input-${{ github.sha }}
          RESULT_NAME: stablecoin-stage1-primary-result-${{ github.sha }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > "${RUNNER_TEMP}/existing-artifacts.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('existing-artifacts.json').read_text())
          names={a.get('name') for a in d.get('artifacts',[]) if not a.get('expired',False)}
          blocked={os.environ['INPUT_NAME'], os.environ['RESULT_NAME']}.intersection(names)
          if blocked:
              raise SystemExit(f'refusing repeat Stage-1 execution; existing artifacts: {sorted(blocked)}')
          PY
      - name: Verify irreversible marker and frozen execution contract
        run: python -m research.stablecoin_liquidity_0001.stage1_execution --self-test
      - name: Download frozen Stablecoin first-capture raw artifact
        uses: actions/download-artifact@v4
        with:
          name: stablecoin-first-capture-raw-824f58151bcef2203c320e4b94b8070dcac77dae
          path: ${{ runner.temp }}/stablecoin-first-capture
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31261566204
      - name: Locate and verify Stablecoin raw identity before market capture
        id: stablecoin
        env:
          EXPECTED_SHA: 7cffe6fb3a21e891082c06c60e91491edfbc78e9c01e2d549805815a646d9ffd
        run: |
          set -euo pipefail
          python - <<'PY' >> "${GITHUB_OUTPUT}"
          import hashlib, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'stablecoin-first-capture'
          expected=os.environ['EXPECTED_SHA']
          matches=[]
          for p in root.rglob('*.json'):
              if p.name.endswith('.manifest.json') or p.name == 'stablecoin-staging.json':
                  continue
              if hashlib.sha256(p.read_bytes()).hexdigest()==expected:
                  matches.append(p)
          if len(matches)!=1:
              raise SystemExit(f'expected exactly one Stablecoin raw file with frozen hash, found {len(matches)}')
          print(f'stablecoin_raw={matches[0]}')
          PY
      - name: Capture exact Binance Stage-1 input pages before evaluation
        id: price_capture
        run: |
          set -euo pipefail
          ROOT="${RUNNER_TEMP}/stablecoin-stage1-binance"
          SUMMARY="${RUNNER_TEMP}/stablecoin-stage1-binance-capture-summary.json"
          python -m research.stablecoin_liquidity_0001.stage1_price_capture --root "${ROOT}" > "${SUMMARY}"
          echo "root=${ROOT}" >> "${GITHUB_OUTPUT}"
          echo "summary=${SUMMARY}" >> "${GITHUB_OUTPUT}"
          echo "manifest=${ROOT}/BINANCE_STAGE1_CAPTURE_MANIFEST.json" >> "${GITHUB_OUTPUT}"
      - name: Archive exact Binance inputs before any Stage-1 evaluation
        id: input_archive
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-stage1-binance-input-${{ github.sha }}
          path: |
            ${{ steps.price_capture.outputs.root }}/**
            ${{ steps.price_capture.outputs.summary }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Create Binance durability receipt from immutable artifact identity
        id: receipt
        env:
          MANIFEST: ${{ steps.price_capture.outputs.manifest }}
          RECEIPT: ${{ runner.temp }}/stablecoin-stage1-binance-durability-receipt.json
          ARTIFACT_ID: ${{ steps.input_archive.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.input_archive.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          manifest=Path(os.environ['MANIFEST'])
          artifact_id=os.environ['ARTIFACT_ID']
          artifact_url=os.environ['ARTIFACT_URL']
          if not artifact_id or not artifact_url:
              raise SystemExit('missing immutable Binance artifact identity')
          receipt={
              'schema_version':1,
              'research_id':'STABLECOIN-LIQUIDITY-0001',
              'run_interface_id':'STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1',
              'execution_id':'STABLECOIN-LIQUIDITY-0001-STAGE1-RUN-V1',
              'manifest_sha256':hashlib.sha256(manifest.read_bytes()).hexdigest(),
              'durable_backend':'GITHUB_ACTIONS_ARTIFACT_V4',
              'artifact_id':artifact_id,
              'artifact_url':artifact_url,
              'archived_at':datetime.now(timezone.utc).isoformat().replace('+00:00','Z'),
              'overwrite':False,
          }
          Path(os.environ['RECEIPT']).write_text(json.dumps(receipt,sort_keys=True,separators=(',',':'))+'\n')
          PY
          echo "path=${RECEIPT}" >> "${GITHUB_OUTPUT}"
      - name: Archive Binance durability receipt before evaluation
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-stage1-binance-receipt-${{ github.sha }}
          path: ${{ steps.receipt.outputs.path }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Execute exactly one frozen Stage-1 variant
        id: stage1
        env:
          RESULT: ${{ runner.temp }}/stablecoin-stage1-primary-result.json
        run: |
          set -euo pipefail
          python -m research.stablecoin_liquidity_0001.stage1_execution \
            --stablecoin-raw "${{ steps.stablecoin.outputs.stablecoin_raw }}" \
            --binance-root "${{ steps.price_capture.outputs.root }}" \
            --binance-receipt "${{ steps.receipt.outputs.path }}" \
            --output "${RESULT}"
          echo "result=${RESULT}" >> "${GITHUB_OUTPUT}"
      - name: Durably archive primary-only result before release
        id: result_archive
        uses: actions/upload-artifact@v4
        with:
          name: stablecoin-stage1-primary-result-${{ github.sha }}
          path: ${{ steps.stage1.outputs.result }}
          if-no-files-found: error
          overwrite: false
          retention-days: 90
      - name: Release only frozen primary result fields
        env:
          RESULT: ${{ steps.stage1.outputs.result }}
          RESULT_ARTIFACT_ID: ${{ steps.result_archive.outputs.artifact-id }}
        run: |
          python - <<'PY' >> "${GITHUB_STEP_SUMMARY}"
          import json, os
          from pathlib import Path
          r=json.loads(Path(os.environ['RESULT']).read_text())
          allowed=('research_id','run_interface_id','classification','valid_oos_prediction_count','mean_primary_loss_differential','hac_max_lag','hac_test_statistic','hac_one_sided_p_value','primary_result_digest')
          if set(r)!=set(allowed):
              raise SystemExit('primary release fields drifted')
          print('## STABLECOIN-LIQUIDITY-0001 Stage-1 primary result')
          for key in allowed:
              print(f'- **{key}**: `{r[key]}`')
          print(f'- **result_artifact_id**: `{os.environ["RESULT_ARTIFACT_ID"]}`')
          PY
