name: Research governance core

on:
  pull_request:
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'
  push:
    branches: [main]
    paths:
      - 'config/research_governance_v1.json'
      - 'config/research_registry.json'
      - 'config/dataset_exposure_registry.json'
      - 'config/edge_registry.json'
      - 'research/**'
      - 'README.md'
      - 'docs/CURRENT_STATE.md'
      - 'docs/NEXT_STEPS.md'
      - 'docs/PROJECT_GOVERNANCE_2026-08-05.md'
      - 'docs/PROGRAM_GOVERNANCE_*.md'
      - 'docs/PROGRAM_LEVEL_EPISTEMIC_GOVERNANCE_V1_FINAL_REPORT_2026-08-08.md'
      - '.github/workflows/research-governance.yml'

jobs:
  governance-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run governance unit tests
        run: python -m unittest discover -s research/governance -p 'test_*.py'
      - name: Verify Phase 6 live-observation preactivation gate
        run: python -m research.governance.phase6_live_observation_gate
      - name: Run STABLECOIN-LIQUIDITY-0001 data-contract unit tests
        run: python -m unittest discover -s research/stablecoin_liquidity_0001 -p 'test_*.py'
      - name: Validate canonical registries
        run: python -m research.governance.validate
      - name: Enforce post-boundary formal research registration
        if: github.event_name == 'pull_request'
        run: python -m research.governance.enforce_future --base "${{ github.event.pull_request.base.sha }}"
      - name: Run final no-drift regression
        run: python -m research.governance.no_drift
      - name: Emit deterministic audit twice
        run: |
          python -m research.governance.audit --json > /tmp/audit-a.json
          python -m research.governance.audit --json > /tmp/audit-b.json
          diff -u /tmp/audit-a.json /tmp/audit-b.json
          cat /tmp/audit-a.json

  phase6-identity-probe:
    runs-on: ubuntu-latest
    env:
      PHASE6_OBSERVATION_ADDRESS: '0xc9f3904a5cd7e417309fcae7d2d642594b03735c'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Query and preserve public Hyperliquid identity surfaces
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          address = os.environ['PHASE6_OBSERVATION_ADDRESS']
          endpoint = 'https://api.hyperliquid.xyz/info'
          out = Path('/tmp/phase6_identity_probe')
          out.mkdir(parents=True, exist_ok=True)

          def post(payload):
              body = json.dumps(payload, separators=(',', ':')).encode('utf-8')
              req = urllib.request.Request(endpoint, data=body, headers={'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(req, timeout=30) as resp:
                  return resp.read()

          role_raw = post({'type': 'userRole', 'user': address})
          abstraction_raw = post({'type': 'userAbstraction', 'user': address})
          role_obj = json.loads(role_raw)
          abstraction_obj = json.loads(abstraction_raw)
          verified_at = datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z')
          summary = {
              'account_address': address,
              'verified_at': verified_at,
              'user_role_response': role_obj,
              'user_abstraction_response': abstraction_obj,
              'raw_response_sha256': {
                  'userRole': hashlib.sha256(role_raw).hexdigest(),
                  'userAbstraction': hashlib.sha256(abstraction_raw).hexdigest(),
              },
          }
          (out / 'userRole.raw.json').write_bytes(role_raw)
          (out / 'userAbstraction.raw.json').write_bytes(abstraction_raw)
          (out / 'summary.json').write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('PHASE6_IDENTITY_RAW=' + json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY
      - name: Upload identity evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase6-identity-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/phase6_identity_probe
          if-no-files-found: error
          retention-days: 90
          overwrite: false
      - name: Verify frozen identity contract compatibility
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from research.governance.phase6_live_account_identity import verify_identity_observation
          summary = json.loads(Path('/tmp/phase6_identity_probe/summary.json').read_text())
          result = verify_identity_observation(
              account_address=summary['account_address'],
              user_role_response=summary['user_role_response'],
              user_abstraction_response=summary['user_abstraction_response'],
          )
          print('PHASE6_IDENTITY_VERIFIED=' + json.dumps(result, sort_keys=True, separators=(',', ':')))
          PY
