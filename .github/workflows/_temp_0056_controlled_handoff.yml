name: Temporary 0056 controlled handoff

on:
  push:
    branches:
      - research/0056-simple-beta-router-controlled-run

permissions:
  contents: write

jobs:
  handoff:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Advance zero-result handoff only
        run: |
          python - <<'PY'
          from pathlib import Path

          readme_path = Path('research/brrk_simple_eth_sol_beta_router_0056/README.md')
          readme = readme_path.read_text()
          old_status = 'Status: **NUMERICAL PREREGISTRATION MERGED / IMPLEMENTATION-ONLY ON BRANCH / REAL HISTORICAL RUN FORBIDDEN**'
          new_status = 'Status: **CONTROLLED-EXECUTION BOUNDARY ON BRANCH / ZERO RESULT / REAL HISTORICAL RUN NOT RUN**'
          assert old_status in readme
          readme = readme.replace(old_status, new_status, 1)
          anchor = '## Current authority\n'
          assert anchor in readme
          controlled = '''## Controlled-execution boundary\n\nThe separate controlled-run layer is now frozen on this branch. It binds the merged preregistration, dataset declaration, implementation boundary, scientific engine, synthetic contract test, immutable 0048 source engine/declaration, and the exact 0047 `MARKET_EVIDENCE.json` git blob plus payload SHA256.\n\nRuntime state is staged and create-only:\n\n```text\npreflight       repeatable / zero result\nstart-attempt   create RUN_ATTEMPT.marker and permanently close same-ID recomputation authority\nevaluate        requires durable attempt marker; load the frozen market evidence and call the frozen 0056 portfolio engine exactly once\nfinalize        hash verification only; market loader and portfolio engine calls forbidden\n```\n\nFrozen runtime artifacts are `RUN_ATTEMPT.marker`, `PRIMARY_RESULT.json`, `EXECUTION.json`, and `RUN_ONCE.marker`. This boundary branch contains none of them. A complete result+execution bundle with only the final marker missing may use marker-only recovery; any interruption after the attempt marker but before a complete result/execution bundle forbids automatic same-ID remeasurement.\n\nThe result schema permits only the preregistered 0056 portfolio-economic outputs and diagnostics. It rejects probability/predictive metrics, hindsight winner/oracle metrics, BTC/cash integration, CORE4, leverage and shorting. The classification must mechanically match frozen G0-G4 precedence.\n\nSynthetic/fault run `31602817149` passed the implementation contracts, controlled-run fault contracts and zero-result guard. It did not evaluate the real 0056 historical payload.\n\n'''
          readme = readme.replace(anchor, controlled + anchor, 1)
          readme = readme.replace('implementation                IMPLEMENTATION-ONLY ON BRANCH', 'implementation                MERGED AT 9417bc3370613f1818d11aebf91bf733ac5ecbcc', 1)
          readme = readme.replace('controlled execution boundary ABSENT', 'controlled execution boundary FROZEN ON BRANCH / ZERO RESULT', 1)
          readme = readme.replace('After this implementation-only branch merges green, the only allowed next stage is a **separate controlled-execution boundary**. No real 0056 historical evaluation is authorized by the implementation merge itself.', 'After this controlled-execution boundary merges green, the only allowed next action is the unique staged DEVELOPMENT execution from the exact merged boundary HEAD: zero-result preflight, durable attempt marker, exactly one real evaluation, durable result/execution bundle, then marker-only finalization. No real 0056 historical evaluation is authorized while this boundary remains unmerged.', 1)
          readme_path.write_text(readme)

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text()
          old_main = 'Current `main` research merge: **`85bbc8583b625da670267cbb3db4928fbe1ade6f`**'
          old_branch = 'Current research branch: **`research/0056-simple-beta-router-implementation`**'
          assert old_main in state
          assert old_branch in state
          state = state.replace(old_main, 'Current `main` research merge: **`9417bc3370613f1818d11aebf91bf733ac5ecbcc`**', 1)
          state = state.replace(old_branch, 'Current research branch: **`research/0056-simple-beta-router-controlled-run`**', 1)
          old_exec = 'BRRK simple ETH/SOL Beta router 0056  PREREG MERGED / IMPLEMENTATION-ONLY / REAL HISTORICAL RUN FORBIDDEN'
          assert old_exec in state
          state = state.replace(old_exec, 'BRRK simple ETH/SOL Beta router 0056  CONTROLLED-RUN BOUNDARY / ZERO RESULT / REAL HISTORICAL RUN NOT RUN', 1)
          marker = '## 17. 0056 controlled-execution boundary — zero-result'
          assert marker not in state
          state += '''\n\n---\n\n## 17. 0056 controlled-execution boundary — zero-result\n\nThe 0056 implementation merged at `9417bc3370613f1818d11aebf91bf733ac5ecbcc`. The active branch now adds only the separate exactly-once execution safety layer around that frozen engine. Older 0056 implementation-stage next-step prose above is historical and is superseded by this section.\n\n```text\nresearch ID                           BRRK-SIMPLE-ETH-SOL-BETA-ROUTER-0056\nprereg merge                          85bbc8583b625da670267cbb3db4928fbe1ade6f\nimplementation merge                  9417bc3370613f1818d11aebf91bf733ac5ecbcc\nimplementation engine blob            b0fc1ac267a66593e7e2c4687aff81491bfcdf5a\nimplementation boundary blob          f04cc9cba9a038b2fd770aec3d47825226c24977\nmarket evidence blob                  64ebf5c6deaf3f34dbeac715378f196ff0f4fafe\npayload SHA256                        d1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193\ncontrolled execution boundary         FROZEN ON BRANCH / ZERO RESULT\nhistorical execution                  NOT RUN\nresult                                PREREGISTERED_NOT_RUN\nactual historical variants evaluated  0\n```\n\nThe staged protocol is `preflight -> durable RUN_ATTEMPT.marker -> exactly one evaluate -> durable PRIMARY_RESULT.json + EXECUTION.json -> marker-only RUN_ONCE.marker finalize`. Once the attempt marker is durable, same-ID automatic recomputation, retuning and rescue are forbidden. Only a complete result/execution bundle with a missing final marker may use marker-only recovery without remeasurement.\n\nThe controlled result schema freezes the existing G0-G4 taxonomy and allows only preregistered terminal wealth/CAGR, MDD, turnover/switch/holding diagnostics, calendar-year and fixed-block attribution, 5/10/20 bps cost sensitivity and the paired 60-row moving-block bootstrap. Probability/predictive metrics, hindsight winner/oracle metrics, BTC/cash integration, CORE4, leverage and shorting remain forbidden.\n\nSynthetic/fault Actions run `31602817149` passed implementation contracts, controlled state-machine tests, hash-tamper rejection, exactly-once call checks, marker-only finalization checks and the zero-result guard. No real 0056 historical payload was evaluated.\n\n```text\nCanonical BRRK-0011                    NO CHANGE\nPhase 6                                NO CHANGE\nproduction_authorized_components       []\nproduction_authorized                  false\nsignature_authorized                   false\norder_submission_authorized            false\n```\n\nExact next step: pass standing handoff, research-governance/no-drift, Phase0-8, P3.2 parity and Phase6 safety checks; merge this boundary with expected-head protection. Only after that merge may the exact merged controlled-boundary HEAD perform the unique staged 0056 DEVELOPMENT execution.\n'''
          state_path.write_text(state)
          PY
      - name: Verify handoff remains zero-result
        run: |
          set -euo pipefail
          base=research/brrk_simple_eth_sol_beta_router_0056
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EXECUTION.json RUN_ONCE.marker; do
            test ! -e "$base/$f"
          done
          git diff --name-only HEAD~1 -- docs/CURRENT_STATE.md "$base/README.md" >/dev/null || true
      - name: Commit handoff and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temp_0056_controlled_handoff.yml
          git add docs/CURRENT_STATE.md research/brrk_simple_eth_sol_beta_router_0056/README.md
          git commit -m 'Research execution boundary [DRIFT_0]: advance 0056 zero-result handoff'
          git push origin HEAD:research/0056-simple-beta-router-controlled-run
