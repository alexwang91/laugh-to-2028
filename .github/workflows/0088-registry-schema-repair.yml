name: 0088 registry schema repair

on:
  push:
    branches:
      - research/0088-factor-ls-spec-freeze-v1

permissions:
  contents: write

jobs:
  repair-registry:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0088-factor-ls-spec-freeze-v1
          fetch-depth: 0
      - name: Repair 0088 registry schema only
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('config/research_registry.json')
          data = json.loads(p.read_text())
          matches = [r for r in data['records'] if r.get('research_id') == 'BRRK-FACTOR-LS-0088']
          if len(matches) != 1:
              raise SystemExit(f'expected one 0088 record, found {len(matches)}')
          r = matches[0]
          r['objective_type'] = 'PORTFOLIO_INTEGRATION'
          r['development_dataset_refs'] = []
          r['lineage_edges'] = [{'relation':'RESULT_INFORMED','ref_research_id':'BRRK-CROSS-SECTIONAL-FACTOR-ATLAS-0086'}]
          r['result_status'] = 'PREREGISTERED_NOT_RUN'
          r['evidence_refs'] = []
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')
          PY
          python -m research.governance.validate
      - name: Remove repair workflow and commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0088-registry-schema-repair.yml
          git add config/research_registry.json
          git diff --cached --check
          git commit -m "fix(0088): conform preregistry to governance schema"
          git push origin HEAD:research/0088-factor-ls-spec-freeze-v1
