name: 0073 Stage8 handoff repair

on:
  push:
    branches:
      - research/0073-stage8-controlled-attempt-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0073-stage8-controlled-attempt-v1
          fetch-depth: 0
      - name: Repair exact CURRENT_STATE handoff and self-delete
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          old = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is merged at `8ccf14ecf0e1e2b0ccfa94ad3600105fb321380b`. Stage 6 CONTROLLED BOUNDARY is merged at `ac13585c54c031440e5b35e183d7fea9a46e2830`. Stage 7 ZERO-RESULT PREFLIGHT is in progress on PR #358 / `research/0073-stage7-zero-result-preflight-v1`. Formal completion remains 6/10 until Stage 7 merges. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0; scientific source-network fetches remain 0. Stage 7 may inspect identity/execution metadata only and must not open controlled historical payloads or create the Stage-8 attempt marker. Require exact-head standing CI SUCCESS and expected-head merge only after a terminal zero-result preflight outcome is recorded."
          new = "0073 Stage 1 OWNER-FIRST is merged at `dc287210212a827181501779482c976ac01995c8`. Stage 2 DESIGN is merged at `8cfe10ed7c031c6e46edb1d58e30bc5eb8cc7878`. Stage 3 PREREGISTRATION is merged at `903718ac8b406ed0b27399667a116e9e25ff4dab`. Stage 4 IMPLEMENTATION is merged at `372ece83cda67b74557b32ef19022e9829e2b89f`. Stage 5 NONHISTORICAL QUALIFICATION is merged at `8ccf14ecf0e1e2b0ccfa94ad3600105fb321380b`. Stage 6 CONTROLLED BOUNDARY is merged at `ac13585c54c031440e5b35e183d7fea9a46e2830`. Stage 7 ZERO-RESULT PREFLIGHT is merged at `91807d0824f61c734e1a07c36f6e8fa84a39da13` with `PREFLIGHT_PASS_ZERO_RESULT`. Formal completion is 7/10. Stage 8 CONTROLLED ATTEMPT is proposed on draft PR #359 / `research/0073-stage8-controlled-attempt-v1` but is BLOCKED_PENDING_EXPLICIT_USER_AUTHORIZATION before any irreversible attempt action. Controlled attempt remains 0/1; controlled scientific/history reads remain 0; scientific engine calls remain 0; scientific source-network fetches remain 0. No `RUN_ATTEMPT.marker` may be created and no controlled historical payload may be opened until contemporaneous explicit user authorization is recorded; after authorization, rerun identity-only zero-result preflight, then durably persist and verify `RUN_ATTEMPT.marker` before the first controlled content read."
          if old not in s:
              raise SystemExit('expected Exact next step handoff text not found; fail closed')
          s = s.replace(old, new, 1)
          old2 = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION MERGED / STAGE-6 CONTROLLED BOUNDARY MERGED / STAGE-7 ZERO-RESULT PREFLIGHT IN PROGRESS / FORMAL COMPLETION 6/10 UNTIL STAGE-7 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new2 = "0073 = OWNER-FIRST MERGED / STAGE-2 DESIGN MERGED / STAGE-3 PREREGISTRATION MERGED / STAGE-4 IMPLEMENTATION MERGED / STAGE-5 NONHISTORICAL QUALIFICATION MERGED / STAGE-6 CONTROLLED BOUNDARY MERGED / STAGE-7 ZERO-RESULT PREFLIGHT MERGED / FORMAL COMPLETION 7/10 / STAGE-8 CONTROLLED ATTEMPT BLOCKED_PENDING_EXPLICIT_USER_AUTHORIZATION / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          if old2 not in s:
              raise SystemExit('expected no-drift 0073 line not found; fail closed')
          s = s.replace(old2, new2, 1)
          anchor = "workflow run                         31381953131 / attempt 1"
          if s.count(anchor) != 1:
              raise SystemExit('immutable workflow anchor missing or duplicated; fail closed')
          p.write_text(s)
          Path('.github/workflows/0073-stage8-handoff-repair.yml').unlink()
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md .github/workflows/0073-stage8-handoff-repair.yml
          git diff --cached --quiet && exit 0
          git commit -m "governance(0073): record Stage-8 authorization gate handoff"
          git push origin HEAD:research/0073-stage8-controlled-attempt-v1
