name: ASYM BETA 0021 Bull Extra Beta

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asym-beta-0021.yml'
      - 'research/requirements.txt'
      - 'research/asym_beta/**'
      - 'research/regime_kelly/**'
      - 'research/hybrid_meta/**'
      - 'research/risk_metric_fix/**'
      - 'research/core/**'
      - 'research/results/pit_disp_0015/**'
      - 'research/results/funding_pnl_0003/**'
      - 'research/results/router_pnl_0005/**'

permissions:
  contents: read

concurrency:
  group: asym-beta-0021-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asym-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic unit tests
        working-directory: research/asym_beta
        run: python -m unittest -v test_asym_beta_0021.py
      - name: Run preregistered ASYM-BETA-0021
        working-directory: research/asym_beta
        shell: bash
        run: |
          set -o pipefail
          python run_asym_beta_0021.py | tee asym_beta_0021.log
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asym-beta-0021-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/asym_beta/ASYM-BETA-0021.json
            research/asym_beta/asym_beta_0021.log
            research/results/asym_beta_0021/**
