name: AUDIT 0017 PIT Alpha Attribution

# One-time evidence persistence; no trading or audit-method change.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-0017-pit-alpha-attribution.yml'
      - 'research/requirements.txt'
      - 'research/pit_universe/AUDIT-0017-PIT-ALPHA-ATTRIBUTION.json'
      - 'research/pit_universe/run_pit_alpha_attribution.py'
      - 'research/pit_universe/run_dynamic_alpha.py'
      - 'research/results/pit_alpha_0016/**'

permissions:
  contents: write

concurrency:
  group: audit-0017-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attribution:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run preregistered no-trading-change attribution audit
        working-directory: research/pit_universe
        shell: bash
        run: |
          set -o pipefail
          python run_pit_alpha_attribution.py | tee audit_0017.log
      - name: Persist validated audit evidence
        if: github.event_name == 'pull_request' && success()
        shell: bash
        run: |
          set -euo pipefail
          out='research/results/audit_0017_pit_alpha_attribution'
          mkdir -p "$out"
          cp research/pit_universe/audit_0017_outputs/* "$out/"
          cp research/pit_universe/audit_0017.log "$out/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record AUDIT 0017 attribution outputs'
            git push origin HEAD:"${GITHUB_HEAD_REF}"
          fi
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-0017-pit-alpha-attribution
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/pit_universe/audit_0017.log
            research/pit_universe/audit_0017_outputs/**
            research/pit_universe/AUDIT-0017-PIT-ALPHA-ATTRIBUTION.json
