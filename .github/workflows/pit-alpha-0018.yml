name: PIT ALPHA 0018 Entry Rank Eligibility Exit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pit-alpha-0018.yml'
      - 'research/requirements.txt'
      - 'research/crypto_rotation_backtest.py'
      - 'research/core/crypto_rotation_backtest.py'
      - 'research/pit_universe/PIT-ALPHA-0018-ENTRY-RANK-ELIGIBILITY-EXIT.json'
      - 'research/pit_universe/run_entry_rank_eligibility_exit.py'
      - 'research/pit_universe/test_entry_rank_eligibility_exit.py'
      - 'research/pit_universe/run_dynamic_alpha.py'
      - 'research/pit_universe/run_pit_alpha_attribution.py'
      - 'research/pit_universe/run_archive_discovery.py'
      - 'research/pit_universe/run_dynamic_dispersion.py'

permissions:
  contents: read

concurrency:
  group: pit-alpha-0018-${{ github.ref }}
  cancel-in-progress: false

# Split into two jobs (backlog F11) so the write-scoped persist step never
# shares a job -- and therefore never shares a GITHUB_TOKEN in its
# environment -- with a step that executes PR-supplied Python. `research`
# only ever needs contents: read; `persist` never executes repository code,
# it only copies files already produced by `research` and pushes them.
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic state-machine tests
        working-directory: research/pit_universe
        run: python -m unittest -v test_entry_rank_eligibility_exit.py
      - name: Run preregistered entry-rank eligibility-exit test
        working-directory: research/pit_universe
        shell: bash
        run: |
          set -o pipefail
          python run_entry_rank_eligibility_exit.py | tee pit_alpha_0018.log
      - name: Upload exact research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-alpha-0018-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/pit_universe/pit_alpha_0018.log
            research/pit_universe/pit_alpha_0018_outputs/**
            research/pit_universe/PIT-ALPHA-0018-ENTRY-RANK-ELIGIBILITY-EXIT.json

  persist:
    needs: research
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: pit-alpha-0018-results
          path: /tmp/artifact
      - name: Persist validated outputs
        shell: bash
        run: |
          set -euo pipefail
          SRC='/tmp/artifact/research/pit_universe'
          DEST='research/results/pit_alpha_0018'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R "$SRC/pit_alpha_0018_outputs/." "$DEST/"
          cp "$SRC/pit_alpha_0018.log" "$DEST/pit_alpha_0018.log"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$DEST"
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Persist PIT-ALPHA-0018 exact outputs'
          git pull --rebase origin "${{ github.head_ref }}"
          git push origin "HEAD:${{ github.head_ref }}"
