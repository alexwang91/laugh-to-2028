name: Tooling 0069 exact implementation qualification

on:
  push:
    branches:
      - tools/0069-qualification-v1
    paths:
      - '.github/workflows/tooling-0069-qualification.yml'

permissions:
  contents: read

concurrency:
  group: brrk-0069-exact-qualification
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      QUALIFIED_IMPLEMENTATION_SHA: 'c11101d8c454d71e918bed163fbd188934910670'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c11101d8c454d71e918bed163fbd188934910670
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned qualification runtime
        run: python -m pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Verify exact implementation identity and zero-result isolation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c11101d8c454d71e918bed163fbd188934910670"
          test ! -e research/brrk_btc_sol_path_event_early_warning_execution_assured_0069/RUN_ATTEMPT.marker
          test ! -e research/brrk_btc_sol_path_event_early_warning_execution_assured_0069/PRIMARY_RESULT.json
          test ! -e research/brrk_btc_sol_path_event_early_warning_execution_assured_0069/EVIDENCE.json
          test ! -e research/brrk_btc_sol_path_event_early_warning_execution_assured_0069/EXECUTION.json
          test ! -e research/brrk_btc_sol_path_event_early_warning_execution_assured_0069/RUN_ONCE.marker
      - name: Run 0069 bounded execution-assurance tests
        run: python -m unittest research.brrk_btc_sol_path_event_early_warning_execution_assured_0069.test_execution_assurance -v
      - name: Run exact full-shape nonhistorical qualification
        run: python -m research.brrk_btc_sol_path_event_early_warning_execution_assured_0069.qualification --output /tmp/0069-full-qualification.json
      - name: Verify frozen qualification outputs
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/0069-full-qualification.json').read_text())
          assert r['research_id']=='BRRK-BTC-SOL-PATH-EVENT-EARLY-WARNING-EXECUTION-ASSURED-0069'
          assert r['qualification_verdict']=='PASS'
          assert r['implementation_commit_sha']=='c11101d8c454d71e918bed163fbd188934910670'
          assert r['network_fetch_count']==0
          assert all(int(v)==0 for v in r['historical_content_read_counters'].values())
          assert r['declared_and_actual_validation_configs']=={'declared':1632,'actual':1632}
          assert r['declared_and_actual_validation_fit_calls']=={'declared':31008,'actual':31008}
          assert r['declared_and_actual_final_tracks']=={'declared':64,'actual':64}
          assert r['declared_and_actual_controllers']=={'declared':8,'actual':8}
          assert r['declared_and_actual_predictive_bootstrap_replicates']=={'declared':4000,'actual':4000}
          assert r['declared_and_actual_economic_bootstrap_replicates']=={'declared':4000,'actual':4000}
          assert r['declared_and_actual_pbo_splits']=={'declared':70,'actual':70}
          assert len(r['required_regimes'])==5
          expected={
            'FULL_SUPPORT':(11904,40),
            'PARTIAL_SUPPORT':(5952,20),
            'SINGLE_CLASS_UNDEFINED_TRACKS':(8928,30),
            'MISSING_BASE_PREDICTIONS':(11904,20),
            'MIXED_P07_P08_ELIGIBILITY':(7872,10),
          }
          by={x['regime']:x for x in r['required_regimes']}
          assert set(by)==set(expected)
          for name,(fits,nnls) in expected.items():
              assert by[name]['economic_fit_calls']==fits
              assert by[name]['p08_nnls_solves']==nnls
              assert by[name]['manifest_byte_identical'] is True
              assert by[name]['terminal_trace_complete'] is True
          a=r['execution_assurance']
          assert a['validation_fit_calls_expected']==a['validation_fit_calls_observed']==31008
          assert a['economic_fit_calls_expected_manifest_derived']==a['economic_fit_calls_observed']
          assert a['p08_nnls_expected_manifest_derived']==a['p08_nnls_observed']
          assert a['terminal_trace_complete'] is True
          assert a['terminal_trace_count']==a['manifest_unit_count']
          assert a['inference_barrier_released'] is True
          assert a['process_worker_count']==4
          assert r['total_wall_clock_seconds'] <= 10800
          assert r['peak_process_tree_rss_bytes'] <= 4294967296
          assert r['peak_rss_fraction_of_memtotal'] <= 0.60
          assert r['swap_or_oom_observed'] is False
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Upload qualification evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrk-0069-qualification-c11101d8
          path: /tmp/0069-full-qualification.json
          if-no-files-found: error
