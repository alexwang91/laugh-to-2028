name: 0054 immutable closeout build

on:
  push:
    branches:
      - research/brrk-leadership-4h-readiness-0054-result

permissions:
  contents: write

jobs:
  closeout:
    if: contains(github.event.head_commit.message, 'trigger 0054 immutable closeout build')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-4h-readiness-0054-result
      - name: Build closeout only from committed immutable runtime artifacts
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json

          p=Path('research/brrk_leadership_4h_native_readiness_0054')
          result=json.loads((p/'METHOD_RESULT.json').read_text())
          execution=json.loads((p/'EXECUTION.json').read_text())
          attempt=json.loads((p/'RUN_ATTEMPT.marker').read_text())
          marker=json.loads((p/'RUN_ONCE.marker').read_text())

          def canonical_sha(obj):
              return hashlib.sha256(json.dumps(obj,sort_keys=True,separators=(',',':'),ensure_ascii=False,allow_nan=False).encode()).hexdigest()

          assert result['classification']=='FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED'
          assert result['measurement']['training_readiness'] is None
          assert result['measurement']['calibration_readiness'] is None
          assert result['measurement']['reserved_support'] is None
          assert result['authority']['post_2022_target_values_read'] is False
          assert result['authority']['predictive_performance_metrics_executed'] is False
          assert result['authority']['portfolio_economics_executed'] is False
          assert execution['actual_variants_evaluated']==1
          assert execution['method_result_sha256']==canonical_sha(result)
          assert marker['method_result_sha256']==canonical_sha(result)
          assert marker['execution_sha256']==canonical_sha(execution)
          assert marker['status']=='VALID_METHODOLOGY_MEASUREMENT_COMPLETE_CLOSED_TO_SAME_ID_RERUN'
          assert marker['same_id_rerun_allowed'] is False
          assert marker['same_id_retuning_allowed'] is False
          assert marker['same_id_rescue_allowed'] is False
          assert marker['finalized_without_remeasurement'] is True

          records=result['measurement']['training_records']
          eligible=[r for r in records if r['p90_width'] is not None and r['max_width'] is not None]
          assert eligible
          first=eligible[0]
          last=eligible[-1]
          best_p90=min(eligible,key=lambda r:r['p90_width'])
          best_max=min(eligible,key=lambda r:r['max_width'])
          passes=[r for r in eligible if r['passed']]
          max_n=max(r['matured_eligible_count'] for r in records)

          closeout={
            'research_id':'BRRK-LEADERSHIP-4H-NATIVE-READINESS-0054',
            'closeout_status':'FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED / CLOSED',
            'result_status':result['classification'],
            'evidence_class':'RESEARCHER_EXPOSED_DEVELOPMENT_HISTORY_WITH_POST_2022_TARGET_FIREWALL_NOT_INDEPENDENT_OOS',
            'design_merge_sha':'34a20658d26dd5440aa48139a83a15757ecf394c',
            'preregistration_merge_sha':'7bc88d3dc314d052fdddf0706369974621479e8f',
            'implementation_merge_sha':'4b599be6c8f994878c81604feed51bd18136cea2',
            'controlled_execution_boundary_merge_sha':'ec6d5fa927398e0407b342d4996a1f2a8856306f',
            'dataset_slice_id':result['dataset_slice_id'],
            'market_payload_sha256':result['payload_sha256'],
            'methodology_target_firewall':{
              'latest_allowed_target_path_end':'2022-12-31T20:00:00Z',
              'reserved_suffix_start':'2023-01-01T00:00:00Z',
              'post_2022_target_values_read':False
            },
            'unique_methodology_measurement':{
              'github_actions_run_id':31530579490,
              'github_actions_job_id':93909356498,
              'run_attempt':1,
              'workflow_carrier_head_sha':'c5a87d9dbda5275d4a7b38577bbedd82c9347952',
              'controlled_execution_head_sha':'ec6d5fa927398e0407b342d4996a1f2a8856306f',
              'preflight_status':'PREFLIGHT_PASS_ZERO_RESULT',
              'measurement_step_completed_successfully':True,
              'actual_variants_evaluated':1,
              'same_id_remeasurement_allowed':False
            },
            'official_execution_artifact':{
              'artifact_id':9116707158,
              'name':'brrk-0054-methodology-measurement-bundle',
              'digest':'sha256:cf2f2f950f35fb250500f7679802ae5b8305d6f888dbf6445b6b61583ce01929',
              'source_run_id':31530579490,
              'size_bytes':5547,
              'expired_at_closeout':False
            },
            'hash_locked_result_identity':{
              'attempt_marker_sha256':execution['attempt_marker_sha256'],
              'method_result_sha256':execution['method_result_sha256'],
              'execution_sha256':marker['execution_sha256'],
              'final_marker_status':marker['status']
            },
            'frozen_precision_rule':{
              'hac_kernel':'BARTLETT',
              'hac_lag':335,
              'numerical_floor':672,
              'training_p90_width_max':0.10,
              'training_max_width_max':0.20,
              'consecutive_refits_required':3,
              'calibration_max_width_max':0.10
            },
            'training_precision_evidence':{
              'first_hac_eligible_refit':{
                'timestamp':first['refit_timestamp'],
                'matured_eligible_count':first['matured_eligible_count'],
                'p90_width':first['p90_width'],
                'max_width':first['max_width'],
                'hac_min_eigenvalue':first['hac_min_eigenvalue'],
                'hessian_min_eigenvalue':first['hessian_min_eigenvalue']
              },
              'maximum_matured_eligible_count':max_n,
              'last_refit_record':{
                'timestamp':last['refit_timestamp'],
                'matured_eligible_count':last['matured_eligible_count'],
                'p90_width':last['p90_width'],
                'max_width':last['max_width'],
                'hac_min_eigenvalue':last['hac_min_eigenvalue'],
                'hessian_min_eigenvalue':last['hessian_min_eigenvalue']
              },
              'best_observed_p90_width_descriptive_only':{
                'timestamp':best_p90['refit_timestamp'],
                'matured_eligible_count':best_p90['matured_eligible_count'],
                'p90_width':best_p90['p90_width'],
                'max_width_at_same_refit':best_p90['max_width']
              },
              'best_observed_max_width_descriptive_only':{
                'timestamp':best_max['refit_timestamp'],
                'matured_eligible_count':best_max['matured_eligible_count'],
                'max_width':best_max['max_width'],
                'p90_width_at_same_refit':best_max['p90_width']
              },
              'number_of_training_precision_pass_refits':len(passes),
              'three_consecutive_training_passes_achieved':False,
              'training_readiness':None
            },
            'downstream_gate_status':{
              'calibration_stage_eligible':False,
              'calibration_readiness':None,
              'reserved_suffix_support_stage_eligible':False,
              'reserved_support':None,
              'new_predictive_study_unlocked_by_0054':False,
              '0049_concentration_unlocked':False
            },
            'binding_conclusion':[
              'The fixed 672-observation HAC admissibility floor was reached; the result is not a failure to accumulate enough rows to run the estimator-precision calculation.',
              'The Bartlett-HAC covariance and penalized Hessian were numerically identified at eligible refits; the binding failure is that centered dynamic-probability uncertainty remained far wider than the prospectively frozen 0.10 P90 / 0.20 maximum tolerances.',
              'No training refit passed the frozen precision gate, so three consecutive passes were impossible and training readiness was never established.',
              'Because training readiness failed, calibration readiness and post-2022 reserved-support eligibility were correctly not evaluated under the preregistered hierarchy.',
              '0054 read no post-2022 ETH/SOL target values and computed no predictive-performance or portfolio-economic metrics.'
            ],
            'scientific_implication':{
              'exact_7_feature_4h_estimator_eligible_for_post_2022_predictive_study':False,
              'same_id_threshold_relaxation_allowed':False,
              'same_id_hac_change_allowed':False,
              'same_id_fixed_burnin_rescue_allowed':False,
              'recommended_next_direction':'Any continuation requires a new preregistered methodology/mechanism ID. Prefer structurally lower effective dimensionality or a different preregistered inferential unit; do not merely loosen 0054 precision thresholds or select a fixed burn-in from exposed results.',
              'post_2022_target_suffix_preserved_from_0054':True,
              'independent_oos_claim_allowed':False
            },
            'authority':result['authority'],
            'closure':{
              'same_id_rerun_allowed':False,
              'same_id_retuning_allowed':False,
              'same_id_rescue_allowed':False,
              'result_informed_definition_change_requires_new_research_id':True
            }
          }
          (p/'CLOSEOUT.json').write_text(json.dumps(closeout,indent=2,ensure_ascii=False,allow_nan=False)+'\n')

          md=f'''# BRRK-LEADERSHIP-4H-NATIVE-READINESS-0054 — IMMUTABLE RESULT\n\n**Final classification:** `FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED`\n\n0054 did not fail because the 672-observation numerical floor was never reached. The first HAC-eligible refit was `{first['refit_timestamp']}` with `{first['matured_eligible_count']}` matured eligible observations. At that point the 95% centered dynamic-probability widths were already far above the frozen training gate: P90 `{first['p90_width']:.6f}` versus `0.10`, maximum `{first['max_width']:.6f}` versus `0.20`.\n\nAcross all permitted methodology-prefix labels, the maximum matured eligible count was `{max_n}`. No training refit passed the frozen precision gate. The descriptively smallest observed P90 width was `{best_p90['p90_width']:.6f}` at `{best_p90['refit_timestamp']}`; the descriptively smallest observed maximum width was `{best_max['max_width']:.6f}` at `{best_max['refit_timestamp']}`. These post-result minima have **no threshold-selection, rescue or retuning authority**.\n\nBecause training readiness required three consecutive passing 168-bar refits and zero refits passed, training readiness was never established. Therefore calibration readiness and reserved post-2022 support were not eligible to run.\n\nThe 2023+ target firewall remained intact: no post-2022 ETH/SOL target value was read. No NLL, Brier, AUC, realized-margin score, confidence breakpoint or portfolio economics was computed.\n\nThis result blocks a predictive study of the exact 0054 7-feature estimator under the authority chain frozen here. Any continuation requires a new research ID; the scientifically defensible next fork is structural simplification / lower effective dimensionality or a different preregistered inferential unit, not loosening the observed 0054 precision thresholds.\n'''
          (p/'RESULT.md').write_text(md)

          readme=(p/'README.md').read_text()
          readme=readme.replace('Status: **PREREGISTERED / DATA HASH-BOUND / IMPLEMENTATION MERGED / CONTROLLED-RUN BOUNDARY / ZERO REAL RESULT**.', 'Status: **FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED / CLOSED / IMMUTABLE**.')
          readme += '\n## Immutable closeout\n\nThe unique 0054 methodology measurement is complete and permanently closed to same-ID rerun, retuning and rescue. Training precision readiness failed; calibration and reserved-support stages were not eligible. See `METHOD_RESULT.json`, `RUN_ONCE.marker`, `RESULT.md`, and `CLOSEOUT.json`. No predictive or portfolio authority was created.\n'
          (p/'README.md').write_text(readme)

          statep=Path('docs/CURRENT_STATE.md')
          s=statep.read_text()
          s=s.replace('Current `main` research merge: **`4b599be6c8f994878c81604feed51bd18136cea2`**', 'Current `main` research merge: **`ec6d5fa927398e0407b342d4996a1f2a8856306f`**')
          s=s.replace('Current research branch: **`research/brrk-leadership-4h-readiness-0054-controlled-run`**', 'Current research branch: **`research/brrk-leadership-4h-readiness-0054-result`**')
          s=s.replace('BRRK 4h-native readiness 0054          CONTROLLED-RUN BOUNDARY / ZERO RESULT', 'BRRK 4h-native readiness 0054          FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED / CLOSED')
          section=f'''\n\n## 15. 0054 immutable methodology result\n\n0054 unique execution HEAD: `ec6d5fa927398e0407b342d4996a1f2a8856306f`; GitHub Actions run/job `31530579490 / 93909356498`. Final classification: `FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED`.\n\n```text\nfirst HAC-eligible refit                 {first['refit_timestamp']}\nfirst HAC-eligible matured count         {first['matured_eligible_count']}\nfirst P90 probability CI width           {first['p90_width']:.10f}  > 0.10 gate\nfirst maximum probability CI width       {first['max_width']:.10f}  > 0.20 gate\nmaximum methodology-prefix count         {max_n}\ntraining precision pass refits           {len(passes)}\nthree consecutive passes                 false\ntraining readiness                       NOT ESTABLISHED\ncalibration stage                        NOT ELIGIBLE\nreserved-support stage                   NOT ELIGIBLE\npost-2022 target values read             false\npredictive metrics                       NONE / FORBIDDEN\nportfolio economics                      NONE / FORBIDDEN\nactual variants evaluated                1\nsame-ID rerun / retune / rescue          false / false / false\n```\n\nThe binding failure is estimator precision, not inability to reach the 672 numerical floor and not HAC/Hessian numerical breakdown. The exact 7-feature 4h estimator is therefore **not eligible** for the preserved post-2022 predictive study under 0054. Descriptive post-result minimum interval widths are preserved in `CLOSEOUT.json` but have no threshold-selection authority. Any continuation requires a new preregistered methodology/mechanism ID; do not loosen 0054 thresholds or adopt a fixed burn-in as a same-ID rescue.\n'''
          if '## 15. 0054 immutable methodology result' not in s:
              s += section
          statep.write_text(s)
          print('CLOSEOUT_BUILT_FROM_EXISTING_RESULT_ONLY')
          print('ENGINE_NOT_IMPORTED_OR_CALLED=true')
          print(json.dumps({'first':first,'last':last,'best_p90':best_p90,'best_max':best_max,'max_n':max_n,'passes':len(passes)},sort_keys=True))
          PY
          git config user.name 'Y_Wang'
          git config user.email '40142450+alexwang91@users.noreply.github.com'
          git add research/brrk_leadership_4h_native_readiness_0054/RESULT.md research/brrk_leadership_4h_native_readiness_0054/CLOSEOUT.json research/brrk_leadership_4h_native_readiness_0054/README.md docs/CURRENT_STATE.md
          git commit -m 'Research closeout: build immutable 0054 failure interpretation from locked result'
          git push origin HEAD:research/brrk-leadership-4h-readiness-0054-result
