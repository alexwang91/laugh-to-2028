name: R2 CURRENT_STATE writer

on:
  push:
    branches:
      - governance/controlled-research-runner-v1

permissions:
  contents: write

jobs:
  write-current-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/controlled-research-runner-v1
          fetch-depth: 0
      - name: Append truthful R2 runner qualification handoff and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CURRENT_STATE.md')
          text = path.read_text(encoding='utf-8')
          marker = '## R2 controlled research runner — 2026-08-25'
          if marker not in text:
              text = text.rstrip() + '''\n\n## R2 controlled research runner — 2026-08-25\n\n- R1 Phase 6 evidence closeout is merged on main at `bac4b105e7576f8a00227c759b5cabdaaead7d9f` with `PASS_FROZEN_LIVE_OBSERVATION_GATES`; this grants no production authority.\n- R2 PR #407 introduces prospective public `CONTROLLED_RESEARCH_RUNNER_V1`; it does not authorize or consume any scientific attempt.\n- The runner enforces metadata-only pre-marker inspection, durable `RUN_ATTEMPT.marker` before payload reads, one verified physical payload-read pass, exactly one scientific engine invocation, create-only result persistence and `RUN_ONCE.marker` sealing.\n- Pre-marker `ZipFile.testzip()`, payload `read/open`, decompression, extraction and CRC payload traversal are prohibited.\n- Synthetic qualification covers corrupted ZIP/CRC, missing file, wrong hash, duplicate object, stale head, existing result, marker push failure, crash after marker, duplicate read, double engine invocation, NaN, missing timestamp, schema drift, writer failure, network attempt, wrong source manifest and wrong execution interface.\n- Qualification also requires at least `20` consecutive synthetic full lifecycles with zero unexpected failure.\n- Exact-head `Research governance core` on runner head `cbadff165afc78ae938e11da1f3e1f02bcfe22e3` passed; `PR handoff governance` failed only because this CURRENT_STATE handoff had not yet changed in PR #407. Final qualification remains pending a new exact-head terminal-green CI after this handoff.\n- 0076 remains sealed at Stage7 pre-marker read-boundary incident; no replacement, retroactive marker, same-ID Stage8, rerun, retune, rescue or recompute. 0072/0073 Carry remain paused; 0083 remains immutable FAIL.\n- No Trend, Factor or Options controlled scientific attempt may start until R2 runner qualification is durably PASS and the prospective R3 lifecycle amendment is separately merged.\n- Production/signature/order/withdrawal/transfer authority remains false.\n'''
              path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/r2-current-state-writer.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/r2-current-state-writer.yml
          if git diff --cached --quiet; then
            echo 'No state mutation required.'
            exit 0
          fi
          git commit -m 'governance: record R2 runner qualification handoff'
          git push origin HEAD:governance/controlled-research-runner-v1
