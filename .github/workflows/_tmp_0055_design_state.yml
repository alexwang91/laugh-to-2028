name: 0055 design CURRENT_STATE update

on:
  push:
    branches:
      - research/brrk-leadership-4h-structural-readiness-0055-design

permissions:
  contents: write

jobs:
  update-state:
    if: ${{ github.event.head_commit.message == 'Governance tooling: trigger 0055 design state v2' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-4h-structural-readiness-0055-design
          fetch-depth: 0
      - name: Advance authoritative 0055 design handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          s = s.replace('Current `main` research merge: **`ec6d5fa927398e0407b342d4996a1f2a8856306f`**', 'Current `main` research merge: **`fcbb2182bfd01b5d04d6f652b7cdb1b49f11007b`**')
          s = s.replace('Current research branch: **`research/brrk-leadership-4h-readiness-0054-result`**', 'Current research branch: **`research/brrk-leadership-4h-structural-readiness-0055-design`**')
          old = 'BRRK 4h-native readiness 0054          FAIL_4H_NATIVE_TRAINING_PRECISION_NOT_ESTABLISHED / CLOSED'
          new = old + '\nBRRK 4h structural readiness 0055     DESIGN FROZEN / NUMERICAL PREREG NOT YET FROZEN / NOT RUN'
          if 'BRRK 4h structural readiness 0055' not in s:
              if old not in s:
                  raise SystemExit('0054 state row not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit state update
        run: |
          git config user.name Y_Wang
          git config user.email 40142450+alexwang91@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Research design [DRIFT_0]: hand off 0055 structural readiness design'
          git push origin HEAD:research/brrk-leadership-4h-structural-readiness-0055-design
