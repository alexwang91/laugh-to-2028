name: Tooling 0063 prereg artifact read-only v2

on:
  push:
    branches: [tools/0062-owner-artifact-v1]
    paths: ['.github/workflows/tooling-0063-prereg-artifact-v2.yml']

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: aeff95faa60f5e7f5c209c143a329e7e45545286
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          name: 0063-dtb3-raw-capture
          path: /tmp/0063-capture
          github-token: ${{ github.token }}
          repository: alexwang91/laugh-to-2028
          run-id: 31757177489
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -H 'Accept: application/vnd.github.raw+json' -H 'Authorization: Bearer ${{ github.token }}' 'https://api.github.com/repos/${{ github.repository }}/contents/tools/build_0063_prereg_artifact.py?ref=tools%2F0062-owner-artifact-v1' -o /tmp/b.py
          set +e
          out=$(python /tmp/b.py 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then printf '%s\n' "$out" | grep -Fq "unexpected prereg diff: ['config/dataset_exposure_registry.json', 'docs/CURRENT_STATE.md']" || exit "$rc"; fi
          python -m research.governance.validate
          python -m research.governance.enforce_future --base aeff95faa60f5e7f5c209c143a329e7e45545286
          cat >/tmp/expected <<'EOF'
          config/dataset_exposure_registry.json
          docs/CURRENT_STATE.md
          research/brrk_idle_cash_sweep_robustness_0063/CAPTURE_REPORT.json
          research/brrk_idle_cash_sweep_robustness_0063/DATASET_DECLARATION.json
          research/brrk_idle_cash_sweep_robustness_0063/DTB3_RAW.csv
          research/brrk_idle_cash_sweep_robustness_0063/PREREGISTRATION.json
          EOF
          sed -i 's/^          //' /tmp/expected
          git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //' | sort >/tmp/actual
          diff -u <(sort /tmp/expected) /tmp/actual
          test ! -e research/brrk_idle_cash_sweep_robustness_0063/RUN_ATTEMPT.marker
          test ! -e research/brrk_idle_cash_sweep_robustness_0063/PRIMARY_RESULT.json
          test "$(sha256sum research/brrk_idle_cash_sweep_robustness_0063/DTB3_RAW.csv | cut -d' ' -f1)" = 4d8aee67dbd528ce38ff8482e9bb02dd5ccf2c6cd461f606fe90007151ab6879
          rm -rf /tmp/0063-prereg-artifact; mkdir -p /tmp/0063-prereg-artifact/package
          while IFS= read -r rel; do mkdir -p "/tmp/0063-prereg-artifact/package/$(dirname "$rel")"; cp "$rel" "/tmp/0063-prereg-artifact/package/$rel"; done </tmp/expected
          cat >/tmp/0063-prereg-artifact/BUILD_REPORT.json <<'EOF'
          {"research_id":"BRRK-IDLE-CASH-SWEEP-ROBUSTNESS-0063","owner_first_commit_sha":"aeff95faa60f5e7f5c209c143a329e7e45545286","dtb3_raw_sha256":"4d8aee67dbd528ce38ff8482e9bb02dd5ccf2c6cd461f606fe90007151ab6879","candidate_economics_computed":false,"baseline_equity_read":false,"baseline_weights_read":false,"historical_variants_evaluated":0,"run_attempt_marker_absent":true,"governance_validate":"PASS","future_enforcement":"PASS"}
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: 0063-prereg-package-v2
          path: /tmp/0063-prereg-artifact
          if-no-files-found: error
          retention-days: 7
