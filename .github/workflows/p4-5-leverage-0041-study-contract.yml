name: LEVERAGE-0041 study contract

on:
  pull_request:
    paths:
      - "research/leverage_0041/**"
      - "research/results/leverage_0041/**"
      - "execution/plan-b-bot/tests/test_leverage_0041_*.py"
      - ".github/workflows/p4-5-leverage-0041-*.yml"
      - "docs/LEVERAGE_0041_*"
      - "docs/ROADMAP_AUDIT_2026-08-07.md"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
      - "README.md"

permissions:
  contents: read

jobs:
  study-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Validate LEVERAGE-0041 preregistration and implementation freeze
        run: |
          pytest -q \
            execution/plan-b-bot/tests/test_leverage_0041_preregistration.py \
            execution/plan-b-bot/tests/test_leverage_0041_study_contract.py
      - name: Compile one-time runner and immutable result validator
        run: |
          python -m py_compile \
            research/leverage_0041/study_core_0041.py \
            research/leverage_0041/runner_support_a_0041.py \
            research/leverage_0041/runner_support_b_0041.py \
            research/leverage_0041/run_leverage_0041_once.py \
            research/leverage_0041/validate_leverage_0041_result.py
      - name: Enforce study lifecycle boundary
        run: |
          set -euo pipefail
          if [[ -e research/results/leverage_0041/summary.json ]]; then
            echo "Post-result lifecycle: validate immutable result rather than requiring result absence."
            python research/leverage_0041/validate_leverage_0041_result.py
          else
            echo "Pre-result lifecycle: enforce frozen preregistration/implementation boundary."
            python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path("research/leverage_0041/LEVERAGE-0041.json").read_text())
          c = json.loads(Path("research/leverage_0041/LEVERAGE-0041-STUDY-IMPLEMENTATION-V1.json").read_text())
          assert p["experiment_id"] == "LEVERAGE-0041"
          assert p["production_authorized"] is False
          assert c["status"] == "FROZEN_BEFORE_FIRST_ECONOMIC_RUN"
          assert c["result_observed_before_freeze"] is False
          assert c["owner_run_once_authorized"] is True
          assert c["production_authorized"] is False
          PY
          fi
