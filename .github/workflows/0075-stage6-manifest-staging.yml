name: 0075 Stage6 manifest and byte staging
on:
  push:
    branches:
      - research/0075-stage6-controlled-execution-boundary-v1
permissions:
  contents: write
  actions: read
jobs:
  stage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BRANCH: research/0075-stage6-controlled-execution-boundary-v1
      ROOT: research/brrk_crypto_cross_sectional_factor_atlas_0075
      ARTIFACT_NAME: 0075-stage6-authorized-payloads-v1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0075-stage6-controlled-execution-boundary-v1
          fetch-depth: 0
      - name: Guard frozen boundary and create-only outputs
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$ROOT/AUTHORIZED_OBJECT_MANIFEST.json"
          test ! -e "$ROOT/STAGE6_STAGING_EVIDENCE.json"
          test ! -e "$ROOT/STAGE6_SYMBOL_UNIVERSE.json"
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('research/brrk_crypto_cross_sectional_factor_atlas_0075/CONTROLLED_BOUNDARY_CONTRACT.json')
          d=json.loads(p.read_text())
          assert d['research_id']=='BRRK-CRYPTO-CROSS-SECTIONAL-FACTOR-ATLAS-0075'
          assert d['formal_completion_before_stage6_merge']=='5/10'
          assert d['controlled_attempt']=={'budget':1,'consumed':0,'marker_before_first_controlled_read_required':True,'durable_remote_verification_required':True}
          assert d['controlled_scientific_history_reads']==0
          assert d['scientific_engine_calls']=={'budget':1,'consumed':0}
          assert d['scientific_source_network_fetches']=={'budget':0,'consumed':0}
          assert d['manifest_completion_rules']['manifest_not_yet_complete'] is True
          assert d['offline_staging_rules']['staging_evidence_not_yet_complete'] is True
          assert d['scientific_values_exposed'] is False
          PY
      - name: Enumerate identities, freeze symbol universe, and stage opaque bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p stage/payloads stage/checksums
          python - <<'PY'
          import concurrent.futures, hashlib, json, os, pathlib, re, sys, urllib.parse, urllib.request, xml.etree.ElementTree as ET, zipfile

          ROOT=pathlib.Path(os.environ['ROOT'])
          S3='https://s3-ap-northeast-1.amazonaws.com/data.binance.vision'
          CDN='https://data.binance.vision/'
          START='2021-01'; END='2026-07'
          stable_fiat={
              'USDT','USDC','BUSD','TUSD','FDUSD','USDP','PAX','DAI','USDS','USDE','USD1',
              'EUR','AEUR','EURI','EURT','GBP','TRY','BRL','AUD','BIDR','IDRT','UAH','RUB','NGN','ZAR','PLN','RON','ARS','JPY'
          }
          wrapped={'WBTC','WETH','WBETH','WBNB','BETH','STETH','WSTETH'}
          leveraged_suffixes=('UP','DOWN','BULL','BEAR')

          def list_keys(prefix):
              keys=[]; token=None
              while True:
                  params={'list-type':'2','prefix':prefix,'max-keys':'1000'}
                  if token: params['continuation-token']=token
                  url=S3+'?'+urllib.parse.urlencode(params)
                  with urllib.request.urlopen(url, timeout=30) as r:
                      root=ET.fromstring(r.read())
                  ns={'s3':'http://s3.amazonaws.com/doc/2006-03-01/'}
                  keys.extend(x.text for x in root.findall('s3:Contents/s3:Key',ns) if x.text)
                  trunc=(root.findtext('s3:IsTruncated',default='false',namespaces=ns).lower()=='true')
                  if not trunc: break
                  token=root.findtext('s3:NextContinuationToken',default=None,namespaces=ns)
                  if not token: raise RuntimeError('truncated listing without continuation token')
              return keys

          spot_keys=list_keys('data/spot/monthly/klines/')
          perp_keys=list_keys('data/futures/um/monthly/klines/')
          funding_keys=list_keys('data/futures/um/monthly/fundingRate/')

          spot_re=re.compile(r'^data/spot/monthly/klines/([^/]+)/1d/\1-1d-(\d{4}-\d{2})\.zip$')
          perp_re=re.compile(r'^data/futures/um/monthly/klines/([^/]+)/1d/\1-1d-(\d{4}-\d{2})\.zip$')
          fund_re=re.compile(r'^data/futures/um/monthly/fundingRate/([^/]+)/\1-fundingRate-(\d{4}-\d{2})\.zip$')

          def in_window(ym): return START <= ym <= END
          spot=[]
          for k in spot_keys:
              m=spot_re.match(k)
              if m and in_window(m.group(2)) and m.group(1).endswith('USDT'):
                  spot.append((m.group(1),m.group(2),k))
          perp={(m.group(1),m.group(2)):k for k in perp_keys if (m:=perp_re.match(k)) and in_window(m.group(2))}
          funding={(m.group(1),m.group(2)):k for k in funding_keys if (m:=fund_re.match(k)) and in_window(m.group(2))}
          if not spot: raise RuntimeError('official S3 listing yielded zero candidate USDT spot 1d monthly objects')

          symbol_months={}
          for s,ym,k in spot: symbol_months.setdefault(s,[]).append(ym)
          decisions=[]; allowed=[]
          for s in sorted(symbol_months):
              base=s[:-4]
              reason=None
              if base in stable_fiat: reason='STABLECOIN_OR_FIAT_PROXY_IDENTITY'
              elif base in wrapped: reason='OBVIOUS_WRAPPED_DUPLICATE_IDENTITY'
              elif base.endswith(leveraged_suffixes): reason='LEVERAGED_TOKEN_IDENTITY'
              elif base.endswith('OLD'): reason='OBVIOUS_MIGRATION_OLD_IDENTITY'
              decision='EXCLUDED_BY_FROZEN_IDENTITY_RULE' if reason else 'AUTHORIZED_CANDIDATE_SYMBOL'
              decisions.append({'symbol':s,'base_asset':base,'decision':decision,'reason':reason,'first_archive_month':min(symbol_months[s]),'last_archive_month':max(symbol_months[s]),'spot_month_count':len(set(symbol_months[s]))})
              if not reason: allowed.append(s)
          if len(allowed)<20: raise RuntimeError(f'candidate symbol universe unexpectedly small: {len(allowed)}')
          allowed_set=set(allowed)

          specs=[]
          for s,ym,k in spot:
              if s in allowed_set:
                  specs.append(('SPOT_MONTHLY_1D_KLINE',s,ym,k,'SPOT_PRICE_VOLUME_UNIVERSE_INPUT'))
          for s in allowed:
              for ym in sorted(set(symbol_months[s])):
                  if (s,ym) in perp:
                      specs.append(('USD_M_MONTHLY_1D_PERPETUAL_KLINE',s,ym,perp[(s,ym)],'OPTIONAL_MATCHED_PERPETUAL_FEATURE_INPUT'))
                  if (s,ym) in funding:
                      specs.append(('USD_M_MONTHLY_FUNDING_RATE',s,ym,funding[(s,ym)],'OPTIONAL_MATCHED_FUNDING_FEATURE_INPUT'))
          # Complete enumeration is exactly the identity-derived authorized set. Duplicates are execution-invalid.
          ids=[(a,b,c,d) for a,b,c,d,_ in specs]
          if len(ids)!=len(set(ids)): raise RuntimeError('duplicate authorized object enumeration')

          universe={
              'research_id':'BRRK-CRYPTO-CROSS-SECTIONAL-FACTOR-ATLAS-0075','stage':6,
              'status':'SYMBOL_UNIVERSE_IDENTITY_FREEZE_COMPLETE','official_host':'https://data.binance.vision',
              'candidate_month_start':START,'candidate_month_end':END,
              'selection_basis':'official S3 object-key identity only; no payload scientific values opened',
              'identity_exclusion_rules':{'stable_or_fiat_bases':sorted(stable_fiat),'wrapped_bases':sorted(wrapped),'leveraged_suffixes':list(leveraged_suffixes),'migration_suffix':'OLD'},
              'candidate_symbols':allowed,'candidate_symbol_count':len(allowed),'decisions':decisions,
              'scientific_values_exposed':False,'controlled_scientific_history_reads':0,'scientific_engine_calls':0
          }
          (ROOT/'STAGE6_SYMBOL_UNIVERSE.json').write_text(json.dumps(universe,indent=2,sort_keys=True)+'\n')

          def fetch_one(spec):
              fam,s,ym,key,role=spec
              chk_key=key+'.CHECKSUM'
              safe=key.replace('/','__')
              zip_local=pathlib.Path('stage/payloads')/safe
              chk_local=pathlib.Path('stage/checksums')/(safe+'.CHECKSUM')
              # Exactly one HTTP acquisition per checksum and payload in this staging execution; no automatic retry.
              for url,dest in [(CDN+chk_key,chk_local),(CDN+key,zip_local)]:
                  req=urllib.request.Request(url,headers={'User-Agent':'0075-stage6-identity-stager/1'})
                  with urllib.request.urlopen(req,timeout=45) as r:
                      dest.write_bytes(r.read())
              txt=chk_local.read_text(errors='strict').strip()
              mt=re.search(r'\b([0-9a-fA-F]{64})\b',txt)
              if not mt: raise RuntimeError(f'malformed checksum: {chk_key}')
              official=mt.group(1).lower(); actual=hashlib.sha256(zip_local.read_bytes()).hexdigest()
              if official!=actual: raise RuntimeError(f'sha256 mismatch: {key}')
              # Structural offline readability only. Test CRC/ZIP mechanics; never print/extract/parse scientific rows.
              with zipfile.ZipFile(zip_local,'r') as z:
                  bad=z.testzip()
                  if bad is not None: raise RuntimeError(f'zip CRC failure: {key}:{bad}')
              return {
                  'canonical_object_id':f'BINANCE_VISION::{fam}::{s}::{ym}',
                  'source_family':fam,'symbol':s,'month':ym,'archive_path':key,
                  'paired_checksum_path':chk_key,'paired_checksum_identity':txt,
                  'payload_sha256':actual,'frozen_object_role':role,'scientific_content_read_budget':1,
                  'staging_status':'STAGED_HASH_VERIFIED_OFFLINE_READABLE','staged_relative_path':str(zip_local),
                  'staged_byte_size':zip_local.stat().st_size,'checksum_relative_path':str(chk_local)
              }

          rows=[]; failures=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=32) as ex:
              futs={ex.submit(fetch_one,x):x for x in specs}
              for fut in concurrent.futures.as_completed(futs):
                  spec=futs[fut]
                  try: rows.append(fut.result())
                  except Exception as e: failures.append({'source_family':spec[0],'symbol':spec[1],'month':spec[2],'archive_path':spec[3],'error':str(e)})
          rows.sort(key=lambda r:(r['source_family'],r['symbol'],r['month'],r['archive_path']))
          if failures or len(rows)!=len(specs):
              pathlib.Path('stage/FAILURES.json').write_text(json.dumps({'expected':len(specs),'captured':len(rows),'failures':failures},indent=2,sort_keys=True)+'\n')
              print(json.dumps({'expected':len(specs),'captured':len(rows),'failure_count':len(failures),'sample_failures':failures[:20]},indent=2))
              sys.exit(2)
          if len({r['canonical_object_id'] for r in rows})!=len(rows): raise RuntimeError('duplicate canonical_object_id')
          manifest={
              'schema_version':1,'research_id':'BRRK-CRYPTO-CROSS-SECTIONAL-FACTOR-ATLAS-0075','stage':6,
              'status':'AUTHORIZED_OBJECT_MANIFEST_COMPLETE','official_host':'https://data.binance.vision',
              'candidate_month_start':START,'candidate_month_end':END,'candidate_symbol_count':len(allowed),
              'authorized_payload_objects':len(rows),
              'counts_by_family':{f:sum(r['source_family']==f for r in rows) for f in sorted({r['source_family'] for r in rows})},
              'failures':[],'scientific_values_exposed':False,'scientific_calculations_performed':False,
              'controlled_scientific_history_reads':0,'scientific_engine_calls':0,'stage8_scientific_source_network_fetches':0,
              'scientific_content_read_budget_each':1,'staging_artifact_name':os.environ['ARTIFACT_NAME'],'objects':rows
          }
          out=ROOT/'AUTHORIZED_OBJECT_MANIFEST.json'; out.write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          pathlib.Path('stage/AUTHORIZED_OBJECT_MANIFEST.json').write_text(out.read_text())
          pathlib.Path('stage/STAGE6_SYMBOL_UNIVERSE.json').write_text((ROOT/'STAGE6_SYMBOL_UNIVERSE.json').read_text())
          print(json.dumps({'candidate_symbols':len(allowed),'authorized_objects':len(rows),'counts_by_family':manifest['counts_by_family'],'opaque_payload_bytes':sum(r['staged_byte_size'] for r in rows)},indent=2))
          PY
      - name: Upload durable staged payload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: stage/
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Persist evidence, complete boundary flags, and self-delete executor
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['ROOT'])
          mp=root/'AUTHORIZED_OBJECT_MANIFEST.json'; up=root/'STAGE6_SYMBOL_UNIVERSE.json'; cp=root/'CONTROLLED_BOUNDARY_CONTRACT.json'
          manifest=json.loads(mp.read_text()); universe=json.loads(up.read_text()); contract=json.loads(cp.read_text())
          n=manifest['authorized_payload_objects']
          ev={
              'schema_version':1,'research_id':'BRRK-CRYPTO-CROSS-SECTIONAL-FACTOR-ATLAS-0075','stage':6,
              'status':'STAGING_COMPLETE_ZERO_SCIENTIFIC_VALUE_EXPOSURE','artifact_name':os.environ['ARTIFACT_NAME'],
              'artifact_id':os.environ.get('ARTIFACT_ID',''),'artifact_url':os.environ.get('ARTIFACT_URL',''),'artifact_retention_days':90,
              'candidate_symbol_count':universe['candidate_symbol_count'],'authorized_payload_objects':n,'hash_verified_objects':n,
              'offline_zip_readability_passed_objects':n,'manifest_sha256':hashlib.sha256(mp.read_bytes()).hexdigest(),
              'symbol_universe_sha256':hashlib.sha256(up.read_bytes()).hexdigest(),'controlled_scientific_history_reads':0,
              'scientific_engine_calls':0,'stage8_scientific_source_network_fetches':0,'attempt':'0/1','scientific_values_exposed':False,
              'note':'Stage6 enumerated official object-key identities, fetched paired checksum metadata and opaque authorized ZIP bytes, verified SHA-256 and ZIP structural readability, and never parsed or emitted historical scientific rows.'
          }
          (root/'STAGE6_STAGING_EVIDENCE.json').write_text(json.dumps(ev,indent=2,sort_keys=True)+'\n')
          contract['manifest_completion_rules']['manifest_not_yet_complete']=False
          contract['offline_staging_rules']['staging_evidence_not_yet_complete']=False
          contract['stage6_evidence']={'authorized_object_manifest_sha256':ev['manifest_sha256'],'symbol_universe_sha256':ev['symbol_universe_sha256'],'artifact_id':ev['artifact_id'],'artifact_name':ev['artifact_name'],'authorized_payload_objects':n,'candidate_symbol_count':ev['candidate_symbol_count'],'scientific_values_exposed':False}
          cp.write_text(json.dumps(contract,indent=2,sort_keys=True)+'\n')
          PY
          rm .github/workflows/0075-stage6-manifest-staging.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$ROOT/AUTHORIZED_OBJECT_MANIFEST.json" "$ROOT/STAGE6_SYMBOL_UNIVERSE.json" "$ROOT/STAGE6_STAGING_EVIDENCE.json" "$ROOT/CONTROLLED_BOUNDARY_CONTRACT.json" .github/workflows/0075-stage6-manifest-staging.yml
          git commit -m 'research(0075): persist Stage6 manifest and opaque staging evidence'
          git push origin HEAD:$BRANCH
