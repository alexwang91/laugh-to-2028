name: 0074 Stage9 CURRENT_STATE repair

on:
  push:
    branches:
      - research/0074-stage9-result-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage9-result-v1
          fetch-depth: 0
      - name: Synchronize Stage9 handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert s.count(anchor) == 1
          next_text = (
              '0073 remains immutable `10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. '
              '0074 Stage 8 merged at `8a8f1d109a4eff80df9feb7cc0cdc818568d35a8` with terminal `INVALID_EXECUTION`. '
              'Stage 9 RESULT is in progress on `research/0074-stage9-result-v1`; formal completion is `8/10` until Stage 9 merges. '
              'Stage 9 is interpretation-only: no controlled payload reread, no scientific recomputation, no new engine call, and no reconstruction or exposure of the inadmissible local harness metrics. '
              'Final operational accounting remains attempt `1/1 CONSUMED`, staged artifact download after marker `1`, controlled scientific-history reads `402/402` each at most once, scientific engine invocation `1/1` consumed but inadmissible non-frozen harness, scientific source-network fetches `0`, scientific values exposed `true`, and no admissible strategy-performance result. '
              'Same-ID rerun, recompute, retune, rescue, source substitution, history extension and candidate replacement remain permanently forbidden. '
              'The next legal action is exact-head CI and expected-head merge of Stage 9, followed only by a separate Stage 10 immutable closeout.'
          )
          pat = re.compile(r'(?ms)(^## Exact next step\n\n).*?(?=\n\n## No-drift authority)')
          s, n = pat.subn(lambda m: m.group(1) + next_text, s, count=1)
          assert n == 1
          state_line = (
              '0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / '
              'STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / '
              'STAGE-3 PREREGISTRATION MERGED AT `beae11d807886bfec65aa5cc8a26f79e92e5a0e9` / '
              'STAGE-4 IMPLEMENTATION MERGED AT `b74263cd6ab2bddd37544702fec0a187b7433151` / '
              'STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c1bf177d98e14f54c26374cf52151c9ad90733e8` / '
              'STAGE-6 CONTROLLED BOUNDARY MERGED AT `3d48f2fd837334e184dd3a9de3b8a003fa7c23a0` / '
              'STAGE-7 ZERO-RESULT PREFLIGHT MERGED AT `4e2dd98519ce9d513318beb5678ac1e00be3a04b` / '
              'STAGE-8 CONTROLLED ATTEMPT MERGED AT `8a8f1d109a4eff80df9feb7cc0cdc818568d35a8` TERMINAL `INVALID_EXECUTION` / '
              'STAGE-9 RESULT IN PROGRESS / FORMAL COMPLETION 8/10 UNTIL STAGE-9 MERGE / CONTROLLED ATTEMPT 1/1 CONSUMED / '
              'ACTUAL CONTROLLED READS 402 / SCIENTIFIC ENGINE 1/1 CONSUMED INADMISSIBLE NON-FROZEN HARNESS / SCIENTIFIC SOURCE NETWORK FETCHES 0 / '
              'SCIENTIFIC VALUES EXPOSED TRUE / NO ADMISSIBLE STRATEGY-PERFORMANCE RESULT / RUN_ONCE SEALED WITH INCIDENT SUPPLEMENT / '
              'NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          )
          s, n = re.subn(r'(?m)^0074 =.*$', state_line, s, count=1)
          assert n == 1
          assert s.count(anchor) == 1
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove one-shot writer
        run: rm .github/workflows/0074-stage9-current-state-repair.yml
      - name: Commit Stage9 handoff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0074-stage9-current-state-repair.yml
          git commit -m 'governance(0074): synchronize Stage9 result handoff'
          git push origin HEAD:research/0074-stage9-result-v1
