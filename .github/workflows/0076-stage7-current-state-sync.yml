name: 0076 Stage7 CURRENT_STATE one-shot sync

on:
  push:
    branches:
      - research/0076-stage7-zero-result-preflight-v1
    paths:
      - .github/workflows/0076-stage7-current-state-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/0076-stage7-zero-result-preflight-v1
      - name: Synchronize governance handoff only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert s.count(anchor) == 1, 'immutable workflow-run anchor drift'

          old_para = "0076 Stage1 OWNER-FIRST merged at `4f9f4b3bf009af2b8affc41f29835c099b7fda70`; Stage2 DESIGN merged at `3d2a91558a1829314541f66304a5c463b164ef1c`; Stage3 PREREGISTRATION merged at `c0c587929af9fa71fab8ddb8a69d58ef03f36101`; Stage4 IMPLEMENTATION merged at `ffab381d8a47536835d461cc72f30ca14af04bb7`; Stage5 NONHISTORICAL QUALIFICATION merged at `0e453df9a1148919333a85d695bacfc9b35dbd39`. Stage6 CONTROLLED-EXECUTION BOUNDARY is active on PR #403 / `research/0076-stage6-controlled-execution-boundary-v1`; formal completion 5/10; inherited validated factors 0; attempt 0/1; controlled reads 0; scientific engine 0/1; scientific source-network fetches 0; scientific values exposed false; no Stage8 marker/result exists; zero production/signature/order authority."
          new_para = "0076 Stage1 OWNER-FIRST merged at `4f9f4b3bf009af2b8affc41f29835c099b7fda70`; Stage2 DESIGN merged at `3d2a91558a1829314541f66304a5c463b164ef1c`; Stage3 PREREGISTRATION merged at `c0c587929af9fa71fab8ddb8a69d58ef03f36101`; Stage4 IMPLEMENTATION merged at `ffab381d8a47536835d461cc72f30ca14af04bb7`; Stage5 NONHISTORICAL QUALIFICATION merged at `0e453df9a1148919333a85d695bacfc9b35dbd39`; Stage6 CONTROLLED-EXECUTION BOUNDARY merged at `868187bae8f5e23dcf884b023c0783d19c96ed18`. Stage7 ZERO-RESULT PREFLIGHT is active on PR #404 / `research/0076-stage7-zero-result-preflight-v1`; formal completion 6/10; inherited validated factors 0; attempt 0/1; controlled reads 0; scientific engine 0/1; scientific source-network fetches 0; scientific values exposed false; no Stage8 marker/result exists; zero production/signature/order authority."

          old_line = "0076 = STAGE-1 THROUGH STAGE-5 MERGED / STAGE5 MERGE `0e453df9a1148919333a85d695bacfc9b35dbd39` / STAGE6 CONTROLLED-EXECUTION BOUNDARY ACTIVE ON PR #403 / FORMAL COMPLETION 5/10 / ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0/1 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / SCIENTIFIC VALUES EXPOSED FALSE / NO STAGE8 MARKER OR RESULT / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new_line = "0076 = STAGE-1 THROUGH STAGE-6 MERGED / STAGE6 MERGE `868187bae8f5e23dcf884b023c0783d19c96ed18` / STAGE7 ZERO-RESULT PREFLIGHT ACTIVE ON PR #404 / FORMAL COMPLETION 6/10 / ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0/1 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / SCIENTIFIC VALUES EXPOSED FALSE / NO STAGE8 MARKER OR RESULT / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."

          assert s.count(old_para) == 1, 'expected stale exact-next-step handoff not found exactly once'
          assert s.count(old_line) == 1, 'expected stale no-drift 0076 line not found exactly once'
          s = s.replace(old_para, new_para, 1).replace(old_line, new_line, 1)
          assert s.count(anchor) == 1, 'immutable workflow-run anchor changed'
          assert 'Stage6 CONTROLLED-EXECUTION BOUNDARY is active on PR #403' not in s
          assert 'STAGE6 CONTROLLED-EXECUTION BOUNDARY ACTIVE ON PR #403' not in s
          p.write_text(s)
          PY

          rm .github/workflows/0076-stage7-current-state-sync.yml
          git diff --check
          git diff -- docs/CURRENT_STATE.md .github/workflows/0076-stage7-current-state-sync.yml
      - name: Commit synchronized handoff and retire writer
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0076-stage7-current-state-sync.yml
          git commit -m 'governance(0076): sync Stage7 CURRENT_STATE handoff'
          git push origin HEAD:research/0076-stage7-zero-result-preflight-v1
