name: Temporary Stablecoin Stage-1 armed handoff patch

on:
  push:
    branches:
      - research/stablecoin-liquidity-0001-stage1-execute

permissions:
  contents: write

jobs:
  patch-once:
    if: contains(github.event.head_commit.message, '[STABLECOIN_PATCH_STAGE1_ARMED_HANDOFF_V1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/stablecoin-liquidity-0001-stage1-execute
          fetch-depth: 0
      - name: Patch authoritative Stage-1 armed state only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')
          replacements={
            'Stablecoin liquidity research     STABLECOIN-LIQUIDITY-0001 / RUN INTERFACE FROZEN_NOT_EXECUTED / VALIDATION DATA BOUND / NO STAGE-1 RESULT':'Stablecoin liquidity research     STABLECOIN-LIQUIDITY-0001 / STAGE-1 ONE-SHOT CLAIMED + ARMED_NOT_EXECUTED / NO RESULT',
            'run interface                  STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1 / FROZEN_NOT_EXECUTED':'run interface                  STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1 / FROZEN_NOT_EXECUTED\nstage1 run marker              RUN_ONCE_STAGE1.marker / CLAIMED_BEFORE_RESULT_BEARING_EXECUTION / IRREVERSIBLE IF MERGED\nstage1 execution              STABLECOIN-LIQUIDITY-0001-STAGE1-RUN-V1 / ARMED_NOT_EXECUTED / PR CI NON-RESULT-BEARING',
            'MERGE THE STABLECOIN RUN-INTERFACE PR ONLY AFTER GOVERNANCE + NO-DRIFT + P3.2 PARITY/GOLDEN + PHASE-6 SAFETY CHECKS PASS':'MERGE THE STABLECOIN STAGE-1 EXECUTION PR ONLY AFTER GOVERNANCE + SYNTHETIC EXECUTOR SELF-TEST + NO-DRIFT + P3.2 PARITY/GOLDEN + PHASE-6 SAFETY CHECKS PASS',
            'RUN INTERFACE STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1 IS FROZEN_NOT_EXECUTED; DO NOT MODIFY ITS ECONOMIC/STATISTICAL DEGREES OF FREEDOM AFTER MERGE':'RUN INTERFACE STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1 REMAINS FROZEN_NOT_EXECUTED; THE EXECUTION PR MAY IMPLEMENT ONLY THAT FROZEN INTERFACE AND MAY NOT MODIFY ITS ECONOMIC/STATISTICAL DEGREES OF FREEDOM',
            'NEXT STABLECOIN PR MAY ONLY ARM THE FROZEN ONE-SHOT STAGE-1 EXECUTION: CLAIM CREATE-ONLY RUN MARKER BEFORE RESULT-BEARING COMPUTATION, VERIFY STABLECOIN RAW HASH, FREEZE/PERSIST BINANCE PRICE PAYLOAD PROVENANCE, RECONFIRM CANONICAL P3.2 PARITY, THEN EXECUTE EXACTLY THE FROZEN INTERFACE ONCE':'CURRENT STAGE-1 EXECUTION PR HAS CLAIMED RUN_ONCE_STAGE1.marker AND ARMED STABLECOIN-LIQUIDITY-0001-STAGE1-RUN-V1; IF MERGED THE CLAIM MAY NEVER BE DELETED EVEN IF EXECUTION FAILS OR INVALIDATES',
            'DO NOT FIT RIDGE, CONSTRUCT REAL OOS PREDICTIONS, RUN STAGE-1 OR RELEASE A RESULT IN THE RUN-INTERFACE PR ITSELF':'PULL-REQUEST CI MUST NOT FIT RIDGE ON REAL DATA, CONSTRUCT REAL OOS PREDICTIONS, RUN STAGE-1 OR RELEASE A RESULT; PR CI IS SYNTHETIC/PREFLIGHT ONLY',
            'AFTER THE RUN INTERFACE IS MERGED, RUN EXACTLY ONE STAGE-1 VARIANT UNDER [STABLECOIN_STAGE1_EXECUTE_V1]; NO RESCUE TUNING, NO AUTOMATIC RETRY AFTER RESULT-BEARING OUTPUT, AND NO REPEATED EVALUATION':'ONLY A FULLY GREEN MERGE COMMIT CONTAINING [STABLECOIN_STAGE1_EXECUTE_V1] MAY RUN THE SINGLE STAGE-1 VARIANT, AND ONLY ON github.run_attempt == 1; NO RESCUE TUNING, NO AUTOMATIC OR MANUAL RERUN UNDER THIS RESEARCH ID'
          }
          for old,new in replacements.items():
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'unexpected match count {count}: {old[:90]}')
              s=s.replace(old,new,1)
          anchor='`RUN_INTERFACE.json` freezes the 35-column continuous canonical P3.2 BRRK price/regime baseline state, exact LAG_2D Stablecoin alignment, future 20-calendar-day canonical BRRK net-return label, paired-row eligibility, minimum 365 fully realized expanding training rows, training-only StandardScaler, Ridge alpha=1.0 with no grid, one-sided Bartlett/Newey-West lag 19, minimum 730 OOS PASS threshold, primary-first release policy and a create-only pre-execution Stage-1 run marker. Baseline and augmented rows/labels/training dates are identical; augmented differs only by the two frozen Stablecoin columns. The interface is synthetic-tested only and has not executed real Stage-1 data/model logic.'
          extra=anchor+'\n\nThe Stage-1 execution branch adds the irreversible marker claim and an armed push-only executor. Before any Ridge evaluation, it must verify the frozen Stablecoin raw SHA256, capture and durably archive exact Binance daily pages, archive a hash-bound durability receipt, build the canonical P3.2 batch state path, and match `calculate_target()` on all six frozen parity dates. Predictions/coefficients are never persisted; only the frozen primary-result JSON may be durably archived and released. A GitHub rerun is blocked by `github.run_attempt == 1`.'
          if s.count(anchor)!=1:
              raise SystemExit('unexpected Run Interface anchor count')
          s=s.replace(anchor,extra,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate pre-result armed state
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/CURRENT_STATE.md').read_text(encoding='utf-8')
          required=[
            'STAGE-1 ONE-SHOT CLAIMED + ARMED_NOT_EXECUTED / NO RESULT',
            'actual_variants_evaluated     0',
            'stage1 execution              STABLECOIN-LIQUIDITY-0001-STAGE1-RUN-V1 / ARMED_NOT_EXECUTED',
            'Ridge fit                       NOT RUN',
            'OOS predictions                 NONE',
            'research result evidence      NONE',
            'edge admission                NONE',
            'portfolio integration         NONE'
          ]
          for item in required:
              assert item in s, item
          PY
      - name: Remove temporary workflow and commit handoff
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-stablecoin-stage1-armed-handoff.yml
          git add docs/CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Research [DRIFT_0]: hand off armed Stablecoin Stage-1 execution'
          git push origin HEAD:research/stablecoin-liquidity-0001-stage1-execute
