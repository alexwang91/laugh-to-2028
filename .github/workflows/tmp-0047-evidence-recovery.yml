name: Temporary 0047 evidence recovery — not a new research execution

on:
  push:
    branches:
      - research/brrk-beta-handoff-0047-controlled-run
    paths:
      - .github/workflows/tmp-0047-evidence-recovery.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-beta-handoff-0047-controlled-run
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bind immutable original run identity before any reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          ORIGINAL_RUN_ID = '31444910921'
          ORIGINAL_RUN_ATTEMPT = '1'
          ORIGINAL_HEAD = '7c79f62e657c492afcb98be6c637905b2156f244'
          MARKET_HASH = 'd1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193'
          RESULT_OBJECT_HASH = '961ac99bd5a2d3d6556262b17411333bfbeead921616dccf120190ee1dd67c2a'
          EXECUTION_OBJECT_HASH = 'a87e37ae41e20d71e61dd52fb0b20009a5a6c6ffeeb6d0eb3d6faab568604665'
          STATUS = 'FAIL_NO_RECURRENT_DURABLE_HANDOFF_STRUCTURE'

          def digest(value):
              raw = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          execution = {
              'research_id': 'BRRK-BETA-HANDOFF-EVENT-STUDY-0047',
              'dataset_slice_id': 'BRRK-BETA-HANDOFF-0047-EXPOSED-HIST-V1',
              'git_head_sha': ORIGINAL_HEAD,
              'github_run_id': ORIGINAL_RUN_ID,
              'github_run_attempt': ORIGINAL_RUN_ATTEMPT,
              'market_evidence_path': 'research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json',
              'market_payload_sha256': MARKET_HASH,
              'primary_result_path': 'research/brrk_beta_handoff_0047/PRIMARY_RESULT.json',
              'primary_result_sha256': RESULT_OBJECT_HASH,
              'frozen_history_end': '2026-08-02',
              'bootstrap_replicates': 10000,
              'bootstrap_seed': 470047,
              'actual_variants_evaluated': 1,
              'result_status': STATUS,
              'portfolio_economics_executed': False,
              'duration_aware_handoff_model_fitted': False,
              'production_authorized': False,
              'signature_authorized': False,
              'order_submission_authorized': False,
          }
          got = digest(execution)
          assert got == EXECUTION_OBJECT_HASH, (got, EXECUTION_OBJECT_HASH)

          evidence = json.loads(Path('research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json').read_text())
          assert evidence['payload_sha256'] == MARKET_HASH
          summary = json.loads(Path('research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE_SUMMARY.json').read_text())
          assert summary['payload_sha256'] == MARKET_HASH
          assert summary['anatomy_metrics_computed'] is False
          assert summary['actual_variants_evaluated'] == 0

          # The unique evaluation workflow is still the original human-controlled head.
          original = Path('.github/workflows/tmp-0047-evaluate-once.yml')
          assert original.exists()
          for name in ('PRIMARY_RESULT.json','EXECUTION.json','RUN_ONCE.marker','RESULT_SUMMARY.json','EVIDENCE_RECOVERY.json'):
              assert not Path('research/brrk_beta_handoff_0047', name).exists()

          print('BRRK_0047_RECOVERY_BINDING=' + json.dumps({
              'original_run_id': ORIGINAL_RUN_ID,
              'original_run_attempt': ORIGINAL_RUN_ATTEMPT,
              'original_head_sha': ORIGINAL_HEAD,
              'market_payload_sha256': MARKET_HASH,
              'known_primary_result_object_sha256': RESULT_OBJECT_HASH,
              'known_execution_object_sha256': EXECUTION_OBJECT_HASH,
              'known_result_status': STATUS,
              'new_research_execution': False,
          }, sort_keys=True))
          PY

      - name: Prove scientific implementation unchanged from immutable pre-result boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE=341e0b75595baef26823debe4f29a338eda63f5c
          git diff --exit-code "$BASE" -- \
            research/brrk_beta_handoff_0047/engine.py \
            research/brrk_beta_handoff_0047/run_once.py \
            research/brrk_beta_handoff_0047/RUN_INTERFACE.json \
            research/brrk_beta_handoff_0047/PREREGISTRATION.json \
            research/brrk_beta_handoff_0047/DATASET_DECLARATION.json \
            research/governance/BRRK_BETA_HANDOFF_EVENT_STUDY_0047_DESIGN_FREEZE_2026-08-11.md

      - name: Install frozen reconstruction runtime
        run: python -m pip install --disable-pip-version-check numpy pandas requests scipy scikit-learn

      - name: Re-run synthetic contracts only — zero tuning and zero portfolio translation
        run: |
          python -m unittest \
            research.governance.test_brrk_beta_handoff_0047_prereg_contract \
            research.governance.test_brrk_beta_handoff_0047_implementation

      - name: Deterministically recover the already-known result and require exact original object hash
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          from research.brrk_beta_handoff_0047.engine import evaluate_frozen_protocol, frames_from_market_evidence

          HERE = Path('research/brrk_beta_handoff_0047')
          ORIGINAL_RUN_ID = '31444910921'
          ORIGINAL_RUN_ATTEMPT = '1'
          ORIGINAL_JOB_ID = '93636897419'
          ORIGINAL_HEAD = '7c79f62e657c492afcb98be6c637905b2156f244'
          MARKET_HASH = 'd1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193'
          RESULT_OBJECT_HASH = '961ac99bd5a2d3d6556262b17411333bfbeead921616dccf120190ee1dd67c2a'
          EXECUTION_OBJECT_HASH = 'a87e37ae41e20d71e61dd52fb0b20009a5a6c6ffeeb6d0eb3d6faab568604665'
          STATUS = 'FAIL_NO_RECURRENT_DURABLE_HANDOFF_STRUCTURE'

          def object_digest(value):
              raw = json.dumps(value, sort_keys=True, separators=(',', ':'), ensure_ascii=False, allow_nan=False).encode('utf-8')
              return hashlib.sha256(raw).hexdigest()

          def write_create_only(path, value):
              data = json.dumps(value, indent=2, ensure_ascii=False, allow_nan=False) + '\n'
              with path.open('x', encoding='utf-8') as handle:
                  handle.write(data)

          evidence = json.loads((HERE/'evidence/MARKET_EVIDENCE.json').read_text())
          assert evidence['payload_sha256'] == MARKET_HASH
          frames = frames_from_market_evidence(evidence)

          # EVIDENCE RECOVERY ONLY: the expected scientific result hash and status were fixed
          # from the already-successful unique evaluation log before this computation starts.
          result = evaluate_frozen_protocol(frames, MARKET_HASH)
          recovered_object_hash = object_digest(result)
          assert recovered_object_hash == RESULT_OBJECT_HASH, (recovered_object_hash, RESULT_OBJECT_HASH)
          assert result['classification']['result_status'] == STATUS
          assert result['actual_variants_evaluated'] == 1
          assert result['authority']['duration_aware_handoff_model_fitted'] is False
          assert result['authority']['portfolio_allocation_tested'] is False
          assert result['authority']['portfolio_economics_executed'] is False
          assert result['authority']['production_authorized'] is False
          write_create_only(HERE/'PRIMARY_RESULT.json', result)

          raw_result_bytes = (HERE/'PRIMARY_RESULT.json').read_bytes()
          result_file_sha = hashlib.sha256(raw_result_bytes).hexdigest()
          reparsed_result = json.loads(raw_result_bytes)
          reparsed_canonical_sha = object_digest(reparsed_result)
          # The known persistence bug is expected: JSON coerces integer episode_intercept keys to strings.
          assert reparsed_canonical_sha != RESULT_OBJECT_HASH

          execution = {
              'research_id': 'BRRK-BETA-HANDOFF-EVENT-STUDY-0047',
              'dataset_slice_id': 'BRRK-BETA-HANDOFF-0047-EXPOSED-HIST-V1',
              'git_head_sha': ORIGINAL_HEAD,
              'github_run_id': ORIGINAL_RUN_ID,
              'github_run_attempt': ORIGINAL_RUN_ATTEMPT,
              'market_evidence_path': 'research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json',
              'market_payload_sha256': MARKET_HASH,
              'primary_result_path': 'research/brrk_beta_handoff_0047/PRIMARY_RESULT.json',
              'primary_result_sha256': RESULT_OBJECT_HASH,
              'frozen_history_end': '2026-08-02',
              'bootstrap_replicates': 10000,
              'bootstrap_seed': 470047,
              'actual_variants_evaluated': 1,
              'result_status': STATUS,
              'portfolio_economics_executed': False,
              'duration_aware_handoff_model_fitted': False,
              'production_authorized': False,
              'signature_authorized': False,
              'order_submission_authorized': False,
          }
          assert object_digest(execution) == EXECUTION_OBJECT_HASH
          write_create_only(HERE/'EXECUTION.json', execution)

          marker = {
              'research_id': 'BRRK-BETA-HANDOFF-EVENT-STUDY-0047',
              'status': 'VALID_EXECUTION_COMPLETE_CLOSED_TO_SAME_ID_RERUN',
              'git_head_sha': ORIGINAL_HEAD,
              'market_payload_sha256': MARKET_HASH,
              'primary_result_sha256': RESULT_OBJECT_HASH,
              'execution_sha256': EXECUTION_OBJECT_HASH,
              'result_status': STATUS,
              'same_id_rerun_allowed': False,
              'same_id_retuning_allowed': False,
              'same_id_rescue_allowed': False,
          }
          write_create_only(HERE/'RUN_ONCE.marker', marker)
          marker_object_sha = object_digest(marker)

          classification = result['classification']
          result_summary = {
              'research_id': result['research_id'],
              'evidence_class': result['evidence_class'],
              'result_status': STATUS,
              'market_payload_sha256': MARKET_HASH,
              'unique_original_run_id': ORIGINAL_RUN_ID,
              'unique_original_job_id': ORIGINAL_JOB_ID,
              'unique_original_head_sha': ORIGINAL_HEAD,
              'primary_result_pre_serialization_object_sha256': RESULT_OBJECT_HASH,
              'primary_result_recovered_file_sha256': result_file_sha,
              'primary_result_reparsed_canonical_sha256': reparsed_canonical_sha,
              'execution_pre_serialization_object_sha256': EXECUTION_OBJECT_HASH,
              'run_once_marker_object_sha256': marker_object_sha,
              'target_eligible_BTC_positive_episodes': classification['target_eligible_BTC_positive_episodes'],
              'primary_handoff_episodes': classification['primary_handoff_episodes'],
              'episode_level_durable_handoff_prevalence': classification['episode_level_durable_handoff_prevalence'],
              'ETH_primary_handoff_episodes': classification['ETH_primary_handoff_episodes'],
              'SOL_primary_handoff_episodes': classification['SOL_primary_handoff_episodes'],
              'gates': classification['gates'],
              'actual_variants_evaluated': 1,
              'duration_aware_handoff_model_fitted': False,
              'portfolio_allocation_tested': False,
              'portfolio_economics_executed': False,
              'same_id_rerun_allowed': False,
          }
          write_create_only(HERE/'RESULT_SUMMARY.json', result_summary)

          recovery = {
              'research_id': 'BRRK-BETA-HANDOFF-EVENT-STUDY-0047',
              'recovery_type': 'EVIDENCE_RECOVERY_NOT_NEW_RESEARCH_EXECUTION',
              'new_research_execution': False,
              'actual_variants_evaluated_before_recovery': 1,
              'actual_variants_evaluated_after_recovery': 1,
              'unique_original_run_id': ORIGINAL_RUN_ID,
              'unique_original_run_attempt': ORIGINAL_RUN_ATTEMPT,
              'unique_original_job_id': ORIGINAL_JOB_ID,
              'unique_original_head_sha': ORIGINAL_HEAD,
              'unique_result_status_from_original_log': STATUS,
              'known_primary_result_pre_serialization_object_sha256_from_original_log': RESULT_OBJECT_HASH,
              'known_execution_pre_serialization_object_sha256_from_original_log': EXECUTION_OBJECT_HASH,
              'market_payload_sha256': MARKET_HASH,
              'recovered_primary_result_pre_serialization_object_sha256': recovered_object_hash,
              'recovered_primary_result_file_sha256': result_file_sha,
              'recovered_primary_result_reparsed_canonical_sha256': reparsed_canonical_sha,
              'reconstructed_execution_pre_serialization_object_sha256': object_digest(execution),
              'reconstructed_run_once_marker_object_sha256': marker_object_sha,
              'recovery_hash_match': recovered_object_hash == RESULT_OBJECT_HASH and object_digest(execution) == EXECUTION_OBJECT_HASH,
              'original_post_result_failure': {
                  'step': 'Freeze post-evaluation invariants without changing the result',
                  'failed_assertion': "execution['primary_result_sha256'] == digest(json.loads(PRIMARY_RESULT.json))",
                  'root_cause': 'PRIMARY_RESULT pre-serialization object contains integer episode_intercepts dictionary keys; JSON persistence coerces those keys to strings, so canonical hashing after json.loads is not equal to the pre-serialization object hash stored in EXECUTION.json.',
                  'scientific_classification_affected': False,
                  'stage_gate_logic_affected': False,
                  'market_data_affected': False,
              },
              'governance': {
                  'same_id_rerun_allowed': False,
                  'same_id_retuning_allowed': False,
                  'same_id_rescue_allowed': False,
                  '0048_model_fit_performed': False,
                  'portfolio_economics_performed': False,
                  'production_authorized': False,
                  'signature_authorized': False,
                  'order_submission_authorized': False,
              },
          }
          assert recovery['recovery_hash_match'] is True
          write_create_only(HERE/'EVIDENCE_RECOVERY.json', recovery)

          print('BRRK_0047_RECOVERY_RESULT=' + json.dumps({
              'result_status': STATUS,
              'market_payload_sha256': MARKET_HASH,
              'primary_result_pre_serialization_object_sha256': RESULT_OBJECT_HASH,
              'primary_result_recovered_file_sha256': result_file_sha,
              'primary_result_reparsed_canonical_sha256': reparsed_canonical_sha,
              'execution_pre_serialization_object_sha256': EXECUTION_OBJECT_HASH,
              'recovery_hash_match': True,
              'new_research_execution': False,
              'actual_variants_evaluated': 1,
              'target_eligible_BTC_positive_episodes': classification['target_eligible_BTC_positive_episodes'],
              'primary_handoff_episodes': classification['primary_handoff_episodes'],
              'episode_level_durable_handoff_prevalence': classification['episode_level_durable_handoff_prevalence'],
              'ETH_primary_handoff_episodes': classification['ETH_primary_handoff_episodes'],
              'SOL_primary_handoff_episodes': classification['SOL_primary_handoff_episodes'],
          }, sort_keys=True))
          PY

      - name: Upload recovered immutable evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: brrk-beta-handoff-0047-recovered-unique-result
          if-no-files-found: error
          retention-days: 90
          path: |
            research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json
            research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE_SUMMARY.json
            research/brrk_beta_handoff_0047/PRIMARY_RESULT.json
            research/brrk_beta_handoff_0047/EXECUTION.json
            research/brrk_beta_handoff_0047/RUN_ONCE.marker
            research/brrk_beta_handoff_0047/RESULT_SUMMARY.json
            research/brrk_beta_handoff_0047/EVIDENCE_RECOVERY.json

      - name: Remove stale one-shot and recovery workflows before durable recovery commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-0047-evaluate-once.yml
          rm .github/workflows/tmp-0047-evidence-recovery.yml

      - name: Commit recovered evidence only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_beta_handoff_0047/PRIMARY_RESULT.json \
                  research/brrk_beta_handoff_0047/EXECUTION.json \
                  research/brrk_beta_handoff_0047/RUN_ONCE.marker \
                  research/brrk_beta_handoff_0047/RESULT_SUMMARY.json \
                  research/brrk_beta_handoff_0047/EVIDENCE_RECOVERY.json \
                  .github/workflows/tmp-0047-evaluate-once.yml \
                  .github/workflows/tmp-0047-evidence-recovery.yml
          git diff --cached --check
          test ! -e .github/workflows/tmp-0047-evaluate-once.yml
          test ! -e .github/workflows/tmp-0047-evidence-recovery.yml
          git commit -m 'research evidence: recover unique 0047 result by original hashes'
          git push origin HEAD:research/brrk-beta-handoff-0047-controlled-run
