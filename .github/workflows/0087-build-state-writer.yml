name: 0087 BUILD state writer

on:
  push:
    branches:
      - research/0087-options-vrp-build-v1
    paths:
      - .github/workflows/0087-build-state-writer.yml

permissions:
  contents: write

jobs:
  write-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0087-options-vrp-build-v1
          fetch-depth: 0
      - name: Append durable BUILD state and self-remove
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## 0087 Options / VRP BUILD — 2026-08-25$' docs/CURRENT_STATE.md; then
            echo '' | base64 -d >> docs/CURRENT_STATE.md
          fi
          rm -f .github/workflows/0087-build-state-writer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md .github/workflows/0087-build-state-writer.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(0087): persist BUILD handoff'
          git push origin HEAD:research/0087-options-vrp-build-v1
