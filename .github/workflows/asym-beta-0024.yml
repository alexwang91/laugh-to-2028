name: ASYM BETA 0024 Daily Cap

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/asym-beta-0024.yml'
      - 'research/requirements.txt'
      - 'research/asym_beta/**'
      - 'research/regime_kelly/**'
      - 'research/hybrid_meta/**'
      - 'research/risk_metric_fix/**'
      - 'research/core/**'
      - 'research/results/asym_beta_0022/summary.json'
      - 'research/results/AUDIT_0023_LATENCY_RESULT_2026-08-05.md'

permissions:
  contents: read

concurrency:
  group: asym-beta-0024-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-cap:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic daily-cap tests
        working-directory: research/asym_beta
        run: python -m unittest -v test_asym_beta_0024.py
      - name: Run preregistered ASYM-BETA-0024
        working-directory: research/asym_beta
        shell: bash
        run: |
          set -o pipefail
          python run_asym_beta_0024.py | tee asym_beta_0024.log
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asym-beta-0024-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/asym_beta/ASYM-BETA-0024.json
            research/asym_beta/asym_beta_0024.log
            research/results/asym_beta_0024/**
