name: 0053 source amendment CURRENT_STATE update

on:
  push:
    branches:
      - research/brrk-leadership-intraday-support-0053-capture-source-amendment

permissions:
  contents: write

jobs:
  update-state:
    if: contains(github.event.head_commit.message, 'trigger 0053 source amendment state')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-intraday-support-0053-capture-source-amendment
          fetch-depth: 0
      - name: Advance authoritative handoff without scientific measurement
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          s=s.replace('Current `main` closeout merge: **`62c0e2a4e1fb3ddfdc64c41adbd06b03012df895`**', 'Current `main` research merge: **`ed3c22f0e3f562498f483ce5f1bb634f8f9b9e4e`**')
          s=s.replace('Current research branch: **`research/brrk-leadership-intraday-0053-design`**', 'Current research branch: **`research/brrk-leadership-intraday-support-0053-capture-source-amendment`**')
          s=s.replace('BRRK intraday support 0053             PREREGISTERED / DATA NOT CAPTURED / NO MODEL FIT', 'BRRK intraday support 0053             PREREGISTERED / SOURCE AMENDMENT / DATA NOT CAPTURED')
          s=s.replace('4h data retrieval                      CONTRACT FROZEN / NOT STARTED', '4h data retrieval                      SOURCE AMENDED / NOT CAPTURED')
          marker='4h payload SHA256                      NOT FROZEN\n'
          insert=(marker+
            'capture infrastructure attempt 1        RUN 31511625959 / HTTP 451 / ZERO DATA ROWS\n'+
            'capture endpoint                         https://data-api.binance.vision/api/v3/klines\n')
          if 'capture infrastructure attempt 1' not in s:
              s=s.replace(marker,insert)
          s=s.replace('No 4h data have yet been fetched under 0053.', 'No complete 4h dataset has yet been captured under 0053. One infrastructure-only U.S. GitHub-runner attempt returned HTTP 451 before the first row and created no payload/hash/exposure. The pre-exposure capture contract now uses Binance\'s official market-data-only base `data-api.binance.vision` with the same `/api/v3/klines` resource.')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m 'Docs [DRIFT_0]: record 0053 pre-exposure capture source amendment'
          git rm .github/workflows/_tmp_0053_source_amendment_state.yml .0053_source_state_trigger
          git commit -m 'Governance tooling: remove temporary 0053 source-state writer'
          git push origin HEAD:research/brrk-leadership-intraday-support-0053-capture-source-amendment
