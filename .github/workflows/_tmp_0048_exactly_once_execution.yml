name: 0048 exactly-once DEVELOPMENT execution

on:
  push:
    branches:
      - 'automation/brrk-leadership-rotation-0048-execute-once'

permissions:
  contents: write

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'
  CONTROLLED_HEAD: '12f70c927df39b9e2ba799c8d4c597a7ae9b1726'
  RESULT_BRANCH: 'research/brrk-leadership-rotation-0048-execute-once'
  MARKET: 'research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json'
  OUTPUT: 'research/brrk_leadership_rotation_0048/PRIMARY_RESULT.json'
  SUMMARY: 'research/brrk_leadership_rotation_0048/RESULT_SUMMARY.json'
  EXECUTION: 'research/brrk_leadership_rotation_0048/EXECUTION.json'
  ATTEMPT: 'research/brrk_leadership_rotation_0048/RUN_ATTEMPT.marker'
  MARKER: 'research/brrk_leadership_rotation_0048/RUN_ONCE.marker'

jobs:
  execute-once:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact frozen controlled-run merge
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTROLLED_HEAD }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact detached execution head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CONTROLLED_HEAD"
          test ! -e "$OUTPUT"
          test ! -e "$SUMMARY"
          test ! -e "$EXECUTION"
          test ! -e "$ATTEMPT"
          test ! -e "$MARKER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt

      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt

      - name: Frozen preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m research.brrk_leadership_rotation_0048.run_once preflight \
            --market "$MARKET" \
            --output "$OUTPUT" \
            --summary "$SUMMARY" \
            --execution "$EXECUTION" \
            --attempt "$ATTEMPT" \
            --marker "$MARKER" \
            --expected-head-sha "$CONTROLLED_HEAD" | tee /tmp/0048-preflight.log
          grep -F '"status": "PREFLIGHT_PASS_ZERO_RESULT"' /tmp/0048-preflight.log

      - name: Exactly-once historical DEVELOPMENT evaluate with durable create-only persistence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          from research.brrk_leadership_rotation_0048 import run_once

          controlled_head = os.environ['CONTROLLED_HEAD']
          result_branch = os.environ['RESULT_BRANCH']
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          market = Path(os.environ['MARKET'])
          output = Path(os.environ['OUTPUT'])
          summary = Path(os.environ['SUMMARY'])
          execution = Path(os.environ['EXECUTION'])
          attempt = Path(os.environ['ATTEMPT'])
          marker = Path(os.environ['MARKER'])
          runtime_paths = {output.resolve(), summary.resolve(), execution.resolve(), attempt.resolve(), marker.resolve()}

          original_write = run_once._write_create_only

          def persist_remote_create_only(path: Path, value):
              resolved = path.resolve()
              if resolved not in runtime_paths:
                  return
              safe = run_once._json_safe(value)
              text = json.dumps(safe, indent=2, ensure_ascii=False, allow_nan=False) + '\n'
              api = f"https://api.github.com/repos/{repo}/contents/{path.as_posix()}"
              payload = {
                  'message': f"Research execution [0048]: persist {path.name}",
                  'content': base64.b64encode(text.encode('utf-8')).decode('ascii'),
                  'branch': result_branch,
              }
              request = urllib.request.Request(
                  api,
                  data=json.dumps(payload).encode('utf-8'),
                  method='PUT',
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                      'User-Agent': 'BRRK-0048-exactly-once',
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = json.loads(response.read().decode('utf-8'))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode('utf-8', errors='replace')
                  raise RuntimeError(f"Durable create-only persistence failed for {path}: HTTP {exc.code}: {detail}") from exc
              commit_sha = body.get('commit', {}).get('sha')
              if not commit_sha:
                  raise RuntimeError(f"Durable persistence returned no commit SHA for {path}")
              print(f"BRRK_0048_DURABLE_CREATE={path.as_posix()}@{commit_sha}", flush=True)

          def durable_write(path: Path, value):
              # Persist remotely first. If this fails, computation cannot advance.
              persist_remote_create_only(path, value)
              original_write(path, value)

          run_once._write_create_only = durable_write
          run_once.evaluate(
              market,
              output,
              summary,
              execution,
              attempt,
              marker,
              controlled_head,
          )
          PY

      - name: Verify complete local bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ATTEMPT"
          test -s "$OUTPUT"
          test -s "$SUMMARY"
          test -s "$EXECUTION"
          test -s "$MARKER"
          python - <<'PY'
          import json, os
          from pathlib import Path
          summary = json.loads(Path(os.environ['SUMMARY']).read_text())
          marker = json.loads(Path(os.environ['MARKER']).read_text())
          print('BRRK_0048_FINAL_CLASSIFICATION=' + str(summary['classification']))
          print('BRRK_0048_FINAL_MARKER_STATUS=' + str(marker['status']))
          print('BRRK_0048_FINAL_HEAD=' + str(marker['git_head_sha']))
          PY

      - name: Upload immutable execution bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brrk-0048-execution-bundle
          if-no-files-found: warn
          retention-days: 90
          path: |
            research/brrk_leadership_rotation_0048/RUN_ATTEMPT.marker
            research/brrk_leadership_rotation_0048/PRIMARY_RESULT.json
            research/brrk_leadership_rotation_0048/RESULT_SUMMARY.json
            research/brrk_leadership_rotation_0048/EXECUTION.json
            research/brrk_leadership_rotation_0048/RUN_ONCE.marker
