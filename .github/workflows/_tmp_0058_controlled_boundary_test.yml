name: Temporary 0058 controlled-boundary tests

on:
  push:
    branches:
      - research/0058-beta-btc-continuation-parameter-geometry-controlled-boundary-tooling

permissions:
  contents: read

jobs:
  boundary-contracts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0058-beta-btc-continuation-parameter-geometry-controlled-boundary
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt

      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt

      - name: Verify boundary base and zero-result firewall
        shell: bash
        run: |
          set -euo pipefail
          BASE=e2a0f2fd564274e53d099811d54bcdb06d77fb07
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('research/brrk_beta_btc_continuation_parameter_geometry_0058')
          for name in ('RUN_INTERFACE.json','RESULT_SCHEMA.json','run_once.py','test_run_interface.py','CONTROLLED_EXECUTION_BOUNDARY.json'):
              assert (root / name).exists(), name
          for name in ('PRIMARY_RESULT.json','EXECUTION.json','RUN_ATTEMPT.marker','RUN_ONCE.marker'):
              assert not (root / name).exists(), name
          runner = (root / 'run_once.py').read_text()
          for token in ('requests.get', 'fetch_daily_frame(', 'api.binance', 'data-api.binance'):
              assert token not in runner, token
          prereg = json.loads((root / 'PREREGISTRATION.json').read_text())
          impl = json.loads((root / 'IMPLEMENTATION_BOUNDARY.json').read_text())
          boundary = json.loads((root / 'CONTROLLED_EXECUTION_BOUNDARY.json').read_text())
          assert prereg['actual_variants_evaluated'] == 0
          assert impl['actual_variants_evaluated'] == 0
          assert boundary['actual_variants_evaluated'] == 0
          assert boundary['historical_execution_performed'] is False
          assert boundary['runtime_artifacts_present'] is False
          print('REAL_0058_HISTORICAL_PAYLOAD_NOT_LOADED=true')
          print('REAL_0058_PARAMETER_SURFACE_ECONOMICS_NOT_EXECUTED=true')
          print('ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0')
          PY

      - name: Run immutable 0058 implementation contracts
        run: python -m unittest research.brrk_beta_btc_continuation_parameter_geometry_0058.test_engine -v

      - name: Run controlled-run fault and schema contracts
        run: python -m unittest research.brrk_beta_btc_continuation_parameter_geometry_0058.test_run_interface -v

      - name: Validate research governance and no-drift
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift

      - name: Final zero-result audit
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('research/brrk_beta_btc_continuation_parameter_geometry_0058')
          forbidden = ('PRIMARY_RESULT.json','EXECUTION.json','RUN_ATTEMPT.marker','RUN_ONCE.marker')
          for name in forbidden:
              assert not (root / name).exists(), name
          print('REAL_0058_HISTORICAL_PAYLOAD_NOT_LOADED=true')
          print('REAL_0058_PARAMETER_SURFACE_ECONOMICS_NOT_EXECUTED=true')
          print('ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0')
          PY
