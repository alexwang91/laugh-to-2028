name: CARRY RF 0036R1

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/carry-rf-0036r1.yml'
      - 'research/requirements.txt'
      - 'research/common/**'
      - 'research/carry/CARRY-RF-0036*.json'
      - 'research/carry/run_carry_rf_0036r1.py'
      - 'research/carry/test_carry_rf_0036r1.py'
      - 'research/carry/run_carry_pnl_0031.py'
      - 'research/carry/run_carry_stack_0033.py'
      - 'research/carry/run_carry_data_0030.py'
      - 'research/asym_beta/run_asym_beta_0021.py'
      - 'research/results/carry_pnl_0031/**'
      - 'research/results/carry_stack_0033/**'
      - 'research/results/pit_disp_0015/**'
      - 'research/results/funding_pnl_0003/**'
  push:
    branches: [agent/review-f1-f2]
    paths:
      - '.github/workflows/carry-rf-0036r1.yml'

permissions:
  contents: read

concurrency:
  group: carry-rf-0036r1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reprice:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run shared risk-free unit tests
        working-directory: research/common
        run: python -m unittest -v test_risk_free.py
      - name: Run F1 deterministic qualification tests
        working-directory: research/carry
        run: python -m unittest -v test_carry_rf_0036r1.py
      - name: Run preregistered risk-free repricing
        working-directory: research/carry
        shell: bash
        run: |
          set -o pipefail
          python run_carry_rf_0036r1.py | tee carry_rf_0036r1.log
      - name: Upload exact evidence including daily sequences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carry-rf-0036r1-results
          retention-days: 30
          if-no-files-found: error
          path: |
            research/carry/CARRY-RF-0036.json
            research/carry/CARRY-RF-0036R1.json
            research/carry/carry_rf_0036r1.log
            research/results/carry_rf_0036r1/**

  persist-first-valid-evidence:
    if: github.event_name == 'push'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/review-f1-f2
      - name: Download first valid CARRY-RF-0036R1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H 'Accept: application/vnd.github+json' \
            /repos/${{ github.repository }}/actions/artifacts/8927529508/zip \
            > /tmp/carry-rf-0036r1.zip
          rm -rf /tmp/carry-rf-0036r1
          mkdir -p /tmp/carry-rf-0036r1
          unzip -q /tmp/carry-rf-0036r1.zip -d /tmp/carry-rf-0036r1
          mkdir -p research/results/carry_rf_0036r1
          cp -f /tmp/carry-rf-0036r1/results/carry_rf_0036r1/* research/results/carry_rf_0036r1/
      - name: Verify first-valid evidence fingerprint and required daily files
        shell: bash
        run: |
          set -euo pipefail
          test -s research/results/carry_rf_0036r1/summary.json
          test -s research/results/carry_rf_0036r1/daily_repricing.csv
          test -s research/results/carry_rf_0036r1/risk_free_daily.csv
          test -s research/results/carry_rf_0036r1/fred_dtb3_raw.csv
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/results/carry_rf_0036r1/summary.json')
          report = json.loads(p.read_text())
          assert report['status'] == 'FIRST_VALID_REPRICING_COMPLETE'
          assert report['carry_pnl_0031']['corrected_net_economics_pass'] is False
          assert report['carry_line_stopped_under_discipline_7'] is True
          assert report['carry_pnl_0031']['risk_free_source']['raw_csv_sha256'] == '27b9d881b98ec90890a891c1080170fe6ade2a682ab01b6e66561479b113d0c3'
          print('first valid evidence verified')
          PY
      - name: Commit exact first-valid evidence to research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/carry_rf_0036r1/
          if git diff --cached --quiet; then
            echo 'Evidence already persisted; nothing to commit.'
            exit 0
          fi
          git commit -m 'Persist CARRY-RF-0036R1 first-valid daily evidence'
          git push origin HEAD:agent/review-f1-f2
