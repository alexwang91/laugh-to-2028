name: TSMOM 0029 First Mechanism

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tsmom-0029.yml'
      - 'research/requirements.txt'
      - 'research/tsmom/TSMOM-0029-FIRST-MECHANISM.json'
      - 'research/tsmom/run_tsmom_0029_first_mechanism.py'
      - 'research/tsmom/test_tsmom_0029_first_mechanism.py'
      - 'research/tsmom/run_tsmom_pit_0028_eligibility.py'
      - 'research/tsmom/run_tsmom_perp_universe_audit.py'
      - 'research/core/crypto_rotation_backtest.py'
      - 'research/results/pit_disp_0015/daily_equity.csv'

permissions:
  contents: read

concurrency:
  group: tsmom-0029-${{ github.ref }}
  cancel-in-progress: true

jobs:
  first-mechanism:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic mechanism tests
        working-directory: research/tsmom
        run: python -m unittest -v test_tsmom_0029_first_mechanism.py
      - name: Run preregistered first PIT TSMOM mechanism
        working-directory: research/tsmom
        shell: bash
        run: |
          set -o pipefail
          python run_tsmom_0029_first_mechanism.py | tee tsmom_0029.log
      - name: Upload exact mechanism evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsmom-0029-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/tsmom/TSMOM-0029-FIRST-MECHANISM.json
            research/tsmom/tsmom_0029.log
            research/results/tsmom_0029/**
