name: 0048 implementation synthetic contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/brrk_leadership_rotation_0048/**'
      - '.github/workflows/_tmp_0048_implementation_synthetic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Verify implementation-only artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.brrk_leadership_rotation_0048.engine import assert_no_result_artifacts
          assert_no_result_artifacts(Path('research/brrk_leadership_rotation_0048'))
          PY
      - name: Run frozen preregistration and synthetic engine contracts
        run: |
          python -m unittest \
            research.brrk_leadership_rotation_0048.test_preregistration_contract \
            research.brrk_leadership_rotation_0048.test_engine_contract
