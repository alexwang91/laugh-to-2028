name: 0048 implementation synthetic contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/brrk_leadership_rotation_0048/**'
      - '.github/workflows/_tmp_0048_implementation_synthetic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synthetic-contract:
    runs-on: ubuntu-24.04
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-rotation-0048-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Apply deterministic implementation-only numerical repair
        run: |
          python - <<'PY'
          from pathlib import Path

          engine_path = Path('research/brrk_leadership_rotation_0048/engine.py')
          text = engine_path.read_text(encoding='utf-8')
          start = text.index('def fit_offset_ridge(')
          end = text.index('\ndef raw_probability', start)
          replacement = '''def fit_offset_ridge(X: Any, y: Any, prevalence: float) -> FittedOffsetModel:
              X = _as_float_array(X)
              y = _as_float_array(y)
              if X.ndim == 1:
                  X = X.reshape(-1, 1)
              if X.ndim != 2 or y.ndim != 1 or X.shape[0] != y.shape[0] or X.shape[0] == 0:
                  raise FrozenProtocolError("Invalid offset-ridge training shapes")
              if not np.isin(y, [0.0, 1.0]).all():
                  raise FrozenProtocolError("Offset-ridge labels must be binary")
              offset = float(logit_probability(np.asarray([prevalence]))[0])
              beta = np.zeros(X.shape[1], dtype=float)
              identity = np.eye(X.shape[1], dtype=float)

              def loss_grad_hessian(value: np.ndarray) -> tuple[float, np.ndarray, np.ndarray]:
                  logits = offset + X @ value
                  prob = sigmoid(logits)
                  loss = float(
                      np.sum(np.logaddexp(0.0, logits) - y * logits)
                      + 0.5 * RIDGE_LAMBDA * np.dot(value, value)
                  )
                  grad = X.T @ (prob - y) + RIDGE_LAMBDA * value
                  weights = prob * (1.0 - prob)
                  hessian = X.T @ (X * weights[:, None]) + RIDGE_LAMBDA * identity
                  return loss, np.asarray(grad, dtype=float), np.asarray(hessian, dtype=float)

              converged = False
              for _ in range(100):
                  loss, grad, hessian = loss_grad_hessian(beta)
                  if float(np.max(np.abs(grad))) <= 1e-10:
                      converged = True
                      break
                  try:
                      step = np.linalg.solve(hessian, grad)
                  except np.linalg.LinAlgError as exc:
                      raise FrozenProtocolError("Offset-ridge Newton Hessian solve failed") from exc
                  directional = float(np.dot(grad, step))
                  if not np.isfinite(directional) or directional <= 0.0:
                      raise FrozenProtocolError("Offset-ridge Newton direction is not a descent direction")
                  step_scale = 1.0
                  accepted = False
                  for _ in range(60):
                      trial = beta - step_scale * step
                      trial_loss, _, _ = loss_grad_hessian(trial)
                      if trial_loss <= loss - 1e-4 * step_scale * directional:
                          beta = trial
                          accepted = True
                          break
                      step_scale *= 0.5
                  if not accepted:
                      raise FrozenProtocolError("Offset-ridge Newton line search failed")
              final_loss, final_grad, _ = loss_grad_hessian(beta)
              if not np.isfinite(final_loss) or not np.isfinite(beta).all():
                  raise FrozenProtocolError("Offset-ridge produced non-finite solution")
              grad_norm = float(np.max(np.abs(final_grad)))
              if not converged and grad_norm > 1e-8:
                  raise FrozenProtocolError(f"Offset-ridge Newton solver did not converge: {grad_norm}")
              return FittedOffsetModel(beta=np.asarray(beta, dtype=float), prevalence=float(prevalence))
          '''
          # Dedent the literal source while preserving the function body indentation.
          import textwrap
          replacement = textwrap.dedent(replacement)
          engine_path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          test_path = Path('research/brrk_leadership_rotation_0048/test_engine_contract.py')
          test_text = test_path.read_text(encoding='utf-8')
          old = 'y = np.asarray([0, 1, 1, 0, 1, 0, 1, 0], dtype=float)'
          new = 'y = np.asarray([0, 1, 1, 0, 0, 0, 1, 1], dtype=float)'
          if old not in test_text:
              raise SystemExit('Expected finite-temperature synthetic sample marker not found')
          test_path.write_text(test_text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify implementation-only artifact boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          from research.brrk_leadership_rotation_0048.engine import assert_no_result_artifacts
          assert_no_result_artifacts(Path('research/brrk_leadership_rotation_0048'))
          PY
      - name: Run frozen preregistration and synthetic engine contracts
        run: |
          python -m unittest \
            research.brrk_leadership_rotation_0048.test_preregistration_contract \
            research.brrk_leadership_rotation_0048.test_engine_contract
      - name: Persist verified repair and self-delete temporary workflow
        if: success()
        run: |
          rm .github/workflows/_tmp_0048_implementation_synthetic.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_leadership_rotation_0048/engine.py \
                  research/brrk_leadership_rotation_0048/test_engine_contract.py \
                  .github/workflows/_tmp_0048_implementation_synthetic.yml
          if ! git diff --cached --quiet; then
            git commit -m 'Research implementation [DRIFT_0]: fix deterministic 0048 numerical solver'
            git push origin HEAD:research/brrk-leadership-rotation-0048-implementation
          fi
