name: 0053 controlled-run CURRENT_STATE update

on:
  push:
    branches:
      - research/brrk-leadership-intraday-support-0053-controlled-run

permissions:
  contents: write

jobs:
  update-state:
    if: contains(github.event.head_commit.message, 'trigger 0053 controlled state')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-intraday-support-0053-controlled-run
          fetch-depth: 0
      - name: Advance 0053 zero-result controlled-run handoff
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md'); s=p.read_text()
          s=s.replace('Current `main` research merge: **`36a517ecde6bb908101c14edea3695012ec781e4`**', 'Current `main` research merge: **`55c6869bacf2161df6b10ed4f82a423103952fe9`**')
          s=s.replace('Current research branch: **`research/brrk-leadership-intraday-support-0053-implementation`**', 'Current research branch: **`research/brrk-leadership-intraday-support-0053-controlled-run`**')
          s=s.replace('BRRK intraday support 0053             IMPLEMENTATION-ONLY / DATA FROZEN / NO RESULT', 'BRRK intraday support 0053             CONTROLLED-RUN BOUNDARY / ZERO RESULT')
          s=s.replace('support-funnel implementation             PRESENT / NOT EXECUTED ON FROZEN PAYLOAD', 'support-funnel implementation             MERGED / NOT YET EXECUTED ON FROZEN PAYLOAD')
          marker='support execution marker                  ABSENT\n'
          if 'controlled support interface' not in s:
              s=s.replace(marker, marker+'controlled support interface               PRESENT / NOT MERGED\n')
          if '## 11. 0053 controlled support-measurement boundary' not in s:
              s += '\n\n## 11. 0053 controlled support-measurement boundary\n\nThe implementation merge is `55c6869bacf2161df6b10ed4f82a423103952fe9`. `RUN_INTERFACE.json`, `RESULT_SCHEMA.json`, `run_once.py`, and `CONTROLLED_EXECUTION_BOUNDARY.json` now exist on the controlled-run branch, but the frozen payload has still not been passed to `measure_support_funnel()`. `RUN_ATTEMPT.marker`, `SUPPORT_RESULT.json`, `EXECUTION.json`, and `RUN_ONCE.marker` remain absent. After this boundary merges green, the only permitted next action is exact-head preflight followed by one label-blind support measurement. No ETH/SOL labels, model/calibration fits, predictive metrics or portfolio economics are authorized.\n'
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m 'Docs [DRIFT_0]: advance CURRENT_STATE to 0053 controlled zero-result boundary'
          git rm .github/workflows/_tmp_0053_controlled_state.yml .0053_controlled_state_trigger
          git commit -m 'Governance tooling: remove temporary 0053 controlled-state writer'
          git push origin HEAD:research/brrk-leadership-intraday-support-0053-controlled-run
