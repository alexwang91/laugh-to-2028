name: 0075 pre-attempt governance CURRENT_STATE sync

on:
  push:
    branches:
      - governance/0075-preattempt-implementation-replacement-v1

permissions:
  contents: write

jobs:
  sync-current-state:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: governance/0075-preattempt-implementation-replacement-v1

      - name: Apply exact governance handoff and self-delete
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          immutable = 'workflow run                         31381953131 / attempt 1'
          assert s.count(immutable) == 1, 'immutable workflow anchor missing/duplicated'
          assert 'CAPTURE-0001' in s and 'CAPTURE-0002' in s, 'capture anchors missing'

          old_next = "0074 completed immutable Stage 10 closeout at merge `92a1f24f5d5c439920f3cf7b3256343ee1c53f4c` and is `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. Its final operational accounting is controlled reads `402`, scientific engine `1/1` consumed but inadmissible non-frozen harness, scientific source-network fetches `0`, and no admissible strategy-performance result. 0075 Stage1 OWNER-FIRST merged at `f162c21cfccfe8a7801f78c4e07e357cdf20f93e`; Stage2 DESIGN merged at `27ac33952cff3ef835b2585dc990c09833624db9`; Stage3 PREREGISTRATION merged at `7b0ba828c75f9ecf8293b2e99a0531eac7954720`; Stage4 IMPLEMENTATION merged at `084a0ec5726a2abcda7aa78e284de58b4dae9f2b`; Stage5 NONHISTORICAL QUALIFICATION merged at `c03dba8a89de81869a8dcb8024f95538f2f9af3f`; Stage6 CONTROLLED-EXECUTION BOUNDARY merged at `fdce516ee37245ab6c3295d6148595ae03f6af0c`. Stage7 ZERO-RESULT PREFLIGHT is in progress on PR #378 / `research/0075-stage7-zero-result-preflight-v1` with terminal `PREFLIGHT_PASS_ZERO_RESULT`; formal completion remains `6/10` until Stage7 merge. 0075 controlled attempt is `0/1`; controlled scientific-history reads are `0`; scientific engine calls are `0`; scientific source-network fetches are `0`. The next legal action is exact-head mandatory CI success followed by expected-head Stage7 merge; Stage8 remains prohibited until that merge."
          new_next = "0074 remains immutable `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN`. 0075 Stage1-Stage6 are merged and Stage7 ZERO-RESULT PREFLIGHT merged at `3af2a58cb7ff12be37f918f2c45f44369bd0900d` with `PREFLIGHT_PASS_ZERO_RESULT`. Stage8 PR #379 obtained explicit contemporaneous authorization, but before any durable `RUN_ATTEMPT.marker`, controlled scientific-history read, scientific-engine call, or Stage8 scientific source-network fetch, pre-marker audit found `PREMARKER_READINESS_FAIL_FROZEN_IMPLEMENTATION_INCOMPLETE`; Issue #380 records the defect. 0075 therefore remains formal completion `7/10`, attempt `0/1` unconsumed, controlled reads `0`, scientific engine `0/1`, source-network fetches `0`, scientific values exposed `false`, and #379 stays draft/pre-marker. Governance PR #381 prospectively proposes `BLOCKED_PRE_ATTEMPT_FROZEN_IMPLEMENTATION_INCOMPLETE` plus replacement `BRRK-CRYPTO-CROSS-SECTIONAL-FACTOR-ATLAS-REPLACEMENT-0084`; neither routing change nor 0084 is authoritative before #381 merges. No 0075 marker or controlled scientific read is legal while #381 is unresolved."
          assert s.count(old_next) == 1, 'expected stale 0075 next-step paragraph not found exactly once'
          s = s.replace(old_next, new_next, 1)

          old_line = "0075 = STAGE-1 OWNER-FIRST MERGED AT `f162c21cfccfe8a7801f78c4e07e357cdf20f93e` / STAGE-2 DESIGN MERGED AT `27ac33952cff3ef835b2585dc990c09833624db9` / STAGE-3 PREREGISTRATION MERGED AT `7b0ba828c75f9ecf8293b2e99a0531eac7954720` / STAGE-4 IMPLEMENTATION MERGED AT `084a0ec5726a2abcda7aa78e284de58b4dae9f2b` / STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c03dba8a89de81869a8dcb8024f95538f2f9af3f` / STAGE-6 CONTROLLED-EXECUTION BOUNDARY MERGED AT `fdce516ee37245ab6c3295d6148595ae03f6af0c` / STAGE-7 ZERO-RESULT PREFLIGHT PASS IN PROGRESS ON #378 / FORMAL COMPLETION 6/10 UNTIL STAGE-7 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new_line = "0075 = STAGE-1 THROUGH STAGE-7 MERGED / STAGE-7 MERGE `3af2a58cb7ff12be37f918f2c45f44369bd0900d` / `PREFLIGHT_PASS_ZERO_RESULT` / STAGE-8 #379 AUTHORIZED BUT DRAFT-PRE-MARKER BLOCKED BY `PREMARKER_READINESS_FAIL_FROZEN_IMPLEMENTATION_INCOMPLETE` / ISSUE #380 / GOVERNANCE RESOLUTION #381 PROSPECTIVE ONLY UNTIL MERGE / FORMAL COMPLETION 7/10 / CONTROLLED ATTEMPT 0/1 UNCONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0/1 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / SCIENTIFIC VALUES EXPOSED FALSE / NO MARKER / NO RESULT / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.\n0084 = PROSPECTIVE 0075 REPLACEMENT ONLY / NOT AUTHORIZED UNLESS GOVERNANCE PR #381 MERGES / MUST RESTART FULL TEN-STAGE LIFECYCLE / NO INHERITED SCIENTIFIC RESULT OR STAGE CREDIT."
          assert s.count(old_line) == 1, 'expected stale 0075 no-drift line not found exactly once'
          s = s.replace(old_line, new_line, 1)

          assert s.count(immutable) == 1, 'immutable workflow anchor changed'
          p.write_text(s)
          PY

          git rm .github/workflows/0075-preattempt-governance-current-state-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "governance(0075): synchronize blocked pre-marker handoff"
          git push origin HEAD:governance/0075-preattempt-implementation-replacement-v1
