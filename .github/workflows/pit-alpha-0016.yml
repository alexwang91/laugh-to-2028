name: PIT ALPHA 0016 Dynamic Rotation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pit-alpha-0016.yml'
      - 'research/requirements.txt'
      - 'research/crypto_rotation_backtest.py'
      - 'research/core/crypto_rotation_backtest.py'
      - 'research/pit_universe/PIT-ALPHA-0016-DYNAMIC-ROTATION.json'
      - 'research/pit_universe/run_dynamic_alpha.py'
      - 'research/pit_universe/run_archive_discovery.py'
      - 'research/pit_universe/run_dynamic_dispersion.py'

permissions:
  contents: write

concurrency:
  group: pit-alpha-0016-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dynamic-alpha:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run preregistered point-in-time alpha test
        working-directory: research/pit_universe
        shell: bash
        run: |
          set -o pipefail
          python run_dynamic_alpha.py | tee pit_alpha_0016.log
      - name: Persist validated outputs on same-repository PR
        if: github.event_name == 'pull_request' && success()
        shell: bash
        run: |
          set -euo pipefail
          out='research/results/pit_alpha_0016'
          mkdir -p "$out"
          cp research/pit_universe/pit_alpha_0016_outputs/* "$out/"
          cp research/pit_universe/pit_alpha_0016.log "$out/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$out"
          if ! git diff --cached --quiet; then
            git commit -m 'Record PIT alpha 0016 outputs'
            git fetch origin "${GITHUB_HEAD_REF}"
            git rebase "origin/${GITHUB_HEAD_REF}"
            git push origin HEAD:"${GITHUB_HEAD_REF}"
          fi
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pit-alpha-0016-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/pit_universe/pit_alpha_0016.log
            research/pit_universe/pit_alpha_0016_outputs/**
            research/pit_universe/PIT-ALPHA-0016-DYNAMIC-ROTATION.json
