name: Sync 0085 BUILD current state

on:
  push:
    branches:
      - research/0085-trend-build-v1

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0085-trend-build-v1
          fetch-depth: 0
      - name: Update handoff
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("docs/CURRENT_STATE.md")
          s = p.read_text(encoding="utf-8")
          anchor = "workflow run                         31381953131 / attempt 1"
          marker = "## 0085 Trend BUILD — 2026-08-25"
          assert s.count(anchor) == 1
          assert marker not in s
          s = s.rstrip() + """

## 0085 Trend BUILD — 2026-08-25

- `BRRK-MULTI-HORIZON-TREND-VOL-TARGET-0085` BUILD = IMPLEMENTATION + NONHISTORICAL QUALIFICATION is implemented on branch `research/0085-trend-build-v1`; controlled reads remain `0`, attempt remains `0/1`, scientific engine budget remains unconsumed, and scientific source-network fetches remain `0`.
- BUILD freezes the SPEC-delegated portfolio-volatility mechanic before controlled history: current active normalized inverse-vol weights are applied as fixed coefficients to trailing 20-session asset log returns; sample volatility is annualized by `sqrt(365)`; risky gross targets 25% and remains capped at 1.0 with no shorts.
- The runner-facing interface is frozen before ARM: required BTC/ETH/SOL daily-close JSON objects plus optional ARM-bound cash and canonical-BRRK daily-return objects. If cash is bound, Sharpe uses that cash series as risk-free and any missing bound cash return fails closed; if cash is absent, cash and risk-free return are exactly zero.
- Standing mandatory CI executes the synthetic 0085 BUILD qualification through `research/governance/test_0085_trend_build.py`; these tests use no controlled scientific payload.
- 0074 and 0084 remain immutable `INVALID_EXECUTION`; 0076 remains sealed at the Stage7 pre-marker read-boundary incident with no same-ID continuation; 0072/0073 remain closed/paused; 0083 remains immutable FAIL. Production/signature/order/withdrawal/transfer authority remains false.
- After terminal-green BUILD merge, the next legal 0085 gate is ARM only: bind exact source identities/hashes/sizes, read/call budgets, optional cash/canonical presence, qualified common-runner identity, and a zero-result metadata-only preflight. ARM may not read controlled payload.
""" + "\n"
          p.write_text(s, encoding="utf-8")
          assert p.read_text(encoding="utf-8").count(anchor) == 1
          assert p.read_text(encoding="utf-8").count(marker) == 1
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md
          git rm .github/workflows/0085-build-current-state-writer.yml
          git diff --cached --check
          git commit -m "governance(0085): sync BUILD CURRENT_STATE handoff"
          git push origin HEAD:research/0085-trend-build-v1
