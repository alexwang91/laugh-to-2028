name: AUDIT 0026 April Semantic Risk

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-0026-semantic-risk.yml'
      - 'research/requirements.txt'
      - 'research/asym_beta/AUDIT-0026-APRIL-SEMANTIC-RISK.json'
      - 'research/asym_beta/run_audit_0026_semantic_risk.py'
      - 'research/asym_beta/test_audit_0026_semantic_risk.py'
      - 'research/regime_kelly/**'
      - 'research/hybrid_meta/**'
      - 'research/crypto_rotation_backtest.py'

permissions:
  contents: read

concurrency:
  group: audit-0026-semantic-risk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-risk-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic audit tests
        working-directory: research/asym_beta
        run: python -m unittest -v test_audit_0026_semantic_risk.py
      - name: Run no-trading-change semantic risk audit
        working-directory: research/asym_beta
        shell: bash
        run: |
          set -o pipefail
          python run_audit_0026_semantic_risk.py | tee audit_0026_semantic_risk.log
      - name: Upload exact audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-0026-semantic-risk-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/asym_beta/AUDIT-0026-APRIL-SEMANTIC-RISK.json
            research/asym_beta/audit_0026_semantic_risk.log
            research/results/audit_0026_semantic_risk/**
