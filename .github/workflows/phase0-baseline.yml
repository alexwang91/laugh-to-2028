name: Phase 0 baseline contract

on:
  pull_request:
    paths:
      - "config/**"
      - "execution/plan-b-bot/**"
      - "research/integration/**"
      - ".github/workflows/phase0-baseline.yml"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "execution/plan-b-bot/**"
      - "research/integration/**"
      - ".github/workflows/phase0-baseline.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install execution test dependencies
        working-directory: execution/plan-b-bot
        run: pip install -r requirements-dev.txt
      - name: Run execution tests
        working-directory: execution/plan-b-bot
        run: pytest -q
      - name: Run research integration contract
        run: python research/integration/test_product_config_contract.py
