name: Temporary Stablecoin Stage-1 terminal handoff patch

on:
  push:
    branches:
      - research/stablecoin-liquidity-0001-stage1-closeout

permissions:
  contents: write

jobs:
  handoff-once:
    if: contains(github.event.head_commit.message, '[STABLECOIN_STAGE1_CLOSEOUT_HANDOFF_V1]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/stablecoin-liquidity-0001-stage1-closeout
          fetch-depth: 0
      - name: Replace only Stablecoin terminal section and next action
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text(encoding='utf-8')

          old='Stablecoin liquidity research     STABLECOIN-LIQUIDITY-0001 / STAGE-1 ONE-SHOT CLAIMED + ARMED_NOT_EXECUTED / NO RESULT'
          new='Stablecoin liquidity research     STABLECOIN-LIQUIDITY-0001 / STAGE-1 COMPLETE / FAIL_NO_INCREMENTAL_INFORMATION / TERMINAL STOP'
          if s.count(old)!=1:
              raise SystemExit(f'unexpected executive Stablecoin line count: {s.count(old)}')
          s=s.replace(old,new,1)

          workflow_old='- `.github/workflows/research-governance.yml` — CI enforcement, including the governed Stablecoin data-contract/capture-gate regression suite. The temporary live one-shot executor used for the first capture has been removed after successful execution.'
          workflow_new='- `.github/workflows/research-governance.yml` — CI enforcement, including the governed Stablecoin data-contract/capture-gate/run-interface regression suite. Both temporary live executors (first capture and Stage-1 result execution) were removed immediately after their one-shot use.'
          if s.count(workflow_old)!=1:
              raise SystemExit('unexpected workflow handoff text')
          s=s.replace(workflow_old,workflow_new,1)

          lineage_old='PR #121 repaired the cross-gate conflict between future-research registration and the final no-drift regression without broadening the legacy allowlist. PR #122 repaired preregistration-only validator semantics so empty pre-result dataset/evidence arrays do not require fabricated placeholders. PR #123 prospectively registered `STABLECOIN-LIQUIDITY-0001`. PR #124 froze its source/data/PIT contract. PR #125 froze the one-shot first-capture gate. PR #126 split capture/persist from finalize so durable archival must precede parsing. PR #127 armed and executed the single governed capture on merge commit `824f58151bcef2203c320e4b94b8070dcac77dae` through GitHub Actions run `31261566204`; both governance and capture jobs completed successfully.'
          lineage_new=lineage_old+' PR #128 registered the captured validation slice/exposure and removed the capture executor. PR #129 froze `STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1`. PR #130 irreversibly claimed and executed Stage-1 exactly once on merge `dd50ec35085eee2a2883dc1b29e3dd21ec52b043`, workflow run `31264048473`, producing the immutable primary FAIL result now closed out below.'
          if s.count(lineage_old)!=1:
              raise SystemExit('unexpected Stablecoin lineage paragraph')
          s=s.replace(lineage_old,lineage_new,1)

          section_start=s.index('## STABLECOIN-LIQUIDITY-0001\n')
          section_end=s.index('## Frozen product boundaries\n', section_start)
          replacement='''## STABLECOIN-LIQUIDITY-0001

`STABLECOIN-LIQUIDITY-0001` was a prospectively governed Stage-1 mechanism test asking whether the frozen `STABLECOIN_LIQUIDITY_STATE_V1` feature family adds predictive information about future 20-day canonical BRRK net returns beyond the frozen P3.2 BRRK price/regime state.

The research ID has now reached its frozen stopping point:

```text
result_status                    FAIL_NO_INCREMENTAL_INFORMATION
failure_reason                   PRIMARY_MEAN_LOSS_DIFFERENTIAL_NONPOSITIVE
promotion_state                  NO_PROMOTION
production_authorized            false
declared_variant_budget          1
actual_variants_evaluated        1
run_interface                    STABLECOIN-LIQUIDITY-0001-RUN-INTERFACE-V1 / IMMUTABLE PRE-RESULT CONTRACT
run_once_marker                  RUN_ONCE_STAGE1.marker / PERMANENT / DO NOT DELETE
stage1 execution                 STABLECOIN-LIQUIDITY-0001-STAGE1-RUN-V1 / EXECUTED ONCE / TERMINAL FAIL_STOP
stage1 merge commit              dd50ec35085eee2a2883dc1b29e3dd21ec52b043
stage1 workflow run              31264048473 / run_attempt=1 / SUCCESS
validation dataset               STABLECOIN-LIQUIDITY-0001-DEFILLAMA-HIST-V1
validation exposure              STABLECOIN-LIQUIDITY-0001-RAW-DATA-20260808T141719Z
