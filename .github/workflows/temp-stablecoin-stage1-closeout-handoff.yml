            'hac_one_sided_p_value            0.8935124773215692',
            'stage2 robustness eligibility    NONE / PRIMARY STAGE-1 FAILED',
            'edge admission                   NONE',
            'portfolio integration            NONE',
            'DO NOT DELETE, RERUN, RETRY OR REUSE THIS RESEARCH ID'
          ]
          for item in required:
              assert item in s, item
          PY
      - name: Remove helper and commit authoritative terminal handoff
        run: |
          set -euo pipefail
          git rm .github/workflows/temp-stablecoin-stage1-closeout-handoff.yml
          git add docs/CURRENT_STATE.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
