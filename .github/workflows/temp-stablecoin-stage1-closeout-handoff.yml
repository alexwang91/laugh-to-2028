DO NOT RUN BEAR-SHORT-0001 ECONOMICS WITHOUT THE FROZEN CONFIRMED-BEAR TRIGGER
DO NOT AUTHORIZE A FIRST REAL SHORT WITHOUT THE SEPARATE HUMAN GATE
```
'''
          s=s[:next_start]+next_replacement
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate terminal handoff facts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('docs/CURRENT_STATE.md').read_text(encoding='utf-8')
          required=[
            'STAGE-1 COMPLETE / FAIL_NO_INCREMENTAL_INFORMATION / TERMINAL STOP',
