name: Temporary 0047 implementation preflight

on:
  push:
    branches:
      - research/brrk-beta-handoff-0047-implementation
    paths:
      - .github/workflows/tmp-0047-implementation-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-beta-handoff-0047-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install implementation-test runtime only
        run: python -m pip install --disable-pip-version-check numpy pandas requests scipy scikit-learn
      - name: Normalize synthetic-test-only representation assertions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('research/governance/test_brrk_beta_handoff_0047_implementation.py')
          lines = p.read_text().splitlines()
          out = []
          replaced_ids = False
          skipped_age = False
          replaced_freq = False
          for line in lines:
              if 'self.assertEqual(ids.astype("object").tolist()' in line:
                  out.append('        got_ids = [None if pd.isna(v) else int(v) for v in ids]')
                  out.append('        got_age = [None if pd.isna(v) else int(v) for v in age]')
                  out.append('        self.assertEqual(got_ids, [None, 1, 1, None, 2, 2, None, 3, None])')
                  out.append('        self.assertEqual(got_age, [None, 1, 2, None, 1, 2, None, 1, None])')
                  replaced_ids = True
                  continue
              if 'self.assertEqual(age.astype("object").tolist()' in line:
                  skipped_age = True
                  continue
              if 'pd.testing.assert_frame_equal(rebuilt[asset], frames[asset])' in line:
                  out.append('            pd.testing.assert_frame_equal(rebuilt[asset], frames[asset], check_freq=False)')
                  replaced_freq = True
                  continue
              out.append(line)
          assert replaced_ids and skipped_age and replaced_freq
          p.write_text('\n'.join(out) + '\n')
          PY
      - name: Compile implementation
        run: python -m py_compile research/brrk_beta_handoff_0047/engine.py research/brrk_beta_handoff_0047/run_once.py research/governance/test_brrk_beta_handoff_0047_implementation.py
      - name: Run 0047 prereg and implementation contracts only
        run: |
          python -m unittest \
            research.governance.test_brrk_beta_handoff_0047_prereg_contract \
            research.governance.test_brrk_beta_handoff_0047_implementation
      - name: Assert zero historical output and zero forbidden model or portfolio files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          here = Path('research/brrk_beta_handoff_0047')
          forbidden = [
              'MARKET_EVIDENCE.json','PRIMARY_RESULT.json','EXECUTION.json','RUN_ONCE.marker','RESULT.md',
              'handoff_model.py','hazard_model.py','bocpd.py','portfolio.py'
          ]
          assert all(not (here / name).exists() for name in forbidden)
          PY
      - name: Append implementation-stage CURRENT_STATE handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          text = p.read_text()
          marker = '## BRRK-BETA-HANDOFF-EVENT-STUDY-0047 — implementation candidate'
          assert marker not in text
          lines = [
              '', '',
              marker,
              '',
              'The exact 0047 design and formal preregistration are already merged at `398b7ec3f78f602461787b1b45e8d5041729e126` and `80c0d3cb7339012cac74e20563e07c7139ba3031`. The current branch implements that frozen Stage-1 anatomy only. It has not fetched 0047 historical market evidence and has released no 0047 scientific or economic result.',
              '',
              '```text',
              '0047 exact design                    MERGED / IMMUTABLE / 398b7ec3f78f602461787b1b45e8d5041729e126',
              '0047 formal preregistration          MERGED / IMMUTABLE / 80c0d3cb7339012cac74e20563e07c7139ba3031',
              '0047 implementation                 IMPLEMENTED_PRE_RESULT_NOT_RUN / PR CANDIDATE',
              '0047 declared variants               1',
              '0047 actual variants evaluated       0',
              '0047 MARKET_EVIDENCE                  NOT CREATED',
              '0047 historical result               NONE',
              '0047 duration-aware model            FORBIDDEN UNDER 0047',
              '0047 winner allocation/economics     FORBIDDEN UNDER 0047',
              'canonical BRRK change                NONE',
              'Phase-6 change                       NONE',
              'production_authorized                false',
              'signature_authorized                 false',
              'order_submission_authorized          false',
              '```',
              '',
              'Implementation checkpoint: canonical V1 20/60/120/240 fast/slow trend equivalence is test-bound; BTC-positive episodes remain maximal contiguous `BTC_TREND_FAST >= 0`; ETH/BTC and SOL/BTC fast/slow relative trend, fast-minus-slow acceleration, two-asset breadth, trailing-60 trade-count participation and state age are implemented; the same-cause +20/+60 durable target requires positive BTC at both horizons and right-censors unavailable +60; cross-episode return/VAR pairs are forbidden; XCF is -14..+14 with positive lag meaning BTC leads; pooled episode-fixed-effect VAR(7), all six cluster-aware Granger/Wald diagnostics, generalized BTC IRF 0..14, complete-episode 10,000/470047 bootstrap and the non-gating one-switch oracle are implemented. Stage classification reads only the frozen recurrence/cause-diversity gates.',
              '',
              'Pre-result engineering clarifications are frozen in `RUN_INTERFACE.json`: raw requests begin 2020-08-01 but the common index begins at the latest first available BTC/ETH/SOL date; all days from common start through 2026-08-02 must be present or fail closed; within-episode demeaning is the fixed-intercept VAR implementation; singular Granger cluster covariance returns a null descriptive p-value rather than a rescue estimator; market evidence is create-only and SHA256-bound before result metrics.',
              '',
              'Exact next task: require the implementation PR to pass standing governance/no-drift/P3.2/Phase-6/handoff CI, verify no temporary workflow or generated evidence remains, and merge only as a zero-result implementation boundary. Only after that merge may a separate controlled execution branch call `prepare-data` and then execute the frozen anatomy exactly once. No hazard model, BOCPD rescue, 60/80/100 allocation, portfolio economics, exhaustion gross mapping, Phase-6 change or production/security change is permitted under 0047.',
              ''
          ]
          p.write_text(text.rstrip() + '\n'.join(lines))
          PY
      - name: Remove temporary workflow and commit preflight-approved implementation handoff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-0047-implementation-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          test ! -e .github/workflows/tmp-0047-implementation-preflight.yml
          git commit -m 'research impl: bind zero-result 0047 implementation preflight'
          git push origin HEAD:research/brrk-beta-handoff-0047-implementation
