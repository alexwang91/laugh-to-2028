name: Temporary BRRK-WINNER-0001 run once

on:
  push:
    branches:
      - research/brrk-winner-0001-runonce
    paths:
      - .github/workflows/brrk-winner-0001-runonce.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  run-once:
    if: github.event.head_commit.message == 'Temporary: execute BRRK-WINNER-0001 exactly once'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned research runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Execute exactly one frozen candidate
        run: PYTHONPATH=. python research/brrk_winner_0001/run_once.py --output /tmp/BRRK-WINNER-0001-PRIMARY-RESULT.json
      - name: Upload immutable run output
        uses: actions/upload-artifact@v4
        with:
          name: brrk-winner-0001-primary-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/BRRK-WINNER-0001-PRIMARY-RESULT.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
