name: CARRY RF 0036R2

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/carry-rf-0036r2.yml'
      - 'research/carry/CARRY-RF-0036R2.json'
      - 'research/carry/run_carry_rf_0036r2.py'
      - 'research/carry/test_carry_rf_0036r2.py'
      - 'research/results/carry_rf_0036r1/**'

permissions:
  contents: read

concurrency:
  group: carry-rf-0036r2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic tests
        working-directory: research/carry
        run: python -m unittest -v test_carry_rf_0036r2.py
      - name: Run preregistered reporting correction
        working-directory: research/carry
        run: python run_carry_rf_0036r2.py
      - name: Verify PR #30 metric parity and unchanged stop decision
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/results/carry_rf_0036r2/summary.json')
          r = json.loads(p.read_text())
          assert abs(r['carry_pnl_0031']['excess_sharpe_over_rf'] - (-0.223150784371855)) < 1e-12
          assert r['carry_pnl_0031']['corrected_net_economics_pass'] is False
          assert r['carry_line_stopped_under_discipline_7'] is True
          assert r['carry_pm_0035_required'] is False
          print('R2 reference parity and unchanged STOP decision verified')
          PY
      - name: Upload R2 report
        uses: actions/upload-artifact@v4
        with:
          name: carry-rf-0036r2-results
          retention-days: 30
          if-no-files-found: error
          path: research/results/carry_rf_0036r2/**
