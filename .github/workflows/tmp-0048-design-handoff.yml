name: tmp-0048-design-handoff

on:
  push:
    branches:
      - research/brrk-leadership-rotation-0048-design

permissions:
  contents: write

jobs:
  append-and-clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify design-only boundary before handoff
        shell: bash
        run: |
          set -euo pipefail
          test -f research/governance/BRRK_LEADERSHIP_ROTATION_0048_ARCHITECTURE_FREEZE_2026-08-11.md
          ! find research -iname '*0048*RESULT*' -o -iname '*0048*EXECUTION*' -o -iname '*0048*RUN_ONCE*' | grep -q .
      - name: Append 0048 architecture handoff
        shell: bash
        run: |
          printf '\n' >> docs/CURRENT_STATE.md
          echo '' | base64 -d >> docs/CURRENT_STATE.md
      - name: Remove temporary writer and commit handoff only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-0048-design-handoff.yml
          git add docs/CURRENT_STATE.md
          git commit -m 'governance: append 0048 architecture handoff'
          git push origin HEAD:research/brrk-leadership-rotation-0048-design
