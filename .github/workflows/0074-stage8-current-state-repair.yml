name: 0074 Stage8 CURRENT_STATE repair

on:
  push:
    branches:
      - research/0074-stage8-controlled-attempt-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0074-stage8-controlled-attempt-v1
          fetch-depth: 0
      - name: Synchronize terminal Stage8 handoff only
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert s.count(anchor) == 1, 'immutable anchor missing or duplicated'

          next_text = (
              '0073 completed immutable Stage 10 closeout at merge `da62a1ef2258eb27f5a4cede2415c567f19d3e76` and remains '
              '`10/10 COMPLETE / INCONCLUSIVE_INSUFFICIENT_SUPPORT / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. '
              '0074 Stage 7 ZERO-RESULT PREFLIGHT merged at `4e2dd98519ce9d513318beb5678ac1e00be3a04b`; '
              'Stage 8 unique controlled attempt is terminal `INVALID_EXECUTION` on PR #369 after durable `RUN_ATTEMPT.marker` and create-only '
              '`PRIMARY_RESULT.json` -> `EVIDENCE.json` -> `EXECUTION.json` -> `RUN_ONCE.marker`. Formal completion is `7/10` until Stage 8 merges. '
              '0074 attempt is permanently `1/1 CONSUMED`; controlled scientific/history reads are `0`; scientific engine calls are `0`; '
              'scientific source-network fetches are `0`; no scientific values were exposed. The same ID is closed against rerun, retune, rescue, '
              'source substitution, candidate replacement, history extension and recomputation. The next legal action is exact-head CI and expected-head '
              'merge of Stage 8, then a separate Stage 9 RESULT branch that only interprets the persisted immutable invalid-execution bundle.'
          )
          pattern = re.compile(r'(?ms)(^## Exact next step\n\n).*?(?=\n\n## No-drift authority)')
          s, n = pattern.subn(lambda m: m.group(1) + next_text, s, count=1)
          assert n == 1, 'Exact next step section not uniquely repairable'

          state_line = (
              '0074 = OWNER-FIRST MERGED AT `2af445a26e2a1d08b38a1cc9f6c853b29c828cde` / '
              'STAGE-2 DESIGN MERGED AT `08eafc22c3772bd021bc7e3c201c5dc63ac81e64` / '
              'STAGE-3 PREREGISTRATION MERGED AT `beae11d807886bfec65aa5cc8a26f79e92e5a0e9` / '
              'STAGE-4 IMPLEMENTATION MERGED AT `b74263cd6ab2bddd37544702fec0a187b7433151` / '
              'STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c1bf177d98e14f54c26374cf52151c9ad90733e8` / '
              'STAGE-6 CONTROLLED BOUNDARY MERGED AT `3d48f2fd837334e184dd3a9de3b8a003fa7c23a0` / '
              'STAGE-7 ZERO-RESULT PREFLIGHT MERGED AT `4e2dd98519ce9d513318beb5678ac1e00be3a04b` / '
              'STAGE-8 CONTROLLED ATTEMPT TERMINAL `INVALID_EXECUTION` ON #369 / FORMAL COMPLETION 7/10 UNTIL STAGE-8 MERGE / '
              'CONTROLLED ATTEMPT 1/1 CONSUMED / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SOURCE NETWORK FETCHES 0 / '
              'RUN_ONCE SEALED / NO SAME-ID RERUN-RETUNE-RESCUE-RECOMPUTE / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE.'
          )
          s, n = re.subn(r'(?m)^0074 =.*$', state_line, s, count=1)
          assert n == 1, '0074 state line not uniquely repairable'
          assert s.count(anchor) == 1, 'immutable anchor changed'
          p.write_text(s)
          PY
      - name: Remove one-shot writer
        run: rm .github/workflows/0074-stage8-current-state-repair.yml
      - name: Commit synchronized handoff
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0074-stage8-current-state-repair.yml
          git commit -m 'governance(0074): synchronize terminal Stage8 handoff'
          git push origin HEAD:research/0074-stage8-controlled-attempt-v1
