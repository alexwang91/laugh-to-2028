name: Temporary 0085 invalid handoff finalizer

on:
  push:
    branches:
      - research/0085-artifact-path-adapter-repair-v1
    paths:
      - .github/workflows/tmp-0085-invalid-handoff-finalizer.yml

permissions:
  contents: write

jobs:
  append-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0085-artifact-path-adapter-repair-v1
          fetch-depth: 0
      - name: Append immutable 0085 terminal handoff and remove finalizer
        shell: bash
        run: |
          set -euo pipefail
          marker='## 0085 Trend terminal INVALID_EXECUTION — 2026-08-25'
          if grep -Fqx "$marker" docs/CURRENT_STATE.md; then
            echo 'handoff already present'
          else
            cat >> docs/CURRENT_STATE.md <<'EOF'

## 0085 Trend terminal INVALID_EXECUTION — 2026-08-25

- The explicitly authorized 0085 controlled RUN attempt 1/1 is consumed and permanently sealed. Durable `RUN_ATTEMPT.marker` was created before controlled content reads; the run then completed exactly 201 authorized outer payload reads and exactly one scientific-engine invocation.
- Persisted terminal classification is `INVALID_EXECUTION:ENGINE_OR_RUNTIME_FAILURE:TrendExecutionError`; `scientific_result_admissible=false`. The exact failure is `UNKNOWN_CONTROLLED_SOURCE:payloads/data__futures__um__monthly__klines__BTCUSDT__1d__BTCUSDT-1d-2021-01.zip`.
- `RESULT.json` and `RUN_ONCE.marker` were create-only persisted after the failure. No PASS/FAIL/INCONCLUSIVE scientific claim exists for 0085. Same-ID rerun, retune, rescue, recompute, retroactive reinterpretation and replacement-chain continuation are forbidden.
- Root cause is an execution-interface namespace mismatch: GitHub artifact members are exposed as `payloads/...` while the pre-existing post-marker adapter accepted only `stage/payloads/...`. The bytes remained bound to the frozen parent manifest by exact SHA-256 and size; the failure happened after the durable marker and therefore consumes the sole attempt.
- Prospective repair may teach the adapter both namespace forms and must requalify synthetically before any future scientific attempt. The repair does not reopen 0085 or alter its frozen science, source identities, attempt budget or terminal state.
- Phase6 R1 remains closed on genuine schedule-origin evidence; `CONTROLLED_RESEARCH_RUNNER_V1` R2 and the prospective five-gate R3 amendment remain merged. 0076 remains sealed; 0072/0073 Carry remain paused; 0083 remains immutable FAIL. Production/signature/order/withdrawal/transfer authority remains false.
EOF
          fi
          git rm .github/workflows/tmp-0085-invalid-handoff-finalizer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m 'docs(0085): record sealed invalid execution handoff'
          git push origin HEAD:research/0085-artifact-path-adapter-repair-v1
