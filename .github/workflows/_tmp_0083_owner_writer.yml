name: Temporary 0083 OWNER-FIRST writer

on:
  push:
    branches:
      - research/0083-owner-first-v1
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  write-owner-first:
    if: github.head_ref == 'research/0083-owner-first-v1' || github.ref_name == 'research/0083-owner-first-v1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0083-owner-first-v1
          fetch-depth: 1

      - name: Append 0083 registry record and update CURRENT_STATE
        shell: bash
        run: |
          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          OLD_ID = "BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-0071"
          NEW_ID = "BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-REPLACEMENT-0083"
          NEW_PATH = "research/brrk_sol_long_sideways_controller_integration_replacement_0083"
          RESOLUTION = "research/governance/CRYPTO_MULTI_STRATEGY_0071_PREFLIGHT_CONTAMINATION_RESOLUTION.md"

          registry_path = Path("config/research_registry.json")
          raw = registry_path.read_text(encoding="utf-8")
          data = json.loads(raw)
          assert not any(r.get("research_id") == NEW_ID for r in data["records"])
          source = next(r for r in data["records"] if r.get("research_id") == OLD_ID)
          new = copy.deepcopy(source)

          def replace_0071(obj):
              if isinstance(obj, str):
                  return obj.replace("0071", "0083")
              if isinstance(obj, list):
                  return [replace_0071(x) for x in obj]
              if isinstance(obj, dict):
                  return {k: replace_0071(v) for k, v in obj.items()}
              return obj

          new = replace_0071(new)
          new["research_id"] = NEW_ID
          new["created_at"] = "2026-08-18"
          new["created_before_result"] = True
          new["hypothesis_origin"] = "GOVERNANCE_REPLACEMENT_AFTER_0071_PRE_ATTEMPT_CONTROLLED_CONTENT_CONTAMINATION; SCIENTIFIC_CONTRACT_MECHANICALLY_INHERITED_FROM_FROZEN_0071_WITH_ZERO_RESULT_INFORMED_CHANGE; DEVELOPMENT_HISTORY_ECONOMIC_INTEGRATION_ONLY; NOT_INDEPENDENT_OOS."
          new["stopping_rule"] = "OWNER-FIRST -> DESIGN -> PREREGISTRATION -> IMPLEMENTATION -> NONHISTORICAL QUALIFICATION -> CONTROLLED BOUNDARY -> exact merged-boundary ZERO-RESULT PREFLIGHT -> at most one durable controlled development-history attempt -> RESULT -> IMMUTABLE CLOSEOUT. No formal stage is inherited from 0071. A durable 0083 RUN_ATTEMPT.marker must precede the first permitted 0083 controlled scientific/economic content read. After durable marker creation, no same-ID rerun, rescue, retune, threshold relaxation, alternate cost rule, alternate benchmark or alternate controller is allowed."
          new["lineage_edges"] = [{"relation":"MEASUREMENT_FIX","ref_research_id":OLD_ID,"provenance_status":"FACT","evidence_ref":RESOLUTION}]
          new["result_status"] = "PREREGISTERED_NOT_RUN"
          new["failure_reason"] = None
          new["promotion_state"] = "NONE"
          new["evidence_refs"] = []
          new["decision_refs"] = [RESOLUTION, "docs/CURRENT_STATE.md"]
          new["production_relevance"] = "Governance-replacement DEVELOPMENT-history SOL risk-controller integration research only; no automatic production, signature or order authority."
          new["production_authorized"] = False
          new["provenance_status"] = "PROSPECTIVE_FROZEN"
          new["governed_path_prefixes"] = [NEW_PATH]
          inherited = list(new.get("researcher_decisions", []))
          new["researcher_decisions"] = ["0083 is a new full-lifecycle replacement authorized prospectively by merged governance resolution PR #296; it is not a 0071 rerun and inherits no completed formal stage.","No observed information from the accidental 0071 preflight content exposure may alter, narrow, widen, reprioritize, retune or rescue any 0083 scientific choice."] + inherited
          new["notes"] = ["OWNER-FIRST registration only; the formal 0083 research path does not exist at this stage.","Governance resolution PR #296 merged at b58960ee3bc9e5cc5976d889cc28026614525686 and permanently leaves 0071 blocked at 6/10 with attempt 0/1 unconsumed.","0083 independently restarts the ten-stage lifecycle and may not inherit 0071 formal completion despite mechanically binding its frozen scientific contract.","The accidental 0071 connector content exposure has zero 0083 parameter-selection, tuning, candidate-pruning, cost, gate or benchmark authority.","0083 controlled scientific/economic content reads remain zero at OWNER-FIRST and attempt remains 0/1.","No 0083 controlled read is authorized before its own merged CONTROLLED BOUNDARY, identity-only ZERO-RESULT PREFLIGHT PASS and durable 0083 RUN_ATTEMPT.marker.","Evidence remains researcher-exposed DEVELOPMENT history, not independent OOS.","production_authorized=false; signature_authorized=false; order_submission_authorized=false."]

          marker = '\n  ],\n  "research_governance_debt": ['
          pos = raw.rfind(marker)
          assert pos > 0
          rendered = json.dumps(new, indent=2, ensure_ascii=False)
          rendered = "\n".join("    " + line for line in rendered.splitlines())
          raw2 = raw[:pos] + ",\n" + rendered + raw[pos:]
          parsed = json.loads(raw2)
          assert parsed["records"][-1]["research_id"] == NEW_ID
          assert len(parsed["records"]) == len(data["records"]) + 1
          assert parsed["research_governance_debt"] == data["research_governance_debt"]
          registry_path.write_text(raw2, encoding="utf-8")

          state_path = Path("docs/CURRENT_STATE.md")
          state = state_path.read_text(encoding="utf-8")
          immutable = "workflow run                         31381953131 / attempt 1"
          assert immutable in state
          state = state.replace("- prospective governance resolution PR #296, not authoritative unless merged.","- governance resolution PR #296 merge `b58960ee3bc9e5cc5976d889cc28026614525686`; 0071 remains permanently blocked at 6/10 with attempt 0/1.")
          old_resolution = "PR #296 prospectively proposes, only if its exact head passes standing CI and merges, to keep 0071 permanently blocked at 6/10 and authorize a new full-lifecycle replacement ID `BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-REPLACEMENT-0083`. 0083 is not yet authorized while #296 remains unmerged."
          assert old_resolution in state
          state = state.replace(old_resolution,"Governance resolution PR #296 merged at `b58960ee3bc9e5cc5976d889cc28026614525686`. It permanently keeps 0071 blocked at 6/10, forbids retroactive marker creation or same-ID continuation, and prospectively authorizes replacement ID `BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-REPLACEMENT-0083` to begin a fresh ten-stage lifecycle. No formal 0071 stage is inherited by 0083.")
          owner = '''## 0083 replacement controller integration OWNER-FIRST

Research ID = `BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-REPLACEMENT-0083`.
State = `OWNER-FIRST IN BRANCH / DESIGN NOT STARTED / CONTROLLED ATTEMPT 0/1`.

Owner-first base = exact governance-resolution merge `b58960ee3bc9e5cc5976d889cc28026614525686`.
Governance authority = `research/governance/CRYPTO_MULTI_STRATEGY_0071_PREFLIGHT_CONTAMINATION_RESOLUTION.md`.

OWNER-FIRST prospectively binds, before any formal 0083 research path or controlled scientific/economic read:
- the scientific question and complete controller candidate ceiling to the already-frozen 0071 contract, with zero result-informed scientific change;
- locked predictive input = 0070 P02 `P02_RAW_ELASTIC_NET_LOGIT|SOL|T4_LONG_SIDEWAYS`, lead exactly 10 sessions, sole predictive warning input;
- universe = SOL only;
- exactly six selectable controller families = `BINARY_RISK_OFF`, `LINEAR_DERISK`, `PIECEWISE_DERISK`, `VOL_ADJUSTED`, `DRAWDOWN_AWARE`, `HYSTERESIS`;
- matched signal-off controls remain diagnostic and nonselectable;
- long-or-cash only, no leverage and no short SOL; P03/P08 remain excluded;
- frozen 0064 passive-cash semantics and the C0/C1/C2 framework remain unchanged;
- no information from the accidental 0071 preflight content exposure may influence 0083 tuning, pruning, thresholds, costs, gates, benchmark choice or controller priority;
- formal lifecycle restarts at 0/10; no completed 0071 stage is inherited;
- 0083 controlled scientific/economic content reads = `0`; network fetches = `0`; attempt = `0/1`;
- production/signature/order authority remains false.

No formal path `research/brrk_sol_long_sideways_controller_integration_replacement_0083` exists yet. It may be introduced only by a separate DESIGN PR after OWNER-FIRST merges.

'''
          exact_next = "## Exact next step\n\nRun exact-head standing CI on governance resolution PR #296. Merge only if every required workflow succeeds. If #296 merges, create a separate OWNER-FIRST PR for replacement ID `BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-REPLACEMENT-0083` and independently traverse all ten lifecycle stages. Until then, do not read any additional controlled scientific/economic payload and do not resume 0071.\n"
          assert exact_next in state
          state = state.replace(exact_next, owner + "## Exact next step\n\nOpen the 0083 OWNER-FIRST PR from exact base `b58960ee3bc9e5cc5976d889cc28026614525686` and run every required standing workflow on its exact head. Merge only if all exact-head standing CI succeeds. After OWNER-FIRST merge, introduce `research/brrk_sol_long_sideways_controller_integration_replacement_0083` for the first time in a separate DESIGN PR with no controlled scientific/economic read and no new historical performance.\n")
          state = state.replace("0083 = PROSPECTIVE REPLACEMENT ONLY / NOT AUTHORIZED UNLESS GOVERNANCE PR #296 MERGES.","0083 = OWNER-FIRST IN BRANCH / DESIGN NOT STARTED / ATTEMPT 0/1 / CONTROLLED READS 0.")
          assert state.count(immutable) == 1
          state_path.write_text(state, encoding="utf-8")
          PY

          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/research_registry.json docs/CURRENT_STATE.md
          git rm .github/workflows/_tmp_0083_owner_writer.yml
          test "$(git diff --cached --name-only | sort)" = "$(printf '%s\n' '.github/workflows/_tmp_0083_owner_writer.yml' 'config/research_registry.json' 'docs/CURRENT_STATE.md' | sort)"
          git commit -m "governance(0083): register replacement OWNER-FIRST"
          git push origin HEAD:research/0083-owner-first-v1

# bootstrap revision 2
