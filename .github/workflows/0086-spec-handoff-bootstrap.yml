name: 0086 SPEC handoff bootstrap

on:
  push:
    branches:
      - research/0086-factor-atlas-spec-freeze-clean-v2

permissions:
  contents: write

jobs:
  update-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0086-factor-atlas-spec-freeze-clean-v2
          fetch-depth: 0
      - name: Update registry status and CURRENT_STATE
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rp = Path('config/research_registry.json')
          data = json.loads(rp.read_text())
          rid = 'BRRK-CROSS-SECTIONAL-FACTOR-ATLAS-0086'
          matches = [r for r in data['records'] if r.get('research_id') == rid]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one 0086 owner record, found {len(matches)}')
          r = matches[0]
          r['result_status'] = 'SPEC_FREEZE_PROPOSED'
          spec = 'research/brrk_cross_sectional_factor_atlas_0086/SPEC_FREEZE.md'
          if spec not in r['decision_refs']:
              r['decision_refs'].append(spec)
          rp.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          cp = Path('docs/CURRENT_STATE.md')
          text = cp.read_text()
          marker = '## 0086 independent cross-sectional Factor Atlas\n'
          if marker in text:
              raise SystemExit('0086 CURRENT_STATE section already exists')
          section = '''\n## 0086 independent cross-sectional Factor Atlas\n\nResearch ID = `BRRK-CROSS-SECTIONAL-FACTOR-ATLAS-0086`.\nState = `SPEC_FREEZE_PROPOSED / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0`.\n\n0086 is independent from 0075/0076/0084/0085 and inherits zero lifecycle credit, attempt credit, factor-selection credit, or scientific result. The central owner record was durably committed before the governed 0086 research path was introduced.\n\nFrozen SPEC tests exactly three predeclared factor representatives: momentum `MOM60_RAW`, volatility `RVOL20_RAW`, and liquidity `LIQ30_RAW`. Size/market-cap and carry/funding are excluded because no qualifying point-in-time source identity was frozen before SPEC_FREEZE. The exact multiplicity family is three tests with Holm FWER 0.05. Universe construction, Monday UTC-close decision timing, FWD5 outcome, raw rank transforms, MBB inference, support minima, 10/20 bps economic diagnostics, terminal rules, trial budget, and stop rules are frozen before any controlled value exposure.\n\nAny future 0086 controlled RUN must use `ControlledResearchRunnerV1SourceQualified`, requires a separate irreversible user authorization, and permits at most one attempt. Pre-marker payload traversal/decompression/CRC remains forbidden. Factor L/S remains forbidden unless 0086 returns a valid PASS, and only passing factor families may become eligible for a separately governed future ID.\n\n0085 remains immutable `INVALID_EXECUTION` with attempt 1/1 consumed and no admissible Trend result. 0076 remains sealed; 0072/0073 remain paused; 0083 remains immutable FAIL; Phase6 PASS closeout remains unchanged. Production/signature/order/withdrawal/transfer authority remains zero.\n'''
          cp.write_text(text.rstrip() + '\n' + section)
          PY
      - name: Remove bootstrap and commit handoff
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/0086-spec-handoff-bootstrap.yml
          git add config/research_registry.json docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m "research(0086): record SPEC freeze handoff"
          git push origin HEAD:research/0086-factor-atlas-spec-freeze-clean-v2
