name: 0046 correction test-entrypoint editor once

on:
  push:
    branches:
      - governance/0046-artifact-evidence-correction
    paths:
      - .github/workflows/0046-artifact-evidence-correction-editor-once.yml

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/0046-artifact-evidence-correction
          fetch-depth: 0
      - name: Replace invalid unittest entrypoint and self-delete
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/0046-artifact-evidence-correction-once.yml')
          s=p.read_text()
          old='          python -m unittest research.governance.test_brrk_exhaustion_pulse_0046_closeout\n'
          new="""          python - <<'PYTEST'\n          import research.governance.test_brrk_exhaustion_pulse_0046_closeout as t\n          tests=[getattr(t,n) for n in sorted(dir(t)) if n.startswith('test_') and callable(getattr(t,n))]\n          assert tests, 'no closeout tests discovered'\n          for fn in tests:\n              fn()\n          print(f'executed {len(tests)} 0046 closeout tests')\n          PYTEST\n"""
          assert old in s
          p.write_text(s.replace(old,new,1))
          Path('.github/workflows/0046-artifact-evidence-correction-editor-once.yml').unlink()
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'governance: repair 0046 correction test entrypoint'
          git push origin HEAD:governance/0046-artifact-evidence-correction
