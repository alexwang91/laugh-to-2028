name: Temporary 0047 prereg registry sync

on:
  push:
    branches:
      - research/brrk-beta-handoff-0047-prereg
    paths:
      - .github/workflows/tmp-0047-prereg-registry-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-beta-handoff-0047-prereg
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Mechanically append frozen preregistration and exposure rows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          rid = 'BRRK-BETA-HANDOFF-EVENT-STUDY-0047'
          dataset_id = 'BRRK-BETA-HANDOFF-0047-EXPOSED-HIST-V1'
          exposure_id = 'BRRK-BETA-HANDOFF-0047-DEVELOPMENT-DATA-REGISTRATION-20260810T232616Z'

          prereg_path = root / 'research/brrk_beta_handoff_0047/PREREGISTRATION.json'
          decl_path = root / 'research/brrk_beta_handoff_0047/DATASET_DECLARATION.json'
          rr_path = root / 'config/research_registry.json'
          dr_path = root / 'config/dataset_exposure_registry.json'
          state_path = root / 'docs/CURRENT_STATE.md'

          prereg = json.loads(prereg_path.read_text())
          decl = json.loads(decl_path.read_text())
          rr = json.loads(rr_path.read_text())
          dr = json.loads(dr_path.read_text())

          assert prereg['research_id'] == rid
          assert prereg['result_status'] == 'PREREGISTERED_NOT_RUN'
          assert prereg['declared_variant_budget'] == 1
          assert prereg['actual_variants_evaluated'] == 0
          assert prereg['production_authorized'] is False
          assert decl['dataset_slice']['dataset_slice_id'] == dataset_id
          assert decl['exposure_event']['exposure_id'] == exposure_id
          assert decl['dataset_slice']['end'] == '2026-08-02T00:00:00Z'
          assert decl['dataset_slice']['contamination_state'] == 'RESEARCHER_EXPOSED_HISTORY'

          assert not any(x.get('research_id') == rid for x in rr['records'])
          assert not any(x.get('dataset_slice_id') == dataset_id for x in dr['dataset_slices'])
          assert not any(x.get('exposure_id') == exposure_id for x in dr['exposure_events'])

          rr['records'].append(prereg)
          dr['dataset_slices'].append(decl['dataset_slice'])
          dr['exposure_events'].append(decl['exposure_event'])

          rr_path.write_text(json.dumps(rr, indent=2, ensure_ascii=False) + '\n')
          dr_path.write_text(json.dumps(dr, indent=2, ensure_ascii=False) + '\n')

          lines = [
              '',
              '',
              '## BRRK-BETA-HANDOFF-EVENT-STUDY-0047 — formal preregistration candidate',
              '',
              'The exact 0047 design is already merged and immutable at `398b7ec3f78f602461787b1b45e8d5041729e126`. The current preregistration branch mechanically registers that design under Program Governance v1 and registers the already exposed BTC/ETH/SOL DEVELOPMENT history through `2026-08-02`. No runner, model fit, market result or portfolio result exists on this branch.',
              '',
              '```text',
              '0047 exact design                    MERGED / IMMUTABLE / 398b7ec3f78f602461787b1b45e8d5041729e126',
              '0047 formal PROGRAM_GOVERNED_V1     PREREGISTERED_NOT_RUN / PR CANDIDATE',
              '0047 dataset slice                   BRRK-BETA-HANDOFF-0047-EXPOSED-HIST-V1',
              '0047 contamination                   RESEARCHER_EXPOSED_HISTORY / DEVELOPMENT',
              '0047 declared variants               1',
              '0047 actual variants evaluated       0',
              '0047 runner                          NOT CREATED',
              '0047 historical result               NONE',
              '0047 duration-aware model            FORBIDDEN UNDER 0047',
              '0047 60/80/100 winner allocation     FORBIDDEN UNDER 0047',
              '0047 portfolio economics             FORBIDDEN UNDER 0047',
              'canonical BRRK change                NONE',
              'Phase-6 change                       NONE',
              'production_authorized                false',
              'signature_authorized                 false',
              'order_submission_authorized          false',
              '```',
              '',
              'Frozen method checkpoint remains unchanged from the design merge: canonical BTC-positive episodes; exact V1 20/60/120/240 fast/slow trend math; ETH/BTC and SOL/BTC fast/slow relative structure; `REL_FAST-REL_SLOW` acceleration; two-asset Beta breadth; trailing-60 trade-count participation surprise; raw state age; separate unique same-cause +20/+60 durable realized target with positive BTC on both horizons; right censoring rather than false negatives; episode-preserving cross-correlation `-14..+14`; pooled episode-preserving VAR(7); all six directed Granger/Wald diagnostics; generalized BTC-shock IRF `0..14`; complete-episode bootstrap `10,000 / seed 470047`; and a one-switch hindsight oracle isolated as a non-gating opportunity bound.',
              '',
              'The preregistration treats those components as **one frozen diagnostic protocol**, not a candidate tournament. `actual_variants_evaluated=0`. A future valid 0047 execution may only determine whether recurrent durable handoff structure is sufficient to justify a new, separately preregistered duration-aware model stage. It cannot establish predictability, CAGR improvement, portfolio concentration or production authority.',
              '',
              'Exact next task after this preregistration PR is fully green and merged: create a separate implementation-only branch from the merged preregistration boundary; encode the frozen anatomy with equivalence/fail-closed tests; keep result files absent; re-audit the full method checklist; merge only a zero-result implementation. Only after that boundary may one controlled historical 0047 execution occur. No 0047 allocation test, hazard-model fit, BOCPD rescue, exhaustion gross mapping, Phase-6 change or production/security change is permitted.',
              '',
          ]
          handoff = '\n'.join(lines)
          current = state_path.read_text()
          marker = '## BRRK-BETA-HANDOFF-EVENT-STUDY-0047 — formal preregistration candidate'
          assert marker not in current
          state_path.write_text(current.rstrip() + handoff)

          rr2 = json.loads(rr_path.read_text())
          dr2 = json.loads(dr_path.read_text())
          matches = [x for x in rr2['records'] if x.get('research_id') == rid]
          slices = [x for x in dr2['dataset_slices'] if x.get('dataset_slice_id') == dataset_id]
          events = [x for x in dr2['exposure_events'] if x.get('exposure_id') == exposure_id]
          assert matches == [prereg]
          assert slices == [decl['dataset_slice']]
          assert events == [decl['exposure_event']]
          PY

      - name: Remove temporary write-enabled workflow from final tree
        shell: bash
        run: rm .github/workflows/tmp-0047-prereg-registry-sync.yml

      - name: Verify frozen prereg invariants before commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/brrk_beta_handoff_0047/PREREGISTRATION.json').read_text())
          assert p['actual_variants_evaluated'] == 0
          assert p['result_status'] == 'PREREGISTERED_NOT_RUN'
          assert p['production_authorized'] is False
          forbidden = ['run_once.py','RUN_INTERFACE.json','PRIMARY_RESULT.json','EXECUTION.json','RUN_ONCE.marker','RESULT.md','hazard_model.py','handoff_model.py']
          here = Path('research/brrk_beta_handoff_0047')
          assert all(not (here / x).exists() for x in forbidden)
          assert not Path('.github/workflows/tmp-0047-prereg-registry-sync.yml').exists()
          PY

      - name: Commit registry and handoff sync, with workflow removed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json config/dataset_exposure_registry.json docs/CURRENT_STATE.md .github/workflows/tmp-0047-prereg-registry-sync.yml
          git diff --cached --check
          git commit -m 'research prereg: register 0047 and exposed development dataset'
          git push origin HEAD:research/brrk-beta-handoff-0047-prereg
