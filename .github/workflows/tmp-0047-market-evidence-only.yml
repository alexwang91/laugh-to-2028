name: Temporary 0047 market evidence only

on:
  push:
    branches:
      - research/brrk-beta-handoff-0047-controlled-run
    paths:
      - .github/workflows/tmp-0047-market-evidence-only.yml

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-beta-handoff-0047-controlled-run
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prove immutable scientific implementation before data access
        shell: bash
        run: |
          set -euo pipefail
          BASE=341e0b75595baef26823debe4f29a338eda63f5c
          git diff --exit-code "$BASE" -- \
            research/brrk_beta_handoff_0047/engine.py \
            research/brrk_beta_handoff_0047/run_once.py \
            research/brrk_beta_handoff_0047/RUN_INTERFACE.json \
            research/brrk_beta_handoff_0047/PREREGISTRATION.json \
            research/brrk_beta_handoff_0047/DATASET_DECLARATION.json \
            research/governance/BRRK_BETA_HANDOFF_EVENT_STUDY_0047_DESIGN_FREEZE_2026-08-11.md
          python - <<'PY'
          import json
          from pathlib import Path
          i = json.loads(Path('research/brrk_beta_handoff_0047/RUN_INTERFACE.json').read_text())
          assert i['status'] == 'IMPLEMENTED_PRE_RESULT_NOT_RUN'
          assert i['actual_variants_evaluated'] == 0
          assert i['frozen_design_merge_commit'] == '398b7ec3f78f602461787b1b45e8d5041729e126'
          assert i['frozen_prereg_merge_commit'] == '80c0d3cb7339012cac74e20563e07c7139ba3031'
          assert i['frozen_causal_trend']['horizons'] == [20,60,120,240]
          assert i['frozen_realized_target']['forward_horizons'] == [20,60]
          assert i['frozen_uncertainty']['replicates'] == 10000
          assert i['frozen_uncertainty']['seed'] == 470047
          assert i['stage_gates'] == {
              'target_eligible_episode_count_min': 5,
              'primary_handoff_episode_count_min': 3,
              'episode_level_durable_handoff_prevalence_min': 0.5,
              'ETH_primary_cause_episode_count_min': 1,
              'SOL_primary_cause_episode_count_min': 1,
          }
          PY

      - name: Install frozen evidence runtime
        run: python -m pip install --disable-pip-version-check numpy pandas requests scipy

      - name: Capture create-only frozen market evidence — no anatomy evaluation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p research/brrk_beta_handoff_0047/evidence
          python -m research.brrk_beta_handoff_0047.run_once prepare-data \
            --output research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json
          test ! -e research/brrk_beta_handoff_0047/PRIMARY_RESULT.json
          test ! -e research/brrk_beta_handoff_0047/EXECUTION.json
          test ! -e research/brrk_beta_handoff_0047/RUN_ONCE.marker

      - name: Validate evidence identity, common index and SHA without computing handoff metrics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          from research.brrk_beta_handoff_0047.engine import (
              ASSETS, DATASET_SLICE_ID, FROZEN_END, RESEARCH_ID,
              frames_from_market_evidence, sha256_json,
          )
          path = Path('research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json')
          evidence = json.loads(path.read_text())
          payload = evidence['payload']
          assert payload['research_id'] == RESEARCH_ID
          assert payload['dataset_slice_id'] == DATASET_SLICE_ID
          assert payload['frozen_end'] == '2026-08-02'
          assert payload['common_end'] == '2026-08-02'
          assert payload['assets'] == list(ASSETS)
          assert evidence['payload_sha256'] == sha256_json(payload)
          frames = frames_from_market_evidence(evidence)
          idx = frames['BTC'].index
          assert idx[-1] == FROZEN_END
          expected = pd.date_range(idx[0], FROZEN_END, freq='D')
          assert idx.equals(expected)
          assert all(frames[a].index.equals(idx) for a in ASSETS)
          assert len(payload['rows']) == len(idx) * len(ASSETS)
          summary = {
              'payload_sha256': evidence['payload_sha256'],
              'common_start': payload['common_start'],
              'common_end': payload['common_end'],
              'common_daily_sessions': len(idx),
              'serialized_rows': len(payload['rows']),
              'assets': payload['assets'],
              'fields': payload['fields'],
              'anatomy_metrics_computed': False,
              'actual_variants_evaluated': 0,
          }
          Path('research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE_SUMMARY.json').write_text(
              json.dumps(summary, indent=2, sort_keys=True) + '\n'
          )
          print('BRRK_0047_EVIDENCE_SUMMARY=' + json.dumps(summary, sort_keys=True))
          PY

      - name: Remove write-enabled evidence workflow before evidence commit
        shell: bash
        run: rm .github/workflows/tmp-0047-market-evidence-only.yml

      - name: Commit evidence only — still no research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json \
                  research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE_SUMMARY.json \
                  .github/workflows/tmp-0047-market-evidence-only.yml
          git diff --cached --check
          test ! -e .github/workflows/tmp-0047-market-evidence-only.yml
          test ! -e research/brrk_beta_handoff_0047/PRIMARY_RESULT.json
          test ! -e research/brrk_beta_handoff_0047/EXECUTION.json
          test ! -e research/brrk_beta_handoff_0047/RUN_ONCE.marker
          git commit -m 'research exec: bind 0047 market evidence before anatomy evaluation'
          git push origin HEAD:research/brrk-beta-handoff-0047-controlled-run
