name: BRRK exhaustion state 0044 once

on:
  push:
    branches:
      - research/brrk-exhaustion-state-0044-runonce
    paths:
      - .github/workflows/brrk-exhaustion-state-0044-once.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  frozen-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-exhaustion-state-0044-runonce
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned research runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Reconfirm frozen preregistration contract before result release
        run: |
          python -m unittest research.governance.test_brrk_exhaustion_state_0044_prereg -v
          python -m unittest research.brrk_exhaustion_state_0044.test_run_once_contract -v
          python -m research.governance.validate
          python -m research.governance.no_drift
      - name: Execute frozen 0044 diagnostic exactly once
        run: |
          python -m research.brrk_exhaustion_state_0044.run_once \
            --output /tmp/BRRK_EXHAUSTION_STATE_0044_PRIMARY_RESULT.json
      - name: Create compact immutable result summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          source = Path('/tmp/BRRK_EXHAUSTION_STATE_0044_PRIMARY_RESULT.json')
          result = json.loads(source.read_text())
          summary = {
              'research_id': result['research_id'],
              'result_status': result['result_status'],
              'window': result['window'],
              'source_reproduction': result['source_integrity']['0043_taxonomy_reproduction'],
              'episodes': result['episodes'],
              'primary_summary': result['primary_summary'],
              'gates': result['gates'],
              'state_axis_effective_rank': result['state_axis_correlation']['effective_rank_participation_ratio'],
              'state_axis_pairwise_correlation': result['state_axis_correlation']['pairwise_correlation'],
              'authority': result['authority'],
              'result_payload_sha256_without_self_hash': result['result_payload_sha256_without_self_hash'],
          }
          out = Path('/tmp/BRRK_EXHAUSTION_STATE_0044_SUMMARY.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n')
          print('BRRK_EXHAUSTION_STATE_0044_SUMMARY=' + json.dumps(summary, sort_keys=True, separators=(',', ':')))
          PY
      - name: Upload unique 0044 result artifact
        uses: actions/upload-artifact@v4
        with:
          name: brrk-exhaustion-state-0044
          path: |
            /tmp/BRRK_EXHAUSTION_STATE_0044_PRIMARY_RESULT.json
            /tmp/BRRK_EXHAUSTION_STATE_0044_SUMMARY.json
          if-no-files-found: error
          retention-days: 90
          overwrite: false
