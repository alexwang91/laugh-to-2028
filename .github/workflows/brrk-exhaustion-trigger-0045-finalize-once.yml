name: BRRK exhaustion trigger 0045 finalize once

on:
  push:
    branches:
      - research/brrk-exhaustion-trigger-0045-runonce
    paths:
      - .github/workflows/brrk-exhaustion-trigger-0045-finalize-once.yml

permissions:
  contents: write

jobs:
  finalize-result:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-exhaustion-trigger-0045-runonce
          fetch-depth: 0
      - name: Apply immutable result lifecycle closeout
        run: python research/governance/finalize_brrk_exhaustion_trigger_0045_once.py
      - name: Commit closeout and remove temporary execution infrastructure
        run: |
          git rm .github/workflows/brrk-exhaustion-trigger-0045-once.yml
          git rm .github/workflows/brrk-exhaustion-trigger-0045-finalize-once.yml
          git rm research/governance/finalize_brrk_exhaustion_trigger_0045_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/research_registry.json docs/CURRENT_STATE.md
          git diff --cached --check
          git commit -m 'research: close BRRK exhaustion trigger 0045 immutable FAIL'
          git push origin HEAD:research/brrk-exhaustion-trigger-0045-runonce
