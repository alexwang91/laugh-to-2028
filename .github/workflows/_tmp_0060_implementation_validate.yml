name: 0060 implementation validate

on:
  push:
    branches:
      - research/0060-btc-cash-absolute-risk-diagnostic-implementation

permissions:
  contents: write

concurrency:
  group: brrk-0060-implementation-validate
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0060-btc-cash-absolute-risk-diagnostic-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Run 0060 synthetic contracts
        run: pytest -q research/brrk_btc_cash_absolute_risk_diagnostic_0060/test_engine.py
      - name: Materialize zero-result handoff
        run: |
          set -euo pipefail
          git config user.name 'Y_Wang'
          git config user.email '40142450+alexwang91@users.noreply.github.com'
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          s=s.replace('Current `main` research merge: **`142733887c0e8c0652e29afa9eb99c9c4ede4a42`**','Current `main` research merge: **`cf803b355632a91d19a38186cbf5a369e8a2a6db`**')
          s=s.replace('Current research branch: **`research/0060-btc-cash-absolute-risk-diagnostic-prereg`**','Current research branch: **`research/0060-btc-cash-absolute-risk-diagnostic-implementation`**')
          s=s.replace('BRRK BTC->Cash absolute risk 0060     NUMERICAL/DATA PREREG FROZEN / NOT IMPLEMENTED / NOT RUN','BRRK BTC->Cash absolute risk 0060     IMPLEMENTATION-ONLY / ZERO RESULT / NOT RUN')
          if '## 0060 implementation-only handoff' not in s:
              s += '''\n\n---\n\n## 0060 implementation-only handoff\n\n0060 numerical/data preregistration merged at `cf803b355632a91d19a38186cbf5a369e8a2a6db`. The implementation branch adds only the data-agnostic frozen BTC absolute-risk engine, synthetic contract tests and `IMPLEMENTATION_BOUNDARY.json`.\n\nThe engine accepts a caller-supplied BTC close frame. It contains no 0047 market loader import, no network request, no filesystem market-evidence reader, no `run_once.py`, no `RUN_INTERFACE.json`, no `RESULT_SCHEMA.json`, no controlled-execution boundary and no runtime marker.\n\nFrozen mechanics implemented: 20/60/120/240 BRRK trend components; A1 trend disagreement/persistence; A2 trailing-high/age/MA20 slope structure; A3 RV acceleration/semivol asymmetry/negative-return share; trailing252/min60 causal z-score clip3; strict required-coordinate equal-weight A1/A2/A3/S; terminal-loss and origin-relative adverse-excursion targets at all four horizons; identical shared origin set; average-tie Spearman; four equal-as-possible chronological blocks; 240-row non-circular aligned moving-block bootstrap with simultaneous centered-max LCBs; G1-G4 classification hierarchy.\n\nSynthetic tests exercise formula timing, strict missingness, tie handling, target semantics, block partition, deterministic bootstrap, classification precedence and a synthetic end-to-end call. Synthetic classifications have zero scientific authority.\n\n```text\nREAL_0060_HISTORICAL_PAYLOAD_NOT_LOADED     true\nREAL_0060_DOWNSIDE_TARGETS_NOT_EXECUTED     true\nACTUAL_HISTORICAL_VARIANTS_EVALUATED        0\nBTC/Cash gross map                           absent / forbidden\nportfolio economics                         absent / forbidden\nproduction_authorized                       false\nsignature_authorized                        false\norder_submission_authorized                 false\n```\n\n**Exact next step after implementation merge:** a separate zero-result controlled-execution boundary must freeze immutable engine/source hashes, result schema, run interface and exactly-once marker/fault semantics. No historical 0060 target may be computed before that boundary merges.\n'''
          p.write_text(s)
          PY
          echo 'REAL_0060_HISTORICAL_PAYLOAD_NOT_LOADED=true'
          echo 'REAL_0060_DOWNSIDE_TARGETS_NOT_EXECUTED=true'
          echo 'ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0'
          git rm .github/workflows/_tmp_0060_implementation_validate.yml
          git add docs/CURRENT_STATE.md
          git commit -m 'Research implementation [0060]: record synthetic-only zero-result handoff'
          git push origin HEAD:research/0060-btc-cash-absolute-risk-diagnostic-implementation
