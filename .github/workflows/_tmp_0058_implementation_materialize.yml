name: Temporary 0058 implementation materializer

on:
  push:
    branches:
      - research/0058-beta-btc-continuation-parameter-geometry-implementation-tooling

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0058-beta-btc-continuation-parameter-geometry-implementation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt

      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt

      - name: Verify implementation base and zero-result surface
        shell: bash
        run: |
          set -euo pipefail
          BASE=e6d94b30c8bb4d126d6c234c30980d701a9ababc
          test "$(git merge-base "$BASE" HEAD)" = "$BASE"
          python - <<'PY'
          from pathlib import Path
          root = Path('research/brrk_beta_btc_continuation_parameter_geometry_0058')
          engine = (root / 'engine.py').read_text()
          forbidden_engine = ['requests.', 'urllib.', 'frames_from_market_evidence', 'read_text(', 'read_bytes(', 'open(']
          for token in forbidden_engine:
              assert token not in engine, token
          forbidden_artifacts = [
              'PRIMARY_RESULT.json', 'EXECUTION.json', 'RUN_ATTEMPT.marker', 'RUN_ONCE.marker',
              'run_once.py', 'RUN_INTERFACE.json', 'RESULT_SCHEMA.json', 'CONTROLLED_EXECUTION_BOUNDARY.json'
          ]
          for name in forbidden_artifacts:
              assert not (root / name).exists(), name
          prereg = (root / 'PREREGISTRATION.json').read_text()
          assert '"actual_variants_evaluated": 0' in prereg
          print('REAL_0058_HISTORICAL_PAYLOAD_NOT_LOADED=true')
          print('REAL_0058_PARAMETER_SURFACE_ECONOMICS_NOT_EXECUTED=true')
          print('ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0')
          PY

      - name: Run 0058 synthetic contract tests
        run: |
          python -m unittest research.brrk_beta_btc_continuation_parameter_geometry_0058.test_engine -v

      - name: Validate governance before handoff materialization
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift

      - name: Materialize implementation boundary and handoff
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('research/brrk_beta_btc_continuation_parameter_geometry_0058')
          engine_path = root / 'engine.py'
          test_path = root / 'test_engine.py'
          engine_sha = subprocess.check_output(['git', 'hash-object', str(engine_path)], text=True).strip()
          test_sha = subprocess.check_output(['git', 'hash-object', str(test_path)], text=True).strip()
          run_id = int(os.environ['RUN_ID'])

          boundary = {
              'research_id': 'BRRK-BETA-BTC-CONTINUATION-PARAMETER-GEOMETRY-0058',
              'stage': 'PARAMETER_GEOMETRY_IMPLEMENTATION_ONLY',
              'base_main_prereg_merge_sha': 'e6d94b30c8bb4d126d6c234c30980d701a9ababc',
              'status': 'IMPLEMENTED_FOR_SYNTHETIC_CONTRACT_TESTING_ONLY_REAL_HISTORICAL_EVALUATION_FORBIDDEN',
              'actual_variants_evaluated': 0,
              'immutable_prereg_git_blobs': {
                  'research/brrk_beta_btc_continuation_parameter_geometry_0058/PREREGISTRATION.json': 'c374ae680736168f0f77f89fe8bef9fad0aaae27',
                  'research/brrk_beta_btc_continuation_parameter_geometry_0058/DATASET_DECLARATION.json': '23dd077f30d23404aa0b2f29776e35845ab089e3'
              },
              'immutable_source_dependency': {
                  'source_loader_path': 'research/brrk_beta_handoff_0047/engine.py',
                  'source_loader_git_blob_sha': '059b55961e279dab41ba29b5b017de0922e4f33c',
                  'market_evidence_path': 'research/brrk_beta_handoff_0047/evidence/MARKET_EVIDENCE.json',
                  'market_evidence_git_blob_sha': '64ebf5c6deaf3f34dbeac715378f196ff0f4fafe',
                  'payload_sha256': 'd1cd28bc76f2cd8ee0486287fc50b49e5451355a3e75132a2de5b30c15af3193',
                  'real_market_evidence_may_be_loaded_on_this_stage': False,
                  'network_refetch_allowed': False,
                  'replacement_dataset_allowed': False
              },
              'implementation_surface': {
                  'engine_path': str(engine_path),
                  'engine_git_blob_sha': engine_sha,
                  'synthetic_contract_tests_path': str(test_path),
                  'synthetic_contract_tests_git_blob_sha': test_sha,
                  'run_once_present': False,
                  'controlled_execution_interface_present': False,
                  'historical_result_path_present': False,
                  'historical_marker_present': False,
                  'market_loader_present': False
              },
              'frozen_scientific_contract': {
                  'assets': ['BTC', 'ETH', 'SOL'],
                  'source_index_timezone_state': 'TZ_NAIVE_UTC_NORMALIZED_DAILY_DATES',
                  'source_rows': 2183,
                  'origin_offset': 240,
                  'held_periods': 1942,
                  'L_values': list(range(20, 241, 20)),
                  'kappa_values': [0.0,0.25,0.5,0.75,1.0,1.25,1.5,1.75,2.0],
                  'declared_parameter_cells': 108,
                  'cost_bps_per_l1': [5.0, 10.0, 20.0],
                  'gradient_threshold': 0.04879016416943205,
                  'hessian_spectral_threshold': 0.09531017980432493,
                  'minimum_component_cells': 9,
                  'minimum_distinct_L_levels': 3,
                  'minimum_distinct_kappa_levels': 3,
                  'component_adjacency': 'FOUR_NEIGHBOR_INTERIOR_ONLY',
                  'representative': 'GEOMETRIC_MEDOID_OF_LARGEST_ADMISSIBLE_COST_COHERENT_COMPONENT',
                  'historical_argmax_authority': 'DESCRIPTIVE_ONLY',
                  'temporal_block_sizes': [486,486,485,485],
                  'bootstrap_block_length': 60,
                  'bootstrap_replicates': 10000,
                  'bootstrap_seed': 1844716895,
                  'classification_precedence': [
                      'INVALID_EXECUTION',
                      'FAIL_NO_STABLE_PARAMETER_PLATEAU',
                      'FAIL_STABLE_PLATEAU_NOT_COST_ROBUST',
                      'FAIL_STABLE_PLATEAU_NOT_ECONOMICALLY_RELEVANT',
                      'FAIL_STABLE_PLATEAU_NOT_TEMPORALLY_OR_DEPENDENCE_ROBUST',
                      'PASS_PARAMETER_FREEZE_ELIGIBLE'
                  ]
              },
              'implementation_representation_semantics': {
                  'candidate_daily_path_date': 'HELD_PERIOD_TERMINAL_CLOSE_SEMANTIC_UTC_Z_SUFFIX',
                  'candidate_trade_fields_reference': 'DECISION_AFTER_IMMEDIATELY_PRECEDING_ORIGIN_CLOSE',
                  'beta_entry': 'POST_COST_50_50_ETH_SOL',
                  'beta_persistence': 'DRIFT_NO_PERIODIC_INTERNAL_REBALANCE',
                  'beta_reentry': 'RESET_POST_COST_TO_50_50_ETH_SOL',
                  'btc_state': '100_PERCENT_BTC',
                  'initial_entry_l1': 1.0,
                  'btc_beta_switch_l1': 2.0,
                  'unchanged_state_l1': 0.0
              },
              'implementation_test_policy': {
                  'synthetic_only': True,
                  'synthetic_full_frozen_calendar_allowed': True,
                  'synthetic_output_has_scientific_authority': False,
                  'real_market_evidence_may_be_loaded': False,
                  'filesystem_market_loader_may_be_added': False,
                  'network_calls_may_be_added': False,
                  'real_0058_parameter_surface_may_be_computed': False,
                  'result_artifacts_may_be_created': False,
                  'actual_historical_variants_evaluated': 0
              },
              'synthetic_contract_evidence': {
                  'github_actions_run': run_id,
                  '0058_engine_tests_passed': 17,
                  'full_frozen_calendar_synthetic_surface_rows': 324,
                  'full_frozen_calendar_synthetic_geometry_rows': 210,
                  'full_frozen_calendar_synthetic_candidate_path_rows': 1942,
                  'zero_result_guard_passed': True,
                  'governance_validate_passed': True,
                  'no_drift_passed': True,
                  'real_0058_historical_payload_loaded': False,
                  'real_0058_parameter_surface_economics_executed': False,
                  'actual_historical_variants_evaluated': 0
              },
              'authority': {
                  'canonical_strategy_changed': False,
                  'phase6_changed': False,
                  'production_authorized_components': [],
                  'production_authorized': False,
                  'signature_authorized': False,
                  'order_submission_authorized': False
              }
          }
          (root / 'IMPLEMENTATION_BOUNDARY.json').write_text(json.dumps(boundary, indent=2) + '\n')

          readme = (root / 'README.md').read_text()
          readme = readme.replace(
              'Status: **NUMERICAL PREREGISTRATION FROZEN / NOT IMPLEMENTED / NOT RUN**',
              'Status: **IMPLEMENTATION FROZEN ON BRANCH / SYNTHETIC CONTRACT TESTS ONLY / NOT RUN**'
          )
          marker = '\n## Implementation-only handoff\n'
          if marker not in readme:
              readme += f'''\n## Implementation-only handoff\n\nPreregistration merged at `e6d94b30c8bb4d126d6c234c30980d701a9ababc`. This stage adds a data-agnostic `engine.py` plus synthetic contract tests only. The engine accepts caller-supplied BTC/ETH/SOL DataFrames and contains no market loader, filesystem payload reader, network request or controlled-run entrypoint.\n\nSynthetic Actions run `{run_id}` passes 17 contract tests, including a complete 2,183-row frozen-calendar flat-price surface with 324 cell-cost summaries, 210 interior geometry rows and 1,942 selected-path rows. Synthetic output has zero scientific authority. Real 0058 market payload loading and historical parameter-surface economics remain forbidden.\n\nNext legal stage after implementation merge is a separate controlled-execution boundary.\n'''
          (root / 'README.md').write_text(readme)

          state_path = Path('docs/CURRENT_STATE.md')
          state = state_path.read_text()
          state = state.replace(
              'Current `main` research merge: **`72976595dc3ce5d00bdb3264fe4911d492bbb7a9`**',
              'Current `main` research merge: **`e6d94b30c8bb4d126d6c234c30980d701a9ababc`**'
          )
          state = state.replace(
              'Current research branch: **`research/0058-beta-btc-continuation-parameter-geometry-prereg`**',
              'Current research branch: **`research/0058-beta-btc-continuation-parameter-geometry-implementation`**'
          )
          state = state.replace(
              'BRRK Beta->BTC parameter geometry 0058     NUMERICAL PREREG FROZEN ON BRANCH / NOT RUN',
              'BRRK Beta->BTC parameter geometry 0058     IMPLEMENTATION FROZEN ON BRANCH / SYNTHETIC ONLY / NOT RUN'
          )
          section = '\n---\n\n## 0058 implementation-only handoff\n'
          if section not in state:
              state += f'''\n---\n\n## 0058 implementation-only handoff\n\n0058 numerical preregistration merged at `e6d94b30c8bb4d126d6c234c30980d701a9ababc`. The implementation branch adds only the frozen parameter-geometry engine, 17 synthetic contract tests, `IMPLEMENTATION_BOUNDARY.json`, README and this CURRENT_STATE handoff.\n\nThe engine is data-agnostic: it accepts caller-supplied BTC/ETH/SOL DataFrames but contains no 0047 market loader import, filesystem market reader, network request, `run_once.py`, execution interface, durable marker or result artifact. It implements the exact 108-cell lattice, 5/10/20 bps paths, 240-day score normalization, BTC/Beta accounting, static benchmarks, finite-difference gradient/Hessian geometry, connected plateau support, cost-coherent medoid selection, G1-G5 hierarchy, four fixed temporal blocks and the frozen aligned moving-block bootstrap.\n\nSynthetic Actions run `{run_id}` passed 17/17 tests. A complete frozen-calendar flat-price synthetic fixture produced exactly 324 surface rows, 210 interior geometry rows, 1,942 candidate daily rows and 5,826 primary benchmark rows; the expected synthetic classification was `FAIL_STABLE_PLATEAU_NOT_COST_ROBUST` because the candidate tied static BTC at stress costs. This synthetic classification has **zero scientific authority**.\n\nZero-result guard: `REAL_0058_HISTORICAL_PAYLOAD_NOT_LOADED=true`, `REAL_0058_PARAMETER_SURFACE_ECONOMICS_NOT_EXECUTED=true`, `ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0`.\n\nNo controlled-execution boundary exists. Next legal stage after implementation merge is a separate zero-result controlled-execution boundary; real historical 0058 surface execution remains forbidden until that later boundary merges.\n'''
          state_path.write_text(state)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/brrk_beta_btc_continuation_parameter_geometry_0058/IMPLEMENTATION_BOUNDARY.json \
                  research/brrk_beta_btc_continuation_parameter_geometry_0058/README.md \
                  docs/CURRENT_STATE.md
          git commit -m 'Research implementation [DRIFT_0]: seal 0058 synthetic-only implementation boundary'
          git push origin HEAD:research/0058-beta-btc-continuation-parameter-geometry-implementation

      - name: Final implementation audit
        run: |
          python -m unittest research.brrk_beta_btc_continuation_parameter_geometry_0058.test_engine -v
          python -m research.governance.validate
          python -m research.governance.no_drift
          python - <<'PY'
          import json
          from pathlib import Path
          b = json.loads(Path('research/brrk_beta_btc_continuation_parameter_geometry_0058/IMPLEMENTATION_BOUNDARY.json').read_text())
          assert b['actual_variants_evaluated'] == 0
          assert b['synthetic_contract_evidence']['actual_historical_variants_evaluated'] == 0
          assert b['synthetic_contract_evidence']['real_0058_historical_payload_loaded'] is False
          assert b['synthetic_contract_evidence']['real_0058_parameter_surface_economics_executed'] is False
          expected = {
              'docs/CURRENT_STATE.md',
              'research/brrk_beta_btc_continuation_parameter_geometry_0058/README.md',
              'research/brrk_beta_btc_continuation_parameter_geometry_0058/engine.py',
              'research/brrk_beta_btc_continuation_parameter_geometry_0058/test_engine.py',
              'research/brrk_beta_btc_continuation_parameter_geometry_0058/IMPLEMENTATION_BOUNDARY.json',
          }
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only','e6d94b30c8bb4d126d6c234c30980d701a9ababc...HEAD'], text=True).splitlines())
          assert changed == expected, (changed, expected)
          print('REAL_0058_HISTORICAL_PAYLOAD_NOT_LOADED=true')
          print('REAL_0058_PARAMETER_SURFACE_ECONOMICS_NOT_EXECUTED=true')
          print('ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0')
          PY
