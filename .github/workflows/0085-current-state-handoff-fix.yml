name: 0085 CURRENT_STATE handoff repair

on:
  push:
    branches:
      - research/0085-trend-run-interface-repair-v1

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0085-trend-run-interface-repair-v1
          fetch-depth: 0
      - name: Restore immutable anchor and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          wrong = '`0f86341d40516e0ed90b8232917251e579`'
          right = '`0f86341d40516e0ed90d09baaa17e149c64671f6`'
          if wrong not in s:
              raise SystemExit('expected accidental anchor drift not found')
          s = s.replace(wrong, right, 1)
          p.write_text(s)
          PY
          rm .github/workflows/0085-current-state-handoff-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0085-current-state-handoff-fix.yml
          git commit -m 'docs: restore immutable 0071 anchor in 0085 handoff'
          git push origin HEAD:research/0085-trend-run-interface-repair-v1
