name: P5.4 fixed gross-behavior preregistration

on:
  pull_request:
    paths:
      - "research/cycle_exit/p5_4_behavior_map_contract.json"
      - "docs/P5_4_FIXED_GROSS_BEHAVIOR_PREREG.md"
      - "execution/plan-b-bot/tests/test_p5_4_behavior_map_prereg.py"
      - ".github/workflows/p5-4-behavior-map-prereg.yml"
      - "README.md"
      - "docs/CURRENT_STATE.md"
      - "docs/NEXT_STEPS.md"
  push:
    branches: [main]
    paths:
      - "research/cycle_exit/p5_4_behavior_map_contract.json"
      - "execution/plan-b-bot/tests/test_p5_4_behavior_map_prereg.py"
      - ".github/workflows/p5-4-behavior-map-prereg.yml"

permissions:
  contents: read

jobs:
  prereg-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Validate frozen P5.4 candidate contract
        run: pytest -q execution/plan-b-bot/tests/test_p5_4_behavior_map_prereg.py
      - name: Validate immutable P5.3 V2 dependency and no economic result
        run: |
          set -euo pipefail
          python research/cycle_exit/validate_p5_3_v2_state_path_result.py
          test "$(cat research/results/p5_3_v2_market_state/summary.sha256)" = "05d5d68a59c8b13f1122d98ed75d03934defdc9d73c7dd92e038c92fd97d2e52"
          test "$(git hash-object research/cycle_exit/p5_4_behavior_map_contract.json)" = "e3eba3b467d10dacdd1bcc1933738220fc497d63"
          test ! -e research/results/p5_5_joint_validation/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('research/cycle_exit/p5_4_behavior_map_contract.json').read_text())
          assert c['status'] == 'FROZEN_BEFORE_P5_4_ECONOMIC_EVALUATION'
          assert c['candidate_family_design']['candidate_count'] == 3
          assert c['p5_5_handoff']['joint_candidate_count'] == 9
          assert c['selection']['profile_selected'] is False
          assert c['selection']['behavior_map_selected'] is False
          assert c['selection']['production_behavior_selected'] is False
          assert c['selection']['production_authorized'] is False
          PY
