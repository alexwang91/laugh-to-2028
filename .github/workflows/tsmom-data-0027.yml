name: TSMOM DATA 0027 PIT Perp Universe

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tsmom-data-0027.yml'
      - 'research/requirements.txt'
      - 'research/tsmom/TSMOM-DATA-0027-PIT-PERP-UNIVERSE.json'
      - 'research/tsmom/run_tsmom_perp_universe_audit.py'
      - 'research/tsmom/test_tsmom_perp_universe_audit.py'

permissions:
  contents: read

concurrency:
  group: tsmom-data-0027-${{ github.ref }}
  cancel-in-progress: true

jobs:
  perp-universe-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic audit tests
        working-directory: research/tsmom
        run: python -m unittest -v test_tsmom_perp_universe_audit.py
      - name: Audit historical USD-M perpetual archive universe
        working-directory: research/tsmom
        shell: bash
        run: |
          set -o pipefail
          python run_tsmom_perp_universe_audit.py | tee tsmom_data_0027.log
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tsmom-data-0027-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/tsmom/TSMOM-DATA-0027-PIT-PERP-UNIVERSE.json
            research/tsmom/tsmom_data_0027.log
            research/tsmom/tsmom_data_0027_outputs/**
