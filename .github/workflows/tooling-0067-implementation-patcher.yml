name: Tooling 0067 bounded implementation tests
on:
  push:
    branches: [tools/0067-implementation-patcher-v1]
    paths: ['.github/workflows/tooling-0067-implementation-patcher.yml']
permissions:
  contents: read
jobs:
  bounded-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONHASHSEED: '0'
      PYTHONPATH: '.'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0067-implementation-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Verify zero historical result artifacts
        shell: bash
        run: |
          set -euo pipefail
          D=research/brrk_btc_sol_path_event_early_warning_runtime_qualified_0067
          for f in RUN_ATTEMPT.marker PRIMARY_RESULT.json EVIDENCE.json EXECUTION.json RUN_ONCE.marker QUALIFICATION_RESULT.json; do
            test ! -e "$D/$f"
          done
          python -m py_compile "$D/engine.py" "$D/qualification.py" "$D/test_implementation_contract.py"
      - name: Run bounded implementation contract tests
        run: pytest -q research/brrk_btc_sol_path_event_early_warning_runtime_qualified_0067/test_implementation_contract.py
