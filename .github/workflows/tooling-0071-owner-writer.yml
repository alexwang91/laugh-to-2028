name: Tooling 0071 owner-first registry writer
on:
  push:
    branches: [tools/0071-owner-writer-v1]
    paths: ['.github/workflows/tooling-0071-owner-writer.yml']
permissions:
  contents: write
concurrency:
  group: brrk-0071-owner-first-writer
  cancel-in-progress: false
jobs:
  write-owner-first:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 169d9adf6531dc099a43541df413fef079322adf
      TARGET_BRANCH: research/0071-owner-first-v1
      RID: BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-0071
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 169d9adf6531dc099a43541df413fef079322adf
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact post-roadmap base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git cat-file -e "$BASE_SHA:research/governance/CRYPTO_MULTI_STRATEGY_RESEARCH_PROGRAM_0071_0082.md"
          git cat-file -e "$BASE_SHA:research/brrk_sol_long_sideways_early_warning_episode_robustness_0070/CLOSEOUT.md"
          if git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH" >/dev/null 2>&1; then
            echo "Target owner-first branch already exists" >&2
            exit 1
          fi
      - name: Append prospective owner record only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('config/research_registry.json')
          obj = json.loads(path.read_text(encoding='utf-8'))
          rid = 'BRRK-SOL-LONG-SIDEWAYS-CONTROLLER-INTEGRATION-0071'
          assert obj['schema_version'] == 1
          assert isinstance(obj['records'], list)
          assert all(r.get('research_id') != rid for r in obj['records'])

          rec = {
            'research_id': rid,
            'research_family_id': 'BRRK_PATH_EVENT_EARLY_WARNING',
            'research_domain': 'RISK_CONTROL',
            'research_governance_version': 1,
            'governance_mode': 'PROGRAM_GOVERNED_V1',
            'objective_type': 'PORTFOLIO_INTEGRATION',
            'created_at': '2026-08-17',
            'created_before_result': True,
            'question': 'Does the immutably closed 0070 P02 SOL T4_LONG_SIDEWAYS 10-session warning have incremental economic risk-control value when converted into a bounded prospectively frozen SOL exposure controller after realistic and stressed costs, without changing the signal, target, horizon, feature set, architecture, selected hyperparameters or episode semantics?',
            'hypothesis': 'At least one of six prospectively bounded non-levered long-or-cash controller families can use only the locked 0070 P02 risk score plus explicitly allowed lagged risk-accounting state to improve the preregistered net return/drawdown/tail/turnover Pareto trade-off versus the frozen SOL benchmark under realistic costs, with robustness surviving the preregistered stress and multiple-testing controls.',
            'hypothesis_origin': 'RESULT_INFORMED_FROM_IMMUTABLY_CLOSED_0070_AS_A_NEW_RESEARCH_ID; DEVELOPMENT_HISTORY_ECONOMIC_INTEGRATION_ONLY; NOT_INDEPENDENT_OOS.',
            'economic_mechanism': 'The locked 10-session SOL long-sideways warning may have economic value by reducing or scaling long SOL exposure before elevated long-sideways risk, trading some upside participation for lower drawdown/tail exposure. Any value must survive turnover and realistic/stressed implementation costs; no shorting or leverage is permitted in this research ID.',
            'primary_target': 'P02_RAW_ELASTIC_NET_LOGIT|SOL|T4_LONG_SIDEWAYS|LEAD_10_ECONOMIC_CONTROLLER',
            'primary_metric': 'NET_PARETO_RISK_CONTROL_VALUE_VS_FROZEN_SOL_BENCHMARK',
            'secondary_metrics': [
              'CAGR',
              'annualized_volatility',
              'Sharpe',
              'Sortino',
              'max_drawdown',
              'Calmar',
              'downside_deviation',
              'worst_1_5_10_20_session_loss',
              'average_and_gross_exposure',
              'turnover_and_switch_count',
              'transaction_cost_drag',
              'cost_break_even',
              'bull_participation',
              'bear_protection',
              'sideways_performance',
              'profit_concentration',
              'block_bootstrap',
              'Deflated_Sharpe_Ratio',
              'PBO_if_supported',
              'exact_0070_signal_reproduction',
              'exactly_once_artifact_read'
            ],
            'feature_families': [
              'LOCKED_0070_P02_RISK_SCORE',
              'SOL_PRICE_RETURN_ECONOMIC_ACCOUNTING',
              'LAGGED_SOL_REALIZED_VOLATILITY',
              'LAGGED_CONTROLLER_DRAWDOWN_STATE'
            ],
            'horizon': [10],
            'universe': ['SOL'],
            'development_dataset_refs': [],
            'validation_dataset_refs': [],
            'sealed_dataset_refs': [],
            'declared_variant_budget': 6,
            'actual_variants_evaluated': 0,
            'parameter_candidate_count': 6,
            'stopping_rule': 'Owner-first DESIGN -> numerical/data/analysis preregistration -> implementation -> nonhistorical synthetic qualification -> separate controlled boundary -> exact merged-boundary zero-result preflight -> stop for explicit user authorization -> at most one durable controlled development-history attempt -> immutable result -> immutable closeout. The six controller families are the complete candidate-family ceiling. A durable RUN_ATTEMPT.marker must precede any controlled historical/evidence-content read. After durable attempt creation, no same-ID rerun, rescue, retune, threshold relaxation, alternate cost rule, alternate benchmark or alternate controller is allowed.',
            'success_criteria': 'PASS only if exact locked 0070 signal reproduction succeeds and at least one preregistered fixed controller candidate satisfies the prospectively frozen net economic Pareto/non-inferiority gates versus the frozen SOL benchmark under realistic costs, survives the preregistered stressed-cost/robustness/concentration checks, and satisfies the declared multiple-testing controls. Exact numerical controller parameters, transaction-cost assumptions, bootstrap/PBO/DSR definitions and PASS thresholds must be frozen in PREREGISTRATION before implementation and before any controlled history/evidence-content read.',
            'failure_criteria': 'FAIL if valid execution completes but no preregistered controller passes the frozen net economic and robustness gates. INCONCLUSIVE applies only to prospectively defined insufficient-support or mathematically undefined inference conditions. INVALID_EXECUTION applies to identity/hash/read-count/lookahead/controller-construction/cost-accounting/candidate-count/result-persistence drift.',
            'allowed_followup': 'Before attempt consumption, only semantics-preserving implementation and synthetic-qualification fixes that do not alter the frozen DESIGN/PREREGISTRATION contract. After terminal result, any new signal, threshold family, controller, cost model, benchmark, leverage/short rule, independent-OOS evaluation or portfolio extension requires a new owner-first research ID.',
            'forbidden_followup': 'No retraining or reselection of P02; no target or lead other than locked SOL T4_LONG_SIDEWAYS lead 10; no P03/P08 input in 0071; no new predictive feature search; no leverage; no short SOL; no result-informed controller parameter addition; no final-period Sharpe maximization; no post-read cost relaxation; no claim of independent OOS; no same-ID rerun/retune/rescue after attempt consumption.',
            'researcher_decisions': [
              'Treat closed 0070 only as hypothesis-generating DEVELOPMENT evidence for a new economic-integration ID.',
              'Use locked P02 as the sole predictive warning input; exclude the dependent P03/P08 corroborative cluster from 0071 controller construction.',
              'Bound research to exactly six controller families: BINARY_RISK_OFF, LINEAR_DERISK, PIECEWISE_DERISK, VOL_ADJUSTED, DRAWDOWN_AWARE and HYSTERESIS.',
              'Restrict target SOL exposure to the preregistered long-or-cash interval with no leverage and no shorting.',
              'Evaluate C0 theoretical, C1 realistic and C2 stressed cost states plus preregistered cost-multiplier sensitivity; C0 alone can never establish PASS.',
              'Select by frozen Pareto/non-inferiority logic across return retention, drawdown/tail improvement and turnover/cost rather than maximizing observed Sharpe.',
              'Persist and count every evaluated controller candidate, including failed or invalid candidates.'
            ],
            'research_process_complexity': {
              'declared_parameter_candidates': 6,
              'actual_parameter_candidates_evaluated': 0,
              'universes_evaluated': 1,
              'horizons_evaluated': 1,
              'rebalance_variants': 1,
              'feature_representations': 4,
              'special_cases_introduced': 6,
              'validation_exposure_event_refs': 1,
              'related_family_trials': 1
            },
            'lineage_edges': [],
            'result_status': 'PREREGISTERED_NOT_RUN',
            'failure_reason': None,
            'promotion_state': 'NONE',
            'evidence_refs': [],
            'decision_refs': [],
            'production_relevance': 'Development-history SOL risk-controller integration research only; no automatic production, signature or order authority.',
            'production_authorized': False,
            'provenance_status': 'PROSPECTIVE_FROZEN',
            'governed_path_prefixes': [
              'research/brrk_sol_long_sideways_controller_integration_0071'
            ],
            'notes': [
              'Owner-first registration precedes introduction of the formal 0071 research path.',
              '0071 begins only after immutable 0070 closeout and governed 0071-0082 roadmap merge.',
              'The broad roadmap authorization does not authorize the future irreversible attempt 1/1; separate explicit user authorization is required after zero-result preflight PASS.',
              'Evidence remains researcher-exposed DEVELOPMENT history, not independent OOS.',
              'production_authorized=false; signature_authorized=false; order_submission_authorized=false.'
            ]
          }
          obj['records'].append(rec)
          path.write_text(json.dumps(obj, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          check = json.loads(path.read_text(encoding='utf-8'))
          matches = [r for r in check['records'] if r.get('research_id') == rid]
          assert len(matches) == 1
          assert matches[0]['created_before_result'] is True
          assert matches[0]['actual_variants_evaluated'] == 0
          assert matches[0]['production_authorized'] is False
          print('0071 prospective owner record appended exactly once')
          PY
          python -m json.tool config/research_registry.json >/dev/null
      - name: Persist owner-first branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$TARGET_BRANCH"
          git add config/research_registry.json
          test "$(git diff --cached --name-only)" = "config/research_registry.json"
          git commit -m 'research: register 0071 prospective owner'
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
