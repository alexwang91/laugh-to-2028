name: ROUTER PNL 0005 Strict Verified Spot

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/router-pnl-0005.yml'
      - 'research/funding_router/run_strict_router_accounting.py'
      - 'research/funding_router/test_strict_router_accounting.py'
      - 'research/results/funding_pnl_0003/**'
      - 'research/results/router_data_0004/**'

permissions:
  contents: read

concurrency:
  group: router-pnl-0005-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-router-accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic accounting tests
        working-directory: research/funding_router
        run: python -m unittest -v test_strict_router_accounting.py
      - name: Reconstruct strict verified-spot accounting
        working-directory: research/funding_router
        run: python run_strict_router_accounting.py
      - name: Upload exact accounting outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-pnl-0005-results
          retention-days: 30
          if-no-files-found: error
          path: |
            research/results/router_pnl_0005/daily_equity.csv
            research/results/router_pnl_0005/summary.json
