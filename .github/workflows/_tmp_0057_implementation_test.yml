name: Temporary 0057 implementation synthetic contracts

on:
  push:
    branches:
      - research/0057-implementation-tooling

permissions:
  contents: read

jobs:
  synthetic-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0057-simple-beta-router-interface-replication-implementation
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test runtime
        run: pip install 'numpy==2.4.2' 'pandas==3.0.0'
      - name: Run immutable 0056 and new 0057 synthetic contracts
        run: |
          python -m unittest -v research.brrk_simple_eth_sol_beta_router_0056.test_engine
          python -m unittest -v research.brrk_simple_eth_sol_beta_router_interface_replication_0057.test_adapter
      - name: Zero-result implementation guard
        run: |
          python - <<'PY'
          from pathlib import Path
          base=Path('research/brrk_simple_eth_sol_beta_router_interface_replication_0057')
          adapter=(base/'adapter.py').read_text()
          boundary=(base/'IMPLEMENTATION_BOUNDARY.json').read_text()
          forbidden_adapter=('requests.', 'urllib', 'http://', 'https://', 'open(', 'Path(', 'MARKET_EVIDENCE.json')
          for token in forbidden_adapter:
              assert token not in adapter, token
          for name in ('run_once.py','RUN_INTERFACE.json','RESULT_SCHEMA.json','PRIMARY_RESULT.json','EXECUTION.json','RUN_ATTEMPT.marker','RUN_ONCE.marker'):
              assert not (base/name).exists(), name
          assert 'real_market_evidence_may_be_loaded_on_this_stage": false' in boundary
          assert 'actual_historical_variants_evaluated": 0' in boundary
          assert 'b0fc1ac267a66593e7e2c4687aff81491bfcdf5a' in boundary
          assert 'tz_localize' in adapter
          print('REAL_0057_HISTORICAL_PAYLOAD_NOT_LOADED=true')
          print('REAL_0057_PORTFOLIO_ECONOMICS_NOT_EXECUTED=true')
          print('ACTUAL_HISTORICAL_VARIANTS_EVALUATED=0')
          PY
      - name: Validate governance and no drift
        run: |
          python -m research.governance.validate
          python -m research.governance.no_drift
