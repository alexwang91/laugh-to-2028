name: 0055 synthetic implementation contract

on:
  push:
    branches:
      - research/brrk-leadership-4h-structural-readiness-0055-implementation

jobs:
  synthetic-contract:
    if: contains(github.event.head_commit.message, 'trigger 0055 synthetic implementation contract')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/brrk-leadership-4h-structural-readiness-0055-implementation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned test runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3 pandas==2.2.3 scipy==1.14.1 requests==2.32.5
      - name: Compile 0055 implementation
        run: python -m py_compile research/brrk_leadership_4h_structural_readiness_0055/engine.py research/brrk_leadership_4h_structural_readiness_0055/test_engine.py
      - name: Enforce synthetic-only implementation test surface
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('research/brrk_leadership_4h_structural_readiness_0055/test_engine.py').read_text()
          forbidden=['MARKET_4H_PAYLOAD.json','measure_frozen_readiness(']
          for token in forbidden:
              if token in s:
                  raise SystemExit(f'forbidden real-measurement token in tests: {token}')
          print('SYNTHETIC_ONLY_TEST_SURFACE=true')
          PY
      - name: Run 0055 synthetic contracts only
        run: python -m unittest research.brrk_leadership_4h_structural_readiness_0055.test_engine
      - name: Enforce zero-result implementation boundary
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('research/brrk_leadership_4h_structural_readiness_0055')
          forbidden=[
            'METHOD_RESULT.json','RESULT.json','RESULT_SUMMARY.json','EXECUTION.json',
            'RUN_ATTEMPT.marker','RUN_ONCE.marker','RESULT.md'
          ]
          for name in forbidden:
              if (p/name).exists():
                  raise SystemExit(f'forbidden implementation-stage artifact exists: {name}')
          for path in p.iterdir():
              low=path.name.lower()
              if any(token in low for token in ['nll','brier','auc','portfolio','cagr','winner_label','confidence_breakpoint']):
                  raise SystemExit(f'forbidden predictive/economic artifact: {path.name}')
          print('REAL_0055_MEASUREMENT_NOT_EXECUTED=true')
          print('REAL_0053_PAYLOAD_NOT_LOADED_BY_TESTS=true')
          print('ACTUAL_VARIANTS_EVALUATED=0')
          PY
