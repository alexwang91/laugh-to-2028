            'success_criteria': ['SPEC_FREEZE must define exact candidate and PASS gates before any controlled value exposure.','Any valid PASS must survive frozen realistic costs and remain directionally valid under the frozen stressed-cost panel.','All identity, point-in-time, finite-statistic, support, read, persistence, source-interface, marker-ordering and exactly-once invariants must pass.'],
