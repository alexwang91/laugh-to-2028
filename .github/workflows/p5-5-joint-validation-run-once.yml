name: P5.5 joint validation RUN ONCE

on:
  push:
    branches:
      - "p5-5/joint-validation-runner"
    paths:
      - "research/cycle_exit/RUN_ONCE_P5_5_JOINT_VALIDATION.marker"

permissions:
  contents: write

concurrency:
  group: p5-5-joint-validation-run-once
  cancel-in-progress: false

jobs:
  run-once:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "p5-5/joint-validation-runner"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Guard one-time authority and frozen research
        run: |
          set -euo pipefail
          test ! -d research/results/p5_5_joint_validation
          test "$(sha256sum research/cycle_exit/RUN_ONCE_P5_5_JOINT_VALIDATION.marker | awk '{print $1}')" = "f2791d4cfe0265351ea28e42014b563a806c5a1f6e8db61817aeb9edc48869f3"
          test "$(git hash-object research/cycle_exit/p5_5_validation_contract.json)" = "96a923189fce1682d2cee2dd0b34afdb3e3bd3a7"
          test "$(git hash-object research/cycle_exit/p5_5_validation_contract_r1.json)" = "98f651811b7edcb1f0b4c3047b87d95bffed087a"
          test "$(git hash-object research/cycle_exit/p5_5_validation_contract_r2.json)" = "57073e6948e0c7540c453f193a1be7c21979b7d5"
          test "$(git hash-object research/cycle_exit/p5_5_validation.py)" = "17118ee9000be62a799a185dd51e36998d00872e"
          test "$(git hash-object research/cycle_exit/run_p5_5_joint_validation.py)" = "f45e4293af7214bb13c0b9ddd4ed2656dfb6d75b"
          test "$(git hash-object research/cycle_exit/run_p5_5_joint_validation_r2.py)" = "de15a952d963dc50ae60cf794e39dab5b507dea6"
          test "$(git hash-object research/cycle_exit/validate_p5_5_joint_validation_result.py)" = "97b72394daf96030288434764d66ea1242de400f"
          test "$(cat research/results/p5_3_v2_market_state/summary.sha256)" = "05d5d68a59c8b13f1122d98ed75d03934defdc9d73c7dd92e038c92fd97d2e52"
          pytest -q execution/plan-b-bot/tests/test_p5_5_validation_prereg.py execution/plan-b-bot/tests/test_p5_5_validation_mechanics.py
      - name: Execute frozen P5.5 validation once
        env:
          OMP_NUM_THREADS: "1"
          OPENBLAS_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          NUMEXPR_NUM_THREADS: "1"
        run: python research/cycle_exit/run_p5_5_joint_validation_r2.py
      - name: Validate immutable result
        run: python research/cycle_exit/validate_p5_5_joint_validation_result.py
      - name: Commit immutable P5.5 result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/results/p5_5_joint_validation
          git diff --cached --quiet && { echo "No P5.5 result files staged"; exit 1; }
          git commit -m "Research: commit immutable P5.5 joint validation result"
          git push origin HEAD:p5-5/joint-validation-runner
