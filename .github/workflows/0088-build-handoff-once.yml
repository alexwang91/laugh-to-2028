name: 0088 build handoff once
on:
  push:
    branches:
      - research/0088-factor-ls-build-v1
permissions:
  contents: write
jobs:
  append-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0088-factor-ls-build-v1
          fetch-depth: 0
      - name: Append CURRENT_STATE and self-delete
        shell: bash
        run: |
          cat >> docs/CURRENT_STATE.md <<'EOF'

## 0088 Factor L/S BUILD — 2026-08-26

- SPEC_FREEZE and prospective invalid-week transition clarification are merged.
- Synthetic/nonhistorical BUILD implements the frozen portfolio state machine, turnover, C0/C1/C2 costs, funding accounting, beta/capacity/concentration diagnostics, 8-week moving-block bootstrap with 10,000 replicates and seed 880088, G0-G9, and PASS/FAIL/INCONCLUSIVE terminal classification.
- Unsupported Mondays create no observation, remove the immediately preceding observation when its terminal transition cannot be truthfully accounted, reset portfolio state to zero, and force full-entry turnover at the next admissible Monday. Admission is return-blind.
- Controlled attempt remains 0/1; controlled reads remain 0; scientific engine remains 0/1; no controlled value has been exposed.
- Next gate is ARM. ARM must bind exact controlled price/funding identities, declared hashes/sizes, schema/timestamps, read budget, marker/result paths and source-qualified runner interface before any RUN authorization.
- 0086 remains immutable PASS_VALIDATED_FACTOR_ATLAS; 0076 and 0085 remain immutable; 0072/0073 remain paused; 0083 remains immutable FAIL; Phase6 and common-runner governance remain unchanged.
EOF
          git rm .github/workflows/0088-build-handoff-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md
          git commit -m 'docs(0088): record BUILD handoff'
          git push origin HEAD:research/0088-factor-ls-build-v1
