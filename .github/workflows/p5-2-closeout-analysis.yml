name: P5.2 descriptive closeout analysis

on:
  push:
    branches:
      - "p5-2/feature-families"
    paths:
      - "research/cycle_exit/RUN_P5_2_CLOSEOUT_ANALYSIS.marker"

permissions:
  contents: write

concurrency:
  group: p5-2-closeout-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "p5-2/feature-families"
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Snapshot immutable P5.2 evidence
        run: |
          set -euo pipefail
          find research/results/p5_2_feature_evidence -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/p52-before.sha256
          test "$(cat research/results/p5_2_feature_evidence/summary.sha256)" = "3f6dc3c512d22ac8f71d43ed155f2602cd40d5caf3d617c0e130e170727e0627"
      - name: Run post-result descriptive diagnostics only
        run: python research/cycle_exit/analyze_p5_2_closeout.py
      - name: Prove immutable evidence unchanged and diagnostics are non-authorizing
        run: |
          set -euo pipefail
          find research/results/p5_2_feature_evidence -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/p52-after.sha256
          diff -u /tmp/p52-before.sha256 /tmp/p52-after.sha256
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path
          root = Path('research/analysis/p5_2_closeout')
          meta = json.loads((root / 'analysis_metadata.json').read_text())
          assert meta['analysis_status'] == 'POST_RESULT_DESCRIPTIVE_DIAGNOSTICS_ONLY'
          assert meta['selection_or_threshold_authority'] == 'NONE'
          f = pd.read_csv(root / 'feature_diagnostics.csv')
          fam = pd.read_csv(root / 'family_diagnostics.csv')
          rank = pd.read_csv(root / 'context_rankings.csv')
          assert len(f) == 29
          assert set(fam['family']) == {'BTC_TREND_MATURITY','MOMENTUM_EXHAUSTION','LEADERSHIP_MIGRATION','BREADTH'}
          assert set(rank['context']) == {'TERMINAL','SECOND_WIND','NONTERMINAL_TOPLIKE','DETERIORATION'}
          assert set(rank['bucket']) == {'target_lead','near_event'}
          PY
      - name: Commit derived closeout diagnostics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/analysis/p5_2_closeout
          git diff --cached --quiet && { echo "No diagnostics staged"; exit 1; }
          git commit -m "Research: commit P5.2 descriptive closeout diagnostics"
          git push origin HEAD:p5-2/feature-families
