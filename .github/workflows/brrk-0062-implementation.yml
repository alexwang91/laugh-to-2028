name: BRRK 0062 Signal Atlas implementation contracts

on:
  pull_request:
    paths:
      - 'research/brrk_btc_risk_signal_atlas_0062/engine.py'
      - 'research/brrk_btc_risk_signal_atlas_0062/IMPLEMENTATION_CONTRACT.json'
      - 'research/brrk_btc_risk_signal_atlas_0062/test_*.py'
      - '.github/workflows/brrk-0062-implementation.yml'
  push:
    branches: [main]
    paths:
      - 'research/brrk_btc_risk_signal_atlas_0062/engine.py'
      - 'research/brrk_btc_risk_signal_atlas_0062/IMPLEMENTATION_CONTRACT.json'
      - 'research/brrk_btc_risk_signal_atlas_0062/test_*.py'
      - '.github/workflows/brrk-0062-implementation.yml'

permissions:
  contents: read

env:
  PYTHONHASHSEED: '0'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  NUMEXPR_NUM_THREADS: '1'

jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: execution/plan-b-bot/requirements-dev.txt
      - name: Install pinned test runtime
        run: pip install -r execution/plan-b-bot/requirements-dev.txt
      - name: Assert historical result artifacts remain absent
        run: |
          test ! -e research/brrk_btc_risk_signal_atlas_0062/RUN_ATTEMPT.marker
          test ! -e research/brrk_btc_risk_signal_atlas_0062/PRIMARY_RESULT.json
          test ! -e research/brrk_btc_risk_signal_atlas_0062/EXECUTION.json
          test ! -e research/brrk_btc_risk_signal_atlas_0062/CLOSEOUT.json
      - name: Run synthetic-only implementation contracts
        run: python -m unittest discover -s research/brrk_btc_risk_signal_atlas_0062 -p 'test_*.py' -v
