name: 0087 ARM source state writer

on:
  push:
    branches:
      - research/0087-options-vrp-arm-source-qualification-v1
    paths:
      - .github/workflows/0087-arm-source-state-writer.yml

permissions:
  contents: write

jobs:
  write-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0087-options-vrp-arm-source-qualification-v1
          fetch-depth: 0
      - name: Persist ARM source qualification blocker and self-remove
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## 0087 ARM source qualification blocker — 2026-08-25$' docs/CURRENT_STATE.md; then
            printf '%s\n' '' '## 0087 ARM source qualification blocker — 2026-08-25' '' '- 0087 BUILD is merged. ARM source qualification from exact main `20f2a5290bfb37ee2c6e02f2f2e9e0bd57f1b782` found no qualifying Deribit point-in-time controlled source metadata/schema for executable option bid/ask, contemporaneous IV, expiry/settlement, index closes, source-native hedge-target/delta semantics and executable daily hedge quotes.' '- Status is `BLOCKED_NO_QUALIFYING_CONTROLLED_SOURCE_METADATA`. This is a reversible pre-scientific source/data blocker, not PASS, FAIL, INCONCLUSIVE or INVALID_EXECUTION.' '- 0087 remains attempt `0/1`, controlled reads `0`, engine `0/1`, values unexposed and no RUN marker. No source substitution, post-exposure schema invention or alternative venue is authorized.' '- A future ARM continuation is legal only after independently staging qualifying point-in-time Deribit source data and proving metadata/schema before controlled value exposure.' '- 0086 remains ARM-complete at attempt `0/1` pending separate irreversible RUN authorization; Factor L/S remains blocked unless 0086 returns valid PASS.' '- 0085 remains immutable INVALID_EXECUTION attempt 1/1; 0076 sealed; 0072/0073 paused; 0083 immutable FAIL; Phase6 PASS closeout unchanged.' '- `workflow run                         31381953131 / attempt 1`, CAPTURE-0001 sealed/no-retry and CAPTURE-0002 permanently claimed/no-refetch remain immutable.' '- Production/signature/order/withdrawal/transfer authority remains false.' >> docs/CURRENT_STATE.md
          fi
          rm -f .github/workflows/0087-arm-source-state-writer.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md .github/workflows/0087-arm-source-state-writer.yml
          git diff --cached --quiet && exit 0
          git commit -m 'docs(0087): persist ARM source qualification blocker'
          git push origin HEAD:research/0087-options-vrp-arm-source-qualification-v1
