name: Tooling 0067 implementation state finalize
on:
  push:
    branches: [tools/0067-implementation-state-writer-v1]
    paths: ['.github/workflows/tooling-0067-implementation-state.yml']
permissions:
  contents: write
jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0067-implementation-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/CURRENT_STATE.md')
          s=p.read_text()
          s=s.replace('0067 = `IMPLEMENTATION BUILT / QUICK EQUIVALENCE PENDING / NOT FULL-SHAPE QUALIFIED / NOT RUN`.', '0067 = `IMPLEMENTATION BUILT / QUICK EQUIVALENCE PASS / NOT FULL-SHAPE QUALIFIED / NOT RUN`.')
          s=s.replace('Quick nonhistorical reference-equivalence workflow = `31867425779`; current verdict is PENDING until that workflow terminates.', 'Quick nonhistorical reference-equivalence workflow = `31867425779`; verdict = `PASS`; 8080 indicator cells reported and all reference-equivalence fixtures passed.\nBounded implementation test workflow = `31867565008`; verdict = `PASS`.')
          s=s.replace('Require quick nonhistorical equivalence PASS on the implementation, run bounded implementation tests on the final implementation head, then open/merge IMPLEMENTATION-ONLY with standing CI green. Only after implementation merge may the exact merged implementation run the preregistered full-shape nonhistorical qualification. A historical controlled-execution boundary remains forbidden until a full-shape qualification PASS is durably recorded.', 'Open and merge IMPLEMENTATION-ONLY after standing CI is green. Only after implementation merge may the exact merged implementation run the preregistered full-shape nonhistorical qualification. A historical controlled-execution boundary remains forbidden until a full-shape qualification PASS is durably recorded.')
          assert 'workflow run                         31381953131 / attempt 1' in s
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CURRENT_STATE.md
          git commit -m '0067: record quick equivalence and bounded-test PASS'
          git push origin HEAD:refs/heads/research/0067-implementation-v1
