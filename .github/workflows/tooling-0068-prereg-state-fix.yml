name: Tooling 0068 prereg CURRENT_STATE fix

on:
  push:
    branches:
      - tools/0068-prereg-state-fix-v1
    paths:
      - '.github/workflows/tooling-0068-prereg-state-fix.yml'

permissions:
  contents: write

jobs:
  patch-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0068-execution-equivalence-design-v1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Append preregistration handoff state
        shell: bash
        run: |
          set -euo pipefail
          cat >> docs/CURRENT_STATE.md <<'EOF'

## 0068 execution-equivalence preregistration status

Research ID = `BRRK-BTC-SOL-PATH-EVENT-EXECUTION-EQUIVALENCE-0068`.
Merged DESIGN = `e9a3124061e614bff5bc66e004941d8ab7d3c33d`.
Current lifecycle stage = `PREREGISTERED / NOT IMPLEMENTED / NOT QUALIFIED / NO HISTORICAL AUTHORITY`.
Historical attempt budget = 0; historical content reads are forbidden in 0068.
Scientific semantics remain frozen to 0067. Closed 0067 execution accounting is used only as engineering/process evidence.

Frozen execution-assurance contract:
- validation estimator fits remain structurally 31,008;
- downstream economic fit and P08 NNLS counts are generated by the frozen eligibility law and are not universal full-support constants;
- one canonical downstream graph builder must serve qualification and controlled-mode dry run;
- canonical ordered manifests must be SHA256-bound;
- every manifest work unit must declare expected physical fit/NNLS actions and receive exactly one terminal trace;
