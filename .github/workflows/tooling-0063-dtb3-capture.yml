name: Tooling 0063 DTB3 capture

on:
  push:
    branches: [tools/0062-owner-artifact-v1]
    paths: ['.github/workflows/tooling-0063-dtb3-capture.yml']

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e1ac320e092e554c283ef6b88aaaa5f65aaf61ab
          fetch-depth: 1
      - name: Capture and validate raw DTB3 only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/0063_capture
          python - <<'PY'
          import csv, hashlib, io, json, math, urllib.request
          from datetime import date
          from pathlib import Path

          url='https://fred.stlouisfed.org/graph/fredgraph.csv?id=DTB3&cosd=2022-11-30&coed=2026-08-02'
          req=urllib.request.Request(url, headers={'User-Agent':'laugh-to-2028-governed-research/0063'})
          with urllib.request.urlopen(req, timeout=60) as r:
              raw=r.read()
          if not raw or len(raw) < 100:
              raise SystemExit('empty/too-small FRED payload')
          text=raw.decode('utf-8-sig')
          rows=list(csv.reader(io.StringIO(text)))
          if len(rows) < 2 or len(rows[0]) != 2:
              raise SystemExit(f'unexpected CSV shape/header: {rows[:2]}')
          header=rows[0]
          if header[1] != 'DTB3':
              raise SystemExit(f'unexpected series column: {header}')
          parsed=[]
          valid=[]
          for i,row in enumerate(rows[1:], start=2):
              if len(row) != 2:
                  raise SystemExit(f'bad row width at {i}')
              d=date.fromisoformat(row[0])
              val=row[1].strip()
              parsed.append((d,val))
              if val not in ('','.','NaN','nan'):
                  x=float(val)
                  if not math.isfinite(x):
                      raise SystemExit(f'nonfinite DTB3 at {d}')
                  valid.append((d,x))
          if not parsed or not valid:
              raise SystemExit('no parsed/valid rows')
          requested_start=date(2022,11,30); requested_end=date(2026,8,2)
          if parsed[0][0] < requested_start or parsed[-1][0] > requested_end:
              raise SystemExit('payload outside requested range')
          if not any(d <= date(2022,12,10) for d,_ in valid):
              raise SystemExit('no pre/on-window valid DTB3 seed')
          out=Path('/tmp/0063_capture')
          (out/'DTB3_RAW.csv').write_bytes(raw)
          sha=hashlib.sha256(raw).hexdigest()
          report={
              'schema_version':1,
              'research_id':'BRRK-IDLE-CASH-SWEEP-ROBUSTNESS-0063',
              'capture_stage':'RESULT_BLIND_RAW_DATA_CAPTURE',
              'design_merge_sha':'e1ac320e092e554c283ef6b88aaaa5f65aaf61ab',
              'source_provider':'FRED',
              'series_id':'DTB3',
              'source_url':url,
              'requested_start':'2022-11-30',
              'requested_end':'2026-08-02',
              'header':header,
              'csv_data_row_count':len(parsed),
              'valid_observation_count':len(valid),
              'first_csv_date':parsed[0][0].isoformat(),
              'last_csv_date':parsed[-1][0].isoformat(),
              'first_valid_date':valid[0][0].isoformat(),
              'last_valid_date':valid[-1][0].isoformat(),
              'raw_sha256':sha,
              'candidate_economics_computed':False,
              'baseline_equity_read':False,
              'baseline_weights_read':False,
              'replacement_allowed':False,
          }
          (out/'CAPTURE_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: 0063-dtb3-raw-capture
          path: /tmp/0063_capture
          if-no-files-found: error
          retention-days: 7
