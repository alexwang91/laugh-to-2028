name: 0053 prereg contract temporary

on:
  push:
    branches:
      - research/brrk-leadership-intraday-support-0053-prereg

permissions:
  contents: read

jobs:
  contract:
    if: contains(github.event.head_commit.message, 'trigger 0053 prereg contract')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 0053 preregistration contract
        run: python -m unittest research.brrk_leadership_intraday_support_0053.test_preregistration_contract
      - name: Assert no 4h capture or result artifact exists
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/brrk_leadership_intraday_support_0053')
          forbidden = ['MARKET_4H_EVIDENCE.json','DATASET_DECLARATION.json','PRIMARY_RESULT.json','RESULT_SUMMARY.json','EXECUTION.json','RUN_ONCE.marker']
          present = [x for x in forbidden if (p/x).exists()]
          if present:
              raise SystemExit(f'forbidden pre-capture artifacts present: {present}')
          PY
