name: TEMP 0061 implementation synthetic tests

on:
  push:
    branches:
      - docs/0061-prereg-tooling

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/0061-implementation-tooling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: pip install 'numpy==1.26.4' 'pandas==2.2.2' 'pytest==8.3.2'
      - name: Run synthetic tests
        run: pytest -q --import-mode=importlib research/brrk_btc_cash_absolute_risk_diagnostic_0060/test_engine.py research/brrk_btc_cash_absolute_risk_measurement_replication_0061/test_engine.py
