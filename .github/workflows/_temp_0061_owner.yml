name: TEMP 0061 boundary contracts
on:
  push:
    branches: [docs/0061-prereg-tooling]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/0061-boundary-tooling
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install 'numpy==1.26.4' 'pandas==2.2.2' 'pytest==8.3.2'
      - run: pytest -q research/brrk_btc_cash_absolute_risk_measurement_replication_0061/test_engine.py
      - run: pytest -q research/brrk_btc_cash_absolute_risk_measurement_replication_0061/test_run_interface.py
