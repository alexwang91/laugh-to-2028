name: TEMP 0061 owner materializer

on:
  push:
    branches:
      - docs/0061-prereg-tooling

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/0061-prereg-tooling
          fetch-depth: 0
      - name: Materialize owner only
        shell: bash
        run: |
          python - <<'PY'
          import copy, json
          from pathlib import Path
          p = Path('config/research_registry.json')
          reg = json.loads(p.read_text())
          rid = 'BRRK-BTC-CASH-ABSOLUTE-RISK-MEASUREMENT-REPLICATION-0061'
          if any(r.get('research_id') == rid for r in reg['records']):
              raise SystemExit(0)
          src = next(r for r in reg['records'] if r.get('research_id') == 'BRRK-BTC-CASH-ABSOLUTE-RISK-DIAGNOSTIC-0060')
          r = copy.deepcopy(src)
          r['research_id'] = rid
          r['research_family_id'] = 'BRRK_BTC_TO_CASH_GROSS_RISK'
          r['research_domain'] = 'RISK_CONTROL'
          r['research_governance_version'] = 1
          r['governance_mode'] = 'PROGRAM_GOVERNED_V1'
          r['objective_type'] = 'MECHANISM_TEST'
          r['created_at'] = '2026-08-13'
          r['created_before_result'] = True
          r['question'] = 'Does the unchanged 0060 BTC absolute-risk state contain recurrent monotone information about the same eight future downside targets when only the identified resampled-correlation degeneracy is corrected by fixed full-panel midrank-score dependence inference?'
          r['hypothesis'] = 'Higher unchanged BTC absolute-risk state is positively associated with all eight unchanged future downside targets, recurrently across time and with dependence-aware simultaneous lower bounds above zero.'
          r['hypothesis_origin'] = 'New-ID measurement-corrected replication required by immutable 0060 INVALID_EXECUTION closeout; no unpersisted 0060 statistic has authority.'
          r['economic_mechanism'] = 'Pure information diagnostic only; no BTC-to-Cash threshold, gross map or portfolio economics.'
          r['primary_metric'] = 'Eight co-primary full-sample ordinary Spearman associations plus fixed-score aligned moving-block simultaneous one-sided lower bounds.'
          r['declared_variant_budget'] = 1
          r['actual_variants_evaluated'] = 0
          r['parameter_candidate_count'] = 1
          r['stopping_rule'] = 'One preregistered representation and one historical execution only; after a durable attempt marker no same-ID recomputation, rerun, retuning or rescue.'
          r['success_criteria'] = 'All preregistered support, all-eight monotonicity, temporal recurrence and dependence-aware simultaneous lower-bound gates pass.'
          r['failure_criteria'] = 'Any preregistered scientific gate fails; full-panel constant required coordinates are valid no-information failures, not protocol invalidity.'
          r['allowed_followup'] = 'PASS permits only a new-ID systematic BTC-to-Cash translation study; FAIL or INVALID closes same-ID rescue.'
          r['forbidden_followup'] = 'No same-ID feature change, target/horizon selection, signed-target substitution, threshold/gross-map search, portfolio economics, bootstrap relaxation, rerun, retune or rescue.'
          r['researcher_decisions'] = [
              'Keep the complete 0060 BTC-only A1/A2/A3/S representation unchanged.',
              'Keep all eight 0060 terminal-loss and adverse-excursion targets and all four horizons co-primary.',
              'Keep full-sample and temporal ordinary average-tie Spearman unchanged.',
              'Correct only G4 dependence inference using full-panel fixed average-tie midrank scores and aligned moving-block sampling of fixed score products.',
              'Treat full-panel constant required coordinates as valid scientific no-information failure.',
              'Treat degenerate resamples as finite sampling observations rather than execution invalidity when the full panel is nonconstant.'
          ]
          rpc = r.get('research_process_complexity', {})
          rpc.update({
              'declared_parameter_candidates': 1,
              'actual_parameter_candidates_evaluated': 0,
              'universes_evaluated': 1,
              'horizons_evaluated': 4,
              'rebalance_variants': 0,
              'feature_representations': 1,
              'special_cases_introduced': 1,
              'validation_exposure_event_refs': ['BRRK-BTC-CASH-ABSOLUTE-RISK-DIAGNOSTIC-0060'],
              'related_family_trials': ['BRRK-BTC-CASH-ABSOLUTE-RISK-DIAGNOSTIC-0060']
          })
          r['research_process_complexity'] = rpc
          r['lineage_edges'] = [{
              'ref_research_id': 'BRRK-BTC-CASH-ABSOLUTE-RISK-DIAGNOSTIC-0060',
              'provenance_status': 'FACT',
              'evidence_ref': 'research/brrk_btc_cash_absolute_risk_diagnostic_0060/CLOSEOUT.json'
          }]
          r['result_status'] = 'PREREGISTERED_NOT_RUN'
          r['failure_reason'] = None
          r['promotion_state'] = 'NO_PROMOTION'
          r['evidence_refs'] = ['research/governance/BRRK_BTC_CASH_ABSOLUTE_RISK_MEASUREMENT_REPLICATION_0061_DESIGN_FREEZE_2026-08-13.md']
          r['decision_refs'] = []
          r['production_relevance'] = 'DEVELOPMENT mechanism evidence only; no automatic canonical, Phase 6 or production authority.'
          r['production_authorized'] = False
          r['provenance_status'] = 'FACT'
          r['governed_path_prefixes'] = ['research/brrk_btc_cash_absolute_risk_measurement_replication_0061/']
          r['notes'] = [
              '0060 is immutable INVALID_EXECUTION with no scientific conclusion.',
              '0061 changes only the dependence-measurement interface and treats all 0060 attempt information as exposed DEVELOPMENT evidence.',
              'No 0061 historical target, association or bootstrap output existed when this owner was created.'
          ]
          r.pop('evidence_scorecard', None)
          r.pop('derived_confidence', None)
          reg['records'].append(r)
          p.write_text(json.dumps(reg, indent=2, sort_keys=False) + '\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet -- config/research_registry.json; then
            exit 0
          fi
          git add config/research_registry.json
          git commit -m 'Research prereg [0061]: register owner first'
          git push origin HEAD:docs/0061-prereg-tooling
