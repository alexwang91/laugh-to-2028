name: TEMP 0061 handoff materializer

on:
  push:
    branches:
      - docs/0061-prereg-tooling

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/0061-prereg-tooling
          fetch-depth: 0
      - name: Refresh handoff
        env:
          SECTION_B64: ""
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          s = s.replace('Current `main` research merge: **`9ac4a70c638bf55d8b7b614e877ed36e8193f0e7`**', 'Current `main` research merge: **`c81e780ae2faa38f2e0bcda8f25e04ec7c5bc2a7`**')
          s = s.replace('Current research branch: **`research/0061-btc-cash-absolute-risk-measurement-replication-design`**', 'Current research branch: **`research/0061-btc-cash-absolute-risk-measurement-replication-prereg`**')
          s = s.replace('BRRK BTC->Cash measurement replication 0061 DESIGN FROZEN / PREREG ABSENT / NOT RUN', 'BRRK BTC->Cash measurement replication 0061 NUMERICAL/DATA PREREG FROZEN / NOT RUN')
          if '## 0061 numerical/data preregistration handoff' not in s:
              s = s.rstrip() + '\n\n' + base64.b64decode(os.environ['SECTION_B64']).decode().rstrip() + '\n'
          p.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet -- docs/CURRENT_STATE.md; then
            exit 0
          fi
          git add docs/CURRENT_STATE.md
          git commit -m 'docs: update 0061 prereg handoff'
          git push origin HEAD:docs/0061-prereg-tooling
