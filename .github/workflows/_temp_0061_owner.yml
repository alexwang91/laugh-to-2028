name: TEMP 0061 closeout registry
on:
  push:
    branches: [docs/0061-prereg-tooling]
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/0061-closeout-tooling
          fetch-depth: 0
      - shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('config/research_registry.json'); d=json.loads(p.read_text())
          r=next(x for x in d['records'] if x.get('research_id')=='BRRK-BTC-CASH-ABSOLUTE-RISK-MEASUREMENT-REPLICATION-0061')
          r['actual_variants_evaluated']=1; r['research_process_complexity']['actual_parameter_candidates_evaluated']=1
          r['result_status']='FAIL_NO_JOINT_DOWNSIDE_INFORMATION'; r['promotion_state']='NO_PROMOTION'
          r['failure_reason']='G2 failed: 5 of 8 co-primary full-sample Spearman associations were not strictly positive; G3/G4 were not evaluated by preregistered short-circuit.'
          r['evidence_refs']=['run:31717797348','research/brrk_btc_cash_absolute_risk_measurement_replication_0061/PRIMARY_RESULT.json','research/brrk_btc_cash_absolute_risk_measurement_replication_0061/EXECUTION.json','research/brrk_btc_cash_absolute_risk_measurement_replication_0061/RUN_ONCE.marker','research/brrk_btc_cash_absolute_risk_measurement_replication_0061/CLOSEOUT.json']
          c='research/brrk_btc_cash_absolute_risk_measurement_replication_0061/CLOSEOUT.json'
          if c not in r['decision_refs']: r['decision_refs'].append(c)
          r['production_relevance']='DEVELOPMENT mechanism-information failure; no state-to-gross, canonical, Phase 6 or production authority.'
          r['evidence_scorecard']={'temporal_novelty':'RESEARCHER_EXPOSED_DEVELOPMENT_NOT_INDEPENDENT_OOS','statistical_sufficiency':'G1_SUPPORT_PASS_1635_ORIGINS_BUT_G2_JOINT_DOWNSIDE_INFORMATION_FAIL','governance_integrity':'HIGH_EXACTLY_ONCE_HASH_BOUND_FINALIZED_WITHOUT_MARKET_READ_OR_REMEASUREMENT','operational_realism':'CAUSAL_DAILY_BTC_ABSOLUTE_RISK_INFORMATION_DIAGNOSTIC_NO_STRATEGY_ECONOMICS','derived_confidence':'HIGH_FOR_FROZEN_DEVELOPMENT_G2_FAILURE','confidence_rule_ref':c}
          p.write_text(json.dumps(d,indent=2)+'\n')
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add config/research_registry.json
          git commit -m 'docs: register 0061 immutable G2 failure'
          git push origin HEAD:docs/0061-closeout-tooling
