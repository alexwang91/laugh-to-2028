name: 0075 Stage6 CURRENT_STATE one-shot repair

on:
  push:
    branches:
      - research/0075-stage6-controlled-execution-boundary-v1

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/0075-stage6-controlled-execution-boundary-v1
          fetch-depth: 0
      - name: Patch only stale 0075 lifecycle handoff
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text()
          anchor = 'workflow run                         31381953131 / attempt 1'
          assert anchor in s
          old_next = "0074 completed immutable Stage 10 closeout at merge `92a1f24f5d5c439920f3cf7b3256343ee1c53f4c` and is `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. Its final operational accounting is controlled reads `402`, scientific engine `1/1` consumed but inadmissible non-frozen harness, scientific source-network fetches `0`, and no admissible strategy-performance result. 0075 Stage1 OWNER-FIRST merged at `f162c21cfccfe8a7801f78c4e07e357cdf20f93e`; Stage2 DESIGN merged at `27ac33952cff3ef835b2585dc990c09833624db9`; Stage3 PREREGISTRATION merged at `7b0ba828c75f9ecf8293b2e99a0531eac7954720`; Stage4 IMPLEMENTATION merged at `084a0ec5726a2abcda7aa78e284de58b4dae9f2b`. Stage5 NONHISTORICAL QUALIFICATION is in progress on PR #376 / `research/0075-stage5-nonhistorical-qualification-v1`; formal completion remains `4/10` until Stage5 merge. 0075 controlled attempt is `0/1`; controlled scientific-history reads are `0`; scientific engine calls are `0`; scientific source-network fetches are `0`. The next legal action is fresh exact-head standing CI and, if all required checks succeed with head/base unchanged, expected-head merge of Stage5, followed by a separate Stage6 CONTROLLED-EXECUTION BOUNDARY branch from that merge commit."
          new_next = "0074 completed immutable Stage 10 closeout at merge `92a1f24f5d5c439920f3cf7b3256343ee1c53f4c` and is `10/10 COMPLETE / INVALID_EXECUTION / CLOSED TO SAME-ID RERUN / ATTEMPT 1/1 CONSUMED`. Its final operational accounting is controlled reads `402`, scientific engine `1/1` consumed but inadmissible non-frozen harness, scientific source-network fetches `0`, and no admissible strategy-performance result. 0075 Stage1 OWNER-FIRST merged at `f162c21cfccfe8a7801f78c4e07e357cdf20f93e`; Stage2 DESIGN merged at `27ac33952cff3ef835b2585dc990c09833624db9`; Stage3 PREREGISTRATION merged at `7b0ba828c75f9ecf8293b2e99a0531eac7954720`; Stage4 IMPLEMENTATION merged at `084a0ec5726a2abcda7aa78e284de58b4dae9f2b`; Stage5 NONHISTORICAL QUALIFICATION merged at `c03dba8a89de81869a8dcb8024f95538f2f9af3f`. Stage6 CONTROLLED-EXECUTION BOUNDARY is in progress on PR #377 / `research/0075-stage6-controlled-execution-boundary-v1`; formal completion remains `5/10` until Stage6 merge. 0075 controlled attempt is `0/1`; controlled scientific-history reads are `0`; scientific engine calls are `0`; scientific source-network fetches are `0`. The next legal action is completion of the exact authorized-object manifest and durable offline-staging/readability evidence without scientific payload-value exposure, followed by synchronized exact-head CI and expected-head Stage6 merge only if every mandatory check succeeds."
          old_auth = "0075 = STAGE-1 OWNER-FIRST MERGED AT `f162c21cfccfe8a7801f78c4e07e357cdf20f93e` / STAGE-2 DESIGN MERGED AT `27ac33952cff3ef835b2585dc990c09833624db9` / STAGE-3 PREREGISTRATION MERGED AT `7b0ba828c75f9ecf8293b2e99a0531eac7954720` / STAGE-4 IMPLEMENTATION MERGED AT `084a0ec5726a2abcda7aa78e284de58b4dae9f2b` / STAGE-5 NONHISTORICAL QUALIFICATION IN PROGRESS ON #376 / FORMAL COMPLETION 4/10 UNTIL STAGE-5 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          new_auth = "0075 = STAGE-1 OWNER-FIRST MERGED AT `f162c21cfccfe8a7801f78c4e07e357cdf20f93e` / STAGE-2 DESIGN MERGED AT `27ac33952cff3ef835b2585dc990c09833624db9` / STAGE-3 PREREGISTRATION MERGED AT `7b0ba828c75f9ecf8293b2e99a0531eac7954720` / STAGE-4 IMPLEMENTATION MERGED AT `084a0ec5726a2abcda7aa78e284de58b4dae9f2b` / STAGE-5 NONHISTORICAL QUALIFICATION MERGED AT `c03dba8a89de81869a8dcb8024f95538f2f9af3f` / STAGE-6 CONTROLLED-EXECUTION BOUNDARY IN PROGRESS ON #377 / FORMAL COMPLETION 5/10 UNTIL STAGE-6 MERGE / CONTROLLED ATTEMPT 0/1 / CONTROLLED READS 0 / SCIENTIFIC ENGINE 0 / SCIENTIFIC SOURCE NETWORK FETCHES 0 / PRODUCTION-SIGNATURE-ORDER AUTHORITY FALSE."
          assert s.count(old_next) == 1
          assert s.count(old_auth) == 1
          s = s.replace(old_next, new_next).replace(old_auth, new_auth)
          assert anchor in s
          p.write_text(s)
      - name: Remove this one-shot workflow
        run: rm .github/workflows/0075-stage6-current-state-repair.yml
      - name: Commit exact handoff repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/CURRENT_STATE.md .github/workflows/0075-stage6-current-state-repair.yml
          git diff --cached --check
          git commit -m 'docs(0075): synchronize Stage6 current-state handoff'
          git push origin HEAD:research/0075-stage6-controlled-execution-boundary-v1
