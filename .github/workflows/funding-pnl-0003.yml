name: FUNDING PNL 0003 Frozen Holdings

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/funding-pnl-0003.yml'
      - 'research/requirements.txt'
      - 'research/funding_router/FUNDING-PNL-0003-FROZEN-HOLDINGS.json'
      - 'research/funding_router/run_frozen_holdings_funding_pnl.py'
      - 'research/funding_router/test_frozen_holdings_funding_pnl.py'
      - 'research/funding_router/run_funding_data_audit.py'
      - 'research/results/pit_disp_0015/daily_weights.csv'
      - 'research/results/pit_disp_0015/daily_equity.csv'
      - 'research/results/funding_crossvenue_0002/paired_8h_blocks.csv'

permissions:
  contents: write

concurrency:
  group: funding-pnl-0003-${{ github.ref }}
  cancel-in-progress: false

jobs:
  frozen-holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Install research dependencies
        run: pip install --disable-pip-version-check -r research/requirements.txt
      - name: Run deterministic funding accounting tests
        working-directory: research/funding_router
        run: python -m unittest -v test_frozen_holdings_funding_pnl.py
      - name: Run preregistered frozen-holdings funding attribution
        working-directory: research/funding_router
        shell: bash
        run: |
          set -o pipefail
          python run_frozen_holdings_funding_pnl.py | tee funding_pnl_0003.log
      - name: Persist validated outputs on same-repository PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/funding-pnl-0003
          mkdir -p /tmp/funding-pnl-0003
          cp -R research/funding_router/funding_pnl_0003_outputs/. /tmp/funding-pnl-0003/
          cp research/funding_router/funding_pnl_0003.log /tmp/funding-pnl-0003/funding_pnl_0003.log
          cp research/funding_router/FUNDING-PNL-0003-FROZEN-HOLDINGS.json /tmp/funding-pnl-0003/FUNDING-PNL-0003-FROZEN-HOLDINGS.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" "origin/$HEAD_REF"

          DEST='research/results/funding_pnl_0003'
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cp -R /tmp/funding-pnl-0003/. "$DEST/"

          git add -f "$DEST"
          if git diff --cached --quiet; then
            echo 'Validated outputs are already current.'
            exit 0
          fi
          git commit -m 'Persist FUNDING-PNL-0003 exact evidence'
          git pull --rebase origin "$HEAD_REF"
          git push origin "HEAD:$HEAD_REF"
      - name: Upload exact research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-pnl-0003-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            research/funding_router/funding_pnl_0003.log
            research/funding_router/funding_pnl_0003_outputs/**
            research/funding_router/FUNDING-PNL-0003-FROZEN-HOLDINGS.json
