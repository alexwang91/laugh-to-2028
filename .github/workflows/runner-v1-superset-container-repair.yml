name: Runner V1 superset-container repair

on:
  push:
    branches:
      - governance/runner-v1-superset-container-repair
    paths:
      - .github/workflows/runner-v1-superset-container-repair.yml

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: governance/runner-v1-superset-container-repair
          fetch-depth: 0
      - name: Patch runner without reading controlled payloads
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('research/governance/controlled_research_runner_v1.py')
          s = p.read_text()
          old = '''        expected = {entry.filename: entry for entry in self.manifest.entries}\n        if set(names) != set(expected):\n            missing = sorted(set(expected) - set(names))\n            extra = sorted(set(names) - set(expected))\n            raise PreflightRejected(f"ARCHIVE_FILE_SET_MISMATCH missing={missing} extra={extra}")\n        # file_size is central-directory metadata and is explicitly allowed pre-marker.\n        for info in infos:\n            if info.is_dir():\n                continue\n            if info.file_size != expected[info.filename].size:\n                raise PreflightRejected(f"DECLARED_SIZE_MISMATCH:{info.filename}")\n'''
          new = '''        expected = {entry.filename: entry for entry in self.manifest.entries}\n        # A frozen source artifact may be a superset container shared by several\n        # prospectively filtered research IDs.  Pre-marker we may inspect only\n        # central-directory metadata, so require every authorized member and\n        # validate its declared size while ignoring unmanifested members.  The\n        # post-marker read path still opens only manifest entries, so extras\n        # consume zero controlled-read budget and expose zero scientific values.\n        missing = sorted(set(expected) - set(names))\n        if missing:\n            raise PreflightRejected(f"ARCHIVE_FILE_SET_MISMATCH missing={missing}")\n        # file_size is central-directory metadata and is explicitly allowed pre-marker.\n        for info in infos:\n            if info.is_dir() or info.filename not in expected:\n                continue\n            if info.file_size != expected[info.filename].size:\n                raise PreflightRejected(f"DECLARED_SIZE_MISMATCH:{info.filename}")\n'''
          if old not in s:
              raise SystemExit('expected runner block not found')
          p.write_text(s.replace(old, new, 1))

          t = Path('research/governance/test_controlled_research_runner_v1_superset.py')
          if t.exists():
              raise SystemExit('superset test already exists')
          t.write_text('''from __future__ import annotations\n\nimport hashlib\nimport json\nimport zipfile\nfrom pathlib import Path\n\nfrom research.governance.controlled_research_runner_v1 import (\n    ControlledResearchRunnerV1, InMemoryCreateOnlyStore, ManifestEntry,\n    RunSpec, SourceManifest,\n)\n\n\nclass _EchoEngine:\n    def execute(self, context):\n        assert set(context.sources) == {"authorized.bin"}\n        return {"rows": 1, "ok": True}\n\n\ndef test_superset_container_reads_only_manifest_members(tmp_path: Path) -> None:\n    authorized = b"authorized scientific bytes"\n    extra = b"unmanifested bytes that must never enter engine context"\n    archive = tmp_path / "superset.zip"\n    with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_STORED) as zf:\n        zf.writestr("authorized.bin", authorized)\n        zf.writestr("extra.bin", extra)\n    manifest = SourceManifest(\n        manifest_id="m1", source_id="s1", decision_timestamp="2026-08-25T00:00:00Z",\n        archive_identity="artifact:synthetic-superset",\n        entries=(ManifestEntry(filename="authorized.bin", size=len(authorized), sha256=hashlib.sha256(authorized).hexdigest()),),\n    )\n    store = InMemoryCreateOnlyStore()\n    spec = RunSpec(\n        research_id="SYNTHETIC-SUPERSET", attempt_id="1",\n        expected_head_sha="a" * 40, actual_head_sha="a" * 40, expected_source_id="s1",\n        manifest=manifest, archive_path=archive, result_key="RESULT.json",\n        marker_key="RUN_ATTEMPT.marker", run_once_key="RUN_ONCE.marker",\n    )\n    report = ControlledResearchRunnerV1(store).run(spec, _EchoEngine())\n    assert report.classification == "EXECUTION_VALID"\n    assert report.attempt_consumed is True\n    assert report.source_reads == 1\n    assert report.engine_invocations == 1\n    assert report.scientific_result_admissible is True\n    envelope = json.loads(store.objects["RESULT.json"])\n    assert envelope["source_reads"] == 1\n    assert envelope["engine_result"] == {"rows": 1, "ok": True}\n''')

          c = Path('docs/CURRENT_STATE.md')
          cs = c.read_text()
          marker = '\n## R2.1 common-runner superset-container compatibility repair — 2026-08-25\n'
          if marker.strip() in cs:
              raise SystemExit('CURRENT_STATE repair section already exists')
          cs += marker + '''\n- Live 0085 pre-attempt inspection found its frozen artifact is the 0074 Stage6 shared `stage/` artifact containing 402 payload objects, while the 0085 ARM filter authorizes exactly 201 perpetual-1d-kline objects.\n- `CONTROLLED_RESEARCH_RUNNER_V1` previously required archive membership to equal the filtered manifest exactly, which would preflight-reject the frozen shared artifact before marker creation. No 0085 attempt, controlled read, engine invocation or scientific-value exposure occurred.\n- This prospective infrastructure-only repair permits a frozen archive to be a superset container: metadata preflight requires every manifest member and validates only its declared central-directory size; unmanifested members are ignored and never opened. Post-marker reads remain exactly the manifest entries, each at most once, with unchanged SHA-256 verification and exactly-one engine invocation.\n- The repair changes no 0085 universe, date range, signal, cost, threshold, benchmark, source identity or 201-object read budget. It changes no historical result or authority and grants no new attempt.\n- The common runner must re-pass the complete existing synthetic fault matrix, the 20-consecutive full-lifecycle qualification, and the new superset-container test on the exact final PR head before 0085 RUN may execute.\n- 0085 user authorization for controlled attempt 1/1 remains valid but unconsumed. Production/signature/order/withdrawal/transfer authority remains false.\n'''
          c.write_text(cs)
          PY
          rm .github/workflows/runner-v1-superset-container-repair.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/governance/controlled_research_runner_v1.py research/governance/test_controlled_research_runner_v1_superset.py docs/CURRENT_STATE.md .github/workflows/runner-v1-superset-container-repair.yml
          git commit -m 'fix(runner): support frozen superset artifact containers'
          git push origin HEAD:governance/runner-v1-superset-container-repair
