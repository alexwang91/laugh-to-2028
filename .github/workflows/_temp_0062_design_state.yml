name: TEMP 0062 design state
on:
  push:
    branches:
      - docs/0062-design-tooling
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/0062-design-tooling
          fetch-depth: 0
      - name: Patch CURRENT_STATE
        run: echo '' | base64 -d | python
      - name: Commit CURRENT_STATE
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add docs/CURRENT_STATE.md
          git commit -m 'docs: hand off 0062 signal atlas design'
          git push origin HEAD:docs/0062-design-tooling
