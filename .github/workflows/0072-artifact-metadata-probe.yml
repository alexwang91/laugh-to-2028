name: 0072 artifact metadata probe

on:
  pull_request:
    paths:
      - '.github/workflows/0072-artifact-metadata-probe.yml'
      - 'research/brrk_crypto_carry_atlas_0072/test_capture_wiring.py'

permissions:
  contents: read
  actions: read

jobs:
  artifact-metadata-probe:
    if: github.head_ref == 'research/0072-first-capture-status-probe-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Query fixed artifact metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          names = [
              '0072-first-capture-raw-BRRK-CRYPTO-CARRY-ATLAS-0072-CAPTURE-0001',
              '0072-first-capture-metadata-BRRK-CRYPTO-CARRY-ATLAS-0072-CAPTURE-0001',
          ]
          token = os.environ['GH_TOKEN']
          out = {}
          for name in names:
              url = 'https://api.github.com/repos/alexwang91/laugh-to-2028/actions/artifacts?name=' + urllib.parse.quote(name) + '&per_page=100'
              req = urllib.request.Request(url, headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': 'Bearer ' + token,
                  'User-Agent': '0072-authenticated-metadata-only-probe',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              with urllib.request.urlopen(req, timeout=20) as r:
                  data = json.load(r)
              rows = []
              for a in data.get('artifacts', []):
                  wr = a.get('workflow_run') or {}
                  rows.append({
                      'id': a.get('id'),
                      'name': a.get('name'),
                      'size_in_bytes': a.get('size_in_bytes'),
                      'expired': a.get('expired'),
                      'created_at': a.get('created_at'),
                      'updated_at': a.get('updated_at'),
                      'workflow_run_id': wr.get('id'),
                      'workflow_head_sha': wr.get('head_sha'),
                  })
              out[name] = rows
          print('0072_AUTH_ARTIFACT_METADATA=' + json.dumps(out, sort_keys=True, separators=(',', ':')))
          PY
